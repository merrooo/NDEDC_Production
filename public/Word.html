<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos → Word / PDF (one photo per page) with live preview</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f1f5f9;color:#0f172a;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1400px;margin:0 auto;padding:18px 18px 40px}
  header{display:flex;justify-content:space-between;align-items:center;
         gap:12px;flex-wrap:wrap;margin-bottom:10px}
  header h1{margin:0;font-size:19px;font-weight:700}
  .home-btn{
    display:inline-flex;align-items:center;gap:7px;
    background:#fff;border:1px solid #cbd5e1;border-radius:9px;
    padding:8px 14px;font-size:13px;font-weight:600;color:#334155;
    cursor:pointer;text-decoration:none;transition:.15s;
    box-shadow:0 1px 2px rgba(15,23,42,.05);
  }
  .home-btn:hover{background:#eff6ff;border-color:#2563eb;color:#1e40af}
  .home-btn svg{width:15px;height:15px;flex-shrink:0}

  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;
        box-shadow:0 1px 2px rgba(15,23,42,.05)}

  .top-grid{
    display:grid;
    grid-template-columns:minmax(240px, 1fr) auto;
    gap:12px;
    margin-bottom:12px;
    align-items:stretch;
  }
  @media (max-width:900px){ .top-grid{grid-template-columns:1fr} }

  #drop{
    border:2px dashed #cbd5e1;border-radius:10px;
    padding:16px 14px;text-align:center;cursor:pointer;transition:.15s;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:70px;
  }
  #drop:hover,#drop.hover{border-color:#2563eb;background:#eff6ff}
  #drop strong{display:block;font-size:14px;margin-bottom:2px}
  #drop span{color:#64748b;font-size:12px}

  .controls-card{padding:12px 14px}
  .ctrl-row{
    display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;
  }
  .ctrl-row + .ctrl-row{
    margin-top:10px;padding-top:10px;border-top:1px solid #eef2f7;
  }
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:10.5px;font-weight:700;color:#475569;
               text-transform:uppercase;letter-spacing:.04em}
  select,input[type=number],input[type=checkbox]{
         padding:7px 9px;border:1px solid #cbd5e1;
         border-radius:8px;background:#fff;font-size:13px;min-width:100px}
  input[type=number]{width:90px}
  input[type=checkbox]{min-width:auto;width:16px;height:16px;padding:0}
  .field .sub{font-size:9.5px;color:#94a3b8;font-weight:600;
              text-transform:none;letter-spacing:0}
  .inline-check{display:flex;align-items:center;gap:6px;padding-bottom:6px}
  .inline-check label{font-size:12.5px;font-weight:600;color:#334155;
                      text-transform:none;letter-spacing:0;cursor:pointer}
  .size-info{font-size:11.5px;color:#16a34a;font-weight:600;
             align-self:center;white-space:nowrap}
  .size-info.warn{color:#f59e0b}

  .main-grid{
    display:grid;
    grid-template-columns:minmax(340px, 40%) 1fr;
    gap:12px;
    align-items:start;
  }
  @media (max-width:900px){ .main-grid{grid-template-columns:1fr} }

  .thumbs-card{display:flex;flex-direction:column;gap:10px;
               max-height:calc(100vh - 220px);min-height:420px}
  .thumbs-head{display:flex;justify-content:space-between;
               align-items:center;gap:10px;flex-wrap:wrap}
  .thumbs-head h2{margin:0;font-size:13px;font-weight:700;color:#0f172a}
  .thumbs-head .btns{display:flex;gap:6px}
  .thumb-scroll{
    flex:1;overflow-y:auto;padding-right:4px;
    border-top:1px solid #eef2f7;padding-top:10px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(96px, 1fr));
    gap:8px;
  }
  .thumb{position:relative;border:1px solid #e2e8f0;border-radius:8px;
         overflow:hidden;background:#f8fafc;cursor:grab;
         aspect-ratio:1 / 1}
  .thumb img{display:block;width:100%;height:100%;object-fit:cover}
  .thumb .num{position:absolute;top:4px;left:4px;background:rgba(15,23,42,.72);
              color:#fff;font-size:10px;padding:1px 6px;border-radius:20px}
  .thumb .rm{position:absolute;top:4px;right:4px;width:18px;height:18px;border:0;
             border-radius:50%;background:rgba(15,23,42,.72);color:#fff;
             cursor:pointer;font-size:12px;line-height:1;padding:0}
  .thumb .rm:hover{background:#dc2626}
  .thumb.err img{filter:grayscale(1) opacity(.35)}
  .thumb .badge{position:absolute;left:4px;right:4px;bottom:4px;background:#dc2626;
                color:#fff;font-size:9px;padding:2px 4px;border-radius:5px;
                text-align:center;line-height:1.15}
  .thumb .save-tag{position:absolute;bottom:4px;left:4px;background:#16a34a;
                   color:#fff;font-size:9px;padding:1px 5px;border-radius:20px;
                   font-weight:600}
  .thumb .up-tag{position:absolute;bottom:4px;left:4px;background:#f59e0b;
                 color:#fff;font-size:9px;padding:1px 5px;border-radius:20px;
                 font-weight:600}
  .thumb.over{outline:2px solid #2563eb;outline-offset:1px}
  .thumb.active{outline:2px solid #2563eb;outline-offset:1px;
                box-shadow:0 0 0 3px rgba(37,99,235,.15)}

  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button.primary{background:#2563eb;color:#fff;border:0;border-radius:9px;
                 padding:10px 18px;font-size:13.5px;font-weight:600;cursor:pointer}
  button.primary:disabled{background:#94a3b8;cursor:not-allowed}
  button.primary.pdf{background:#dc2626}
  button.primary.pdf:disabled{background:#94a3b8}
  button.ghost{background:#fff;border:1px solid #cbd5e1;border-radius:8px;
               padding:6px 12px;font-size:12.5px;cursor:pointer;color:#334155}
  button.ghost:hover{background:#f8fafc}
  .progress{flex:1;min-width:120px;height:6px;background:#e2e8f0;border-radius:99px;
            overflow:hidden;display:none}
  .progress.on{display:block}
  .progress i{display:block;height:100%;width:0;background:#2563eb;transition:width .2s}
  #status{font-size:12px;color:#475569;min-height:16px}
  .err-box{display:none;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;
           padding:8px 10px;border-radius:8px;font-size:12px}

  .preview-card{display:flex;flex-direction:column;gap:8px}
  .preview-toolbar{display:flex;justify-content:space-between;align-items:center;
                   gap:10px;flex-wrap:wrap}
  .preview-toolbar h2{margin:0;font-size:13px;font-weight:700}
  .preview-toolbar .nav{display:flex;gap:4px;align-items:center}
  .nav button{background:#fff;border:1px solid #cbd5e1;border-radius:7px;
              width:26px;height:26px;cursor:pointer;font-size:14px;line-height:1;
              color:#334155}
  .nav button:hover:not(:disabled){background:#f1f5f9}
  .nav button:disabled{opacity:.4;cursor:not-allowed}
  .nav .pageinfo{font-size:11.5px;color:#475569;min-width:60px;text-align:center}

  .preview-stage{
    background:#e2e8f0;border-radius:10px;padding:14px;
    display:flex;align-items:center;justify-content:center;
    height:calc(100vh - 220px);
    min-height:480px;
    overflow:hidden;
    position:relative;
  }
  .preview-stage .stage-inner{
    display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;
  }
  .page{
    background:#fff;box-shadow:0 6px 18px rgba(15,23,42,.18);
    position:relative;display:flex;align-items:center;justify-content:center;
  }
  .page .content{
    position:absolute;display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .page .content img{
    max-width:100%;max-height:100%;
    width:auto;height:auto;display:block;
  }
  .page .content.stretch img{
    width:100%!important;height:100%!important;max-width:none;max-height:none;
  }
  .page .guide{position:absolute;border:1px dashed #cbd5e1;pointer-events:none}
  .page .page-no{
    position:absolute;top:-18px;left:0;font-size:10.5px;color:#64748b;font-weight:600;
  }
  .placeholder{
    color:#64748b;font-size:12.5px;text-align:center;line-height:1.6;padding:20px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Photos → Word / PDF document</h1>
    <a class="home-btn" href="Control_Excel.html" title="Back to Control Excel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"/>
      </svg>
      Home
    </a>
  </header>

  <!-- ============ TOP: upload + all controls ============ -->
  <div class="top-grid">

    <!-- Compact upload -->
    <div class="card">
      <div id="drop">
        <strong>Click or drop photos here</strong>
        <span>Multiple files · JPG, PNG, GIF, BMP, WebP…</span>
      </div>
      <input id="file" type="file" multiple accept="image/*,.jpg,.jpeg,.png,.gif,.bmp,.webp,.avif,.svg,.tif,.tiff,.heic,.heif" hidden>
    </div>

    <!-- All controls -->
    <div class="card controls-card">
      <div class="ctrl-row">
        <div class="inline-check">
          <input type="checkbox" id="applyAll" checked>
          <label for="applyAll">Apply to all</label>
        </div>

        <div class="field">
          <label for="pageSize">Page size</label>
          <select id="pageSize">
            <option value="A4" selected>A4</option>
            <option value="Letter">Letter</option>
            <option value="Legal">Legal</option>
            <option value="A3">A3</option>
            <option value="A5">A5</option>
          </select>
        </div>
        <div class="field">
          <label for="orientation">Orientation</label>
          <select id="orientation">
            <option value="portrait" selected>Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
        <div class="field">
          <label for="sizing">Image sizing</label>
          <select id="sizing">
            <option value="fit" selected>Fit (keeps ratio)</option>
            <option value="stretch">Stretch to fill</option>
          </select>
        </div>

        <div class="field">
          <label for="marginH">Margin H <span class="sub">(in)</span></label>
          <input id="marginH" type="number" min="0" max="4" step="0.05" value="0.5">
        </div>
        <div class="field">
          <label for="marginV">Margin V <span class="sub">(in)</span></label>
          <input id="marginV" type="number" min="0" max="4" step="0.05" value="0.5">
        </div>
      </div>

      <div class="ctrl-row">
        <div class="inline-check">
          <input type="checkbox" id="optimize" checked>
          <label for="optimize">Optimize</label>
        </div>

        <div class="field" id="optFields">
          <label for="resolution">Resolution</label>
          <select id="resolution">
            <option value="0.25">Min (25%)</option>
            <option value="0.5">50%</option>
            <option value="1" selected>100% (original)</option>
            <option value="1.5">150% (upscale)</option>
            <option value="2">200% (upscale)</option>
          </select>
        </div>

        <div class="field" id="optFieldsQ">
          <label for="quality">JPEG quality</label>
          <select id="quality">
            <option value="50">Min (50%)</option>
            <option value="75">75%</option>
            <option value="85" selected>85% (recommended)</option>
            <option value="92">92%</option>
            <option value="100">Max (100%)</option>
          </select>
        </div>

        <div class="size-info" id="sizeInfo"></div>
      </div>
    </div>
  </div>

  <!-- ============ BOTTOM: thumbs + preview ============ -->
  <div class="main-grid">

    <div class="card thumbs-card" id="panel" style="display:none">
      <div class="thumbs-head">
        <h2>Selected photos <span style="color:#64748b;font-weight:500" id="count"></span></h2>
        <div class="btns">
          <button class="ghost" id="addMore">+ Add</button>
          <button class="ghost" id="clearBtn">Clear</button>
        </div>
      </div>
      <div class="thumb-scroll">
        <div class="grid" id="grid"></div>
      </div>

      <div class="actions">
        <button class="primary" id="exportBtn">Export Word (.docx)</button>
        <button class="primary pdf" id="exportPdfBtn">Export PDF</button>
        <div class="progress" id="progress"><i id="bar"></i></div>
      </div>
      <div id="status"></div>
      <div class="err-box" id="errBox"></div>
    </div>

    <div class="card preview-card">
      <div class="preview-toolbar">
        <h2>Live preview</h2>
        <div class="nav">
          <button id="prevBtn" title="Previous page" disabled>‹</button>
          <span class="pageinfo" id="pageInfo">— / —</span>
          <button id="nextBtn" title="Next page" disabled>›</button>
        </div>
      </div>
      <div class="preview-stage" id="previewStage">
        <div class="stage-inner" id="previewHost">
          <div class="placeholder">Upload photos to see the live preview.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------ */
/*  Elements                                                           */
/* ------------------------------------------------------------------ */
const els = {
  drop:        document.getElementById('drop'),
  file:        document.getElementById('file'),
  grid:        document.getElementById('grid'),
  panel:       document.getElementById('panel'),
  count:       document.getElementById('count'),
  pageSize:    document.getElementById('pageSize'),
  orient:      document.getElementById('orientation'),
  marginH:     document.getElementById('marginH'),
  marginV:     document.getElementById('marginV'),
  sizing:      document.getElementById('sizing'),
  applyAll:    document.getElementById('applyAll'),
  optimize:    document.getElementById('optimize'),
  optFields:   document.getElementById('optFields'),
  optFieldsQ:  document.getElementById('optFieldsQ'),
  resolution:  document.getElementById('resolution'),
  quality:     document.getElementById('quality'),
  sizeInfo:    document.getElementById('sizeInfo'),
  exportBtn:   document.getElementById('exportBtn'),
  exportPdfBtn:document.getElementById('exportPdfBtn'),
  clearBtn:    document.getElementById('clearBtn'),
  addMore:     document.getElementById('addMore'),
  progress:    document.getElementById('progress'),
  bar:         document.getElementById('bar'),
  status:      document.getElementById('status'),
  errBox:      document.getElementById('errBox'),
  previewStage:document.getElementById('previewStage'),
  previewHost: document.getElementById('previewHost'),
  prevBtn:     document.getElementById('prevBtn'),
  nextBtn:     document.getElementById('nextBtn'),
  pageInfo:    document.getElementById('pageInfo')
};

const state = { items: [], previewIndex: 0 };
let dragId = null;

/* ------------------------------------------------------------------ */
/*  Helpers                                                            */
/* ------------------------------------------------------------------ */
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
                                     : 'id' + Math.random().toString(36).slice(2));

function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('load fail'));
    document.head.appendChild(s);
  });
}

let docxLib = null;
async function ensureDocx(){
  if (docxLib) return docxLib;
  if (window.docx && window.docx.Document) return (docxLib = window.docx);
  const cdns = [
    'https://cdn.jsdelivr.net/npm/docx@9.5.1/build/index.umd.js',
    'https://unpkg.com/docx@9.5.1/build/index.umd.js',
    'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js'
  ];
  for (const url of cdns){
    try {
      await loadScript(url);
      if (window.docx && window.docx.Document) return (docxLib = window.docx);
    } catch(e){ /* try next */ }
  }
  throw new Error('Could not load the Word engine (docx). Check your internet connection and reload.');
}

let jspdfLib = null;
async function ensureJsPdf(){
  if (jspdfLib) return jspdfLib;
  if (window.jspdf && window.jspdf.jsPDF) return (jspdfLib = window.jspdf.jsPDF);
  const cdns = [
    'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js',
    'https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js',
    'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'
  ];
  for (const url of cdns){
    try {
      await loadScript(url);
      if (window.jspdf && window.jspdf.jsPDF) return (jspdfLib = window.jspdf.jsPDF);
    } catch(e){ /* try next */ }
  }
  throw new Error('Could not load the PDF engine (jsPDF). Check your internet connection and reload.');
}

let jszipLib = null;
async function ensureJSZip(){
  if (jszipLib) return jszipLib;
  if (window.JSZip) return (jszipLib = window.JSZip);
  const cdns = [
    'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
    'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'
  ];
  for (const url of cdns){
    try {
      await loadScript(url);
      if (window.JSZip) return (jszipLib = window.JSZip);
    } catch(e){ /* try next */ }
  }
  return null;
}

function loadImage(src){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload  = () => res(img);
    img.onerror = () => rej(new Error('decode'));
    img.src = src;
  });
}

function fmtSize(bytes){
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(0) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}

function clampMargin(v){
  const n = parseFloat(v);
  if (isNaN(n) || n < 0) return 0;
  if (n > 4) return 4;
  return Math.round(n * 100) / 100;
}

/* ------------------------------------------------------------------ */
/*  Optimization settings                                              */
/* ------------------------------------------------------------------ */
function getOptimizeSettings(){
  return {
    enabled: els.optimize.checked,
    scale:   parseFloat(els.resolution.value) || 1,
    quality: parseInt(els.quality.value, 10) / 100
  };
}

function toggleOptimizeUI(){
  const off = !els.optimize.checked;
  els.optFields.style.opacity  = off ? .45 : 1;
  els.optFields.style.pointerEvents = off ? 'none' : '';
  els.optFieldsQ.style.opacity = off ? .45 : 1;
  els.optFieldsQ.style.pointerEvents = off ? 'none' : '';
}

els.optimize.addEventListener('change', () => {
  toggleOptimizeUI();
  embCache.clear();
  render();
  updateSizeInfo();
});
els.resolution.addEventListener('change', () => {
  embCache.clear();
  updateSizeInfo();
});
els.quality.addEventListener('change', () => {
  embCache.clear();
  updateSizeInfo();
});

let sizeInfoTimer = null;
function updateSizeInfo(){
  clearTimeout(sizeInfoTimer);
  sizeInfoTimer = setTimeout(doUpdateSizeInfo, 120);
}
async function doUpdateSizeInfo(){
  const usable = state.items.filter(i => !i.error);
  if (!usable.length){
    els.sizeInfo.textContent = '';
    els.sizeInfo.classList.remove('warn');
    return;
  }
  const item = usable[0];
  const original = item.file.size;

  if (!els.optimize.checked){
    els.sizeInfo.textContent = `Original: ${fmtSize(original)}`;
    els.sizeInfo.classList.remove('warn');
    return;
  }

  try {
    const emb = await toEmbeddable(item, { skipCache: true });
    const opt = emb.blob.size;
    const diff = opt - original;
    const pct = original > 0 ? Math.round((diff / original) * 100) : 0;

    if (diff >= 0){
      els.sizeInfo.textContent = `~${fmtSize(opt)} (+${pct}%) · upscaled`;
      els.sizeInfo.classList.add('warn');
    } else {
      els.sizeInfo.textContent = `~${fmtSize(opt)} (saves ~${-pct}%)`;
      els.sizeInfo.classList.remove('warn');
    }
  } catch(e){
    els.sizeInfo.textContent = '';
  }
}

/* ------------------------------------------------------------------ */
/*  Page geometry                                                      */
/* ------------------------------------------------------------------ */
const PAGE_SIZES = {
  A4:     [8.27, 11.69],
  Letter: [8.5,  11],
  Legal:  [8.5,  14],
  A3:     [11.69, 16.54],
  A5:     [5.83, 8.27]
};

function readToolbarSettings(){
  return {
    pageSize:    els.pageSize.value,
    orientation: els.orient.value,
    sizing:      els.sizing.value,
    marginH:     clampMargin(els.marginH.value),
    marginV:     clampMargin(els.marginV.value)
  };
}
function writeToolbarSettings(s){
  els.pageSize.value = s.pageSize;
  els.orient.value   = s.orientation;
  els.sizing.value   = s.sizing;
  els.marginH.value  = s.marginH;
  els.marginV.value  = s.marginV;
}
function geometryFor(s){
  const [pw, ph] = PAGE_SIZES[s.pageSize] || PAGE_SIZES.A4;
  const landscape = s.orientation === 'landscape';
  const pageW = landscape ? ph : pw;
  const pageH = landscape ? pw : ph;
  return { pageW, pageH, mH: s.marginH, mV: s.marginV, landscape };
}
function settingsForItem(item){
  if (!item) return readToolbarSettings();
  if (els.applyAll.checked) return readToolbarSettings();
  return {
    pageSize:    item.pageSize,
    orientation: item.orientation,
    sizing:      item.sizing,
    marginH:     item.marginH,
    marginV:     item.marginV
  };
}

/* ------------------------------------------------------------------ */
/*  Adding files                                                       */
/* ------------------------------------------------------------------ */
async function addFiles(fileList){
  const files = Array.from(fileList);
  const defaults = readToolbarSettings();

  for (const file of files){
    const item = {
      id: uid(), file,
      url: URL.createObjectURL(file),
      width: 0, height: 0, error: null,
      pageSize:    defaults.pageSize,
      orientation: defaults.orientation,
      sizing:      defaults.sizing,
      marginH:     defaults.marginH,
      marginV:     defaults.marginV
    };
    try {
      const img = await loadImage(item.url);
      item.width  = img.naturalWidth;
      item.height = img.naturalHeight;
      if (!item.width || !item.height) throw new Error('no size');
    } catch(e){
      item.error = 'Bad format';
    }
    state.items.push(item);
  }
  render();
  updateSizeInfo();
}

/* ------------------------------------------------------------------ */
/*  Render thumbnails                                                  */
/* ------------------------------------------------------------------ */
function render(){
  els.grid.innerHTML = '';
  els.panel.style.display = state.items.length ? '' : 'none';
  els.count.textContent = `(${state.items.length})`;

  const visible = state.items.filter(x => !x.error);
  const currentId = visible[state.previewIndex] ? visible[state.previewIndex].id : null;

  state.items.forEach((item, i) => {
    const d = document.createElement('div');
    d.className = 'thumb' + (item.error ? ' err' : '') +
                  (item.id === currentId ? ' active' : '');
    d.draggable = true;
    d.dataset.id = item.id;

    const img = document.createElement('img');
    img.src = item.url; img.alt = '';
    d.appendChild(img);

    const num = document.createElement('span');
    num.className = 'num'; num.textContent = i + 1;
    d.appendChild(num);

    const rm = document.createElement('button');
    rm.className = 'rm'; rm.textContent = '×'; rm.title = 'Remove';
    rm.onclick = (e) => { e.stopPropagation(); removeItem(item.id); };
    d.appendChild(rm);

    if (item.error){
      const b = document.createElement('div');
      b.className = 'badge'; b.textContent = item.error;
      d.appendChild(b);
    } else if (item.optimizedSize){
      if (item.optimizedSize < item.file.size){
        const tag = document.createElement('span');
        tag.className = 'save-tag';
        const pct = Math.round((1 - item.optimizedSize / item.file.size) * 100);
        tag.textContent = `-${pct}%`;
        d.appendChild(tag);
      } else if (item.optimizedSize > item.file.size){
        const tag = document.createElement('span');
        tag.className = 'up-tag';
        tag.textContent = '↑';
        tag.title = 'Upscaled';
        d.appendChild(tag);
      }
    }

    d.addEventListener('click', () => {
      const usable = state.items.filter(x => !x.error);
      const idx = usable.findIndex(x => x.id === item.id);
      if (idx > -1) state.previewIndex = idx;
      if (!els.applyAll.checked) writeToolbarSettings(item);
      render();
    });

    d.addEventListener('dragstart', e => {
      dragId = item.id;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', item.id); } catch(_) {}
    });
    d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over'); });
    d.addEventListener('dragleave', () => d.classList.remove('over'));
    d.addEventListener('drop', e => {
      e.preventDefault(); d.classList.remove('over');
      if (dragId && dragId !== item.id) reorder(dragId, item.id);
    });

    els.grid.appendChild(d);
  });

  if (state.previewIndex >= visible.length) state.previewIndex = 0;
  renderPreview();
}

function removeItem(id){
  const i = state.items.findIndex(x => x.id === id);
  if (i > -1){
    URL.revokeObjectURL(state.items[i].url);
    state.items.splice(i, 1);
    render();
    updateSizeInfo();
  }
}
function reorder(fromId, toId){
  const from = state.items.findIndex(x => x.id === fromId);
  const to   = state.items.findIndex(x => x.id === toId);
  if (from < 0 || to < 0) return;
  const [moved] = state.items.splice(from, 1);
  state.items.splice(to, 0, moved);
  render();
}

/* ------------------------------------------------------------------ */
/*  Live preview                                                       */
/* ------------------------------------------------------------------ */
function renderPreview(){
  const host = els.previewHost;
  host.innerHTML = '';

  const visible = state.items.filter(i => !i.error);

  if (!visible.length){
    host.innerHTML = '<div class="placeholder">Upload photos to see the live preview.</div>';
    els.pageInfo.textContent = '— / —';
    els.prevBtn.disabled = els.nextBtn.disabled = true;
    return;
  }

  if (state.previewIndex >= visible.length) state.previewIndex = 0;
  const idx = state.previewIndex;
  const item = visible[idx];

  const s = settingsForItem(item);
  const { pageW, pageH, mH, mV, landscape } = geometryFor(s);

  const stage = els.previewStage;
  const pad = 40;
  const availW = Math.max(200, stage.clientWidth  - pad);
  const availH = Math.max(200, stage.clientHeight - pad);

  const aspect = pageW / pageH;
  let paperW = availW;
  let paperH = paperW / aspect;
  if (paperH > availH){
    paperH = availH;
    paperW = paperH * aspect;
  }

  const scale = paperW / pageW;

  const contentWIn = Math.max(0.1, pageW - mH * 2);
  const contentHIn = Math.max(0.1, pageH - mV * 2);
  const contentW   = contentWIn * scale;
  const contentH   = contentHIn * scale;
  const contentLeft = mH * scale;
  const contentTop  = mV * scale;

  const page = document.createElement('div');
  page.className = 'page';
  page.style.width  = paperW + 'px';
  page.style.height = paperH + 'px';

  const label = document.createElement('div');
  label.className = 'page-no';
  label.textContent = `Page ${idx + 1} of ${visible.length}` +
                      (landscape ? ' · landscape' : ' · portrait');
  page.appendChild(label);

  const content = document.createElement('div');
  content.className = 'content' + (s.sizing === 'stretch' ? ' stretch' : '');
  content.style.left   = contentLeft + 'px';
  content.style.top    = contentTop + 'px';
  content.style.width  = contentW + 'px';
  content.style.height = contentH + 'px';

  const img = document.createElement('img');
  img.src = item.url; img.alt = '';
  content.appendChild(img);
  page.appendChild(content);

  const guide = document.createElement('div');
  guide.className = 'guide';
  guide.style.left   = contentLeft + 'px';
  guide.style.top    = contentTop + 'px';
  guide.style.width  = contentW + 'px';
  guide.style.height = contentH + 'px';
  page.appendChild(guide);

  host.appendChild(page);

  els.pageInfo.textContent = `${idx + 1} / ${visible.length}`;
  els.prevBtn.disabled = visible.length < 2;
  els.nextBtn.disabled = visible.length < 2;
}

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderPreview, 80);
});

els.prevBtn.addEventListener('click', () => {
  const n = state.items.filter(i => !i.error).length;
  if (!n) return;
  state.previewIndex = (state.previewIndex - 1 + n) % n;
  if (!els.applyAll.checked){
    const visible = state.items.filter(i => !i.error);
    writeToolbarSettings(visible[state.previewIndex]);
  }
  render();
});
els.nextBtn.addEventListener('click', () => {
  const n = state.items.filter(i => !i.error).length;
  if (!n) return;
  state.previewIndex = (state.previewIndex + 1) % n;
  if (!els.applyAll.checked){
    const visible = state.items.filter(i => !i.error);
    writeToolbarSettings(visible[state.previewIndex]);
  }
  render();
});

['change','input'].forEach(ev => {
  els.pageSize.addEventListener(ev, onToolbarChange);
  els.orient.addEventListener(ev, onToolbarChange);
  els.sizing.addEventListener(ev, onToolbarChange);
  els.marginH.addEventListener(ev, onToolbarChange);
  els.marginV.addEventListener(ev, onToolbarChange);
});

function onToolbarChange(){
  const s = readToolbarSettings();
  if (els.applyAll.checked){
    state.items.forEach(it => {
      it.pageSize    = s.pageSize;
      it.orientation = s.orientation;
      it.sizing      = s.sizing;
      it.marginH     = s.marginH;
      it.marginV     = s.marginV;
    });
  } else {
    const visible = state.items.filter(i => !i.error);
    const item = visible[state.previewIndex];
    if (item){
      item.pageSize    = s.pageSize;
      item.orientation = s.orientation;
      item.sizing      = s.sizing;
      item.marginH     = s.marginH;
      item.marginV     = s.marginV;
    }
  }
  renderPreview();
}

els.applyAll.addEventListener('change', () => {
  if (els.applyAll.checked){
    const s = readToolbarSettings();
    state.items.forEach(it => {
      it.pageSize    = s.pageSize;
      it.orientation = s.orientation;
      it.sizing      = s.sizing;
      it.marginH     = s.marginH;
      it.marginV     = s.marginV;
    });
  } else {
    const visible = state.items.filter(i => !i.error);
    const item = visible[state.previewIndex];
    if (item) writeToolbarSettings(item);
  }
  render();
});

els.marginH.addEventListener('blur', () => {
  els.marginH.value = clampMargin(els.marginH.value); onToolbarChange();
});
els.marginV.addEventListener('blur', () => {
  els.marginV.value = clampMargin(els.marginV.value); onToolbarChange();
});

/* ------------------------------------------------------------------ */
/*  Image → embeddable bytes                                           */
/* ------------------------------------------------------------------ */
const embCache = new Map();

function cacheKey(item){
  const o = getOptimizeSettings();
  return `${item.id}|${o.enabled}|${o.scale}|${o.quality}`;
}

async function toEmbeddable(item, opts = {}){
  const key = cacheKey(item);
  if (!opts.skipCache && embCache.has(key)) return embCache.get(key);

  const img = await loadImage(item.url);
  const naturalW = img.naturalWidth;
  const naturalH = img.naturalHeight;

  const o = getOptimizeSettings();

  let w = naturalW, h = naturalH;
  if (o.enabled && o.scale !== 1){
    w = Math.max(1, Math.round(naturalW * o.scale));
    h = Math.max(1, Math.round(naturalH * o.scale));
  }

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const usePng = /png/i.test(item.file.type) || /\.png$/i.test(item.file.name);

  if (!usePng){
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
  }

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);

  const encodeType = usePng ? 'image/png' : 'image/jpeg';
  const encodeQuality = o.enabled ? o.quality : 0.92;

  const blob = await new Promise(r => canvas.toBlob(r, encodeType, encodeQuality));
  if (!blob) throw new Error('Could not process image');

  const result = {
    blob,
    type: usePng ? 'png' : 'jpg',
    width: naturalW,
    height: naturalH,
    canvas
  };
  embCache.set(key, result);

  item.optimizedSize = o.enabled ? blob.size : null;
  return result;
}

/* ------------------------------------------------------------------ */
/*  Shared export helpers                                              */
/* ------------------------------------------------------------------ */
function setProgress(ratio, text){
  els.progress.classList.add('on');
  els.bar.style.width = Math.round(ratio * 100) + '%';
  if (text) els.status.textContent = text;
}
function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}
function baseName(){
  const first = state.items.find(i => !i.error);
  const n = first ? first.file.name : 'photos';
  return n.replace(/\.[^.]+$/, '');
}
function setExporting(on){
  els.exportBtn.disabled = on;
  els.exportPdfBtn.disabled = on;
}

/* ------------------------------------------------------------------ */
/*  Post-process .docx for landscape                                   */
/* ------------------------------------------------------------------ */
async function fixLandscapeInDocx(blob){
  const JSZip = await ensureJSZip();
  if (!JSZip) return blob;
  try {
    const zip = await JSZip.loadAsync(blob);
    const file = zip.file('word/document.xml');
    if (!file) return blob;

    let xml = await file.async('string');
    xml = xml.replace(/<w:pgSz\b[^>]*\/>/g, (tag) => {
      const wMatch = tag.match(/\bw:w="(\d+)"/);
      const hMatch = tag.match(/\bw:h="(\d+)"/);
      const oMatch = tag.match(/\bw:orient="([^"]+)"/);
      if (!wMatch || !hMatch) return tag;
      let w = parseInt(wMatch[1], 10);
      let h = parseInt(hMatch[1], 10);
      let orient = oMatch ? oMatch[1] : (w > h ? 'landscape' : 'portrait');
      if (orient === 'landscape' && w < h){ const t = w; w = h; h = t; }
      else if (orient === 'portrait' && w > h){ const t = w; w = h; h = t; }
      let newTag = tag.replace(/\bw:w="\d+"/, `w:w="${w}"`)
                      .replace(/\bw:h="\d+"/, `w:h="${h}"`);
      if (/\bw:orient="[^"]+"/.test(newTag)){
        newTag = newTag.replace(/\bw:orient="[^"]+"/, `w:orient="${orient}"`);
      } else {
        newTag = newTag.replace(/\/>$/, ` w:orient="${orient}"/>`);
      }
      return newTag;
    });
    zip.file('word/document.xml', xml);
    return await zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
  } catch (e){
    console.warn('docx post-fix failed:', e);
    return blob;
  }
}

/* ------------------------------------------------------------------ */
/*  Export → Word                                                      */
/* ------------------------------------------------------------------ */
async function exportDocx(){
  els.errBox.style.display = 'none';
  const usable = state.items.filter(i => !i.error);
  const skipped = state.items.length - usable.length;
  if (!usable.length){
    els.errBox.textContent = 'No usable photos.';
    els.errBox.style.display = 'block';
    return;
  }

  setExporting(true);
  setProgress(0.02, 'Loading Word engine…');

  try {
    const docx = await ensureDocx();
    const { Document, Packer, Paragraph, ImageRun, AlignmentType,
            convertInchesToTwip, PageOrientation } = docx;

    const sections = [];

    for (let i = 0; i < usable.length; i++){
      const item = usable[i];
      setProgress(i / usable.length, `Photo ${i + 1} / ${usable.length}…`);
      await new Promise(r => setTimeout(r, 0));

      const s = els.applyAll.checked ? readToolbarSettings() : item;
      const { pageW, pageH, mH, mV, landscape } = geometryFor(s);

      const shortSide = Math.min(pageW, pageH);
      const longSide  = Math.max(pageW, pageH);
      const sheetW = landscape ? longSide  : shortSide;
      const sheetH = landscape ? shortSide : longSide;
      const orient = landscape ? PageOrientation.LANDSCAPE : PageOrientation.PORTRAIT;

      const SAFE = 12;
      const contentW = Math.max(40, (sheetW - mH * 2) * 96 - SAFE);
      const contentH = Math.max(40, (sheetH - mV * 2) * 96 - SAFE);
      const stretch  = s.sizing === 'stretch';

      const emb = await toEmbeddable(item);

      let outW, outH;
      if (stretch){ outW = contentW; outH = contentH; }
      else {
        const sc = Math.min(contentW / emb.width, contentH / emb.height);
        outW = emb.width * sc; outH = emb.height * sc;
      }

      const buf = await emb.blob.arrayBuffer();

      const para = new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 0, after: 0 },
        children: [ new ImageRun({
          type: emb.type, data: buf,
          transformation: { width: Math.max(1, Math.round(outW)),
                            height: Math.max(1, Math.round(outH)) }
        })]
      });

      sections.push({
        properties: { page: {
          size: { width: convertInchesToTwip(sheetW),
                  height: convertInchesToTwip(sheetH),
                  orientation: orient },
          margin: { top: convertInchesToTwip(mV), right: convertInchesToTwip(mH),
                    bottom: convertInchesToTwip(mV), left: convertInchesToTwip(mH) }
        }},
        children: [para]
      });
    }

    setProgress(0.97, 'Building .docx…');
    const doc = new Document({ sections });
    const rawBlob = await Packer.toBlob(doc);
    setProgress(0.985, 'Fixing page orientation…');
    const fixedBlob = await fixLandscapeInDocx(rawBlob);

    download(fixedBlob, `${baseName()}-photos.docx`);

    setProgress(1, `Done ✔  ${usable.length} page(s)` +
                   (skipped ? ` · ${skipped} skipped` : ''));
    if (skipped){
      els.errBox.textContent = `${skipped} file(s) skipped.`;
      els.errBox.style.display = 'block';
    }
  } catch (err){
    console.error(err);
    els.errBox.textContent = err.message || 'Error creating document.';
    els.errBox.style.display = 'block';
    els.progress.classList.remove('on');
    els.status.textContent = '';
  } finally {
    setExporting(false);
  }
}

/* ------------------------------------------------------------------ */
/*  Export → PDF                                                       */
/* ------------------------------------------------------------------ */
async function exportPdf(){
  els.errBox.style.display = 'none';
  const usable = state.items.filter(i => !i.error);
  const skipped = state.items.length - usable.length;
  if (!usable.length){
    els.errBox.textContent = 'No usable photos.';
    els.errBox.style.display = 'block';
    return;
  }

  setExporting(true);
  setProgress(0.02, 'Loading PDF engine…');

  try {
    const jsPDF = await ensureJsPdf();
    const firstS = els.applyAll.checked ? readToolbarSettings() : usable[0];
    const firstG = geometryFor(firstS);
    const pdf = new jsPDF({
      unit: 'in',
      format: [firstG.pageW, firstG.pageH],
      orientation: firstG.landscape ? 'landscape' : 'portrait',
      compress: true
    });

    for (let i = 0; i < usable.length; i++){
      const item = usable[i];
      setProgress(i / usable.length, `Photo ${i + 1} / ${usable.length}…`);
      await new Promise(r => setTimeout(r, 0));

      const s = els.applyAll.checked ? readToolbarSettings() : item;
      const { pageW, pageH, mH, mV, landscape } = geometryFor(s);
      const contentW = Math.max(0.1, pageW - mH * 2);
      const contentH = Math.max(0.1, pageH - mV * 2);
      const stretch  = s.sizing === 'stretch';

      const emb = await toEmbeddable(item);

      let drawW, drawH;
      if (stretch){ drawW = contentW; drawH = contentH; }
      else {
        const sc = Math.min(contentW / emb.width, contentH / emb.height);
        drawW = emb.width * sc; drawH = emb.height * sc;
      }
      const x = mH + (contentW - drawW) / 2;
      const y = mV + (contentH - drawH) / 2;

      const q = els.optimize.checked ? parseInt(els.quality.value, 10) / 100 : 0.92;
      const dataUrl = emb.canvas.toDataURL(
        emb.type === 'png' ? 'image/png' : 'image/jpeg', q);
      const fmt = emb.type === 'png' ? 'PNG' : 'JPEG';

      if (i === 0) pdf.addImage(dataUrl, fmt, x, y, drawW, drawH, undefined, 'FAST');
      else {
        pdf.addPage([pageW, pageH], landscape ? 'landscape' : 'portrait');
        pdf.addImage(dataUrl, fmt, x, y, drawW, drawH, undefined, 'FAST');
      }
    }

    setProgress(0.97, 'Building PDF…');
    const blob = pdf.output('blob');
    download(blob, `${baseName()}-photos.pdf`);

    setProgress(1, `Done ✔  ${usable.length} page(s)` +
                   (skipped ? ` · ${skipped} skipped` : ''));
    if (skipped){
      els.errBox.textContent = `${skipped} file(s) skipped.`;
      els.errBox.style.display = 'block';
    }
  } catch (err){
    console.error(err);
    els.errBox.textContent = err.message || 'Error creating PDF.';
    els.errBox.style.display = 'block';
    els.progress.classList.remove('on');
    els.status.textContent = '';
  } finally {
    setExporting(false);
  }
}

/* ------------------------------------------------------------------ */
/*  Events                                                             */
/* ------------------------------------------------------------------ */
els.drop.addEventListener('click', () => els.file.click());
els.addMore.addEventListener('click', () => els.file.click());

els.file.addEventListener('change', e => {
  if (e.target.files && e.target.files.length) addFiles(e.target.files);
  e.target.value = '';
});

['dragenter','dragover'].forEach(ev =>
  els.drop.addEventListener(ev, e => { e.preventDefault(); els.drop.classList.add('hover'); }));
['dragleave','drop'].forEach(ev =>
  els.drop.addEventListener(ev, e => { e.preventDefault(); els.drop.classList.remove('hover'); }));

els.drop.addEventListener('drop', e => {
  const dt = e.dataTransfer;
  if (dt && dt.files && dt.files.length) addFiles(dt.files);
});

els.clearBtn.addEventListener('click', () => {
  state.items.forEach(i => URL.revokeObjectURL(i.url));
  state.items = [];
  state.previewIndex = 0;
  embCache.clear();
  render();
  updateSizeInfo();
  els.progress.classList.remove('on');
  els.status.textContent = '';
  els.errBox.style.display = 'none';
});

els.exportBtn.addEventListener('click', exportDocx);
els.exportPdfBtn.addEventListener('click', exportPdf);

window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

/* init */
toggleOptimizeUI();
renderPreview();
</script>
</body>
