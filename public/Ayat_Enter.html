<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes" />
    <title>تسجيل دخول بيانات عداد المعمل الهندسي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #e0e7ef 100%);
            padding: 20px;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
            color: #e2e8f0;
        }

        .entry-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(2px);
            border-radius: 28px;
            padding: 28px 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            transition: all 0.3s;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        body.dark-mode .entry-card {
            background: #1e293b;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.4);
            border-color: #334155;
        }

        .section-header {
            font-size: 1rem;
            font-weight: 500;
            color: #0f766e;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 3px solid #0d9488;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.3px;
        }

        body.dark-mode .section-header {
            color: #5ee0da;
            border-bottom-color: #2dd4bf;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px 24px;
            margin-bottom: 30px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-field label {
            font-weight: 700;
            font-size: 0.85rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }

        body.dark-mode .form-field label {
            color: #cbd5e1;
        }

        .form-field label i {
            color: #0d9488;
            width: 20px;
            font-size: 1rem;
        }

        .inline-input,
        .inline-select,
        .inline-textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 16px;
            border: 1.5px solid #e2e8f0;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            background: white;
            transition: all 0.25s ease;
            font-weight: 500;
        }

        .inline-textarea {
            min-height: 92px;
            resize: vertical;
            line-height: 1.5;
        }

        .inline-input:focus,
        .inline-select:focus,
        .inline-textarea:focus {
            outline: none;
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
            transform: translateY(-1px);
        }

        body.dark-mode .inline-input,
        body.dark-mode .inline-select,
        body.dark-mode .inline-textarea {
            background: #334155;
            border-color: #475569;
            color: #f8fafc;
        }

        option.add-option {
            color: #0d9488;
            font-weight: 700;
        }

        .btn-save-row {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            width: 100%;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 14px rgba(16, 185, 129, 0.25);
        }

        .btn-save-row:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.35);
            background: linear-gradient(135deg, #059669, #047857);
        }

        .inline-input[readonly] {
            background: #f1f5f9;
            border-color: #cbd5e1;
            color: #334155;
            font-weight: 600;
            cursor: default;
        }

        body.dark-mode .inline-input[readonly] {
            background: #2d3a4e;
            border-color: #5b6e8c;
            color: #a5f3fc;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            background: white;
        }

        body.dark-mode .table-wrapper {
            background: #0f172a;
            border-color: #334155;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 1350px;
        }

        th {
            background: #f1f5f9;
            padding: 14px 8px;
            font-weight: 700;
            color: #1e293b;
            border-bottom: 1px solid #e2e8f0;
        }

        body.dark-mode th {
            background: #1e293b;
            color: #e2e8f0;
            border-bottom-color: #334155;
        }

        td {
            padding: 10px 8px;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
            white-space: nowrap;
        }

        body.dark-mode td {
            border-bottom-color: #1e293b;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        body.dark-mode tbody tr:hover {
            background: #263449;
        }

        .search-label {
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #0f766e;
        }

        body.dark-mode .search-label {
            color: #5ee0da;
        }

        .date-range {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .search-input,
        .header-date,
        .search-select-notes {
            width: 100%;
            padding: 8px 10px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 0.75rem;
            transition: 0.2s;
            font-family: 'Cairo', sans-serif;
        }

        body.dark-mode .search-input,
        body.dark-mode .header-date,
        body.dark-mode .search-select-notes {
            background: #334155;
            border-color: #475569;
            color: #f8fafc;
        }

        .stats-bar {
            background: #ccfbf1;
            border-radius: 60px;
            padding: 12px 20px;
            font-weight: 700;
            display: inline-block;
            width: auto;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        body.dark-mode .stats-bar {
            background: #134e4a;
            color: #99f6e4;
        }

        .action-buttons-container {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn-icon-edit,
        .btn-icon-delete {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 12px;
            font-size: 0.8rem;
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn-icon-edit {
            background: #f59e0b;
            color: white;
        }

        .btn-icon-delete {
            background: #ef4444;
            color: white;
        }

        .btn-icon-edit:hover,
        .btn-icon-delete:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .pagination-controls {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }

        .btn-pagination {
            background: #0f766e;
            padding: 8px 24px;
            border-radius: 40px;
            border: none;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
        }

        .btn-pagination:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .page-info {
            background: #e2e8f0;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 600;
        }

        body.dark-mode .page-info {
            background: #334155;
            color: #e2e8f0;
        }

        @media (max-width: 780px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .entry-card {
                padding: 20px;
            }

            .btn-save-row {
                width: 100%;
            }
        }

        .header-actions {
            background: linear-gradient(135deg, #18c6b7c0, #16a799);
            border-radius: 32px;
            padding: 12px 24px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-actions h1 {
            font-size: 1.1rem !important;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            letter-spacing: -0.2px;
        }

        .header-actions h1 i {
            font-size: 1.2rem;
        }

        .dark-mode-checkbox {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            padding: 6px 16px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dark-mode-checkbox:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .dark-mode-checkbox input {
            display: none;
        }

        .dark-mode-checkbox span {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #fff;
        }

        .btn-home {
            background: rgba(244, 235, 235, 0.2);
            border-radius: 40px;
            padding: 6px 18px;
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-home:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .header-actions {
                flex-direction: column;
                text-align: center;
                padding: 12px 16px;
            }

            .header-actions h1 {
                font-size: 0.95rem !important;
            }

            .action-buttons {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .header-actions h1 {
                font-size: 0.85rem !important;
            }

            .btn-home,
            .dark-mode-checkbox span {
                font-size: 0.75rem;
            }
        }

        .btn-refresh,
        .btn-excel,
        .btn-import {
            transition: all 0.2s ease;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-refresh:hover,
        .btn-excel:hover,
        .btn-import:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="header-actions">
            <h1><i class="fas fa-microchip"></i> تسجيل دخول بيانات عداد المعمل الهندسي</h1>
            <div class="action-buttons">
                <label class="dark-mode-checkbox">
                    <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()">
                    <span><i class="fas fa-moon"></i> الوضع المظلم</span>
                </label>
                <button class="btn-home" onclick="window.location.href='index.html'"><i class="fas fa-home"></i>
                    الرئيسية</button>
            </div>
        </div>

        <!-- ====================== FORM ====================== -->
        <div class="entry-card">
            <div class="section-header"><i class="fas fa-pen-ruler"></i> إدخال بيانات عداد جديد</div>
            <div class="form-grid">

                <div class="form-field">
                    <label><i class="fas fa-hashtag"></i> رقم العداد</label>
                    <input type="text" id="inputMno" class="inline-input" placeholder="مثال: 12345678">
                </div>

                <div class="form-field">
                    <label><i class="fas fa-chart-line"></i> القطاع</label>
                    <select id="inputKeta3" class="inline-select">
                        <option value="">اختر القطاع</option>
                        <option>دمياط</option>
                        <option>شمال الدقهلية</option>
                        <option>جنوب الدقهلية</option>
                        <option>كفر الشيخ</option>
                    </select>
                </div>

                <div class="form-field">
                    <label><i class="fas fa-draw-polygon"></i> الهندسة</label>
                    <select id="inputHandsa" class="inline-select">
                        <option value="">اختر الهندسة</option>
                        <option>هندسة شمال دمياط</option>
                        <option>هندسة جنوب دمياط</option>
                        <option>هندسة عزبة البرج</option>
                        <option>هندسة كفر سعد</option>
                        <option>هندسة كفر البطيخ</option>
                        <option>هندسة راس البر</option>
                        <option>هندسة دمياط الجديدة</option>
                        <option>هندسة الزرقا</option>
                        <option>هندسة فارسكور</option>
                        <option>هندسة الروضة</option>
                        <option>هندسة الشعراء</option>
                        <option>هندسة مدينة شربين</option>
                        <option>هندسة قري شربين</option>
                        <option>هندسة دكرنس</option>
                        <option>هندسة جمصة</option>
                        <option>هندسة قري بلقاس</option>
                        <option>هندسة مدينة بلقاس</option>
                        <option>هندسة الستاموني</option>
                        <option>هندسة بني عبيد</option>
                        <option>هندسة منية النصر</option>
                        <option>هندسة ميت سلسيل</option>
                        <option>هندسة الجمالية</option>
                        <option>هندسة قري المنزلة</option>
                        <option>هندسة مدينة المنزلة</option>
                        <option>هندسة المطرية</option>
                        <option>هندسة شرق المنصورة</option>
                        <option>هندسة غرب المنصورة</option>
                        <option>هندسة طلخا</option>
                        <option>هندسة نبروه</option>
                        <option>هندسة قري المنصورة 1</option>
                        <option>هندسة قري المنصورة 2</option>
                        <option>هندسة اجا</option>
                        <option>هندسة مدينة السنبلاوين</option>
                        <option>هندسة قري السنبلاوين</option>
                        <option>هندسة تمي الامديد</option>
                        <option>هندسة مدينة ميت غمر</option>
                        <option>هندسة قري ميت غمر</option>
                        <option>هندسة كوم النور</option>
                        <option>هندسة مدينة كفر الشيخ</option>
                        <option>هندسة غرب كفر الشيخ</option>
                        <option>هندسة شرق كفر الشيخ</option>
                        <option>هندسة قلين</option>
                        <option>هندسة قرى سيدي سالم</option>
                        <option>هندسة مدينة سيدي سالم</option>
                        <option>هندسة الرياض</option>
                        <option>هندسة مدينة دسوق</option>
                        <option>هندسة قرى شمال دسوق</option>
                        <option>هندسة قرى جنوب دسوق</option>
                        <option>هندسة فوه</option>
                        <option>هندسة مطوبس</option>
                        <option>هندسة مدينة الحامول</option>
                        <option>هندسة قرى الحامول</option>
                        <option>هندسة بيلا</option>
                        <option>هندسة بلطيم</option>
                        <option>هندسة برج البرلس</option>
                    </select>
                </div>

                <!-- نوع النشاط -->
                <div class="form-field">
                    <label><i class="fas fa-bolt"></i> نوع النشاط</label>
                    <select id="inputNashat" class="inline-select"
                        onchange="handleAddOption(this, 'النشاط')">
                        <option value="">اختر النشاط</option>
                        <option>منزلي</option>
                        <option>تجاري</option>
                        <option>قوى محركة</option>
                        <option>كودي مخالف</option>
                        <option>ري</option>
                        <option>مزارع</option>
                        <option>مساجد</option>
                        <option>استثمار صناعة</option>
                        <option>كبار</option>
                        <option>مصالح حكومية</option>
                        <option>مصالح حكوميه اخري</option>
                        <option value="__add__" class="add-option">➕ إضافة نشاط جديد</option>
                    </select>
                </div>

                <!-- نوع العداد -->
                <div class="form-field">
                    <label><i class="fas fa-tachometer-alt"></i> نوع العداد</label>
                    <select id="inputMtype" class="inline-select"
                        onchange="handleAddOption(this, 'نوع العداد')">
                        <option value="">اختر نوع العداد</option>
                        <option> ثلاثى</option>
                        <option> احادي</option>
                        <option> ثلاثى غير  مباشر</option>
                        <option value="__add__" class="add-option">➕ إضافة نوع عداد جديد</option>
                    </select>
                </div>

                <!-- الشركة المصنعة -->
                <div class="form-field">
                    <label><i class="fas fa-industry"></i> الشركة المصنعة</label>
                    <select id="inputManufacturer" class="inline-select"
                        onchange="handleAddOption(this, 'الشركة المصنعة')">
                        <option value="">اختر الشركة المصنعة</option>
                        <option>سويدي</option>
                        <option>اسكرا</option>
                        <option>المصرية</option>
                        <option>جلوبال</option>
                        <option> جيزة باور</option>
                        <option>المصرية</option>
                        <option value="__add__" class="add-option">➕ إضافة شركة جديدة</option>
                    </select>
                </div>

                <!-- نوع التقرير -->
                <div class="form-field">
                    <label><i class="fas fa-file-lines"></i> نوع التقرير</label>
                    <select id="inputReportType" class="inline-select"
                        onchange="handleAddOption(this, 'نوع التقرير')">
                        <option value="">اختر نوع التقرير</option>
                        <option>الفحص</option>
                        <option>التكهين</option>
                        <option>ضبطية</option>
                        <option>تلاعب</option>
                        <option>مديونية</option>
                        <option value="__add__" class="add-option">➕ إضافة نوع تقرير جديد</option>
                    </select>
                </div>

                <!-- تاريخ التسجيل (dd/mm/yyyy) -->
                <div class="form-field">
                    <label><i class="fas fa-calendar-alt"></i> تاريخ التسجيل</label>
                    <input type="text" id="inputDate" class="inline-input" placeholder="dd/mm/yyyy"
                        maxlength="10" inputmode="numeric" oninput="autoFormatDate(this)">
                </div>

                <!-- ملاحظات (Textarea) -->
                <div class="form-field" style="grid-column:1/-1;">
                    <label><i class="fas fa-comment-dots"></i> ملاحظات</label>
                    <textarea id="inputNotes" class="inline-textarea" placeholder="اكتب الملاحظات هنا..."></textarea>
                </div>

            </div>
            <button class="btn-save-row" onclick="saveDirectInput()"><i class="fas fa-save fa-lg"></i> حفظ بيانات
                العداد</button>
        </div>

        <!-- ====================== SEARCH + TABLE ====================== -->
        <div class="entry-card">
            <div class="section-header"><i class="fas fa-table-list"></i> البحث </div>
            <div class="stats-bar" id="totalSummary"><i class="fas fa-chart-simple"></i> إجمالي السجلات: 0 | نتائج
                البحث: 0</div>
            <div class="table-controls"
                style="display: flex; gap: 12px; justify-content: flex-end; margin-bottom: 20px; flex-wrap: wrap;">
                <button class="btn-import" onclick="triggerExcelUpload()"
                    style="background:#8b5cf6; border:none; padding:8px 18px; border-radius:40px; color:white;"><i
                        class="fas fa-file-import"></i> استيراد Excel</button>
                <button class="btn-refresh" onclick="refreshDatabase()"
                    style="background:#0284c7; border:none; padding:8px 18px; border-radius:40px; color:white;"><i
                        class="fas fa-sync-alt"></i> تحديث</button>
                <button class="btn-excel" onclick="exportExcel()"
                    style="background:#10b981; border:none; padding:8px 18px; border-radius:40px; color:white;"><i
                        class="fas fa-file-excel"></i> تصدير Excel</button>
                <input type="file" id="excelFileInput" accept=".xlsx,.xls,.csv" style="display:none"
                    onchange="handleExcelImport(event)">
            </div>
            <div class="table-wrapper">
                <table id="dataTable">
                    <thead>
                        <tr class="search-header-row">
                            <th style="width:55px;">
                                <div class="search-label">م</div>
                            </th>
                            <th>
                                <div class="search-label">القطاع</div>
                                <input type="text" class="search-input" id="searchKeta3" onkeyup="filterTable()"
                                    placeholder="بحث...">
                            </th>
                            <th>
                                <div class="search-label">الهندسة</div>
                                <input type="text" class="search-input" id="searchHandsa" onkeyup="filterTable()"
                                    placeholder="بحث...">
                            </th>
                            <th>
                                <div class="search-label">تاريخ التسجيل</div>
                                <div class="date-range">
                                    <input type="text" class="header-date" id="searchStartDate"
                                        placeholder="من dd/mm/yyyy" maxlength="10" inputmode="numeric"
                                        oninput="autoFormatDate(this)" onchange="filterTable()">
                                    <input type="text" class="header-date" id="searchEndDate"
                                        placeholder="إلى dd/mm/yyyy" maxlength="10" inputmode="numeric"
                                        oninput="autoFormatDate(this)" onchange="filterTable()">
                                </div>
                            </th>
                            <th>
                                <div class="search-label">نوع النشاط</div>
                                <input type="text" class="search-input" id="searchNashat" onkeyup="filterTable()"
                                    placeholder="بحث...">
                            </th>
                            <th>
                                <div class="search-label">نوع العداد</div>
                                <input type="text" class="search-input" id="searchMtype" onkeyup="filterTable()"
                                    placeholder="بحث...">
                            </th>
                            <th>
                                <div class="search-label">رقم العداد</div>
                                <input type="text" class="search-input" id="searchMno" onkeyup="filterTable()"
                                    placeholder="بحث...">
                            </th>
                            <th>
                                <div class="search-label">الشركة المصنعة</div>
                                <input type="text" class="search-input" id="searchManufacturer"
                                    onkeyup="filterTable()" placeholder="بحث...">
                            </th>
                            <th>
                                <div class="search-label">نوع التقرير</div>
                                <input type="text" class="search-input" id="searchReportType" onkeyup="filterTable()"
                                    placeholder="بحث...">
                            </th>
                            <th>
                                <div class="search-label">ملاحظات</div>
                                <input type="text" class="search-input" id="searchNotes" onkeyup="filterTable()"
                                    placeholder="بحث...">
                            </th>
                            <th style="width:110px;">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="pagination-controls">
                <button id="prevBtn" class="btn-pagination" onclick="prevPage()"><i class="fas fa-chevron-right"></i>
                    السابق</button>
                <span id="pageInfo" class="page-info">الصفحة 1 من 1</span>
                <button id="nextBtn" class="btn-pagination" onclick="nextPage()">التالي <i
                        class="fas fa-chevron-left"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getDatabase, ref, set, get, remove } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnKRhT5xJTBvsQKpW7e9w-hGSbAQJWTSo",
            authDomain: "production1-ae85.firebaseapp.com",
            projectId: "production1-ae85",
            storageBucket: "production1-ae85.firebasestorage.app",
            messagingSenderId: "490438031865",
            appId: "1:490438031865:web:a4a69335989f30cd13a528"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allData = [], filteredData = [], currentPage = 1;
        const itemsPerPage = 10;
        const ADD_VALUE = '__add__';

        /* ---------- date helpers (dd/mm/yyyy ⇄ yyyy-mm-dd) ---------- */
        function toISO(dmy) {
            if (!dmy) return '';
            const m = String(dmy).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (!m) return '';
            const d = m[1].padStart(2, '0');
            const mo = m[2].padStart(2, '0');
            const y = m[3];
            const dd = +d, mm = +mo;
            if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return '';
            const dt = new Date(`${y}-${mo}-${d}T00:00:00`);
            if (isNaN(dt.getTime())) return '';
            if (dt.getFullYear() !== +y || dt.getMonth() + 1 !== mm || dt.getDate() !== dd) return '';
            return `${y}-${mo}-${d}`;
        }

        function toDMY(iso) {
            if (!iso) return '';
            const p = String(iso).split('-');
            if (p.length !== 3) return String(iso);
            return `${p[2].padStart(2, '0')}/${p[1].padStart(2, '0')}/${p[0]}`;
        }

        function todayDMY() {
            const d = new Date();
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            return `${dd}/${mm}/${d.getFullYear()}`;
        }

        // global so inline oninput can call it
        window.autoFormatDate = function (el) {
            let v = el.value.replace(/[^\d]/g, '').slice(0, 8);
            if (v.length >= 5) v = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
            else if (v.length >= 3) v = v.slice(0, 2) + '/' + v.slice(2);
            el.value = v;
        };

        /* ---------- helpers ---------- */
        const gv = id => (document.getElementById(id)?.value || '').trim();
        const esc = s => (s === undefined || s === null) ? '' : String(s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        function optionsHtml(selectId, selected) {
            return Array.from(document.getElementById(selectId).options)
                .filter(o => o.value && o.value !== ADD_VALUE)
                .map(o => `<option value="${esc(o.value)}" ${selected === o.value ? 'selected' : ''}>${esc(o.value)}</option>`)
                .join('');
        }

        /* ---------- load ---------- */
        async function loadData() {
            const snapshot = await get(ref(db, 'Ayat_Enter'));
            allData = [];
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach(key => { allData.push({ ...data[key], id: key }); });
                allData.sort((a, b) => (b.enter_date || '').localeCompare(a.enter_date || ''));
            }
            filteredData = [...allData];
            currentPage = 1;
            renderTable();
            updateStats();
        }

        /* ---------- save ---------- */
        window.saveDirectInput = async function () {
            const mno = gv('inputMno');
            if (!mno) { Swal.fire("خطأ", "رقم العداد مطلوب", "error"); return; }
            if (allData.some(item => item.mno === mno)) { Swal.fire("تنبيه", "رقم العداد موجود بالفعل", "warning"); return; }

            const selects = ['inputNashat', 'inputMtype', 'inputManufacturer', 'inputReportType'];
            for (const id of selects) {
                if (document.getElementById(id).value === ADD_VALUE) {
                    Swal.fire("تنبيه", "اختر قيمة صحيحة بدل خيار الإضافة", "warning");
                    return;
                }
            }

            const rawDate = gv('inputDate');
            const isoDate = toISO(rawDate);
            if (rawDate && !isoDate) {
                Swal.fire("خطأ", "صيغة التاريخ غير صحيحة (dd/mm/yyyy)", "error");
                return;
            }

            const newRecord = {
                mno: mno,
                keta3: gv('inputKeta3'),
                handsa: gv('inputHandsa'),
                nashattype: gv('inputNashat'),
                mtype: gv('inputMtype'),
                manufacturer: gv('inputManufacturer'),
                report_type: gv('inputReportType'),
                enter_date: isoDate,
                notes: gv('inputNotes')
            };

            try {
                await set(ref(db, `Ayat_Enter/${mno}`), newRecord);
                Swal.fire("تم", "تم إضافة العداد بنجاح", "success");
                ['inputMno', 'inputKeta3', 'inputHandsa', 'inputNashat',
                    'inputMtype', 'inputManufacturer', 'inputReportType', 'inputNotes'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.value = '';
                    });
                document.getElementById('inputDate').value = todayDMY();
                await loadData();
            } catch (e) {
                Swal.fire("خطأ", "فشل الحفظ", "error");
            }
        };

        /* ---------- add option ---------- */
        window.handleAddOption = async function (select, optionName) {
            if (select.value !== ADD_VALUE) {
                select.dataset.prev = select.value;
                return;
            }

            const prev = select.dataset.prev || '';

            const { value: newValue } = await Swal.fire({
                title: `إضافة ${optionName}`,
                input: 'text',
                inputPlaceholder: `أدخل ${optionName}`,
                showCancelButton: true,
                confirmButtonText: 'إضافة',
                cancelButtonText: 'إلغاء'
            });

            if (newValue && newValue.trim()) {
                const v = newValue.trim();
                const option = document.createElement('option');
                option.value = v;
                option.textContent = v;
                const addOpt = select.querySelector(`option[value="${ADD_VALUE}"]`);
                select.insertBefore(option, addOpt);
                select.value = v;
                select.dataset.prev = v;
                Swal.fire('تم', 'تمت الإضافة', 'success');
            } else {
                select.value = prev;
            }
        };

        /* ---------- edit ---------- */
        window.editRecord = async function (mno) {
            const record = allData.find(r => r.mno === mno);
            if (!record) return;

            const { value: form } = await Swal.fire({
                title: 'تعديل البيانات',
                width: 720,
                html: `
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:right;margin-top:10px">
                    <input id="edit-mno" class="swal2-input" value="${esc(record.mno)}" readonly style="background:#e9ecef;margin:0" placeholder="رقم العداد">
                    <select id="edit-keta3" class="swal2-select" style="margin:0">${optionsHtml('inputKeta3', record.keta3)}</select>
                    <select id="edit-handsa" class="swal2-select" style="margin:0">${optionsHtml('inputHandsa', record.handsa)}</select>
                    <select id="edit-nashat" class="swal2-select" style="margin:0">${optionsHtml('inputNashat', record.nashattype)}</select>
                    <select id="edit-mtype" class="swal2-select" style="margin:0">${optionsHtml('inputMtype', record.mtype)}</select>
                    <select id="edit-manufacturer" class="swal2-select" style="margin:0">${optionsHtml('inputManufacturer', record.manufacturer)}</select>
                    <select id="edit-reporttype" class="swal2-select" style="margin:0">${optionsHtml('inputReportType', record.report_type)}</select>
                    <input id="edit-date" type="text" class="swal2-input" value="${esc(toDMY(record.enter_date))}" placeholder="dd/mm/yyyy" maxlength="10" inputmode="numeric" style="margin:0" oninput="autoFormatDate(this)">
                    <textarea id="edit-notes" class="swal2-textarea" style="grid-column:1/-1;margin:0;min-height:90px;resize:vertical" placeholder="ملاحظات">${esc(record.notes || '')}</textarea>
                </div>
            `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'حفظ',
                cancelButtonText: 'إلغاء',
                preConfirm: () => {
                    const raw = document.getElementById('edit-date').value.trim();
                    const iso = toISO(raw);
                    if (raw && !iso) {
                        Swal.showValidationMessage('صيغة التاريخ غير صحيحة (dd/mm/yyyy)');
                        return false;
                    }
                    return {
                        mno: record.mno,
                        keta3: document.getElementById('edit-keta3').value,
                        handsa: document.getElementById('edit-handsa').value,
                        nashattype: document.getElementById('edit-nashat').value,
                        mtype: document.getElementById('edit-mtype').value,
                        manufacturer: document.getElementById('edit-manufacturer').value,
                        report_type: document.getElementById('edit-reporttype').value,
                        enter_date: iso,
                        notes: document.getElementById('edit-notes').value
                    };
                }
            });

            if (form) {
                await set(ref(db, `Ayat_Enter/${mno}`), form);
                Swal.fire('تم', 'تم تحديث البيانات', 'success');
                await loadData();
            }
        };

        /* ---------- delete ---------- */
        window.deleteRecord = async function (mno) {
            const confirm = await Swal.fire({
                title: 'حذف',
                text: `حذف العداد ${mno}؟`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'حذف',
                cancelButtonText: 'إلغاء'
            });
            if (confirm.isConfirmed) {
                await remove(ref(db, `Ayat_Enter/${mno}`));
                Swal.fire('تم الحذف');
                await loadData();
            }
        };

        /* ---------- render ---------- */
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            if (!tbody) return;
            tbody.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const pageItems = filteredData.slice(start, start + itemsPerPage);

            pageItems.forEach((item, i) => {
                const row = tbody.insertRow();

                const serialCell = row.insertCell();
                serialCell.textContent = start + i + 1;
                serialCell.style.fontWeight = '800';
                serialCell.style.color = '#0d9488';

                const values = [
                    item.keta3,
                    item.handsa,
                    toDMY(item.enter_date),
                    item.nashattype,
                    item.mtype,
                    item.mno,
                    item.manufacturer,
                    item.report_type,
                    item.notes
                ];
                values.forEach(v => {
                    row.insertCell().textContent = (v === undefined || v === null || v === '') ? '—' : v;
                });

                const act = row.insertCell();
                act.className = 'action-buttons-container';
                act.innerHTML = `<button class="btn-icon-edit" onclick="editRecord('${esc(item.mno)}')"><i class="fas fa-edit"></i></button>
                                 <button class="btn-icon-delete" onclick="deleteRecord('${esc(item.mno)}')"><i class="fas fa-trash"></i></button>`;
            });

            updatePagination();
        }

        /* ---------- filter ---------- */
        window.filterTable = function () {
            const mno = gv('searchMno').toLowerCase();
            const k3 = gv('searchKeta3').toLowerCase();
            const hs = gv('searchHandsa').toLowerCase();
            const es = toISO(gv('searchStartDate'));
            const ee = toISO(gv('searchEndDate'));
            const ns = gv('searchNashat').toLowerCase();
            const mt = gv('searchMtype').toLowerCase();
            const mf = gv('searchManufacturer').toLowerCase();
            const rt = gv('searchReportType').toLowerCase();
            const nt = gv('searchNotes').toLowerCase();

            filteredData = allData.filter(item => {
                if (mno && !(item.mno || '').toLowerCase().includes(mno)) return false;
                if (k3 && !(item.keta3 || '').toLowerCase().includes(k3)) return false;
                if (hs && !(item.handsa || '').toLowerCase().includes(hs)) return false;
                if (ns && !(item.nashattype || '').toLowerCase().includes(ns)) return false;
                if (mt && !(item.mtype || '').toLowerCase().includes(mt)) return false;
                if (mf && !(item.manufacturer || '').toLowerCase().includes(mf)) return false;
                if (rt && !(item.report_type || '').toLowerCase().includes(rt)) return false;
                if (nt && !(item.notes || '').toLowerCase().includes(nt)) return false;

                const ed = item.enter_date || '';
                if (es && ed < es) return false;
                if (ee && ed > ee) return false;

                return true;
            });

            currentPage = 1;
            renderTable();
            updateStats();
        };

        /* ---------- stats / pagination ---------- */
        function updateStats() {
            document.getElementById('totalSummary').innerHTML =
                `<i class="fas fa-database"></i> إجمالي السجلات: ${allData.length} | <i class="fas fa-search"></i> نتائج البحث: ${filteredData.length}`;
        }

        function updatePagination() {
            const total = Math.ceil(filteredData.length / itemsPerPage) || 1;
            document.getElementById('pageInfo').innerText = `الصفحة ${currentPage} من ${total}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage >= total;
        }

        window.prevPage = () => { if (currentPage > 1) { currentPage--; renderTable(); } };
        window.nextPage = () => {
            const total = Math.ceil(filteredData.length / itemsPerPage);
            if (currentPage < total) { currentPage++; renderTable(); }
        };

        window.refreshDatabase = async () => { await loadData(); Swal.fire('تم التحديث'); };

        /* ---------- export ---------- */
        window.exportExcel = () => {
            const data = filteredData.map((i, idx) => ({
                'م': idx + 1,
                'القطاع': i.keta3 || '',
                'الهندسة': i.handsa || '',
                'تاريخ التسجيل': toDMY(i.enter_date),
                'نوع النشاط': i.nashattype || '',
                'نوع العداد': i.mtype || '',
                'رقم العداد': i.mno || '',
                'الشركة المصنعة': i.manufacturer || '',
                'نوع التقرير': i.report_type || '',
                'ملاحظات': i.notes || ''
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "العدادات");
            XLSX.writeFile(wb, `تقرير_عدادات_${new Date().toLocaleDateString()}.xlsx`);
        };

        /* ======================= EXCEL IMPORT ======================= */

        // normalize header text: strip diacritics, unify alef/teh, remove spaces & punctuation
        function normKey(s) {
            return String(s ?? '')
                .replace(/[\u064B-\u0652\u0640]/g, '')
                .replace(/[أإآٱ]/g, 'ا')
                .replace(/ى/g, 'ي')
                .replace(/ة/g, 'ه')
                .replace(/\s+/g, '')
                .replace(/[\/\\\-_.,:;()\[\]{}'"!؟?]/g, '')
                .trim();
        }

        const HEADER_ALIASES = {
            keta3: ['القطاع', 'قطاع'],
            handsa: ['الهندسة', 'هندسة', 'التابع لهندسة', 'التابع لهندسه'],
            enter_date: ['تاريخ التسجيل', 'تاريخ الاستلام', 'التاريخ'],
            nashattype: ['نوع النشاط', 'النشاط'],
            mtype: ['نوع العداد'],
            mno: ['رقم العداد', 'العداد'],
            manufacturer: ['الشركة المصنعة', 'المصنع', 'الشركة'],
            report_type: ['نوع التقرير', 'التقرير'],
            notes: ['ملاحظات', 'الملاحظات', 'ملاحظات الدخول']
        };

        const HEADER_MAP = {};
        Object.keys(HEADER_ALIASES).forEach(field => {
            HEADER_ALIASES[field].forEach(h => { HEADER_MAP[normKey(h)] = field; });
        });

        // Excel serial number → ISO date
        function excelSerialToISO(n) {
            const ms = Math.round((n - 25569) * 86400 * 1000);
            const d = new Date(ms);
            if (isNaN(d.getTime())) return '';
            const y = d.getUTCFullYear();
            const mo = String(d.getUTCMonth() + 1).padStart(2, '0');
            const day = String(d.getUTCDate()).padStart(2, '0');
            return `${y}-${mo}-${day}`;
        }

        // any cell value → ISO yyyy-mm-dd or ''
        function cellToISO(v) {
            if (v === null || v === undefined || v === '') return '';
            if (v instanceof Date) {
                const y = v.getFullYear();
                const mo = String(v.getMonth() + 1).padStart(2, '0');
                const d = String(v.getDate()).padStart(2, '0');
                return `${y}-${mo}-${d}`;
            }
            if (typeof v === 'number' && isFinite(v)) return excelSerialToISO(v);
            const s = String(v).trim();
            // dd/mm/yyyy (also d/m/yyyy)
            const iso1 = toISO(s);
            if (iso1) return iso1;
            // yyyy-mm-dd
            let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
            if (m) {
                const iso = toISO(`${m[3]}/${m[2]}/${m[1]}`);
                if (iso) return iso;
            }
            // dd-mm-yyyy
            m = s.match(/^(\d{1,2})[.\-](\d{1,2})[.\-](\d{4})$/);
            if (m) {
                const iso = toISO(`${m[1]}/${m[2]}/${m[3]}`);
                if (iso) return iso;
            }
            return '';
        }

        // detect header row + column map
        function detectHeader(rows) {
            for (let i = 0; i < Math.min(rows.length, 10); i++) {
                const r = rows[i] || [];
                const map = {};
                let count = 0;
                r.forEach((cell, idx) => {
                    const k = normKey(cell);
                    const field = k && HEADER_MAP[k];
                    if (field && map[field] === undefined) {
                        map[field] = idx;
                        count++;
                    }
                });
                if (map.mno !== undefined && count >= 4) return { rowIndex: i, map };
            }
            return null;
        }

        const SELECT_BY_FIELD = {
            keta3: 'inputKeta3',
            handsa: 'inputHandsa',
            nashattype: 'inputNashat',
            mtype: 'inputMtype',
            manufacturer: 'inputManufacturer',
            report_type: 'inputReportType'
        };

        // append a value to a select if it does not already exist
        function ensureOption(selectId, value) {
            if (!value) return;
            const sel = document.getElementById(selectId);
            if (!sel) return;
            if (Array.from(sel.options).some(o => o.value === value)) return;
            const opt = document.createElement('option');
            opt.value = value;
            opt.textContent = value;
            const addOpt = sel.querySelector(`option[value="${ADD_VALUE}"]`);
            if (addOpt) sel.insertBefore(opt, addOpt);
            else sel.appendChild(opt);
        }

        // actual saving loop
        async function runImport(rows, mode) {
            Swal.fire({
                title: 'جاري الاستيراد...',
                html: `<div id="impProgress" style="font-weight:700;font-size:1.1rem">0 / ${rows.length}</div>`,
                allowOutsideClick: false,
                allowEscapeKey: false,
                showConfirmButton: false
            });

            let added = 0, overwritten = 0, skipped = 0, failed = 0;
            const newValues = { keta3: new Set(), handsa: new Set(), nashattype: new Set(), mtype: new Set(), manufacturer: new Set(), report_type: new Set() };

            for (let i = 0; i < rows.length; i++) {
                const r = rows[i];
                try {
                    const exists = allData.some(x => x.mno === r.mno);
                    if (exists && mode === 'skip') {
                        skipped++;
                    } else {
                        await set(ref(db, `Ayat_Enter/${r.mno}`), r);
                        if (exists) overwritten++; else added++;
                        Object.keys(newValues).forEach(f => { if (r[f]) newValues[f].add(r[f]); });
                    }
                } catch (e) {
                    failed++;
                }
                const el = document.getElementById('impProgress');
                if (el) el.textContent = `${i + 1} / ${rows.length}`;
            }

            Swal.close();

            // extend dropdowns so imported values are reusable
            Object.entries(SELECT_BY_FIELD).forEach(([field, selectId]) => {
                newValues[field].forEach(v => ensureOption(selectId, v));
            });

            await loadData();

            Swal.fire({
                title: 'تم الاستيراد',
                html: `<div style="text-align:right;line-height:2;font-size:0.95rem">
                    <div>✅ تمت الإضافة: <b>${added}</b></div>
                    <div>♻️ تم الاستبدال: <b>${overwritten}</b></div>
                    <div>⏭️ تم التخطي (مكرر): <b>${skipped}</b></div>
                    <div>⚠️ فشل: <b>${failed}</b></div>
                </div>`,
                icon: 'success',
                confirmButtonText: 'حسناً',
                confirmButtonColor: '#0d9488'
            });
        }

        window.triggerExcelUpload = function () {
            const inp = document.getElementById('excelFileInput');
            if (inp) { inp.value = ''; inp.click(); }
        };

        window.handleExcelImport = async function (ev) {
            const file = ev.target.files && ev.target.files[0];
            if (!file) return;
            ev.target.value = '';

            let wb;
            try {
                const buf = await file.arrayBuffer();
                wb = XLSX.read(buf, { type: 'array', cellDates: true });
            } catch (err) {
                Swal.fire('خطأ', 'تعذر قراءة الملف', 'error');
                return;
            }

            const sheet = wb.Sheets[wb.SheetNames[0]];
            if (!sheet) {
                Swal.fire('خطأ', 'الملف لا يحتوي على أوراق', 'error');
                return;
            }

            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: true, blankrows: false });

            let startIdx, colMap;
            const header = detectHeader(rows);
            if (header) {
                startIdx = header.rowIndex + 1;
                colMap = header.map;
            } else {
                // fallback: positional layout matching the exported sheet
                startIdx = 0;
                colMap = { keta3: 1, handsa: 2, enter_date: 3, nashattype: 4, mtype: 5, mno: 6, manufacturer: 7, report_type: 8, notes: 9 };
            }

            const parsed = [];
            const seen = new Set();
            let noMeter = 0, dupInFile = 0, badDates = 0;

            for (let i = startIdx; i < rows.length; i++) {
                const r = rows[i] || [];
                const get = f => (colMap[f] !== undefined ? r[colMap[f]] : '');
                const mno = String(get('mno') ?? '').trim();
                if (!mno) { noMeter++; continue; }
                if (seen.has(mno)) { dupInFile++; continue; }
                seen.add(mno);

                const rawDate = get('enter_date');
                const iso = cellToISO(rawDate);
                if (String(rawDate ?? '').trim() !== '' && !iso) badDates++;

                parsed.push({
                    mno,
                    keta3: String(get('keta3') ?? '').trim(),
                    handsa: String(get('handsa') ?? '').trim(),
                    nashattype: String(get('nashattype') ?? '').trim(),
                    mtype: String(get('mtype') ?? '').trim(),
                    manufacturer: String(get('manufacturer') ?? '').trim(),
                    report_type: String(get('report_type') ?? '').trim(),
                    enter_date: iso,
                    notes: String(get('notes') ?? '').trim()
                });
            }

            if (parsed.length === 0) {
                Swal.fire('تنبيه', 'لم يتم العثور على صفوف صالحة في الملف (تأكد من وجود عمود رقم العداد)', 'warning');
                return;
            }

            const dupWithDb = parsed.filter(p => allData.some(x => x.mno === p.mno)).length;

            const summaryHtml = `
                <div style="text-align:right;line-height:2;font-size:0.92rem">
                    <div>📄 إجمالي الصفوف الصالحة: <b>${parsed.length}</b></div>
                    <div>🚫 صفوف بدون رقم عداد: <b>${noMeter}</b></div>
                    <div>📑 تكرار داخل الملف: <b>${dupInFile}</b></div>
                    <div>📅 تواريخ غير صحيحة: <b>${badDates}</b></div>
                    <div>🔁 مكررة مع قاعدة البيانات: <b>${dupWithDb}</b></div>
                </div>`;

            if (dupWithDb > 0) {
                const res = await Swal.fire({
                    title: 'تأكيد الاستيراد',
                    html: summaryHtml + '<div style="margin-top:10px;font-weight:700">يوجد سجلات موجودة بالفعل — اختر طريقة المعالجة:</div>',
                    showDenyButton: true,
                    showCancelButton: true,
                    confirmButtonText: 'استبدال المكرر',
                    denyButtonText: 'تخطي المكرر',
                    cancelButtonText: 'إلغاء',
                    confirmButtonColor: '#0d9488',
                    denyButtonColor: '#f59e0b'
                });
                if (res.isDismissed) return;
                await runImport(parsed, res.isConfirmed ? 'overwrite' : 'skip');
            } else {
                const res = await Swal.fire({
                    title: 'تأكيد الاستيراد',
                    html: summaryHtml,
                    showCancelButton: true,
                    confirmButtonText: 'بدء الاستيراد',
                    cancelButtonText: 'إلغاء',
                    confirmButtonColor: '#0d9488'
                });
                if (!res.isConfirmed) return;
                await runImport(parsed, 'overwrite');
            }
        };

        /* ---------- dark mode ---------- */
        window.toggleDarkMode = function () {
            const cb = document.getElementById('darkModeToggle');
            if (cb.checked) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('darkMode', 'enabled');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('darkMode', 'disabled');
            }
        };

        function checkDark() {
            if (localStorage.getItem('darkMode') === 'enabled') {
                document.body.classList.add('dark-mode');
                document.getElementById('darkModeToggle').checked = true;
            }
        }

        /* ---------- init ---------- */
        window.onload = async () => {
            checkDark();
            document.getElementById('inputDate').value = todayDMY();
            ['inputNashat', 'inputMtype', 'inputManufacturer', 'inputReportType'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.dataset.prev = '';
            });
            await loadData();
        };
    </script>
</body>

</html>
