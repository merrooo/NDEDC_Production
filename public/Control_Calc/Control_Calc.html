<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحسابات الكهربية — لوحة الأدوات</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --card-hover: #f8fafc;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: rgba(79, 70, 229, 0.08);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, .05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, .08), 0 2px 4px -2px rgba(15, 23, 42, .05);
      --radius-md: 10px;
      --radius-lg: 16px;
      --transition: all .2s cubic-bezier(.4, 0, .2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.5;
    }

    .app-wrapper {
      display: flex;
      height: 100vh;
      width: 100vw;
      padding: 16px;
      gap: 16px;
    }

    .sidebar {
      width: 65px;
      flex-shrink: 0;
      height: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: width .3s cubic-bezier(.4, 0, .2, 1);
      overflow-x: hidden;
      overflow-y: auto;
    }

    .sidebar:hover,
    .sidebar:focus-within {
      width: 340px;
      box-shadow: var(--shadow-md);
    }

    .sidebar::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: transparent;
      margin: 10px 0;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .sidebar::-webkit-scrollbar-thumb:hover {
      background: var(--border-strong);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
      flex-shrink: 0;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-sub);
      font-size: 20px;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
      gap: 14px;
      text-decoration: none;
      font-family: inherit;
    }

    .nav-btn:hover {
      background: var(--card-hover);
      color: var(--text-main);
      border-color: var(--border);
    }

    .nav-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(79, 70, 229, .3);
    }

    .nav-btn.active:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .nav-btn .icon {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
    }

    .nav-btn .label {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-8px);
      transition: all .3s ease;
      overflow: hidden;
    }

    .sidebar:hover .nav-btn .label,
    .sidebar:focus-within .nav-btn .label {
      opacity: 1;
      transform: translateX(0);
    }

    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      min-width: 0;
    }

    .card {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      height: 100%;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: border-color .2s, box-shadow .2s;
    }

    .card:hover {
      border-color: var(--border-strong);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: .95rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: .2px;
    }

    .card-title::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: transparent;
      border: 1px solid var(--border);
      min-height: 0;
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    @media (max-width: 768px) {
      .app-wrapper {
        padding: 10px;
        gap: 10px;
      }

      .sidebar {
        width: 56px;
        padding: 8px 4px;
      }

      .sidebar:hover,
      .sidebar:focus-within {
        width: min(200px, 55vw);
      }

      .nav-btn {
        min-height: 42px;
        padding: 0 10px;
        gap: 10px;
        font-size: 18px;
      }

      .card {
        padding: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app-wrapper">
    <aside class="sidebar" aria-label="قائمة الصفحات">
      <a href="../index.html" class="nav-btn" title="الصفحة الرئيسية">
        <span class="icon" aria-hidden="true">🏠</span>
        <span class="label">الصفحة الرئيسية</span>
      </a>
      <div class="divider"></div>
      <div id="page-tools"></div>
    </aside>

    <main class="main-content">
      <section class="card" aria-label="محتوى الصفحة المحددة">
        <div class="card-header">
          <h1 class="card-title" id="page-title">تحليل وتصحيح الزوايا - نسبة خطأ الزوايا</h1>
        </div>
        <div class="iframe-wrapper">
          <iframe id="page-frame" src="Angles_Losses.html"
            title="تحليل وتصحيح الزوايا - نسبة خطأ الزوايا"></iframe>
        </div>
      </section>
    </main>
  </div>

  <script>
    const pages = [
      { file: "Angles_Losses.html", label: "تحليل وتصحيح الزوايا - نسبة خطأ الزوايا", icon: "📐" },
      { file: "Power.html", label: "حسابات القدرة", icon: "🧮" },
      { file: "Trf-Motor.html", label: "محولات ومحركات", icon: "⚙️" },
      { file: "P.F.html", label: "معامل القدرة", icon: "⚡" },
      { file: "CT.html", label: "حسابات المتوسط - CT", icon: "🔌" },
      { file: "Tarriff_Charging.html", label: "مطابقة الأرصدة", icon: "💰" },
      { file: "Distance_Relay.html", label: "الحماية الخطية", icon: "🛡️" },
      { file: "Cables_V.D_Calculator.html", label: "الكابلات والفقد في الجهد", icon: "🔋" },
      { file: "Research.html", label: "المادة العلمية للعدادات الذكية", icon: "📚" },
      { file: "Meter.html", label: "المادة العلمية للعدادات الميكانيكية والإلكترونية والمعايرة", icon: "📖" },
      { file: "Spex.html", label: "المواصفات الفنية", icon: "📄" },
      { file: "TVJ.html", label: "نظام TVJ", icon: "📺" },
    ];

    const toolsContainer = document.getElementById("page-tools");
    const pageFrame = document.getElementById("page-frame");
    const pageTitle = document.getElementById("page-title");

    pages.forEach((page, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `nav-btn${index === 0 ? " active" : ""}`;
      button.title = page.label;
      button.setAttribute("aria-current", index === 0 ? "page" : "false");

      const icon = document.createElement("span");
      icon.className = "icon";
      icon.setAttribute("aria-hidden", "true");
      icon.textContent = page.icon;

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = page.label;

      button.append(icon, label);
      button.addEventListener("click", () => {
        toolsContainer.querySelectorAll(".nav-btn").forEach((navButton) => {
          navButton.classList.remove("active");
          navButton.setAttribute("aria-current", "false");
        });

        button.classList.add("active");
        button.setAttribute("aria-current", "page");
        pageFrame.src = page.file;
        pageFrame.title = page.label;
        pageTitle.textContent = page.label;
      });

      toolsContainer.appendChild(button);
    });
  </script>
</body>

</html>
