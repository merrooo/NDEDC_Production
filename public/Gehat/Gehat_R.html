<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بيان-(الأقل-كبار-مصالح-قوي)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --xl-header: #1e3a8a;
      --xl-header-dark: #0f172a;
      --xl-total: #e0e7ff;
      --xl-total-border: #818cf8;
      --brand-500: #6366f1;
      --brand-600: #4f46e5;
      --brand-700: #4338ca;
      --success-500: #10b981;
      --success-600: #059669;
      --danger-500: #ef4444;
      --danger-600: #dc2626;
      --warning-500: #f59e0b;
      --warning-600: #d97706;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, .05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, .08), 0 2px 4px -2px rgba(15, 23, 42, .05);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, .1), 0 4px 6px -4px rgba(15, 23, 42, .05);
      --transition: all .2s cubic-bezier(.4, 0, .2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, sans-serif }

    body { background: #f3f4f6; min-height: 100vh; padding: 24px 16px; color: #0f172a; line-height: 1.5; font-size: 13px }

    .dashboard { max-width: 1500px; margin: 0 auto }

    .toolbar { background: #fff; border: 1px solid var(--slate-200); border-radius: var(--radius-lg); padding: 16px 24px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; box-shadow: var(--shadow-sm) }

    .toolbar h1 { font-size: 1.15rem; font-weight: 800; color: var(--xl-header); display: flex; align-items: center; gap: 12px }

    .toolbar h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand-600); display: inline-block; box-shadow: 0 0 0 4px rgba(79, 70, 229, .2) }

    .btn { border: none; padding: 10px 20px; border-radius: var(--radius-full); font-weight: 700; font-size: .8rem; cursor: pointer; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px; outline: none; font-family: inherit; box-shadow: var(--shadow-sm); text-decoration: none }

    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md) }
    .btn-primary { background: var(--brand-600); color: #fff }
    .btn-primary:hover { background: var(--brand-700) }
    .btn-success { background: var(--success-600); color: #fff }
    .btn-success:hover { background: var(--success-500) }
    .btn-outline { background: #fff; color: var(--slate-700); border: 1px solid var(--slate-300) }
    .btn-outline:hover { background: var(--slate-50); border-color: var(--slate-400) }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none }

    .export-btn { background: rgba(255, 255, 255, .15); border: 1px solid rgba(255, 255, 255, .3); padding: 7px 16px; border-radius: var(--radius-full); color: #fff; font-size: .75rem; font-weight: 700; cursor: pointer; transition: var(--transition); display: inline-flex; align-items: center; gap: 6px; font-family: inherit; backdrop-filter: blur(4px) }
    .export-btn:hover { background: rgba(255, 255, 255, .28); border-color: rgba(255, 255, 255, .5) }

    .card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--slate-200); margin-bottom: 20px; overflow: hidden; box-shadow: var(--shadow-sm) }

    .card-header { background: linear-gradient(135deg, var(--xl-header) 0%, var(--xl-header-dark) 100%); color: #fff; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px }

    .card-header h2 { font-size: .95rem; font-weight: 800; display: flex; align-items: center; gap: 10px; letter-spacing: .2px }

    .preview-badge { background: rgba(255, 255, 255, .15); color: #fff; font-size: .65rem; font-weight: 700; padding: 4px 12px; border-radius: var(--radius-full); display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255, 255, 255, .2) }

    .preview-badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--success-500); display: inline-block; box-shadow: 0 0 0 2px rgba(16, 185, 129, .4); animation: pulse 1.6s ease-in-out infinite }

    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: .4; transform: scale(.85) } }

    .section { padding: 18px 22px; border-bottom: 1px solid var(--slate-100); background: #fff }
    .section:last-child { border-bottom: none }

    .files-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; padding: 20px; background: var(--slate-50) }

    .file-card { background: #fff; border: 1px solid var(--slate-200); border-radius: var(--radius-md); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-sm); transition: var(--transition) }
    .file-card:hover { border-color: var(--slate-300); box-shadow: var(--shadow-md) }

    .file-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--slate-100) }

    .file-badge { background: var(--slate-100); color: var(--slate-700); font-weight: 800; font-size: .7rem; padding: 4px 10px; border-radius: var(--radius-full); border: 1px solid var(--slate-200); flex: none }

    .fname { color: var(--slate-600); font-size: .72rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; text-align: center }

    .card-remove { border: none; background: transparent; color: var(--slate-400); font-size: 1.15rem; line-height: 1; cursor: pointer; padding: 2px 7px; border-radius: var(--radius-sm); transition: var(--transition); font-family: inherit; flex: none }
    .card-remove:hover { color: var(--danger-600); background: rgba(239, 68, 68, .08) }

    .add-card { border: 2px dashed var(--slate-300); border-radius: var(--radius-md); background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 170px; cursor: pointer; color: var(--brand-600); font-weight: 800; font-size: .85rem; transition: var(--transition); padding: 16px; font-family: inherit }
    .add-card:hover { border-color: var(--brand-500); background: rgba(99, 102, 241, .04); transform: translateY(-1px) }
    .add-card .plus { width: 44px; height: 44px; border-radius: 50%; background: rgba(99, 102, 241, .1); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; line-height: 1 }

    .drop { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed var(--slate-300); border-radius: var(--radius-md); padding: 16px; text-align: center; color: var(--slate-500); cursor: pointer; transition: var(--transition); font-size: .76rem; font-weight: 700; background: var(--slate-50) }
    .drop:hover, .drop.over { border-color: var(--brand-500); color: var(--brand-600); background: rgba(99, 102, 241, .04) }
    .drop input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; margin: 0; padding: 0; border: 0 }

    .row { display: flex; align-items: center; gap: 10px }
    .row label { font-size: .75rem; color: var(--slate-700); font-weight: 700; width: 65px; flex: none }

    select, input[type="text"] { width: 100%; padding: 8px 12px; border-radius: var(--radius-md); border: 1px solid var(--slate-300); background: #fff; font-size: .78rem; font-weight: 600; color: var(--slate-800); transition: var(--transition); font-family: inherit; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: left 10px center; background-size: 14px; padding-left: 30px }
    input[type="text"] { background-image: none; padding-left: 12px }
    select:focus, input:focus { outline: none; border-color: var(--brand-500); box-shadow: 0 0 0 3px rgba(99, 102, 241, .15) }
    select:disabled { opacity: .5; background-color: var(--slate-100); cursor: not-allowed }

    .info { font-size: .72rem; color: var(--slate-500); font-weight: 600; min-height: 1.2em }

    .export-row { margin-bottom: 16px; align-items: flex-start }
    .export-row:last-child { margin-bottom: 0 }
    .export-row > .col { flex: 1; min-width: 0 }

    .region-export-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px }
    .region-export-row > label { width: auto; color: var(--slate-800); font-size: .82rem; font-weight: 800 }
    .region-export-row > .col { width: 100% }

    .checkbox-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; max-height: 190px; overflow-y: auto; background: #fff; border: 1px solid var(--slate-200); border-radius: var(--radius-md); padding: 8px; width: 100% }

    .chk { display: flex; align-items: center; gap: 9px; min-width: 0; min-height: 40px; font-size: .78rem; font-weight: 700; color: var(--slate-700); cursor: pointer; width: auto; flex: initial; padding: 8px 10px; border: 1px solid var(--slate-200); border-radius: var(--radius-sm); background: var(--slate-50); transition: var(--transition) }
    .region-export-row .chk { width: auto; flex: initial }
    .chk:hover { border-color: var(--slate-300); background: #fff }
    .chk:has(input:checked) { color: var(--brand-700); border-color: rgba(99, 102, 241, .3); background: rgba(99, 102, 241, .06) }
    .chk span { min-width: 0; overflow-wrap: normal }
    .chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--brand-600); cursor: pointer; flex: none }

    .mini-tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px }

    .mini-btn { background: #fff; color: var(--brand-600); border: 1px solid var(--slate-300); padding: 4px 12px; border-radius: var(--radius-full); font-size: .72rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: var(--transition); display: inline-flex; align-items: center; gap: 4px }
    .mini-btn:hover { background: var(--brand-600); color: #fff; border-color: var(--brand-600) }
    .mini-btn:focus-visible { outline: 3px solid rgba(99, 102, 241, .2); outline-offset: 2px }

    .region-count { padding: 3px 10px; border-radius: var(--radius-full); background: var(--slate-100); color: var(--slate-600); font-size: .72rem; font-weight: 700; white-space: nowrap }

    #report { padding: 20px; overflow-x: auto }
    #report table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--slate-200) }
    #report th, #report td { border-bottom: 1px solid var(--slate-200); border-left: 1px solid var(--slate-200); padding: 10px 14px; text-align: center; white-space: nowrap }
    #report th:last-child, #report td:last-child { border-left: none }
    #report th { background: var(--xl-header); color: #fff; font-weight: 700; font-size: .78rem; border-bottom: 2px solid var(--xl-header-dark) }
    #report td:first-child { text-align: right; font-weight: 700; padding-right: 16px; color: var(--slate-800) }
    #report td.zero { color: var(--danger-500); font-weight: 800; background: rgba(239, 68, 68, .03) }
    #report td.sheet-count { color: var(--brand-700); font-weight: 800; background: rgba(99, 102, 241, .04) }
    #report tr:hover td { background: var(--slate-50) }
    #report tbody tr.total-row td { background: var(--xl-total); color: var(--xl-header-dark); font-weight: 800; border-top: 2px solid var(--xl-total-border); border-bottom: none; padding: 12px 14px; font-size: .82rem }
    #report tbody tr.total-row td:first-child { font-size: .86rem; letter-spacing: .3px }

    .warn { color: var(--warning-600); font-weight: 700; padding: 12px; background: rgba(245, 158, 11, .08); border-radius: var(--radius-md); display: inline-block }
    .sum { color: var(--slate-600); font-size: .82rem; font-weight: 700; margin-bottom: 16px }

    #fileStatus, #runStatus { font-size: .8rem; font-weight: 700; color: var(--slate-600) }
    #fileStatus.err, #runStatus.err { color: var(--danger-600) }
    #fileStatus.ok, #runStatus.ok { color: var(--success-600) }

    .actions { display: flex; gap: 12px; align-items: center; padding: 16px 20px; flex-wrap: wrap; background: #fff; border-top: 1px solid var(--slate-200) }

    @media (max-width:640px) {
      .toolbar { flex-direction: column; align-items: flex-start }
      .checkbox-list { grid-template-columns: 1fr }
    }
  </style>
</head>

<body>

  <div class="dashboard">

    <div class="toolbar">
      <h1><span class="dot"></span>بيان (جهات-قوي-مصالح-كبار)</h1>
    </div>

    <!-- Files -->
    <div class="card">
      <div class="card-header">
        <h2>الملفات</h2>
        <span class="preview-badge" id="fileCountBadge">0 ملف</span>
      </div>
      <div class="files-grid" id="files"></div>
      <div class="actions">
        <button class="btn btn-outline" id="reset">إعادة تعيين</button>
        <span id="fileStatus"></span>
      </div>
    </div>

    <!-- Export settings -->
    <div class="card" id="exportCard">
      <div class="card-header">
        <h2>إعدادات التصدير</h2>
      </div>
      <div class="section">
        <div class="row export-row region-export-row" id="regionRow" style="display:none">
          <label>المناطق</label>
          <div class="col">
            <div class="mini-tools">
              <button type="button" class="mini-btn" id="regionToggleAll">إلغاء الكل</button>
              <span id="regionCount" class="region-count"></span>
            </div>
            <div class="checkbox-list" id="regionList"></div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-success" id="run">توليد ZIP</button>
        <span id="runStatus"></span>
      </div>
    </div>

    <!-- Live preview report -->
    <div class="card" id="reportCard" style="display:none">
      <div class="card-header">
        <h2>التقرير <span class="preview-badge">معاينة مباشرة</span></h2>
        <button class="export-btn" id="exportTable">تصدير الجدول</button>
      </div>
      <div id="report"></div>
    </div>

  </div>

  <script>
    /* ------------------------------------------------------------------ */
    /*  CONSTANTS & STATE                                                  */
    /* ------------------------------------------------------------------ */
    const CFG = { firstRowHeader: true, incHeader: true, ci: true, sortVals: true };
    const STORAGE_KEY = 'gehat_files_v6';
    const EXPORT_KEY = 'gehat_export_v6';
    const DEFAULT_CARDS = 4;

    /*
      Every card has INDEPENDENT column selections.
        colIndex       → "الهندسة" → one .xlsx per unique value (union across cards)
        regionColIndex → "القطاع"  → folder (when ANY card uses it) + row filter
        sheetColIndex  → "الشيت"   → sheet splitter; "-1" = بدون = single sheet

      Fixed behaviour:
        • Merge is ALWAYS on (all source files merged inside each sheet).
        • Union is ALWAYS used (every unique value across all cards gets exported).
        • Sheet split is controlled ONLY by the third dropdown ("بدون" = one sheet).
        • NO extra "الملف المصدر" column — only the data's own columns.
        • Folders inside the ZIP are used automatically if ANY card has a real
          القطاع column selected; otherwise the ZIP is flat.
    */
    const makeState = (i) => ({
      idx: i, fileName: null, baseName: null, wb: null, sheetName: null,
      aoa: null, headers: [], dataRows: [],
      colIndex: -1, regionColIndex: -1, sheetColIndex: -1,
      ready: false
    });

    let state = [];

    const $ = id => document.getElementById(id);
    const setFileStatus = (msg, isErr, isOk) => {
      const el = $('fileStatus'); if (!el) return;
      el.textContent = msg || '';
      el.className = isErr ? 'err' : (isOk ? 'ok' : '');
    };
    const setRunStatus = (msg, isErr, isOk) => {
      const el = $('runStatus'); if (!el) return;
      el.textContent = msg || '';
      el.className = isErr ? 'err' : (isOk ? 'ok' : '');
    };
    const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function readFileBuffer(file) {
      if (typeof file.arrayBuffer === 'function') return file.arrayBuffer();
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(r.error || new Error('FileReader error'));
        r.readAsArrayBuffer(file);
      });
    }

    /* ------------------------------------------------------------------ */
    /*  STATE HELPERS                                                      */
    /* ------------------------------------------------------------------ */
    function ensureStateCount(n) {
      while (state.length < n) state.push(makeState(state.length));
      state.forEach((s, i) => s.idx = i);
    }
    function updateFileCountBadge() {
      const badge = $('fileCountBadge');
      if (!badge) return;
      const ready = state.filter(s => s.ready).length;
      badge.textContent = `${state.length} ملف · ${ready} محمّل`;
    }

    /* Folder mode is derived from the cards — no separate toggle needed. */
    function useFolders() {
      return state.some(s => s.ready && s.regionColIndex >= 0);
    }

    /* ------------------------------------------------------------------ */
    /*  BUILD FILE CARDS                                                   */
    /* ------------------------------------------------------------------ */
    function buildCard(i) {
      const card = document.createElement('div');
      card.className = 'file-card';
      card.dataset.i = i;
      card.innerHTML = `
        <div class="file-card-head">
          <span class="file-badge">ملف ${i + 1}</span>
          <span class="fname" id="fname-${i}">—</span>
          <button type="button" class="card-remove" data-i="${i}" title="حذف الملف">×</button>
        </div>
        <div class="drop" id="drop-${i}">
          <input type="file" accept=".xlsx,.xls,.xlsm,.csv" data-i="${i}">
          <span>اختر ملف</span>
        </div>
        <div class="row">
          <label>القطاع</label>
          <select id="region-col-${i}" disabled>
            <option value="-1">بدون</option>
          </select>
        </div>
        <div class="row">
          <label>الهندسة</label>
          <select id="col-${i}" disabled></select>
        </div>
        <div class="row">
          <label>الشيت</label>
          <select id="sheet-col-${i}" disabled>
            <option value="-1">بدون</option>
          </select>
        </div>
        <div class="info" id="info-${i}"></div>
      `;

      card.querySelector('input[type=file]').addEventListener('change', e => {
        const f = e.target.files[0];
        if (f) loadFile(i, f);
        e.target.value = '';
      });

      const drop = card.querySelector('.drop');
      ['dragenter', 'dragover'].forEach(ev =>
        drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
      ['dragleave', 'drop'].forEach(ev =>
        drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
      drop.addEventListener('drop', e => {
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) loadFile(i, f);
      });

      card.querySelector('.card-remove').addEventListener('click', e => {
        e.stopPropagation();
        removeFile(i);
      });

      card.querySelector('#col-' + i).addEventListener('change', e => {
        const s = state[i];
        s.colIndex = parseInt(e.target.value, 10);
        buildColumnSelects(i);
        updateInfo(i);
        saveStateToStorage();
        refreshPreview();
      });
      card.querySelector('#region-col-' + i).addEventListener('change', e => {
        const s = state[i];
        s.regionColIndex = parseInt(e.target.value, 10);
        saveStateToStorage();
        refreshPreview();
      });
      card.querySelector('#sheet-col-' + i).addEventListener('change', e => {
        const s = state[i];
        s.sheetColIndex = parseInt(e.target.value, 10);
        saveStateToStorage();
        refreshPreview();
      });

      return card;
    }

    function buildAddCard() {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'add-card';
      el.innerHTML = `<span class="plus">+</span><span>إضافة ملف</span>`;
      el.addEventListener('click', addFile);
      return el;
    }

    function renderCards() {
      const wrap = $('files');
      wrap.innerHTML = '';
      state.forEach((s, i) => {
        const card = buildCard(i);
        wrap.appendChild(card);
        fillCard(i);
      });
      wrap.appendChild(buildAddCard());
      updateFileCountBadge();
    }

    function fillCard(i) {
      const s = state[i];
      const fn = $('fname-' + i);
      if (fn) fn.textContent = s.fileName || '—';
      if (!s.ready) return;
      buildColumnSelects(i);
      updateInfo(i);
    }

    function addFile() {
      state.push(makeState(state.length));
      renderCards();
      saveStateToStorage();
      setFileStatus('تمت إضافة ملف جديد', false, true);
    }

    function removeFile(i) {
      const s = state[i];
      if (s.ready || s.fileName) {
        if (!confirm(`حذف «${s.fileName || 'ملف ' + (i + 1)}»؟`)) return;
      }
      if (state.length <= 1) {
        state[0] = makeState(0);
      } else {
        state.splice(i, 1);
        state.forEach((st, k) => st.idx = k);
      }
      renderCards();
      saveStateToStorage();
      refreshPreview();
      setFileStatus('تم حذف الملف', false, true);
    }

    /* ------------------------------------------------------------------ */
    /*  COLUMN SELECTS                                                     */
    /* ------------------------------------------------------------------ */
    function buildColumnSelects(i) {
      const s = state[i];
      let width = s.headers.length;
      s.dataRows.forEach(r => width = Math.max(width, r.length));
      if (width === 0) width = 1;

      // engineering
      const colSel = $('col-' + i);
      if (colSel) {
        colSel.innerHTML = '';
        for (let c = 0; c < width; c++) {
          const o = document.createElement('option');
          o.value = c;
          const letter = XLSX.utils.encode_col(c);
          const h = s.headers[c];
          o.textContent = h ? `${letter} — ${h}` : `${letter}`;
          colSel.appendChild(o);
        }
        colSel.disabled = false;
        colSel.value = (s.colIndex >= 0 && s.colIndex < width) ? s.colIndex : 0;
      }

      // region
      const regionSel = $('region-col-' + i);
      if (regionSel) {
        regionSel.innerHTML = '<option value="-1">بدون</option>';
        for (let c = 0; c < width; c++) {
          if (c === s.colIndex) continue;
          const o = document.createElement('option');
          o.value = c;
          const letter = XLSX.utils.encode_col(c);
          const h = s.headers[c];
          o.textContent = h ? `${letter} — ${h}` : `${letter}`;
          regionSel.appendChild(o);
        }
        regionSel.disabled = false;
        regionSel.value = s.regionColIndex >= 0 ? s.regionColIndex : -1;
      }

      // sheet-split column — always enabled; "بدون" = no split
      const sheetColSel = $('sheet-col-' + i);
      if (sheetColSel) {
        sheetColSel.innerHTML = '<option value="-1">بدون</option>';
        for (let c = 0; c < width; c++) {
          if (c === s.colIndex) continue;
          const o = document.createElement('option');
          o.value = c;
          const letter = XLSX.utils.encode_col(c);
          const h = s.headers[c];
          o.textContent = h ? `${letter} — ${h}` : `${letter}`;
          sheetColSel.appendChild(o);
        }
        sheetColSel.disabled = false;
        sheetColSel.value = s.sheetColIndex >= 0 ? s.sheetColIndex : -1;
      }
    }

    /* ------------------------------------------------------------------ */
    /*  LOAD & READ FILE                                                   */
    /* ------------------------------------------------------------------ */
    async function loadFile(i, file) {
      const s = state[i];
      setFileStatus(`قراءة ${file.name}…`);
      try {
        if (typeof XLSX === 'undefined') {
          throw new Error('مكتبة XLSX لم تُحمّل — تحقّق من الاتصال بالإنترنت');
        }
        const buf = await readFileBuffer(file);
        const wb = XLSX.read(buf, { type: 'array' });
        s.wb = wb;
        s.fileName = file.name;
        s.baseName = file.name.replace(/\.[^.]+$/, '');
        $('fname-' + i).textContent = file.name;

        s.sheetName = wb.SheetNames[0];

        readSheet(i);
        updateFileCountBadge();
        setFileStatus(`تم تحميل ${file.name}`, false, true);
      } catch (err) {
        console.error(err);
        setFileStatus(`تعذّر قراءة ${file.name}: ${err.message}`, true);
      }
    }

    function readSheet(i) {
      const s = state[i];
      if (!s.wb || !s.sheetName) return;

      const ws = s.wb.Sheets[s.sheetName];
      const aoa = XLSX.utils.sheet_to_json(ws, {
        header: 1, defval: '', blankrows: false, raw: true
      });
      s.aoa = aoa;

      const useHeader = CFG.firstRowHeader;
      s.headers = useHeader ? (aoa[0] || []).map(v => v === '' ? '' : String(v).trim()) : [];
      s.dataRows = (useHeader ? aoa.slice(1) : aoa)
        .filter(r => r.some(c => String(c ?? '').trim() !== ''));

      let width = 0;
      aoa.forEach(r => width = Math.max(width, r.length));
      if (width === 0) width = 1;

      s.colIndex = autoPickColumn(s, width);
      s.regionColIndex = autoPickRegionColumn(s, width, s.colIndex);
      s.sheetColIndex = autoPickSheetColumn(s, width, s.colIndex, s.regionColIndex);

      buildColumnSelects(i);

      s.ready = true;
      updateInfo(i);
      updateFileCountBadge();
      saveStateToStorage();
      refreshPreview();
    }

    function autoPickColumn(s, width) {
      let best = 0, bestScore = Infinity;
      for (let c = 0; c < width; c++) {
        const set = new Set();
        s.dataRows.forEach(r => { const v = String(r[c] ?? '').trim(); if (v) set.add(v); });
        const n = set.size;
        if (n < 2) continue;
        const score = Math.abs(n - 20);
        if (score < bestScore) { bestScore = score; best = c; }
      }
      return best;
    }
    function autoPickRegionColumn(s, width, valueCol) {
      let best = -1, bestN = Infinity;
      for (let c = 0; c < width; c++) {
        if (c === valueCol) continue;
        const set = new Set();
        s.dataRows.forEach(r => { const v = String(r[c] ?? '').trim(); if (v) set.add(v); });
        const n = set.size;
        if (n < 2 || n > 15) continue;
        if (n < bestN) { bestN = n; best = c; }
      }
      return best;
    }
    function autoPickSheetColumn(s, width, valueCol, regionCol) {
      let best = -1, bestScore = Infinity;
      for (let c = 0; c < width; c++) {
        if (c === valueCol) continue;
        if (c === regionCol) continue;
        const set = new Set();
        s.dataRows.forEach(r => { const v = String(r[c] ?? '').trim(); if (v) set.add(v); });
        const n = set.size;
        if (n < 2 || n > 20) continue;
        const score = Math.abs(n - 5);
        if (score < bestScore) { bestScore = score; best = c; }
      }
      return best;
    }
    function updateInfo(i) {
      const s = state[i];
      const el = $('info-' + i);
      if (!el) return;
      if (!s.ready) { el.textContent = ''; return; }
      const set = new Set();
      s.dataRows.forEach(r => { const v = String(r[s.colIndex] ?? '').trim(); if (v) set.add(v); });
      el.textContent = `${s.dataRows.length} صف · ${set.size} قيمة فريدة`;
    }

    /* ------------------------------------------------------------------ */
    /*  PERSISTENCE                                                        */
    /* ------------------------------------------------------------------ */
    function saveStateToStorage() {
      const data = state.map(s => ({
        idx: s.idx, fileName: s.fileName, baseName: s.baseName,
        sheetName: s.sheetName, headers: s.headers, dataRows: s.dataRows,
        colIndex: s.colIndex, regionColIndex: s.regionColIndex,
        sheetColIndex: s.sheetColIndex,
        ready: s.ready
      }));
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
      catch (err) { console.error(err); setFileStatus('تحذير: حجم البيانات كبير جدًا', true); }
    }

    function restoreFromStorage() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      let saved;
      try { saved = JSON.parse(raw); } catch { return; }
      if (!Array.isArray(saved)) return;

      saved.forEach((d, i) => {
        if (i >= state.length || !d || !d.ready) return;
        const s = state[i];
        s.fileName = d.fileName || '';
        s.baseName = d.baseName || '';
        s.sheetName = d.sheetName || 'Sheet1';
        s.headers = d.headers || [];
        s.dataRows = d.dataRows || [];
        s.colIndex = typeof d.colIndex === 'number' ? d.colIndex : 0;
        s.regionColIndex = typeof d.regionColIndex === 'number' ? d.regionColIndex : -1;
        s.sheetColIndex = typeof d.sheetColIndex === 'number' ? d.sheetColIndex : -1;
        s.ready = true;
        fillCard(i);
      });
    }

    /* ------------------------------------------------------------------ */
    /*  EXPORT SETTINGS PERSISTENCE                                        */
    /* ------------------------------------------------------------------ */
    function saveExportSettings() {
      const s = { regions: getCheckedRegions() };
      try { localStorage.setItem(EXPORT_KEY, JSON.stringify(s)); } catch { }
    }
    function loadExportSettings() {
      const raw = localStorage.getItem(EXPORT_KEY);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }

    /* ------------------------------------------------------------------ */
    /*  REGION CHECKBOXES                                                  */
    /* ------------------------------------------------------------------ */
    function getCheckedRegions() {
      return [...document.querySelectorAll('#regionList input[type=checkbox]:checked')]
        .map(cb => cb.value);
    }
    function updateRegionCount() {
      const all = document.querySelectorAll('#regionList input').length;
      const checked = document.querySelectorAll('#regionList input:checked').length;
      $('regionCount').textContent = `${checked} / ${all} محدد`;
      $('regionToggleAll').textContent = (checked === all && all > 0) ? 'إلغاء الكل' : 'تحديد الكل';
    }

    function refreshRegionList() {
      const show = useFolders();
      const rowEl = $('regionRow');
      if (rowEl) rowEl.style.display = show ? 'grid' : 'none';
      if (!show) return;

      const regions = new Set();
      state.forEach(s => {
        if (!s.ready || s.regionColIndex < 0) return;
        s.dataRows.forEach(r => {
          const v = String(r[s.regionColIndex] ?? '').trim();
          if (v) regions.add(v);
        });
      });

      const sorted = [...regions].sort((a, b) => a.localeCompare(b, 'ar'));
      const key = sorted.join('\u0001');
      const listEl = $('regionList');

      if (listEl.dataset.key !== key) {
        const prevChecked = new Set(getCheckedRegions());
        const isFirst = !listEl.dataset.key;

        listEl.innerHTML = '';
        sorted.forEach(r => {
          const lbl = document.createElement('label');
          lbl.className = 'chk';
          const checked = isFirst || prevChecked.has(r);
          lbl.innerHTML =
            `<input type="checkbox" value="${escapeHtml(r)}" ${checked ? 'checked' : ''}>` +
            `<span>${escapeHtml(r)}</span>`;
          listEl.appendChild(lbl);
        });
        listEl.dataset.key = key;
        listEl.querySelectorAll('input[type=checkbox]').forEach(cb => {
          cb.addEventListener('change', () => {
            updateRegionCount();
            updatePreview();
            saveExportSettings();
          });
        });
        updateRegionCount();
      }
    }

    function refreshPreview() {
      refreshRegionList();
      updatePreview();
    }

    /* ------------------------------------------------------------------ */
    /*  COMPUTE EXPORT DATA                                                */
    /*                                                                     */
    /*  GROUPING KEY = engineering value (ci-normalised string).           */
    /*  UNION across all cards — every unique value from any card is       */
    /*  exported, regardless of whether other cards contain it.            */
    /* ------------------------------------------------------------------ */
    function computeExportData() {
      const loadedIdx = state.filter(s => s.ready).map(s => s.idx);
      if (!loadedIdx.length) {
        return { loadedIdx: [], list: [], totalValues: 0, totalSheets: 0 };
      }

      const checkedRegions = getCheckedRegions();
      const hasRegionFilter = checkedRegions.length > 0;

      const norm = v => {
        let t = String(v ?? '').trim();
        if (CFG.ci) t = t.toLowerCase();
        return t;
      };

      const groups = new Map();
      loadedIdx.forEach(i => {
        const s = state[i];
        s.dataRows.forEach(row => {
          if (hasRegionFilter && s.regionColIndex >= 0) {
            const reg = String(row[s.regionColIndex] ?? '').trim();
            if (!checkedRegions.includes(reg)) return;
          }

          const engRaw = row[s.colIndex];
          const engKey = norm(engRaw);
          if (engKey === '') return;

          let g = groups.get(engKey);
          if (!g) {
            g = {
              key: engKey,
              display: String(engRaw ?? '').trim(),
              region: '',
              sheets: new Map(),
              rows_by_file: {}
            };
            groups.set(engKey, g);
          }

          // sheet splitter — controlled by the third dropdown per card
          let sheetKey = '__default__', sheetDisplay = 'البيانات';
          if (s.sheetColIndex >= 0) {
            const sraw = row[s.sheetColIndex];
            const sk = norm(sraw);
            if (sk !== '') {
              sheetKey = sk;
              sheetDisplay = String(sraw ?? '').trim();
            }
          }

          let sh = g.sheets.get(sheetKey);
          if (!sh) {
            sh = { display: sheetDisplay || sheetKey, rows_by_file: {} };
            g.sheets.set(sheetKey, sh);
          }
          if (!sh.rows_by_file[i]) sh.rows_by_file[i] = [];
          sh.rows_by_file[i].push(row);

          if (!g.rows_by_file[i]) g.rows_by_file[i] = [];
          g.rows_by_file[i].push(row);

          if (!g.region && s.regionColIndex >= 0) {
            const r = String(row[s.regionColIndex] ?? '').trim();
            if (r) g.region = r;
          }
        });
      });

      const totalValues = groups.size;
      let list = [...groups.values()];
      if (CFG.sortVals) {
        list.sort((a, b) =>
          a.display.localeCompare(b.display, undefined, { numeric: true, sensitivity: 'base' }));
      }

      let totalSheets = 0;
      list.forEach(g => totalSheets += g.sheets.size);

      return { loadedIdx, list, totalValues, totalSheets };
    }

    /* ------------------------------------------------------------------ */
    /*  LIVE PREVIEW                                                       */
    /* ------------------------------------------------------------------ */
    function updatePreview() {
      const card = $('reportCard');
      const box = $('report');
      let data;
      try { data = computeExportData(); }
      catch (err) { console.error(err); card.style.display = 'none'; return; }

      if (!data.loadedIdx.length) { card.style.display = 'none'; return; }
      card.style.display = 'block';

      if (!data.list.length) {
        let msg = 'لا توجد قيم مطابقة';
        if (data.totalValues === 0) msg = 'لا توجد قيم مشتركة';
        box.innerHTML = `<p class="warn">${msg}</p>`;
        card._report = [];
        card._loadedIdx = data.loadedIdx;
        return;
      }

      renderReport(
        data.list.map(g => ({
          value: g.display,
          region: g.region || '',
          counts: data.loadedIdx.map(i => (g.rows_by_file[i] || []).length),
          sheets: g.sheets.size,
          fname: ''
        })),
        data.loadedIdx, data.totalValues, data.totalSheets, data.list.length, true
      );
    }

    /* ------------------------------------------------------------------ */
    /*  NAME HELPERS                                                       */
    /* ------------------------------------------------------------------ */
    function sanitizeSheetName(name) {
      let n = String(name).replace(/[\\\/\?\*\[\]:]/g, '_').trim();
      if (!n) n = 'Sheet';
      return n.slice(0, 31);
    }
    function uniqueSheetName(base, used) {
      const clean = sanitizeSheetName(base);
      let out = clean, k = 2;
      while (used.has(out.toLowerCase())) {
        const suffix = `_${k++}`;
        out = clean.slice(0, 31 - suffix.length) + suffix;
      }
      used.add(out.toLowerCase());
      return out;
    }
    function safeFileName(v) {
      return String(v).replace(/[\\\/\?\*"<>\|:]/g, '_')
        .replace(/\s+/g, ' ').trim().slice(0, 90);
    }
    function uniqueFileName(base, used) {
      let out = base || 'value', k = 2;
      while (used.has(out.toLowerCase())) out = `${base}_${k++}`;
      used.add(out.toLowerCase());
      return out;
    }
    function downloadBlob(blob, name) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    }

    /* ------------------------------------------------------------------ */
    /*  BUILD WORKBOOK FOR ONE VALUE — merge always ON, no source column   */
    /* ------------------------------------------------------------------ */
    function buildWorkbookForValue(g, loadedIdx) {
      const wb = XLSX.utils.book_new();
      const usedSheetNames = new Set();
      const noSheetSplit = g.sheets.size === 1 && g.sheets.has('__default__');

      g.sheets.forEach((sh, sheetKey) => {
        const headerSet = [];
        const headerSeen = {};
        let anyHeaders = false;

        // union of headers from cards that actually contribute rows here
        for (const i of loadedIdx) {
          const rows = sh.rows_by_file[i] || [];
          if (!rows.length) continue;
          state[i].headers.forEach(h => {
            const key = String(h || '').trim();
            if (!key) return;
            anyHeaders = true;
            if (!(key in headerSeen)) {
              headerSeen[key] = true;
              headerSet.push(key);
            }
          });
        }

        const aoa = [];
        if (CFG.incHeader && anyHeaders) aoa.push([...headerSet]);

        for (const i of loadedIdx) {
          const s = state[i];
          const rows = sh.rows_by_file[i] || [];
          if (!rows.length) continue;
          const map = {};
          s.headers.forEach((h, idx) => {
            const key = String(h || '').trim();
            if (key) map[key] = idx;
          });
          rows.forEach(r => {
            if (anyHeaders && CFG.incHeader) {
              const out = [];
              headerSet.forEach(h => {
                const idx = map[h];
                out.push(idx !== undefined ? r[idx] : '');
              });
              aoa.push(out);
            } else {
              aoa.push([...r]);
            }
          });
        }

        const ws = XLSX.utils.aoa_to_sheet(aoa.length ? aoa : [['']]);
        const nameBase = noSheetSplit ? 'البيانات' : sh.display;
        XLSX.utils.book_append_sheet(wb, ws,
          uniqueSheetName(nameBase, usedSheetNames));
      });

      if (!wb.SheetNames.length) {
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['']]), 'البيانات');
      }
      return wb;
    }

    /* ------------------------------------------------------------------ */
    /*  RUN — build ZIP                                                    */
    /* ------------------------------------------------------------------ */
    async function run() {
      const btn = $('run');
      const data = computeExportData();
      const { loadedIdx, list, totalValues, totalSheets } = data;

      if (!loadedIdx.length) { setRunStatus('حمّل ملفًا واحدًا على الأقل', true); return; }
      if (list.length === 0) { setRunStatus('لا توجد قيم مطابقة', true); return; }

      btn.disabled = true;
      setRunStatus(`جاري إنشاء ${list.length} ملف…`);

      try {
        const zip = new JSZip();
        const report = [];
        const usedFileNames = new Set();
        const foldersOn = useFolders();

        for (const g of list) {
          const wb = buildWorkbookForValue(g, loadedIdx);
          const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
          const fname = uniqueFileName(safeFileName(g.display), usedFileNames) + '.xlsx';
          let path = fname;
          if (foldersOn) {
            const regionFolder = safeFileName(g.region || 'غير محدد');
            path = regionFolder + '/' + fname;
          }
          zip.file(path, buf);
          report.push({
            value: g.display, region: g.region || '',
            counts: loadedIdx.map(i => (g.rows_by_file[i] || []).length),
            sheets: g.sheets.size,
            fname: path
          });
        }

        const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
        const stamp = new Date().toISOString().slice(0, 10);
        downloadBlob(blob, `split_${stamp}.zip`);
        renderReport(report, loadedIdx, totalValues, totalSheets, list.length, false);
        setRunStatus(`تم إنشاء ${report.length} ملف`, false, true);
      } catch (err) {
        setRunStatus('خطأ: ' + err.message, true);
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    }

    /* ------------------------------------------------------------------ */
    /*  REPORT                                                             */
    /* ------------------------------------------------------------------ */
    function renderReport(report, loadedIdx, totalValues, totalSheets, keptValues, isPreview) {
      const box = $('report');
      const card = $('reportCard');
      if (!report.length) {
        box.innerHTML = '<p class="warn">لم يتم إنشاء أي ملفات</p>';
        card.style.display = 'block';
        return;
      }
      const colTotals = loadedIdx.map(() => 0);
      let grandTotal = 0;
      report.forEach(r => {
        r.counts.forEach((c, k) => { colTotals[k] += c; });
        grandTotal += r.counts.reduce((a, b) => a + b, 0);
      });
      const filesLabel = isPreview ? 'الملفات المتوقعة' : 'الملفات المُنشأة';

      let html = `<p class="sum">
        القيم الفريدة: <b>${totalValues}</b> ·
        ${filesLabel}: <b>${report.length}</b> ·
        إجمالي الشيتات: <b>${totalSheets}</b>` +
        (totalValues !== keptValues
          ? ` · تم استبعادها: <b>${totalValues - keptValues}</b>` : '') + `</p>`;

      html += '<table><thead><tr><th>الهندسة</th>';
      loadedIdx.forEach(i =>
        html += `<th>${escapeHtml(state[i].baseName || ('ملف ' + (i + 1)))}</th>`);
      html += '<th>الشيتات</th><th>الإجمالي</th></tr></thead><tbody>';

      report.forEach(r => {
        const total = r.counts.reduce((a, b) => a + b, 0);
        html += `<tr><td>${escapeHtml(r.value)}</td>`;
        r.counts.forEach(c => html += `<td class="${c === 0 ? 'zero' : ''}">${c}</td>`);
        html += `<td class="sheet-count">${r.sheets}</td>`;
        html += `<td>${total}</td></tr>`;
      });

      html += '<tr class="total-row"><td>الإجمالي</td>';
      colTotals.forEach(t => html += `<td>${t}</td>`);
      html += `<td>${totalSheets}</td>`;
      html += `<td>${grandTotal}</td></tr></tbody></table>`;
      box.innerHTML = html;
      card.style.display = 'block';
      card._report = report;
      card._loadedIdx = loadedIdx;
    }

    /* ------------------------------------------------------------------ */
    /*  EXPORT TABLE                                                       */
    /* ------------------------------------------------------------------ */
    $('exportTable').addEventListener('click', () => {
      const card = $('reportCard');
      const report = card._report;
      const loadedIdx = card._loadedIdx;
      if (!report || !report.length || !loadedIdx) return;

      const aoa = [];
      const header = ['الهندسة'];
      loadedIdx.forEach(i => header.push(state[i].baseName || ('ملف ' + (i + 1))));
      header.push('الشيتات', 'الإجمالي');
      aoa.push(header);

      const colTotals = loadedIdx.map(() => 0);
      let grandTotal = 0, sheetTotal = 0;
      report.forEach(r => {
        const row = [r.value];
        r.counts.forEach((c, k) => { colTotals[k] += c; row.push(c); });
        const t = r.counts.reduce((a, b) => a + b, 0);
        grandTotal += t;
        sheetTotal += r.sheets;
        row.push(r.sheets, t);
        aoa.push(row);
      });
      const totalRow = ['الإجمالي'];
      colTotals.forEach(t => totalRow.push(t));
      totalRow.push(sheetTotal, grandTotal);
      aoa.push(totalRow);

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb, ws, 'التقرير');
      const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      downloadBlob(
        new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
        'report.xlsx'
      );
    });

    /* ------------------------------------------------------------------ */
    /*  WIRING                                                             */
    /* ------------------------------------------------------------------ */
    (function init() {
      let count = DEFAULT_CARDS;
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr) && arr.length) count = Math.max(arr.length, 1);
        } catch { /* ignore */ }
      }
      ensureStateCount(count);
      renderCards();
      restoreFromStorage();
      updateFileCountBadge();
      refreshPreview();

      const saved = loadExportSettings();
      if (saved && saved.regions && Array.isArray(saved.regions)) {
        document.querySelectorAll('#regionList input[type=checkbox]').forEach(cb => {
          cb.checked = saved.regions.includes(cb.value);
        });
        updateRegionCount();
      }
      updatePreview();
    })();

    $('reset').addEventListener('click', () => {
      if (!confirm('مسح جميع الملفات المحمّلة؟')) return;
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(EXPORT_KEY);
      location.reload();
    });

    $('run').addEventListener('click', run);

    $('regionToggleAll').addEventListener('click', () => {
      const boxes = document.querySelectorAll('#regionList input[type=checkbox]');
      if (!boxes.length) return;
      const allChecked = [...boxes].every(cb => cb.checked);
      boxes.forEach(cb => cb.checked = !allChecked);
      updateRegionCount();
      updatePreview();
      saveExportSettings();
    });
  </script>
</body>

</html>
