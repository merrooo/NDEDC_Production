<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بيان-(الأقل-كبار-مصالح-قوي)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --card-hover: #f8fafc;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: rgba(79, 70, 229, 0.08);
      --success: #059669;
      --danger: #dc2626;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, .05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, .08), 0 2px 4px -2px rgba(15, 23, 42, .05);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, .1), 0 4px 6px -4px rgba(15, 23, 42, .05);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --transition: all .2s cubic-bezier(.4, 0, .2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.5;
    }

    /* =========================================
       APP LAYOUT
       ========================================= */
    .app-wrapper {
      display: flex;
      height: 100vh;
      width: 100vw;
      padding: 16px;
      gap: 16px;
    }

    /* =========================================
       SIDEBAR (Light)
       ========================================= */
    .sidebar {
      width: 72px;
      flex-shrink: 0;
      height: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: width .3s cubic-bezier(.4, 0, .2, 1);
      overflow-x: hidden;
      overflow-y: auto;
    }

    .sidebar:hover {
      width: 220px;
      box-shadow: var(--shadow-md);
    }

    .sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar::-webkit-scrollbar-track {
      background: transparent;
      margin: 10px 0;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    .sidebar::-webkit-scrollbar-thumb:hover {
      background: var(--border-strong);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
      flex-shrink: 0;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-sub);
      font-size: 20px;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
      gap: 14px;
      text-decoration: none;
      font-family: inherit;
    }

    .nav-btn:hover {
      background: var(--card-hover);
      color: var(--text-main);
      border-color: var(--border);
    }

    .nav-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(79, 70, 229, .3);
    }

    .nav-btn.active:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .nav-btn .icon {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
    }

    .nav-btn .label {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-8px);
      transition: all .3s ease;
      overflow: hidden;
    }

    .sidebar:hover .nav-btn .label {
      opacity: 1;
      transform: translateX(0);
    }

    /* =========================================
       MAIN CONTENT
       ========================================= */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      min-width: 0;
    }

    /* =========================================
       CARDS
       ========================================= */
    .card {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      height: 100%;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: border-color .2s, box-shadow .2s;
    }

    .card.active {
      display: flex;
    }

    .card:hover {
      border-color: var(--border-strong);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: .95rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: .2px;
    }

    .card-title::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: transparent;
      border: 1px solid var(--border);
      min-height: 0;
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* =========================================
       RESPONSIVE
       ========================================= */
    @media (max-width: 768px) {
      .app-wrapper {
        padding: 10px;
        gap: 10px;
      }
      .sidebar {
        width: 56px;
        padding: 8px 4px;
      }
      .sidebar:hover {
        width: 180px;
      }
      .nav-btn {
        height: 42px;
        padding: 0 10px;
        gap: 10px;
        font-size: 18px;
      }
      .card {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="app-wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <!-- HOME -->
      <a href="../index.html" class="nav-btn" title="Home">
        <span class="icon">🏠</span>
        <span class="label">Home</span>
      </a>

      <div class="divider"></div>

      <!-- TOOL 1: Gehat_R (التصدير والتقرير) -->
      <button class="nav-btn active" data-target="card-text" title="بيان — التصدير والتقرير">
        <span class="icon">📝</span>
        <span class="label">بيان الجهات</span>
      </button>

      <!-- TOOL 2: Gehat_DB (قاعدة البيانات) -->
      <button class="nav-btn" data-target="card-pdf" title="بيان — قاعدة البيانات">
        <span class="icon">🗄️</span>
        <span class="label">قاعدة البيانات</span>
      </button>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- Gehat_R -->
      <section class="card active" id="card-text">
        <div class="card-header">
          <span class="card-title">📝 بيان-(الأقل-كبار-مصالح-قوي)</span>
        </div>
        <div class="iframe-wrapper">
          <iframe src="Gehat_R.html" title="التصدير والتقرير"></iframe>
        </div>
      </section>

      <!-- Gehat_DB -->
      <section class="card" id="card-pdf">
        <div class="card-header">
          <span class="card-title">🗄️ بيان-(الأقل-كبار-مصالح-قوي) — قاعدة البيانات</span>
        </div>
        <div class="iframe-wrapper">
          <iframe src="Gehat_DB.html" title="قاعدة البيانات"></iframe>
        </div>
      </section>

    </main>

  </div>

  <script>
    /* =========================================
       SIDEBAR NAVIGATION
       ========================================= */
    const navButtons = document.querySelectorAll('.nav-btn[data-target]');
    const cards = document.querySelectorAll('.card');

    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        navButtons.forEach(b => b.classList.remove('active'));
        cards.forEach(c => c.classList.remove('active'));

        btn.classList.add('active');

        const targetId = btn.getAttribute('data-target');
        const targetCard = document.getElementById(targetId);
        if (targetCard) {
          targetCard.classList.add('active');
        }
      });
    });
  </script>

</body>

</html>
