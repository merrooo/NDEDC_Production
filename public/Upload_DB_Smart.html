<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة البيانات</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --bg: #f4f6fb; --surface: #ffffff; --surface-2: #f8fafc;
            --border: #e6eaf2; --text: #0f172a; --muted: #64748b;
            --primary: #2563eb; --primary-dark: #1d4ed8; --primary-soft: #eef3ff;
            --sub: #8b5cf6; --sub-soft: #f3f0ff;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --radius: 14px;
            --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 10px 30px -18px rgba(15, 23, 42, .35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg); color: var(--text); direction: rtl;
            padding: 12px; font-size: 14px; line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap;
            background: linear-gradient(135deg, #111c33, #1e293b); color: #fff;
            border-radius: var(--radius); padding: 10px 14px;
            box-shadow: var(--shadow); position: sticky; top: 6px; z-index: 50;
        }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand-icon {
            width: 36px; height: 36px; flex: none; border-radius: 10px;
            background: var(--primary); display: grid; place-items: center;
            font-size: 15px; box-shadow: 0 6px 16px -6px var(--primary);
        }
        .brand h1 { font-size: .95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
        .brand .sub { font-size: .72rem; color: #94a3b8; }
        .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .chip {
            font-size: .72rem; padding: 4px 11px; border-radius: 999px;
            background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
            white-space: nowrap; transition: .2s;
        }
        .chip-ok { background: rgba(16,185,129,.15); color: #6ee7b7; border-color: rgba(16,185,129,.25); }
        .chip-loading { background: rgba(245,158,11,.15); color: #fcd34d; border-color: rgba(245,158,11,.25); }
        .chip.warn { color: #fcd34d; border-color: rgba(245,158,11,.35); }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            border: none; border-radius: 10px; padding: 8px 14px;
            font-size: .8rem; font-weight: 600; cursor: pointer;
            transition: .15s; font-family: inherit; white-space: nowrap; line-height: 1.2;
        }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover:not(:disabled) { background: #059669; }
        .btn-ghost { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
        .btn-ghost:hover:not(:disabled) { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
        .btn-top { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.16); }
        .btn-top:hover { background: rgba(255,255,255,.2); }
        .btn-sm { padding: 6px 11px; font-size: .75rem; border-radius: 9px; }
        .icon-btn {
            width: 32px; height: 32px; flex: none; display: inline-grid; place-items: center;
            border-radius: 9px; border: 1px solid var(--border); background: var(--surface);
            color: var(--muted); cursor: pointer; transition: .15s; font-size: .72rem;
        }
        .icon-btn:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
        .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); background: #fef2f2; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; }
        .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .card-head h2 { font-size: .88rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 7px; }
        .card-head h2 i { color: var(--primary); }
        .head-actions { display: flex; align-items: center; gap: 8px; }
        .chip-count { background: var(--primary-soft); color: var(--primary); font-size: .72rem; font-weight: 700; padding: 4px 11px; border-radius: 999px; }
        .muted-sm { font-size: .74rem; color: var(--muted); }
        .db-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .db-label { font-size: .78rem; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .db-buttons { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
        .db-btn {
            display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px;
            border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
            font-size: .78rem; font-weight: 600; color: #334155; cursor: pointer;
            transition: .15s; font-family: inherit;
        }
        .db-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
        .db-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 8px 18px -10px var(--primary); }
        .db-btn .cnt { font-size: .68rem; background: rgba(15,23,42,.07); padding: 1px 8px; border-radius: 999px; font-weight: 700; }
        .db-btn.active .cnt { background: rgba(255,255,255,.25); }
        .db-btn .cached-dot {
            display: inline-block; width: 7px; height: 7px; border-radius: 999px;
            background: var(--success); box-shadow: 0 0 0 2px rgba(16,185,129,.18);
            margin-inline-start: 2px;
        }
        .path-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .path-row label { font-size: .78rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
        .path-row input {
            flex: 1; min-width: 200px; height: 36px; padding: 0 12px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--surface-2);
            font-size: .78rem; font-family: ui-monospace, monospace; outline: none;
            transition: .15s; color: var(--text);
        }
        .path-row input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
        .upload-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .dropzone {
            flex: 1; min-width: 220px; display: flex; align-items: center;
            justify-content: center; gap: 10px; padding: 18px;
            border: 2px dashed var(--border); border-radius: 12px; color: var(--muted);
            font-size: .8rem; cursor: pointer; transition: .15s; background: var(--surface-2); text-align: center;
        }
        .dropzone:hover, .dropzone.over { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
        .dropzone i { font-size: 20px; }
        .progress { height: 5px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--success)); transition: width .25s; }
        .preview { margin-top: 10px; max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
        .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .search-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; flex-wrap: wrap; }
        .search { position: relative; flex: 1; min-width: 180px; max-width: 340px; }
        .search > i.field-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: .75rem; color: var(--muted); pointer-events: none; }
        .search input {
            width: 100%; height: 36px; padding: 0 34px 0 34px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--surface-2);
            font-size: .8rem; outline: none; transition: .15s; font-family: inherit; color: var(--text);
        }
        .search input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
        .search .clear {
            position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
            border: none; background: none; cursor: pointer; color: var(--muted);
            font-size: .8rem; padding: 4px;
        }
        .search .clear:hover { color: var(--danger); }
        .search.sub { max-width: 320px; padding-right: 12px; border-right: 2px dashed var(--border); }
        .search.sub > i.field-icon { color: var(--sub); }
        .search.sub input:focus { border-color: var(--sub); box-shadow: 0 0 0 3px var(--sub-soft); }
        .search.sub .badge {
            position: absolute; top: -7px; right: 14px; background: var(--sub); color: #fff;
            font-size: .58rem; font-weight: 700; padding: 1px 8px; border-radius: 999px;
            letter-spacing: .3px; pointer-events: none; box-shadow: 0 4px 10px -4px var(--sub);
        }
        .toolbar-actions { display: flex; gap: 8px; }
        .table-wrap { max-height: 62vh; overflow: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .76rem; }
        thead th {
            position: sticky; top: 0; z-index: 2; background: var(--surface-2); color: #475569;
            font-weight: 700; text-align: right; padding: 9px 11px;
            border-bottom: 1px solid var(--border); white-space: nowrap;
        }
        tbody td {
            padding: 7px 11px; border-bottom: 1px solid #f1f5f9; text-align: right;
            max-width: 220px; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; color: #334155;
        }
        tbody tr:hover { background: #f8fafc; }
        tbody tr:last-child td { border-bottom: none; }
        td.idx { color: #94a3b8; font-size: .7rem; width: 46px; }
        td.actions { white-space: nowrap; width: 86px; }
        td.actions .icon-btn { width: 28px; height: 28px; font-size: .68rem; }
        .empty-cell, .loading-cell { text-align: center; padding: 34px 12px !important; color: var(--muted); font-size: .82rem; }
        .table-foot { display: flex; justify-content: center; padding-top: 10px; }
        .loading-bar {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 6px 12px; font-size: .74rem; color: var(--primary);
            background: var(--primary-soft); border-radius: 8px; margin-bottom: 8px; font-weight: 600;
        }
        .loading-bar.cached { color: var(--success); background: rgba(16,185,129,.10); }
        .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
        .empty i { font-size: 40px; opacity: .25; margin-bottom: 12px; display: block; }
        .empty h3 { font-size: 1rem; color: var(--text); margin-bottom: 4px; }
        .empty p { font-size: .82rem; }
        .toasts { position: fixed; bottom: 16px; left: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; }
        .toast {
            background: #0f172a; color: #fff; padding: 10px 15px; border-radius: 11px;
            font-size: .78rem; font-weight: 600; box-shadow: 0 12px 34px -12px rgba(0,0,0,.55);
            opacity: 0; transform: translateY(10px); transition: .25s; max-width: 330px;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: #065f46; }
        .toast-error { background: #991b1b; }
        .toast-info { background: #1e3a8a; }
        .swal-row { text-align: right; margin-bottom: 10px; }
        .swal-row label { display: block; font-size: .78rem; font-weight: 700; color: #334155; margin-bottom: 4px; }
        .swal-row input { width: 100% !important; margin: 0 !important; font-size: .82rem !important; }
        @media (max-width: 720px) {
            body { padding: 8px; }
            .brand h1 { font-size: .82rem; max-width: 60vw; }
            .topbar { position: static; }
            .db-bar { align-items: flex-start; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .search, .search.sub { max-width: 100%; }
            .search.sub { border-right: none; border-top: 2px dashed var(--border); padding-right: 0; padding-top: 8px; }
            .upload-row { flex-direction: column; align-items: stretch; }
            .dropzone { width: 100%; }
            .table-wrap { max-height: 55vh; }
        }
    </style>
</head>

<body>
    <div class="toasts" id="toasts"></div>

    <div class="container">
        <header class="topbar">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-database"></i></div>
                <div>
                    <h1>بيانات المحولات - المحطات - اللوحات - المغذيات</h1>
                    <span class="sub">عرض وإدارة قواعد البيانات</span>
                </div>
            </div>
            <div class="topbar-actions">
                <span id="syncStatus" class="chip chip-loading">جاري الاتصال…</span>
                <span id="preloadStatus" class="chip" hidden></span>
                <span id="sessionTimer" class="chip">5:00</span>
                <a href="Control_Smart.html?keta3=admin&handsa=admin&userType=Admin" class="btn btn-top btn-sm">
                    <i class="fas fa-arrow-right"></i> رجوع
                </a>
            </div>
        </header>

        <section class="card">
            <div class="db-bar">
                <span class="db-label"><i class="fas fa-layer-group"></i> قواعد البيانات</span>
                <div class="db-buttons" id="dbButtons"><span class="muted-sm">جاري التحميل…</span></div>
                <button class="icon-btn" id="refreshDbs" title="تحديث القائمة"><i class="fas fa-rotate"></i></button>
            </div>
        </section>

        <section class="card" id="emptyCard">
            <div class="empty">
                <i class="fas fa-hand-pointer"></i>
                <h3>اختر قاعدة بيانات</h3>
                <p>سيتم عرض البيانات هنا بعد الاختيار</p>
            </div>
        </section>

        <section class="card" id="uploadCard" hidden>
            <div class="card-head">
                <h2><i class="fas fa-cloud-arrow-up"></i> رفع بيانات
                    <span class="muted-sm" id="uploadTargetName"></span>
                </h2>
            </div>
            <div class="path-row" id="pathRow" hidden>
                <label>📂 المسار المستهدف</label>
                <input id="uploadAnyPath" dir="ltr" value="reference_data/new_collection">
            </div>
            <div class="upload-row">
                <div class="dropzone" id="dropzone">
                    <i class="fas fa-file-excel"></i>
                    <span>اسحب ملف Excel / CSV هنا أو اضغط للاختيار</span>
                </div>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
                <button class="btn btn-success" id="saveBtn" disabled><i class="fas fa-floppy-disk"></i> حفظ</button>
                <button class="btn btn-ghost" id="clearBtn"><i class="fas fa-rotate-left"></i> مسح</button>
            </div>
            <div class="progress" id="progress" hidden><div class="progress-fill" id="progressFill"></div></div>
            <div class="muted-sm" id="uploadStatus" style="margin-top:8px"></div>
            <div class="preview" id="previewWrap" hidden></div>
        </section>

        <section class="card" id="dataCard" hidden>
            <div class="card-head">
                <h2><i class="fas fa-table-list"></i> <span id="dataTitle">البيانات</span></h2>
                <div class="head-actions">
                    <span class="chip-count" id="loadedChip">0</span>
                    <button class="btn btn-primary btn-sm" id="addBtn"><i class="fas fa-plus"></i> إضافة</button>
                </div>
            </div>
            <div class="loading-bar" id="loadingBar" hidden>
                <i class="fas fa-spinner fa-spin"></i>
                <span id="loadingText">جاري تحميل البيانات…</span>
            </div>
            <div class="toolbar">
                <div class="search-group">
                    <div class="search main">
                        <i class="fas fa-magnifying-glass field-icon"></i>
                        <input id="searchInput" placeholder="بحث رئيسي… (Enter للبحث الفوري)" autocomplete="off">
                        <button class="clear" id="clearSearch" hidden><i class="fas fa-xmark"></i></button>
                    </div>
                    <div class="search sub">
                        <span class="badge">فرعي</span>
                        <i class="fas fa-filter field-icon"></i>
                        <input id="subSearchInput" placeholder="فلتر فرعي مستقل…" autocomplete="off">
                        <button class="clear" id="clearSubSearch" hidden><i class="fas fa-xmark"></i></button>
                    </div>
                </div>
                <div class="toolbar-actions">
                    <button class="btn btn-ghost btn-sm" id="exportBtn"><i class="fas fa-file-excel"></i> تصدير</button>
                    <button class="btn btn-ghost btn-sm" id="reloadBtn"><i class="fas fa-rotate"></i> تحديث</button>
                </div>
            </div>
            <div class="table-wrap">
                <table class="data-table">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="table-foot" id="tableFoot" hidden>
                <button class="btn btn-ghost" id="loadMoreBtn"><i class="fas fa-chevron-down"></i> عرض المزيد</button>
            </div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFXLCWmwrAQIrmRvnus3yJlTpra9Rv69k",
            authDomain: "trial-85.firebaseapp.com",
            databaseURL: "https://trial-85-default-rtdb.firebaseio.com",
            projectId: "trial-85",
            storageBucket: "trial-85.firebasestorage.app",
            messagingSenderId: "660343156279",
            appId: "1:660343156279:web:3275f5d3da7721a35259b2",
            measurementId: "G-RLMVPCLZW3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const DB_URL = firebaseConfig.databaseURL.replace(/\/+$/, '');
        const ROOT = 'reference_data';

        /* =========================================================
           TUNING
        ========================================================= */
        const PAGE_SIZE = 100;
        const INDEX_CHUNK = 300;
        const SEARCH_DEBOUNCE = 400;
        const IDB_TTL_MS = 24 * 60 * 60 * 1000;   // 24 ساعة
        const LS_LAST_DB = 'smart_last_db';

        /* =========================================================
           FIXED COLUMNS
        ========================================================= */
        const TRF_EXTRA_DB = 'trf_code_extra';
        const TRF_EXTRA_COLUMNS = [
            'Handsa Code', 'Handsa Name', 'Keta3 Code', 'keta3',
            'lat', 'lng', 'trf_name', 'G-P', 'dp_name',
            'sub_name', 'trf_capacity', 'cell_name'
        ];
        const CAPACITY_DB_CANDIDATES = [
            'transformer_capacity', 'transformer_capacities', 'trf_capacity',
            'trf_capacities', 'capacities', 'capacity'
        ];
        const CAPACITY_FIELD = 'trf_capacity';

        /* =========================================================
           HELPERS
        ========================================================= */
        const $ = id => document.getElementById(id);
        const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);
        const nextTick = () => new Promise(r => setTimeout(r, 0));

        function debounce(fn, wait) {
            let t;
            return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), wait); };
        }

        function toast(msg, type = 'info', ms = 3200) {
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            $('toasts').appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => {
                el.classList.remove('show');
                setTimeout(() => el.remove(), 260);
            }, ms);
        }

        function setSync(loading) {
            const el = $('syncStatus');
            el.textContent = loading ? 'جاري المزامنة…' : 'متصل';
            el.className = 'chip ' + (loading ? 'chip-loading' : 'chip-ok');
        }

        /* =========================================================
           SESSION TIMER
        ========================================================= */
        const SESSION_MS = 5 * 60 * 1000;
        let lastActivity = Date.now();
        const touch = () => { lastActivity = Date.now(); };
        ['click', 'keydown', 'scroll', 'touchstart', 'pointerdown'].forEach(ev =>
            document.addEventListener(ev, touch, { passive: true })
        );
        let sessionDead = false;
        setInterval(() => {
            if (sessionDead) return;
            const left = Math.max(0, SESSION_MS - (Date.now() - lastActivity));
            const m = Math.floor(left / 60000);
            const s = Math.floor((left % 60000) / 1000);
            const el = $('sessionTimer');
            el.textContent = `${m}:${String(s).padStart(2, '0')}`;
            el.classList.toggle('warn', left <= 60000);
            if (left <= 0) {
                sessionDead = true;
                window.location.href = 'login_Smart.html';
            }
        }, 1000);

        /* =========================================================
           LAZY LOAD SHEETJS
        ========================================================= */
        let xlsxPromise = null;
        function loadXLSX() {
            if (window.XLSX) return Promise.resolve(window.XLSX);
            if (!xlsxPromise) {
                xlsxPromise = new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
                    s.onload = () => resolve(window.XLSX);
                    s.onerror = () => reject(new Error('فشل تحميل مكتبة Excel'));
                    document.head.appendChild(s);
                });
            }
            return xlsxPromise;
        }

        /* =========================================================
           INDEXEDDB PERSISTENCE
        ========================================================= */
        const IDB_NAME = 'smart_data_cache';
        const IDB_VERSION = 1;
        const STORE_DBS = 'databases';
        const STORE_META = 'meta';

        let idbPromise = null;
        function openIDB() {
            if (idbPromise) return idbPromise;
            idbPromise = new Promise((resolve, reject) => {
                if (!('indexedDB' in window)) { idbPromise = null; reject(new Error('IndexedDB not supported')); return; }
                const req = indexedDB.open(IDB_NAME, IDB_VERSION);
                req.onupgradeneeded = (e) => {
                    const idb = e.target.result;
                    if (!idb.objectStoreNames.contains(STORE_DBS)) {
                        idb.createObjectStore(STORE_DBS, { keyPath: 'name' });
                    }
                    if (!idb.objectStoreNames.contains(STORE_META)) {
                        idb.createObjectStore(STORE_META, { keyPath: 'key' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => { idbPromise = null; reject(req.error); };
            });
            return idbPromise;
        }

        async function idbPut(store, payload) {
            try {
                const idb = await openIDB();
                return await new Promise((resolve, reject) => {
                    const tx = idb.transaction(store, 'readwrite');
                    tx.objectStore(store).put(payload);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) { console.warn('IDB put failed', store, e); return false; }
        }

        async function idbGet(store, key) {
            try {
                const idb = await openIDB();
                return await new Promise((resolve, reject) => {
                    const tx = idb.transaction(store, 'readonly');
                    const req = tx.objectStore(store).get(key);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            } catch (e) { return null; }
        }

        async function idbGetAll(store) {
            try {
                const idb = await openIDB();
                return await new Promise((resolve, reject) => {
                    const tx = idb.transaction(store, 'readonly');
                    const req = tx.objectStore(store).getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
            } catch (e) { return []; }
        }

        async function idbDelete(store, key) {
            try {
                const idb = await openIDB();
                return await new Promise((resolve, reject) => {
                    const tx = idb.transaction(store, 'readwrite');
                    tx.objectStore(store).delete(key);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) { return false; }
        }

        async function idbClearStore(store) {
            try {
                const idb = await openIDB();
                return await new Promise((resolve, reject) => {
                    const tx = idb.transaction(store, 'readwrite');
                    tx.objectStore(store).clear();
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) { return false; }
        }

        /* --- helpers to serialize state to IDB --- */
        function serializeDbData(name, data) {
            return {
                name,
                recordsArr: Array.from(data.records.entries()),
                order: data.order.slice(),
                searchIndexArr: Array.from(data.searchIndex.entries()),
                fields: data.fields.slice(),
                timestamp: Date.now()
            };
        }

        function deserializeDbData(entry) {
            return {
                records: new Map(entry.recordsArr || []),
                order: entry.order || [],
                searchIndex: new Map(entry.searchIndexArr || []),
                fields: entry.fields || [],
                timestamp: entry.timestamp || 0
            };
        }

        async function persistDb(name, data) {
            return idbPut(STORE_DBS, serializeDbData(name, data));
        }

        async function deleteDbFromIDB(name) {
            return idbDelete(STORE_DBS, name);
        }

        /* =========================================================
           STATE
        ========================================================= */
        const state = {
            dbNames: [], counts: {}, current: null, uploadAny: false,
            records: new Map(), order: [], searchIndex: new Map(), fields: [],
            loading: false, dataReady: false,
            searchQuery: '', subSearchQuery: '',
            renderedCount: 0, lastFilteredKeyCount: 0,
            fileRows: [], saving: false
        };

        const cache = new Map();
        const cacheTimestamps = new Map();

        function hasCache(name) { return cache.has(name); }

        function saveToCache(name) {
            const data = {
                records: new Map(state.records),
                order: state.order.slice(),
                searchIndex: new Map(state.searchIndex),
                fields: state.fields.slice()
            };
            cache.set(name, data);
            cacheTimestamps.set(name, Date.now());
            return persistDb(name, data);
        }

        function restoreFromCache(name) {
            const c = cache.get(name);
            if (!c) return false;
            state.records = new Map(c.records);
            state.order = c.order.slice();
            state.searchIndex = new Map(c.searchIndex);
            state.fields = c.fields.slice();
            return true;
        }

        async function invalidateCache(name) {
            if (name) {
                cache.delete(name);
                cacheTimestamps.delete(name);
                await deleteDbFromIDB(name);
            } else {
                cache.clear();
                cacheTimestamps.clear();
                await idbClearStore(STORE_DBS);
            }
            renderDbButtons();
        }

        /* =========================================================
           PRELOAD STATE
        ========================================================= */
        const preloadState = { running: false, done: 0, total: 0, promises: new Map() };

        function updatePreloadChip() {
            const el = $('preloadStatus');
            if (!el) return;
            if (!preloadState.total) { el.hidden = true; return; }
            if (preloadState.done >= preloadState.total) {
                el.hidden = false;
                el.className = 'chip chip-ok';
                el.textContent = `✅ (${preloadState.total})`;
                setTimeout(() => {
                    if (preloadState.done >= preloadState.total) el.hidden = true;
                }, 3500);
                return;
            }
            el.hidden = false;
            el.className = 'chip chip-loading';
            el.textContent = `⏳ ${preloadState.done}/${preloadState.total}`;
        }

        /* =========================================================
           CAPACITY REFERENCE
        ========================================================= */
        const capacityState = { map: new Map(), loaded: false, loading: false, dbName: null };

        function findCapacityDbName() {
            for (const c of CAPACITY_DB_CANDIDATES) if (state.dbNames.includes(c)) return c;
            return state.dbNames.find(n => /capacit/i.test(n)) || null;
        }

        async function persistCapacityToIDB() {
            return idbPut(STORE_META, {
                key: 'capacity',
                mapArr: Array.from(capacityState.map.entries()),
                dbName: capacityState.dbName,
                timestamp: Date.now()
            });
        }

        async function loadCapacityLookup() {
            if (capacityState.loaded) return;
            if (capacityState.loading) {
                while (capacityState.loading) await new Promise(r => setTimeout(r, 50));
                return;
            }
            capacityState.loading = true;
            try {
                const name = findCapacityDbName();
                if (!name) { capacityState.loaded = true; return; }
                capacityState.dbName = name;
                const snap = await get(ref(db, `${ROOT}/${name}`));
                if (snap.exists()) {
                    const val = snap.val();
                    for (const k in val) {
                        const rec = val[k];
                        let display;
                        if (rec && typeof rec === 'object') {
                            display = rec.capacity ?? rec.name ?? rec.value ??
                                rec.capacity_value ?? rec.label ?? rec.title ??
                                Object.values(rec).find(x => typeof x === 'string' || typeof x === 'number') ?? '';
                        } else display = rec;
                        capacityState.map.set(k, String(display ?? ''));
                    }
                }
                capacityState.loaded = true;
                await persistCapacityToIDB();
            } catch (err) {
                console.warn('فشل التحميل  :', err);
                capacityState.loaded = true;
            } finally {
                capacityState.loading = false;
            }
        }

        function resolveCapacity(rawKey) {
            if (rawKey == null || rawKey === '') return '';
            return capacityState.map.get(String(rawKey)) ?? String(rawKey);
        }

        /* =========================================================
           INDEX / FIELDS
        ========================================================= */
        function buildIndex(rec) {
            if (rec == null) return '';
            if (typeof rec !== 'object') return String(rec).toLowerCase();
            let s = '';
            for (const k in rec) {
                const v = rec[k];
                if (v != null && v !== '') s += v + ' ';
                if (k === CAPACITY_FIELD && v != null && capacityState.map.size) {
                    const resolved = capacityState.map.get(String(v));
                    if (resolved) s += resolved + ' ';
                }
            }
            return s.toLowerCase();
        }

        function deriveFieldsFrom(records, order) {
            const seen = new Set();
            const fields = [];
            for (const key of order) {
                const rec = records.get(key);
                if (rec && typeof rec === 'object') {
                    for (const k of Object.keys(rec)) if (!seen.has(k)) { seen.add(k); fields.push(k); }
                } else if (rec !== undefined && !seen.has('value')) {
                    seen.add('value'); fields.push('value');
                }
            }
            return fields;
        }

        function deriveFields() { return deriveFieldsFrom(state.records, state.order); }
        function resolveColumns() {
            if (state.current === TRF_EXTRA_DB) return TRF_EXTRA_COLUMNS.slice();
            return state.fields.length ? state.fields : deriveFields();
        }

        /* =========================================================
           FETCH HELPERS
        ========================================================= */
        async function fetchNames() {
            const res = await fetch(`${DB_URL}/${ROOT}.json?shallow=true`);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            return data ? Object.keys(data).sort() : [];
        }

        async function fetchCount(name) {
            try {
                const res = await fetch(`${DB_URL}/${ROOT}/${encodeURIComponent(name)}.json?shallow=true`);
                if (!res.ok) return;
                const data = await res.json();
                state.counts[name] = data ? Object.keys(data).length : 0;
                updateCountBadge(name);
            } catch (_) { }
        }

        function updateCountBadge(name) {
            const el = document.querySelector(`.db-btn[data-db="${CSS.escape(name)}"] .cnt`);
            if (el) el.textContent = state.counts[name];
        }

        async function preloadCounts(names) {
            const queue = [...names];
            const worker = async () => { while (queue.length) await fetchCount(queue.shift()); };
            await Promise.all([worker(), worker(), worker()]);
        }

        /* =========================================================
           LOAD ONE DATABASE INTO CACHE (+ IDB)
        ========================================================= */
        async function loadDatabaseIntoCache(name) {
            const snap = await get(ref(db, `${ROOT}/${name}`));
            if (!snap.exists()) {
                const empty = { records: new Map(), order: [], searchIndex: new Map(), fields: [] };
                cache.set(name, empty);
                cacheTimestamps.set(name, Date.now());
                await persistDb(name, empty);
                return;
            }
            const val = snap.val();
            const keys = Object.keys(val).reverse();
            const total = keys.length;

            const records = new Map();
            const order = [];
            const searchIndex = new Map();

            for (let i = 0; i < total; i += INDEX_CHUNK) {
                const end = Math.min(i + INDEX_CHUNK, total);
                for (let j = i; j < end; j++) {
                    const k = keys[j];
                    const rec = val[k];
                    records.set(k, rec);
                    order.push(k);
                    searchIndex.set(k, buildIndex(rec));
                }
                if (end < total) await nextTick();
            }

            const fields = deriveFieldsFrom(records, order);
            const data = { records, order, searchIndex, fields };
            cache.set(name, data);
            cacheTimestamps.set(name, Date.now());
            await persistDb(name, data);
        }

        /* =========================================================
           PRELOAD ALL
        ========================================================= */
        async function preloadAllDatabases(names) {
            preloadState.running = true;
            preloadState.total = names.length;
            preloadState.done = 0;
            updatePreloadChip();

            for (const name of names) {
                if (cache.has(name)) {
                    if (!preloadState.promises.has(name)) {
                        preloadState.promises.set(name, Promise.resolve());
                    }
                    preloadState.done++;
                    updatePreloadChip();
                    continue;
                }
                let p = preloadState.promises.get(name);
                if (!p) {
                    p = loadDatabaseIntoCache(name);
                    preloadState.promises.set(name, p);
                }
                try { await p; } catch (_) { }
                preloadState.done++;
                updatePreloadChip();
                renderDbButtons();
            }

            preloadState.running = false;
            updatePreloadChip();
        }

        /* refresh stale entries silently in background */
        async function refreshStale(names) {
            const now = Date.now();
            for (const name of names) {
                const ts = cacheTimestamps.get(name) || 0;
                if (now - ts <= IDB_TTL_MS) continue;
                try {
                    cache.delete(name);
                    preloadState.promises.delete(name);
                    await loadDatabaseIntoCache(name);
                    renderDbButtons();
                } catch (e) { console.warn('refreshStale:', name, e); }
            }
        }

        function startPreload(names) {
            setTimeout(() => {
                preloadAllDatabases(names).catch(err => console.warn('preload:', err));
            }, 120);
        }

        /* =========================================================
           BOOT  —  load names + IDB in parallel
        ========================================================= */
        async function loadReferenceDatabases() {
            $('dbButtons').innerHTML = '<span class="muted-sm">⏳ جاري التحميل…</span>';
            setSync(true);

            try {
                /* 1. Fetch names + read IDB in PARALLEL */
                const [names, idbDbs, idbCap] = await Promise.all([
                    fetchNames(),
                    idbGetAll(STORE_DBS),
                    idbGet(STORE_META, 'capacity')
                ]);

                state.dbNames = names;

                /* 2. Restore capacity from IDB */
                if (idbCap && idbCap.mapArr) {
                    capacityState.map = new Map(idbCap.mapArr);
                    capacityState.dbName = idbCap.dbName;
                    capacityState.loaded = true;
                }

                /* 3. Restore DBs from IDB into memory cache */
                for (const entry of idbDbs) {
                    if (!entry || !entry.name) continue;
                    const data = deserializeDbData(entry);
                    cache.set(entry.name, {
                        records: data.records,
                        order: data.order,
                        searchIndex: data.searchIndex,
                        fields: data.fields
                    });
                    cacheTimestamps.set(entry.name, data.timestamp);
                }

                /* 4. Purge orphaned cache entries (DBs deleted from Firebase) */
                const nameSet = new Set(names);
                for (const n of Array.from(cache.keys())) {
                    if (!nameSet.has(n)) {
                        cache.delete(n);
                        cacheTimestamps.delete(n);
                        deleteDbFromIDB(n);
                    }
                }

                renderDbButtons();
                setSync(false);

                /* 5. Load capacity if still missing */
                if (!capacityState.loaded) await loadCapacityLookup();

                /* 6. Preload missing DBs (only those NOT in cache) */
                preloadCounts(names);
                startPreload(names);

                /* 7. Auto-select last opened DB */
                const lastDb = localStorage.getItem(LS_LAST_DB);
                if (lastDb && names.includes(lastDb) && !state.current) {
                    selectDb(lastDb);
                }

                /* 8. Refresh stale entries in background */
                setTimeout(() => refreshStale(names).catch(() => {}), 3000);

            } catch (err) {
                $('dbButtons').innerHTML = '<span class="muted-sm">— تعذر تحميل القائمة —</span>';
                toast('خطأ في تحميل القائمة: ' + err.message, 'error');
                setSync(false);
            }
        }

        function renderDbButtons() {
            const parts = [
                `<button class="db-btn${state.uploadAny ? ' active' : ''}" data-db="__upload_any__">
                    <i class="fas fa-cloud-arrow-up"></i> رفع أي بيانات
                 </button>`
            ];
            for (const name of state.dbNames) {
                const active = (!state.uploadAny && state.current === name) ? ' active' : '';
                const cnt = state.counts[name];
                const cached = hasCache(name) ? ' <span class="cached-dot" title="محفوظ محلياً"></span>' : '';
                parts.push(
                    `<button class="db-btn${active}" data-db="${esc(name)}">
                        <i class="fas fa-folder"></i> ${esc(name.replace(/_/g, ' '))}
                        <span class="cnt">${cnt == null ? '…' : cnt}</span>${cached}
                     </button>`
                );
            }
            $('dbButtons').innerHTML = parts.join('');
        }

        /* =========================================================
           SELECT DATABASE
        ========================================================= */
        async function selectDb(name) {
            touch();

            if (name === '__upload_any__') {
                state.uploadAny = true;
                state.current = null;
                state.dataReady = false;
                localStorage.removeItem(LS_LAST_DB);
                renderDbButtons();
                $('emptyCard').hidden = true;
                $('uploadCard').hidden = false;
                $('dataCard').hidden = true;
                $('pathRow').hidden = false;
                $('uploadTargetName').textContent = '→ مسار مخصص';
                resetUploadUI();
                return;
            }

            state.uploadAny = false;
            state.current = name;
            state.dataReady = false;
            localStorage.setItem(LS_LAST_DB, name);
            renderDbButtons();

            $('emptyCard').hidden = true;
            $('uploadCard').hidden = false;
            $('dataCard').hidden = false;
            $('pathRow').hidden = true;
            $('uploadTargetName').textContent = '→ ' + name.replace(/_/g, ' ');
            $('dataTitle').textContent = name.replace(/_/g, ' ');
            resetUploadUI();

            syncSearchUI();

            /* If not cached → await/start preload promise for this DB */
            if (!hasCache(name)) {
                $('loadingBar').hidden = false;
                $('loadingBar').classList.remove('cached');
                $('loadingText').textContent = `⏳ جاري تحميل "${name.replace(/_/g, ' ')}"…`;
                try {
                    let p = preloadState.promises.get(name);
                    if (!p) {
                        p = loadDatabaseIntoCache(name);
                        preloadState.promises.set(name, p);
                    }
                    await p;
                } catch (_) { }
            }

            await loadAllData();
            if (state.counts[name] == null) fetchCount(name);
        }

        /* =========================================================
           SEARCH HELPERS
        ========================================================= */
        function syncSearchUI() {
            const mainVal = $('searchInput').value.trim();
            const subVal = $('subSearchInput').value.trim();
            state.searchQuery = mainVal.toLowerCase();
            state.subSearchQuery = subVal.toLowerCase();
            $('clearSearch').hidden = !mainVal;
            $('clearSubSearch').hidden = !subVal;
        }

        function hasActiveFilters() { return !!(state.searchQuery || state.subSearchQuery); }

        function filteredKeys() {
            const qMain = state.searchQuery, qSub = state.subSearchQuery;
            let keys = state.order;
            if (qMain) keys = keys.filter(k => (state.searchIndex.get(k) || '').includes(qMain));
            if (qSub) keys = keys.filter(k => (state.searchIndex.get(k) || '').includes(qSub));
            return keys;
        }

        /* =========================================================
           LOAD ALL DATA (memory)
        ========================================================= */
        async function loadAllData(options = {}) {
            if (!state.current) return;
            const forceReload = !!options.force;

            if (!forceReload && hasCache(state.current)) {
                restoreFromCache(state.current);
                state.dataReady = true;
                $('loadingBar').hidden = false;
                $('loadingBar').classList.add('cached');
                $('loadingText').textContent = `⚡ تم استرجاع ${state.order.length} سجل من الذاكرة`;
                setTimeout(() => {
                    $('loadingBar').hidden = true;
                    $('loadingBar').classList.remove('cached');
                }, 900);
                renderTable();
                notifyFiltersApplied();
                return;
            }

            state.records.clear();
            state.order = [];
            state.searchIndex.clear();
            state.fields = [];
            state.dataReady = false;
            state.loading = true;
            state.renderedCount = 0;

            setSync(true);
            $('tableHead').innerHTML = '';
            $('tableBody').innerHTML = `<tr><td class="loading-cell" colspan="99">⏳ جاري تحميل جميع البيانات…</td></tr>`;
            $('tableFoot').hidden = true;
            $('loadingBar').hidden = false;
            $('loadingBar').classList.remove('cached');
            $('loadingText').textContent = 'جاري تحميل جميع البيانات…';

            try {
                await loadCapacityLookup();
                const snap = await get(ref(db, `${ROOT}/${state.current}`));

                if (!snap.exists()) {
                    $('loadingBar').hidden = true;
                    state.dataReady = true;
                    await saveToCache(state.current);
                    renderTable();
                    renderDbButtons();
                    return;
                }

                const val = snap.val();
                const keys = Object.keys(val).reverse();
                const total = keys.length;

                $('loadingText').textContent = `جاري فهرسة ${total} سجل…`;

                for (let i = 0; i < total; i += INDEX_CHUNK) {
                    const end = Math.min(i + INDEX_CHUNK, total);
                    for (let j = i; j < end; j++) {
                        const k = keys[j];
                        const rec = val[k];
                        state.records.set(k, rec);
                        state.order.push(k);
                        state.searchIndex.set(k, buildIndex(rec));
                    }
                    if (end < total) {
                        $('loadingText').textContent = `جاري فهرسة ${end} / ${total}…`;
                        await nextTick();
                    }
                }

                state.fields = deriveFields();
                state.dataReady = true;
                await saveToCache(state.current);

                $('loadingBar').hidden = true;
                renderTable();

                const capInfo = capacityState.map.size ? ` •: ${capacityState.dbName}` : '';
                toast(`✅ تم تحميل ${state.order.length} سجل${capInfo}`, 'success');
                renderDbButtons();
                notifyFiltersApplied();
            } catch (err) {
                $('loadingBar').hidden = true;
                $('tableBody').innerHTML =
                    `<tr><td class="empty-cell" colspan="99">تعذر تحميل البيانات: ${esc(err.message)}</td></tr>`;
                toast('خطأ في التحميل: ' + err.message, 'error');
            } finally {
                state.loading = false;
                setSync(false);
            }
        }

        function notifyFiltersApplied() {
            if (!hasActiveFilters()) return;
            const n = filteredKeys().length;
            toast(`🔎 تم تطبيق البحث على "${state.current.replace(/_/g, ' ')}" — ${n} نتيجة`, 'info', 2200);
        }

        /* =========================================================
           TABLE RENDER (paginated)
        ========================================================= */
        function renderTable(append = false) {
            const head = $('tableHead');
            const body = $('tableBody');
            const foot = $('tableFoot');

            const keys = filteredKeys();
            const total = state.order.length;
            const activeFilters = (state.searchQuery ? 1 : 0) + (state.subSearchQuery ? 1 : 0);

            $('loadedChip').textContent = activeFilters ? `${keys.length} / ${total}` : String(total);

            if (keys.length === 0) {
                head.innerHTML = '';
                body.innerHTML = `<tr><td class="empty-cell" colspan="99">${
                    activeFilters ? 'لا توجد نتائج مطابقة للفلاتر' : 'لا توجد بيانات في هذه القاعدة'
                }</td></tr>`;
                foot.hidden = true;
                state.renderedCount = 0;
                return;
            }

            const fields = resolveColumns();

            if (!append) {
                const h = ['<tr><th>#</th>'];
                for (const f of fields) h.push(`<th>${esc(f)}</th>`);
                h.push('<th></th></tr>');
                head.innerHTML = h.join('');
                body.innerHTML = '';
                state.renderedCount = 0;
            }

            const start = state.renderedCount;
            const end = Math.min(start + PAGE_SIZE, keys.length);
            const out = [];

            for (let i = start; i < end; i++) {
                const key = keys[i];
                const rec = state.records.get(key);
                out.push('<tr>');
                out.push(`<td class="idx">${i + 1}</td>`);

                for (const f of fields) {
                    let v;
                    if (rec && typeof rec === 'object') v = rec[f];
                    else if (f === 'value') v = rec;
                    else v = '';

                    if (f === CAPACITY_FIELD && v != null && v !== '') v = resolveCapacity(v);
                    if (v === undefined || v === null) v = '';
                    else if (typeof v === 'object') v = JSON.stringify(v);
                    else v = String(v);

                    out.push(`<td title="${esc(v)}">${esc(v)}</td>`);
                }

                out.push(
                    `<td class="actions">
                        <button class="icon-btn" data-act="edit" data-key="${esc(key)}" title="تعديل"><i class="fas fa-pen"></i></button>
                        <button class="icon-btn danger" data-act="del" data-key="${esc(key)}" title="حذف"><i class="fas fa-trash"></i></button>
                    </td>`
                );
                out.push('</tr>');
            }

            body.insertAdjacentHTML('beforeend', out.join(''));
            state.renderedCount = end;

            if (end < keys.length) {
                foot.hidden = false;
                $('loadMoreBtn').innerHTML =
                    `<i class="fas fa-chevron-down"></i> عرض المزيد (${keys.length - end} متبقي)`;
            } else foot.hidden = true;
        }

        /* =========================================================
           SEARCH HANDLERS
        ========================================================= */
        const onMainSearch = debounce(() => {
            state.searchQuery = $('searchInput').value.trim().toLowerCase();
            $('clearSearch').hidden = !state.searchQuery;
            if (state.dataReady) renderTable();
        }, SEARCH_DEBOUNCE);

        const onSubSearch = debounce(() => {
            state.subSearchQuery = $('subSearchInput').value.trim().toLowerCase();
            $('clearSubSearch').hidden = !state.subSearchQuery;
            if (state.dataReady) renderTable();
        }, SEARCH_DEBOUNCE);

        /* =========================================================
           UPLOAD
        ========================================================= */
        function resetUploadUI() {
            state.fileRows = [];
            $('fileInput').value = '';
            $('saveBtn').disabled = true;
            $('uploadStatus').textContent = '';
            $('progress').hidden = true;
            $('progressFill').style.width = '0%';
            $('previewWrap').hidden = true;
            $('previewWrap').innerHTML = '';
        }

        async function handleFile(file) {
            if (!file) return;
            try {
                $('uploadStatus').textContent = '⏳ جاري قراءة الملف…';
                const XLSX = await loadXLSX();
                const buf = await file.arrayBuffer();
                const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
                const ws = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
                state.fileRows = rows;
                renderPreview(rows);
                if (rows.length) {
                    $('uploadStatus').textContent = `✅ ${rows.length} سجل من "${file.name}" جاهز للحفظ`;
                    $('saveBtn').disabled = false;
                } else {
                    $('uploadStatus').textContent = '⚠️ الملف لا يحتوي على بيانات';
                    $('saveBtn').disabled = true;
                }
            } catch (err) {
                $('uploadStatus').textContent = '❌ ' + err.message;
                toast('خطأ: ' + err.message, 'error');
            }
        }

        function renderPreview(rows) {
            const wrap = $('previewWrap');
            if (!rows.length) { wrap.hidden = true; return; }
            const seen = new Set();
            const fields = [];
            for (const r of rows) for (const k in r) if (!seen.has(k)) { seen.add(k); fields.push(k); }
            const limit = Math.min(rows.length, 30);
            const out = ['<table><thead><tr><th>#</th>'];
            for (const f of fields) out.push(`<th>${esc(f)}</th>`);
            out.push('</tr></thead><tbody>');
            for (let i = 0; i < limit; i++) {
                const r = rows[i];
                out.push(`<tr><td class="idx">${i + 1}</td>`);
                for (const f of fields) {
                    let v = r[f] ?? '';
                    if (typeof v === 'object') v = JSON.stringify(v);
                    out.push(`<td title="${esc(v)}">${esc(v)}</td>`);
                }
                out.push('</tr>');
            }
            out.push('</tbody></table>');
            wrap.innerHTML = out.join('');
            wrap.hidden = false;
        }

        function compress(rows) {
            const out = [];
            for (const r of rows) {
                const o = {};
                for (const k in r) {
                    const key = String(k).replace(/[.#$/\[\]]/g, '_').trim();
                    if (!key) continue;
                    let v = r[k];
                    if (v === '' || v === null || v === undefined) continue;
                    if (typeof v === 'string') {
                        v = v.trim().replace(/,+$/, '');
                        if (!v) continue;
                    }
                    o[key] = v;
                }
                if (Object.keys(o).length) out.push(o);
            }
            return out;
        }

        async function saveData() {
            if (state.saving) return;
            const rows = compress(state.fileRows);
            if (!rows.length) { toast('لا توجد بيانات صالحة للحفظ', 'error'); return; }

            const target = state.uploadAny
                ? $('uploadAnyPath').value.trim().replace(/^\/+|\/+$/g, '')
                : `${ROOT}/${state.current}`;
            if (!target) { toast('يرجى إدخال المسار المستهدف', 'error'); return; }

            const confirm = await Swal.fire({
                title: 'تأكيد الحفظ',
                html: `سيتم حفظ <b>${rows.length}</b> سجل في<br><code style="font-size:.75rem">${esc(target)}</code>`,
                icon: 'question', showCancelButton: true,
                confirmButtonText: 'حفظ', cancelButtonText: 'إلغاء',
                confirmButtonColor: '#2563eb'
            });
            if (!confirm.isConfirmed) return;

            state.saving = true;
            $('saveBtn').disabled = true;
            $('progress').hidden = false;
            $('progressFill').style.width = '15%';
            $('uploadStatus').textContent = '⏳ جاري الحفظ…';
            setSync(true);
            const t0 = performance.now();

            try {
                const targetRef = ref(db, target);
                const updates = {};
                for (const r of rows) updates[push(targetRef).key] = r;
                $('progressFill').style.width = '55%';
                await update(targetRef, updates);
                $('progressFill').style.width = '100%';

                const secs = ((performance.now() - t0) / 1000).toFixed(1);
                const speed = (rows.length / Math.max(0.001, (performance.now() - t0) / 1000)).toFixed(0);
                toast(`✅ تم حفظ ${rows.length} سجل في ${secs} ثانية`, 'success');
                $('uploadStatus').textContent = `✅ تم الحفظ (${speed} سجل/ثانية)`;

                /* Invalidate both memory + IDB */
                if (!state.uploadAny && state.current) {
                    await invalidateCache(state.current);
                    preloadState.promises.delete(state.current);
                } else {
                    const tail = target.split('/').pop();
                    if (tail) {
                        await invalidateCache(tail);
                        preloadState.promises.delete(tail);
                    }
                }
                resetUploadUI();

                if (!state.uploadAny && state.current) {
                    await loadAllData({ force: true });
                    fetchCount(state.current);
                }
            } catch (err) {
                toast('فشل الحفظ: ' + err.message, 'error');
                $('uploadStatus').textContent = '❌ فشل الحفظ';
                $('saveBtn').disabled = false;
            } finally {
                state.saving = false;
                setSync(false);
                setTimeout(() => { $('progress').hidden = true; }, 700);
            }
        }

        /* =========================================================
           ADD / EDIT / DELETE
        ========================================================= */
        function currentFieldsForForm(rec) {
            if (state.current === TRF_EXTRA_DB) return TRF_EXTRA_COLUMNS.slice();
            if (state.fields.length) return state.fields;
            if (rec && typeof rec === 'object') {
                const f = Object.keys(rec);
                if (f.length) return f;
            }
            return ['value'];
        }

        function buildFormHtml(fields, rec) {
            return fields.map((f, i) => {
                const v = rec && rec[f] != null ? rec[f] : '';
                return `<div class="swal-row">
                    <label>${esc(f)}</label>
                    <input id="swf_${i}" class="swal2-input" value="${esc(v)}" placeholder="${esc(f)}">
                </div>`;
            }).join('');
        }

        function collectForm(fields) {
            const data = {};
            fields.forEach((f, i) => {
                const el = $(`swf_${i}`);
                if (el) data[f] = el.value.trim();
            });
            return data;
        }

        async function addRecordDialog() {
            if (!state.current) { toast('اختر قاعدة بيانات أولاً', 'error'); return; }
            const fields = currentFieldsForForm(null);

            const res = await Swal.fire({
                title: 'إضافة سجل جديد',
                html: buildFormHtml(fields, null),
                width: 520, showCancelButton: true,
                confirmButtonText: 'حفظ', cancelButtonText: 'إلغاء',
                confirmButtonColor: '#2563eb',
                preConfirm: () => {
                    const data = collectForm(fields);
                    if (!data[fields[0]]) {
                        Swal.showValidationMessage(`الحقل "${fields[0]}" مطلوب`);
                        return false;
                    }
                    return data;
                }
            });
            if (!res.isConfirmed) return;

            try {
                setSync(true);
                const collectionRef = ref(db, `${ROOT}/${state.current}`);
                await set(push(collectionRef), res.value);
                toast('✅ تمت إضافة السجل', 'success');
                await invalidateCache(state.current);
                preloadState.promises.delete(state.current);
                await loadAllData({ force: true });
                fetchCount(state.current);
            } catch (err) {
                toast('خطأ: ' + err.message, 'error');
            } finally {
                setSync(false);
            }
        }

        async function editRecordDialog(key) {
            const rec = state.records.get(key);
            if (!rec) return;
            const fields = currentFieldsForForm(rec);

            const res = await Swal.fire({
                title: 'تعديل سجل',
                html: buildFormHtml(fields, rec),
                width: 520, showCancelButton: true,
                confirmButtonText: 'تحديث', cancelButtonText: 'إلغاء',
                confirmButtonColor: '#f59e0b',
                preConfirm: () => {
                    const data = collectForm(fields);
                    if (!data[fields[0]]) {
                        Swal.showValidationMessage(`الحقل "${fields[0]}" مطلوب`);
                        return false;
                    }
                    return data;
                }
            });
            if (!res.isConfirmed) return;

            try {
                setSync(true);
                await set(ref(db, `${ROOT}/${state.current}/${key}`), res.value);
                state.records.set(key, res.value);
                state.searchIndex.set(key, buildIndex(res.value));
                await saveToCache(state.current);
                renderTable();
                toast('✅ تم تحديث السجل', 'success');
            } catch (err) {
                toast('خطأ: ' + err.message, 'error');
            } finally {
                setSync(false);
            }
        }

        async function deleteRecordDialog(key) {
            const res = await Swal.fire({
                title: 'تأكيد الحذف',
                text: 'لا يمكن التراجع عن هذه العملية',
                icon: 'warning', showCancelButton: true,
                confirmButtonText: 'حذف', cancelButtonText: 'إلغاء',
                confirmButtonColor: '#ef4444'
            });
            if (!res.isConfirmed) return;

            try {
                setSync(true);
                await remove(ref(db, `${ROOT}/${state.current}/${key}`));
                state.records.delete(key);
                state.searchIndex.delete(key);
                const idx = state.order.indexOf(key);
                if (idx > -1) state.order.splice(idx, 1);
                await saveToCache(state.current);
                renderTable();
                toast('✅ تم حذف السجل', 'success');
                fetchCount(state.current);
            } catch (err) {
                toast('خطأ: ' + err.message, 'error');
            } finally {
                setSync(false);
            }
        }

        /* =========================================================
           EXPORT
        ========================================================= */
        async function exportExcel() {
            const keys = filteredKeys();
            if (!keys.length) { toast('لا توجد بيانات للتصدير', 'error'); return; }
            try {
                const XLSX = await loadXLSX();
                const fields = resolveColumns();
                const data = keys.map(k => {
                    const rec = state.records.get(k);
                    const row = { _key: k };
                    if (rec && typeof rec === 'object') {
                        for (const f of fields) {
                            let v = rec[f] ?? '';
                            if (f === CAPACITY_FIELD && v !== '') v = resolveCapacity(v);
                            row[f] = v;
                        }
                    } else row.value = rec;
                    return row;
                });
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Data');
                XLSX.writeFile(wb, `${state.current || 'data'}_${new Date().toISOString().slice(0, 10)}.xlsx`);
                toast(`✅ تم تصدير ${data.length} سجل`, 'success');
            } catch (err) { toast('خطأ: ' + err.message, 'error'); }
        }

        /* =========================================================
           EVENT WIRING
        ========================================================= */
        $('dbButtons').addEventListener('click', e => {
            const btn = e.target.closest('.db-btn');
            if (btn) selectDb(btn.dataset.db);
        });

        $('refreshDbs').addEventListener('click', () => {
            /* لا نحذف الكاش — فقط نحدّث قائمة الأسماء + نشغّل التحميل المسبق للناقص */
            state.counts = {};
            preloadState.promises.clear();
            preloadState.done = 0;
            preloadState.total = 0;
            preloadState.running = false;
            updatePreloadChip();
            loadReferenceDatabases();
        });

        $('tableBody').addEventListener('click', e => {
            const btn = e.target.closest('button[data-act]');
            if (!btn) return;
            const key = btn.dataset.key;
            if (btn.dataset.act === 'edit') editRecordDialog(key);
            else deleteRecordDialog(key);
        });

        $('addBtn').addEventListener('click', addRecordDialog);
        $('exportBtn').addEventListener('click', exportExcel);

        /* ✅ Individual DB force refresh: clears memory + IDB for current DB */
        $('reloadBtn').addEventListener('click', async () => {
            if (!state.current) return;
            cache.delete(state.current);
            cacheTimestamps.delete(state.current);
            preloadState.promises.delete(state.current);
            await deleteDbFromIDB(state.current);
            await loadAllData({ force: true });
        });

        $('loadMoreBtn').addEventListener('click', () => renderTable(true));

        $('searchInput').addEventListener('input', onMainSearch);
        $('searchInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                state.searchQuery = e.target.value.trim().toLowerCase();
                $('clearSearch').hidden = !state.searchQuery;
                if (state.dataReady) renderTable();
            }
        });
        $('clearSearch').addEventListener('click', () => {
            $('searchInput').value = '';
            state.searchQuery = '';
            $('clearSearch').hidden = true;
            renderTable();
        });

        $('subSearchInput').addEventListener('input', onSubSearch);
        $('subSearchInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                state.subSearchQuery = e.target.value.trim().toLowerCase();
                $('clearSubSearch').hidden = !state.subSearchQuery;
                if (state.dataReady) renderTable();
            }
        });
        $('clearSubSearch').addEventListener('click', () => {
            $('subSearchInput').value = '';
            state.subSearchQuery = '';
            $('clearSubSearch').hidden = true;
            renderTable();
        });

        const dropzone = $('dropzone');
        dropzone.addEventListener('click', () => $('fileInput').click());
        ['dragenter', 'dragover'].forEach(ev =>
            dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('over'); })
        );
        ['dragleave', 'drop'].forEach(ev =>
            dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('over'); })
        );
        dropzone.addEventListener('drop', e => {
            const f = e.dataTransfer.files[0];
            if (f) handleFile(f);
        });

        $('fileInput').addEventListener('change', e => {
            const f = e.target.files[0];
            if (f) handleFile(f);
        });

        $('saveBtn').addEventListener('click', saveData);
        $('clearBtn').addEventListener('click', resetUploadUI);

        /* =========================================================
           BOOT
        ========================================================= */
        loadReferenceDatabases();
    </script>
</body>

</html>
