<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Date Cleaner · Multi‑Column + Format</title>
    <!-- SheetJS (xlsx.full.min.js) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --primary: #107c41;
            --primary-hover: #0b592e;
            --accent: #4f46e5;
            --bg: #f4f7f6;
            --card: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
        }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: var(--card);
            max-width: 1300px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .nav-container {
            padding: 20px 24px 0 24px;
        }
        .back-link {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #2563eb;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }
        .back-link:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -2px rgba(37, 99, 235, 0.3);
        }
        .header {
            padding: 16px 24px 20px 24px;
            background: #fff;
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            margin: 8px 0 0 0;
            font-size: 1.6rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header p {
            margin: 6px 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .content {
            padding: 24px;
        }
        /* Upload area */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.2s ease;
            background: #fafcfa;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            border-color: var(--primary);
            background: #eef7f2;
        }
        .upload-area i {
            font-size: 42px;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .upload-label {
            font-weight: 600;
            color: var(--primary);
            display: inline-block;
            cursor: pointer;
            font-size: 1rem;
        }
        #fileInput {
            display: none;
        }
        .file-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        .badge {
            background: #e2e8f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        /* Controls */
        .control-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            align-items: end;
        }
        .control-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-muted);
        }
        select, button {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            background: white;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            grid-column: 1 / -1;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .convert-btn {
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .convert-btn:hover {
            background: #4338ca;
        }
        .export-btn {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .export-btn:hover {
            background: var(--primary-hover);
        }
        .reset-btn {
            background: white;
            color: #ef4444;
            border: 1px solid #ef4444;
            cursor: pointer;
            font-weight: 600;
        }
        .reset-btn:hover {
            background: #fee2e2;
        }
        .format-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .format-selector label {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
        }
        .format-selector select {
            border: none;
            padding: 6px 4px;
            font-weight: 500;
            width: auto;
            background: transparent;
        }
        /* Table */
        .table-wrapper {
            overflow-x: auto;
            max-height: 450px;
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th {
            position: sticky;
            top: 0;
            background: #f8fafc;
            padding: 12px 10px;
            text-align: left;
            border-bottom: 2px solid var(--border);
            z-index: 2;
            font-weight: 600;
        }
        td {
            padding: 10px 10px;
            border-bottom: 1px solid var(--border);
        }
        tr:hover {
            background-color: #f8fafc;
        }
        .converted-col {
            background-color: #f0fdf4;
            font-weight: 600;
            color: #0b5e2e;
        }
        .converted-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .tag {
            background: #dcfce7;
            color: #166534;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .status-msg {
            margin: 15px 0;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            background: #e0f2fe;
            color: #0369a1;
        }
        .error-msg {
            background: #fee2e2;
            color: #b91c1c;
        }
        @media (max-width: 700px) {
            .control-bar {
                grid-template-columns: 1fr;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="nav-container">
        <a href="#" class="back-link" onclick="alert('Home page integration'); return false;">
            <i class="fas fa-arrow-left"></i> Return to Home
        </a>
    </div>

    <div class="header">
        <h1><i class="fas fa-calendar-alt" style="color: var(--primary);"></i> Multi‑Column Date Converter</h1>
        <p>Fix Excel numeric dates (e.g., 46044) and batch‑convert multiple columns. Choose output format.</p>
    </div>

    <div class="content">
        <div class="upload-area" id="uploadArea">
            <i class="fas fa-cloud-upload-alt"></i>
            <div class="upload-label">📂 Click or Drag Excel File Here</div>
            <input type="file" id="fileInput" accept=".xlsx, .xls, .xlsm, .csv">
            <div id="filePreview" class="file-preview" style="display: none;">
                <b id="fileNameSpan"></b>
                <span class="badge" id="rowCountBadge"></span>
                <span class="badge" id="sizeBadge"></span>
            </div>
        </div>

        <div id="controlsPanel" style="display: none;">
            <div class="control-bar">
                <div class="control-group">
                    <label><i class="fas fa-columns"></i> Select Column</label>
                    <select id="columnSelect"></select>
                </div>
                <div class="control-group">
                    <label><i class="fas fa-calendar"></i> Output Format</label>
                    <select id="dateFormatSelect">
                        <option value="DD/MM/YYYY">DD/MM/YYYY (31/12/2026)</option>
                        <option value="MM/DD/YYYY">MM/DD/YYYY (12/31/2026)</option>
                        <option value="YYYY/MM/DD">YYYY/MM/DD (2026/12/31)</option>
                        <option value="DD-MM-YYYY">DD-MM-YYYY (31-12-2026)</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button id="convertBtn" class="convert-btn"><i class="fas fa-check"></i> Apply Conversion</button>
                    <button id="exportBtn" class="export-btn"><i class="fas fa-file-download"></i> Download Excel</button>
                    <button id="resetBtn" class="reset-btn"><i class="fas fa-undo-alt"></i> Reset All</button>
                </div>
            </div>

            <div id="convertedColumnsList" style="display: none; margin-bottom: 16px;">
                <small><b>Converted columns:</b></small>
                <div id="convertedTags" class="converted-tags"></div>
            </div>
        </div>

        <div id="infoMessage" class="status-msg"><i class="fas fa-info-circle"></i> Waiting for file upload...</div>

        <div id="tableContainer" style="display: none;">
            <div class="table-wrapper">
                <table id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div id="previewInfo" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 10px;"></div>
        </div>
    </div>
</div>

<script>
    (function() {
        let headers = [];
        let masterData = [];
        let originalDataBackup = [];
        let convertedColumns = new Map();
        let originalFileName = "data";

        const fileInput = document.getElementById('fileInput');
        const columnSelect = document.getElementById('columnSelect');
        const infoMsg = document.getElementById('infoMessage');
        const tableHead = document.getElementById('tableHead');
        const tableBody = document.getElementById('tableBody');
        const controlsPanel = document.getElementById('controlsPanel');
        const tableContainer = document.getElementById('tableContainer');
        const uploadArea = document.getElementById('uploadArea');
        const convertBtn = document.getElementById('convertBtn');
        const exportBtn = document.getElementById('exportBtn');
        const resetBtn = document.getElementById('resetBtn');
        const dateFormatSelect = document.getElementById('dateFormatSelect');
        const filePreview = document.getElementById('filePreview');
        const fileNameSpan = document.getElementById('fileNameSpan');
        const rowCountBadge = document.getElementById('rowCountBadge');
        const sizeBadge = document.getElementById('sizeBadge');
        const convertedTags = document.getElementById('convertedTags');
        const convertedColumnsList = document.getElementById('convertedColumnsList');

        // Accurately convert Excel serial number to JS Date (Epoch: Dec 30, 1899)
        function excelSerialToDate(serial) {
            let num = Number(serial);
            if (isNaN(num) || num <= 0) return null;
            
            // Excel epoch starts December 30, 1899
            const excelEpoch = new Date(Date.UTC(1899, 11, 30));
            const convertedMs = excelEpoch.getTime() + (num * 86400000);
            return new Date(convertedMs);
        }

        function formatDate(date, format) {
            if (!date || isNaN(date.getTime())) return null;
            const d = String(date.getUTCDate()).padStart(2, '0');
            const m = String(date.getUTCMonth() + 1).padStart(2, '0');
            const y = date.getUTCFullYear();
            
            if (format === "MM/DD/YYYY") return `${m}/${d}/${y}`;
            if (format === "YYYY/MM/DD") return `${y}/${m}/${d}`;
            if (format === "DD-MM-YYYY") return `${d}-${m}-${y}`;
            return `${d}/${m}/${y}`;
        }

        function parseDateValue(val, format) {
            if (val === null || val === undefined || val === '') return '';

            const s = String(val).trim();
            if (s === '') return '';

            // Handle string or numeric Excel serials (e.g. 46044 or "46044")
            const num = Number(s);
            if (!isNaN(num) && num > 10000 && num < 100000) {
                const d = excelSerialToDate(num);
                if (d) return formatDate(d, format);
            }

            // Handle YYYY-MM-DD or YYYY/MM/DD
            let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
            if (m) {
                const d = new Date(Date.UTC(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3])));
                if (!isNaN(d)) return formatDate(d, format);
            }

            // Handle DD-MM-YYYY or DD/MM/YYYY
            m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
            if (m) {
                const d = new Date(Date.UTC(parseInt(m[3]), parseInt(m[2]) - 1, parseInt(m[1])));
                if (!isNaN(d)) return formatDate(d, format);
            }

            return s;
        }

        function updateUI() {
            columnSelect.innerHTML = headers.map((h, i) =>
                `<option value="${i}">${h} ${convertedColumns.has(i) ? '✓' : ''}</option>`
            ).join('');

            convertedTags.innerHTML = '';
            convertedColumns.forEach((fmt, idx) => {
                const span = document.createElement('span');
                span.className = 'tag';
                span.textContent = `${headers[idx]} (${fmt})`;
                convertedTags.appendChild(span);
            });
            convertedColumnsList.style.display = convertedColumns.size ? 'block' : 'none';

            renderTable();
        }

        function renderTable() {
            const preview = masterData.slice(0, 15);
            tableHead.innerHTML = `<tr>${headers.map((h, i) =>
                `<th class="${convertedColumns.has(i) ? 'converted-col' : ''}">${h}</th>`).join('')}</tr>`;

            tableBody.innerHTML = preview.map(row =>
                `<tr>${row.map((cell, i) => 
                    `<td class="${convertedColumns.has(i) ? 'converted-col' : ''}">${cell}</td>`
                ).join('')}</tr>`
            ).join('');

            tableContainer.style.display = "block";
            document.getElementById('previewInfo').textContent = `Showing first ${preview.length} of ${masterData.length} rows.`;
        }

        function handleFile(file) {
            if (!file) return;
            originalFileName = file.name.split('.')[0] || 'data';
            fileNameSpan.textContent = file.name;
            sizeBadge.textContent = (file.size / 1024).toFixed(1) + " KB";
            filePreview.style.display = "flex";

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    // Use cellDates: false & raw: true to maintain numerical serials correctly
                    const workbook = XLSX.read(data, { type: 'array', cellDates: false });
                    const ws = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });

                    if (rows.length === 0) {
                        infoMsg.textContent = "⚠️ File is empty.";
                        infoMsg.classList.add('error-msg');
                        return;
                    }
                    headers = rows[0] || [];
                    masterData = rows.slice(1).map(r => [...r]);
                    originalDataBackup = masterData.map(r => [...r]);
                    convertedColumns.clear();

                    rowCountBadge.textContent = masterData.length + " rows";
                    controlsPanel.style.display = "block";
                    updateUI();
                    infoMsg.textContent = "✅ File loaded. Select a column and format, then click 'Apply Conversion'.";
                    infoMsg.classList.remove('error-msg');
                } catch (err) {
                    infoMsg.textContent = "❌ Error reading file: " + err.message;
                    infoMsg.classList.add('error-msg');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        uploadArea.onclick = () => fileInput.click();

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--primary)';
            uploadArea.style.background = '#eef7f2';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = 'var(--border)';
            uploadArea.style.background = '#fafcfa';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--border)';
            uploadArea.style.background = '#fafcfa';
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        convertBtn.onclick = function() {
            if (!masterData.length || !headers.length) {
                infoMsg.textContent = "⚠️ Please load a file first.";
                infoMsg.classList.add('error-msg');
                return;
            }
            const idx = parseInt(columnSelect.value);
            if (isNaN(idx) || idx < 0 || idx >= headers.length) {
                infoMsg.textContent = "⚠️ Invalid column selected.";
                return;
            }
            const fmt = dateFormatSelect.value;

            let convertedCount = 0;
            masterData.forEach((row) => {
                const val = row[idx];
                const formatted = parseDateValue(val, fmt);
                if (formatted !== String(val)) {
                    row[idx] = formatted;
                    convertedCount++;
                }
            });

            convertedColumns.set(idx, fmt);
            updateUI();
            infoMsg.textContent = `✅ Converted column "${headers[idx]}" to ${fmt} (${convertedCount} cells modified).`;
            infoMsg.classList.remove('error-msg');
        };

        resetBtn.onclick = function() {
            if (!originalDataBackup.length) {
                infoMsg.textContent = "⚠️ No data to reset.";
                return;
            }
            if (confirm("Revert all changes to original?")) {
                masterData = originalDataBackup.map(r => [...r]);
                convertedColumns.clear();
                updateUI();
                infoMsg.textContent = "↩️ Reset to original data.";
                infoMsg.classList.remove('error-msg');
            }
        };

        exportBtn.onclick = function() {
            if (!masterData.length || !headers.length) {
                infoMsg.textContent = "⚠️ No data to export.";
                return;
            }
            const ws = XLSX.utils.aoa_to_sheet([headers, ...masterData]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Converted");
            XLSX.writeFile(wb, `${originalFileName}_fixed.xlsx`);
            infoMsg.textContent = `✅ Exported as ${originalFileName}_fixed.xlsx`;
        };

    })();
</script>
</body>
</html>
