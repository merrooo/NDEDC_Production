<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل وحصر العدادات والمحولات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-dark: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-right: 6px solid var(--primary);
            position: relative;
            overflow: hidden;
            flex-wrap: wrap;
            gap: 15px;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.06) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .header-icon {
            width: 52px;
            height: 52px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .header-title h1 {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-title .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .location-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.06);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .location-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e2e8f0;
            font-size: 0.9rem;
        }

        .location-item .label {
            color: #94a3b8;
            font-weight: 400;
        }

        .location-item .value {
            color: #ffffff;
            font-weight: 600;
            background: rgba(37, 99, 235, 0.25);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .location-divider {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
        }

        .location-item .value.sector {
            background: rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
        }

        .location-item .value.district {
            background: rgba(37, 99, 235, 0.25);
            color: #93c5fd;
        }

        .location-icon {
            font-size: 0.8rem;
        }

        .sector-icon {
            color: #6ee7b7;
        }

        .district-icon {
            color: #93c5fd;
        }

        .session-timer-default {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border-color: rgba(255, 255, 255, 0.06);
        }

        .required-marker {
            color: red;
        }

        .common-fields {
            margin-top: 20px;
            border-top: 2px solid var(--border-color);
            padding-top: 20px;
        }

        .cancel-edit-button {
            display: none;
        }

        .records-count {
            font-weight: bold;
            color: var(--secondary);
        }

        .page-indicator {
            font-size: 0.85rem;
            color: var(--secondary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .sync-status {
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .sync-status.loading {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.2);
        }

        .btn-back {
            background: rgba(37, 99, 235, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(37, 99, 235, 0.3);
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: rgba(37, 99, 235, 0.35);
            transform: translateY(-1px);
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 992px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
        }

        .card-inner {
            background: #f8fafc;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .card-inner .card-title {
            font-size: 1rem;
            color: var(--text-dark);
            border-bottom-color: var(--border-color);
            margin-bottom: 15px;
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
        }

        .form-group input,
        .form-group select {
            padding: 8px 10px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
        }

        .form-group input:disabled,
        .form-group select:disabled {
            background-color: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #cbd5e1;
        }

        .form-group input.duplicate {
            border-color: var(--danger);
            background-color: #fef2f2;
        }

        .form-group input.valid {
            border-color: var(--success);
        }

        .warning-msg {
            color: var(--danger);
            font-size: 0.7rem;
            display: none;
            margin-top: 2px;
        }

        .warning-msg.show {
            display: block;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .btn-excel {
            background-color: #10b981;
            color: white;
        }

        .btn-excel:hover {
            background-color: #059669;
        }

        #statusMessage {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
        }

        #statusMessage.info {
            display: block;
            background-color: #e0f2fe;
            color: #0369a1;
        }

        #statusMessage.success {
            display: block;
            background-color: #d1fae5;
            color: #065f46;
        }

        #statusMessage.error {
            display: block;
            background-color: #fee2e2;
            color: #991b1b;
        }

        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            min-height: 250px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            text-align: right;
            white-space: nowrap;
        }

        th {
            background-color: #f1f5f9;
            color: #334155;
            padding: 8px 10px;
            font-weight: 700;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 6px 10px;
            border-bottom: 1px solid var(--border-color);
            color: #334155;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        tr.editing {
            background-color: #fef3c7;
        }

        .th-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .filter-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary);
            font-size: 0.75rem;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            color: var(--primary);
            background: #dbeafe;
        }

        .filter-popover {
            display: none;
            position: absolute;
            background: white;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 12px;
            z-index: 100;
            width: 280px;
            max-height: 380px;
            overflow-y: auto;
            text-align: right;
        }

        .filter-popover.show {
            display: block;
        }

        .filter-search-input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            outline: none;
        }

        .filter-search-input:focus {
            border-color: var(--primary);
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: normal;
            cursor: pointer;
        }

        .filter-option.hidden {
            display: none;
        }

        .filter-actions {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            margin-top: 8px;
        }

        .date-picker-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
        }

        .date-picker-group label {
            font-size: 0.8rem;
            color: var(--secondary);
            font-weight: 600;
        }

        .date-picker-group input[type="date"] {
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            width: 100%;
            text-align: center;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-type {
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .badge-a45 {
            background-color: #dcfce7;
            color: #15803d;
        }

        .badge-a123 {
            background-color: #e0e7ff;
            color: #4338ca;
        }

        .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-edit-sm {
            background-color: #fef3c7;
            color: #b45309;
        }

        .btn-edit-sm:hover {
            background-color: #fde68a;
        }

        .btn-delete-sm {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .btn-delete-sm:hover {
            background-color: #fca5a5;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--secondary);
            font-size: 1rem;
        }

        .debug-info {
            font-size: 0.7rem;
            color: #475569;
            margin-top: 2px;
            direction: ltr;
            text-align: left;
        }

        .date-picker-wrapper {
            position: relative;
            direction: ltr;
        }

        .date-picker-wrapper input {
            padding-left: 40px;
            width: 100%;
        }

        .date-picker-wrapper .date-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary);
            pointer-events: none;
        }

        .date-display {
            font-size: 0.8rem;
            color: var(--secondary);
            margin-top: 2px;
            text-align: right;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .pagination-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .na {
            color: #94a3b8;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .table-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .action-btns {
                justify-content: center;
            }
        }

        @media (max-width: 600px) {
            .location-badge {
                flex-direction: column;
                align-items: center;
                gap: 6px;
                border-radius: 16px;
            }

            .location-item {
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="header-left">
                <div class="header-icon"><i class="fas fa-bolt"></i></div>
                <div class="header-title">
                    <h1>تسجيل التركيبات</h1>
                    <div class="subtitle">العدادات الذكية (A4 - A5)</div>
                </div>
            </div>
            <div class="location-badge">
                <div class="location-item">
                    <i class="fas fa-layer-group location-icon sector-icon"></i>
                    <span class="label">القطاع</span>
                    <span class="value sector" id="sectorNameDisplay">جاري التحميل...</span>
                </div>
                <div class="location-divider"></div>
                <div class="location-item">
                    <i class="fas fa-building location-icon district-icon"></i>
                    <span class="label">الهندسة</span>
                    <span class="value district" id="districtNameDisplay">جاري التحميل...</span>
                </div>
            </div>
            <div class="header-actions">
                <span id="sessionTimer" class="sync-status session-timer-default">⏱ 05:00</span>
                <span id="syncStatus" class="sync-status loading">⏳ جاري الاتصال...</span>
                <button class="btn-back" onclick="goBack()"><i class="fas fa-arrow-right"></i> رجوع</button>
            </div>
        </header>

        <div id="statusMessage"></div>
        <input type="hidden" id="keta3_code">
        <input type="hidden" id="handsa_code">
        <input type="hidden" id="editingKey">

        <div class="card" id="dataForm">
            <div class="card-title"><i class="fas fa-edit"></i> تسجيل البيانات</div>

            <div class="card-grid">
                <!-- Facility Card -->
                <div class="card-inner">
                    <div class="card-title"><i class="fas fa-building"></i> بيانات المحول (Facility)</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>facility <span class="required-marker">*</span></label>
                            <input type="text" id="facility" list="transformersList"
                                placeholder="اختر أو أدخل اسم المحول">
                            <datalist id="transformersList"></datalist>
                        </div>
                        <div class="form-group">
                            <label>facility_code <span class="required-marker">*</span></label>
                            <input type="text" id="facility_code" list="transCodeList" placeholder="كود المحول">
                            <datalist id="transCodeList"></datalist>
                            <span class="warning-msg" id="facilityCodeWarning"></span>
                        </div>
                        <div class="form-group">
                            <label>facility_capacity</label>
                            <input type="text" id="facility_capacity" placeholder="مثال: 500">
                        </div>
                        <div class="form-group">
                            <label>facility_type</label>
                            <select id="facility_type" title="نوع المحول" aria-label="نوع المحول">
                                <option value="Transformer">Transformer</option>
                                <option value="Transformer-P">Transformer-P</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>meter_type</label>
                            <select id="meter_type" title="نوع العداد" aria-label="نوع العداد">
                                <option value="A4" selected>A4</option>
                                <option value="A5">A5</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Feeder Card -->
                <div class="card-inner">
                    <div class="card-title"><i class="fas fa-code-branch"></i> بيانات التغذية (Feeder)</div>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>مصدر تغذية المحول <span class="required-marker">*</span></label>
                            <select id="feedSource" title="مصدر تغذية المحول" aria-label="مصدر تغذية المحول">
                                <option value="" disabled selected>اختر مصدر التغذية</option>
                                <option value="dp">المحول مغذي من لوحة التوزيع</option>
                                <option value="station">المحول مغذي من محطة المحولات</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>feeder</label>
                            <input type="text" id="feeder" list="feedersList" placeholder="اسم المغذي" disabled>
                            <datalist id="feedersList"></datalist>
                        </div>
                        <div class="form-group">
                            <label>feeder_code</label>
                            <input type="text" id="feeder_code" list="feederCodeList" placeholder="كود المغذي" disabled>
                            <datalist id="feederCodeList"></datalist>
                            <span class="warning-msg" id="feederCodeWarning"></span>
                        </div>
                        <div class="form-group">
                            <label>dp</label>
                            <input type="text" id="dp" list="panelsList" placeholder="لوحة التوزيع" disabled>
                            <datalist id="panelsList"></datalist>
                            <div id="panelDebug" class="debug-info"></div>
                        </div>
                        <div class="form-group">
                            <label>sub_name</label>
                            <input type="text" id="sub_name" list="stationsList" placeholder="اسم المحطة" disabled>
                            <datalist id="stationsList"></datalist>
                            <div id="stationDebug" class="debug-info"></div>
                        </div>
                        <div class="form-group">
                            <label>sub_code</label>
                            <input type="text" id="sub_code" list="stationCodeList" placeholder="كود المحطة" disabled>
                            <datalist id="stationCodeList"></datalist>
                            <span class="warning-msg" id="stationCodeWarning"></span>
                        </div>
                        <div class="form-group">
                            <label>feeder_outgoing</label>
                            <input type="text" id="feeder_outgoing" list="outgoingList" placeholder="مغذي الخروج"
                                disabled>
                            <datalist id="outgoingList"></datalist>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Common Fields -->
            <div class="common-fields">
                <div class="form-grid">
                    <div class="form-group">
                        <label>meter_number <span class="required-marker">*</span></label>
                        <input type="text" id="meter_number" maxlength="8" placeholder="أدخل 8 أرقام">
                        <span class="warning-msg" id="meterNumberWarning"></span>
                    </div>
                    <div class="form-group">
                        <label>sim_number</label>
                        <input type="text" id="sim_number" maxlength="19" list="simList" placeholder="أدخل 19 رقم">
                        <datalist id="simList"></datalist>

            if (!dateStr || dateStr === 'N/A') return 'N/A';
            let parts = String(dateStr).split(/[\/\-]/);
            if (parts.length === 3) {
                if (parts[0].length === 4) {

        function parseDate(str) {
            if (!str) return null;
            if (!isNaN(str) && Number(str) > 10000) {
                const epoch = new Date(1899, 11, 30);
                return new Date(epoch.getTime() + Number(str) * 86400000);
            }
            const parts = String(str).split(/[\/\-]/);
            if (parts.length === 3) {
                let d, m, y;
                if (parts[0].length === 4) {
                    y = parseInt(parts[0], 10);
                    m = parseInt(parts[1], 10) - 1;
                    d = parseInt(parts[2], 10);
                } else {
                    d = parseInt(parts[0], 10);
                    m = parseInt(parts[1], 10) - 1;
                    y = parseInt(parts[2], 10);
                }
                return new Date(y, m, d);
            }
            return null;

            const feedSourceVal = document.getElementById('feedSource').value;

            const subName = document.getElementById('sub_name');

            const clearAndDisable = (el) => {
                if (!el) return;
                el.value = '';
                el.disabled = true;
                el.classList.remove('valid', 'duplicate');
            };
            const enable = (el) => { if (el) el.disabled = false; };

            if (!feedSourceVal) {
                [feeder, feederCode, dp, subName, subCode, feederOutgoing].forEach(clearAndDisable);
                renderFeedersList();
                renderOutgoingList();
                checkValidation();
                return;
            }

            if (feedSourceVal === 'dp') {
                enable(dp);
                enable(feeder);
                enable(feederCode);
                clearAndDisable(subName);
                clearAndDisable(subCode);
                clearAndDisable(feederOutgoing);

        async function fetchTransformersDropdown() {
            const [trfSnap, extraSnap] = await Promise.all([
                get(ref(db, 'reference_data/trf_code')),
                get(ref(db, 'reference_data/trf_code_extra'))
            ]);

            const nameDatalist = document.getElementById('transformersList');
            const codeDatalist = document.getElementById('transCodeList');
            if (nameDatalist) nameDatalist.innerHTML = '';
            if (codeDatalist) codeDatalist.innerHTML = '';

            transformersMap = {};
            transformersReverseMap = {};
            transformersDataMap = {};
            rawTransformers = [];

            const trfList = trfSnap.exists() ? (Array.isArray(trfSnap.val()) ? trfSnap.val() : Object.values(trfSnap.val())) : [];
            const extraList = extraSnap.exists() ? (Array.isArray(extraSnap.val()) ? extraSnap.val() : Object.values(extraSnap.val())) : [];

            const nameOf = (it) => {
                if (!it) return [];
                return [it.trf_name, it.cell_name, it.cellName, it["اسم المحول"], it.name, it.trf].map(norm).filter(Boolean);
            };
            const codeOf = (it) => {
                if (!it) return [];
                return [it.trf_code, it.facility_code, it.cell_code, it.cellCode, it.cell, it["كود المحول"], it.code].map(norm).filter(Boolean);
            };

            const extraByName = {};
            const extraByCode = {};
            extraList.forEach(item => {
                if (!item) return;
                nameOf(item).forEach(n => { if (!extraByName[n]) extraByName[n] = item; });
                codeOf(item).forEach(c => { if (!extraByCode[c]) extraByCode[c] = item; });
            });

            const combinedList = [];
            const usedExtra = new Set();

            trfList.forEach(trfItem => {
                if (!trfItem) return;
                const names = nameOf(trfItem);
                const codes = codeOf(trfItem);
                let extraItem = null;
                for (const n of names) { if (extraByName[n]) { extraItem = extraByName[n]; break; } }
                if (!extraItem) for (const c of codes) { if (extraByCode[c]) { extraItem = extraByCode[c]; break; } }
                if (extraItem) usedExtra.add(extraItem);
                combinedList.push({ item: trfItem, fallback: extraItem || {} });
            });

            extraList.forEach(extraItem => {
                if (!extraItem || usedExtra.has(extraItem)) return;
                combinedList.push({ item: extraItem, fallback: extraItem });
            });

            const pickCapacity = (obj) => {
                if (!obj) return '';
                return pick(obj.trf_capacity, obj.facility_capacity, obj.capacity, obj.trf_cap, obj.kva, obj["سعة المحول"], obj["السعة"], obj["سعة"], obj.capacity_kva, obj.cap, obj.transformer_capacity, obj.trfCapacity);
            };
            const pickAddress = (obj) => {
                if (!obj) return '';
                return pick(obj.trf_adress, obj.trf_address, obj.address, obj.adress, obj.trf_adr, obj["عنوان المحول"], obj["العنوان"], obj["عنوان"], obj.location, obj.trfLocation);
            };
            const pickCellName = (obj) => {
                if (!obj) return '';
                return pick(obj.cell_name, obj.cellName, obj.feeder, obj.feeder_name);
            };

            combinedList.forEach(({ item, fallback }) => {
                if (!item || !matchesHandsa(item)) return;
                const name = pick(...nameOf(item));
                const code = pick(...codeOf(item));
                if (!name) return;

                const capacity = pickCapacity(item) || pickCapacity(fallback);
                const adress = pickAddress(item) || pickAddress(fallback);
                const cellName = pickCellName(item) || pickCellName(fallback);
                const lat = pick(item.lat, item.latitude, fallback.lat, fallback.latitude);
                const lng = pick(item.lng, item.longitude, fallback.lng, fallback.longitude);

                const details = { name, code, capacity, lat, lng, adress, cellName, raw: { ...fallback, ...item } };

                if (transformersDataMap[name]) {
                    const existing = transformersDataMap[name];
                    if (!existing.capacity && capacity) existing.capacity = capacity;
                    if (!existing.adress && adress) existing.adress = adress;
                    if (!existing.cellName && cellName) existing.cellName = cellName;
                    return;
                }

                transformersMap[name] = code;
                transformersDataMap[name] = details;
                if (code) {
                    transformersReverseMap[code] = name;
                    transformersDataMap[code] = details;
                }
                rawTransformers.push(details);

                if (nameDatalist) {
                    const nameOpt = document.createElement('option');
                    nameOpt.value = name;
                    nameDatalist.appendChild(nameOpt);
                }
                if (code && codeDatalist) {
                    const codeOpt = document.createElement('option');
                    codeOpt.value = code;
                    codeDatalist.appendChild(codeOpt);
                }
            });
        }

        function loadRecords() {
            const recordsRef = ref(db, `sectors/${keta3_code}/districts/${handsa_code}/manual_entries`);
            onValue(recordsRef, (snapshot) => {
                const rawData = snapshot.val() || {};
                const filtered = {};
                Object.keys(rawData).forEach(key => {
                    const rec = rawData[key];
                    const meterType = norm(rec["meter_type"] || '');
                    if (ALLOWED_TYPES.some(type => type.toUpperCase() === meterType.toUpperCase())) {
                        filtered[key] = rec;
                    }
                });
                allRecords = filtered;
                existingMeters.clear();
                existingSims.clear();
                Object.values(allRecords).forEach(record => {
                    const meterNum = record["meter_number"] || '';
                    const simNum = record["sim_number"] || '';
                    if (meterNum) existingMeters.add(norm(meterNum));
                    if (simNum) existingSims.add(norm(simNum));
                });
                applyFilters();
                document.getElementById('recordsCount').textContent = `${Object.keys(allRecords).length} سجل`;
                checkValidation();
                updateSyncStatus(false);
            });
        }

        function applyFilters() {
            filteredKeysList = Object.keys(allRecords).filter(key => {
                const record = allRecords[key];
                for (const col of COLUMNS) {
                    if (col.isDate) {
                        const dateFilter = activeColumnFilters[col.key];
                        if (dateFilter) {
                            const recTimestamp = parseToTimestamp(getRecordValue(record, col));
                            if (!recTimestamp) return false;
                            if (dateFilter.from) {
                                const fromTs = parseToTimestamp(dateFilter.from);
                                if (fromTs && recTimestamp < fromTs) return false;
                            }
                            if (dateFilter.to) {
                                const toTs = parseToTimestamp(dateFilter.to);
                                if (toTs && recTimestamp > toTs) return false;
                            }
                        }
                    } else {
                        const selectedValues = activeColumnFilters[col.key];
                        if (selectedValues && selectedValues.length > 0) {
                            const val = getRecordValue(record, col);
                            if (!selectedValues.includes(val)) return false;
                        }
                    }
                }
                for (const col of COLUMNS) {
                    const searchTerm = columnSearchTerms[col.key];
                    if (searchTerm && searchTerm.trim() !== '') {
                        const val = getRecordValue(record, col);
                        if (!val.toLowerCase().includes(searchTerm.toLowerCase())) return false;
                    }
                }
                return true;
            });
            document.getElementById('recordsCount').textContent = `${filteredKeysList.length} سجل`;
            currentPage = 1;
            renderTablePage();
        }

        function renderTablePage() {
            const container = document.getElementById('tableContainer');
            if (filteredKeysList.length === 0) {
                container.innerHTML = `<div class="no-data">لا توجد بيانات مسجلة (A4 / A5)</div>`;
                updatePaginationControls();
                return;
            }
            const totalPages = Math.ceil(filteredKeysList.length / PAGE_SIZE);
            if (currentPage > totalPages) currentPage = totalPages;
            const startIndex = (currentPage - 1) * PAGE_SIZE;
            const pageKeys = filteredKeysList.slice(startIndex, startIndex + PAGE_SIZE);

            let html = `<table><thead><tr><th>#</th>`;
            COLUMNS.forEach(col => {
                const isActive = activeColumnFilters[col.key] && (
                    col.isDate ? (activeColumnFilters[col.key].from || activeColumnFilters[col.key].to) : activeColumnFilters[col.key].length > 0
                ) || (columnSearchTerms[col.key] && columnSearchTerms[col.key].trim() !== '');
                html += `<th>
                    <div class="th-content">
                        <span>${col.label}</span>
                        <button class="filter-btn ${isActive ? 'active' : ''}" onclick="window.toggleFilterPopover(event, '${col.key}')">
                            <i class="fas fa-filter"></i>
                        </button>
                    </div>
                </th>`;
            });
            html += `<th>الإجراءات</th></tr></thead><tbody>`;

            let index = startIndex;
            pageKeys.forEach(key => {
                index++;
                const record = allRecords[key];
                const isEditingRow = (editingKey === key);
                html += `<tr class="${isEditingRow ? 'editing' : ''}"><td>${index}</td>`;
                COLUMNS.forEach(col => {
                    let val = getRecordValue(record, col);
                    if (col.isDate) val = formatToDDMMYYYY(val);
                    if (col.key === 'meter_type') {
                        const badgeClass = ['A4', 'A5'].includes(val) ? 'badge-a45' : 'badge-a123';
                        html += `<td><span class="badge-type ${badgeClass}">${val === 'N/A' ? '<span class="na">N/A</span>' : val}</span></td>`;
                    } else if (col.key === 'address') {
                        html += `<td style="max-width:150px;white-space:normal;word-break:break-word;">${val === 'N/A' ? '<span class="na">N/A</span>' : val}</td>`;
                    } else {
                        html += `<td>${val === 'N/A' ? '<span class="na">N/A</span>' : val}</td>`;
                    }
                });
                html += `<td><div class="actions-cell">
                    <button class="btn-sm btn-edit-sm" onclick="window.editRecord('${key}')"><i class="fas fa-edit"></i> تعديل</button>
                    <button class="btn-sm btn-delete-sm" onclick="window.deleteRecord('${key}')"><i class="fas fa-trash"></i></button>
                </div></td></tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
            updatePaginationControls();
        }

        function updatePaginationControls() {
            const totalPages = Math.ceil(filteredKeysList.length / PAGE_SIZE) || 1;
            document.getElementById('pageIndicator').textContent = `الصفحة ${currentPage} من ${totalPages}`;
            document.getElementById('btnPrev').disabled = (currentPage === 1);
            document.getElementById('btnNext').disabled = (currentPage >= totalPages);
        }

        window.changePage = function (delta) {
            const totalPages = Math.ceil(filteredKeysList.length / PAGE_SIZE) || 1;
            if (currentPage + delta >= 1 && currentPage + delta <= totalPages) {
                currentPage += delta;
                renderTablePage();
            }
        };

        window.toggleFilterPopover = function (event, colKey) {
            event.stopPropagation();
            const popover = document.getElementById('filterPopover');
            const button = event.currentTarget;
            const rect = button.getBoundingClientRect();
            if (popover.classList.contains('show') && popover.dataset.colKey === colKey) {
                popover.classList.remove('show');
                return;
            }
            const col = COLUMNS.find(c => c.key === colKey);
            const currentSearch = columnSearchTerms[colKey] || '';
            let popHtml = `<strong style="display:block; margin-bottom:8px; font-size:0.85rem;">تصفية حسب ${col.label}</strong>`;
            if (!col.isDate) {
                popHtml += `<input type="text" class="filter-search-input" id="columnSearchInput" placeholder="بحث في ${col.label}..." value="${currentSearch}" oninput="window.onColumnSearch('${colKey}', this.value)">`;
            }
            if (col.isDate) {
                const currentFilter = activeColumnFilters[colKey] || { fromRGB: '', toRGB: '' };
                popHtml += `<div class="date-picker-group">
                    <label>من تاريخ:</label><input type="date" id="dateFromPicker" value="${currentFilter.fromRGB || ''}">
                    <label>إلى تاريخ:</label><input type="date" id="dateToPicker" value="${currentFilter.toRGB || ''}">
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary btn-sm" onclick="window.applyDateFilter('${colKey}')">تطبيق</button>
                    <button class="btn-link" onclick="window.clearDateFilter('${colKey}')">إلغاء</button>
                </div>`;
            } else {
                const uniqueValues = new Set();
                Object.values(allRecords).forEach(rec => {
                    const val = getRecordValue(rec, col);
                    if (val !== 'N/A') uniqueValues.add(val);
                });
                const sortedValues = Array.from(uniqueValues).sort();
                const currentSelected = activeColumnFilters[colKey] || [];
                if (sortedValues.length === 0) {
                    popHtml += `<div style="color:#94a3b8;font-size:0.85rem;padding:8px 0;">لا توجد قيم للتصفية</div>`;
                } else {
                    sortedValues.forEach(val => {
                        const checked = currentSelected.includes(val) ? 'checked' : '';
                        const searchTermLower = (columnSearchTerms[colKey] || '').toLowerCase();
                        const show = !searchTermLower || val.toLowerCase().includes(searchTermLower);
                        popHtml += `<label class="filter-option ${show ? '' : 'hidden'}" data-value="${val}">
                            <input type="checkbox" value="${val}" ${checked} onchange="window.onCheckboxChange('${colKey}')">
                            <span>${val}</span>
                        </label>`;
                    });
                }
                popHtml += `<div class="filter-actions">
                    <button class="btn-link" onclick="window.selectAllColumn('${colKey}', true)">تحديد الكل</button>
                    <button class="btn-link" onclick="window.selectAllColumn('${colKey}', false)">إلغاء الكل</button>
                </div>`;
            }
            popover.innerHTML = popHtml;
            popover.dataset.colKey = colKey;
            popover.style.top = `${rect.bottom + window.scrollY + 5}px`;
            popover.style.left = `${Math.min(rect.left + window.scrollX - 150, window.innerWidth - 290)}px`;
            popover.classList.add('show');
            setTimeout(() => {
                const searchInput = document.getElementById('columnSearchInput');
                if (searchInput) searchInput.focus();
            }, 100);
        };

        window.onColumnSearch = function (colKey, value) {
            if (value && value.trim() !== '') columnSearchTerms[colKey] = value.trim();
            else delete columnSearchTerms[colKey];
            const popover = document.getElementById('filterPopover');
            if (popover && popover.dataset.colKey === colKey) {
                const searchLower = value.toLowerCase();
                const options = popover.querySelectorAll('.filter-option');
                options.forEach(opt => {
                    const val = opt.dataset.value || '';
                    if (searchLower && !val.toLowerCase().includes(searchLower)) opt.classList.add('hidden');
                    else opt.classList.remove('hidden');
                });
            }
            applyFilters();
        };

        window.applyDateFilter = function (colKey) {
            const fromRGB = document.getElementById('dateFromPicker').value;
            const toRGB = document.getElementById('dateToPicker').value;
            let from = '', to = '';
            if (fromRGB) { const p = fromRGB.split('-'); from = `${p[2]}/${p[1]}/${p[0]}`; }
            if (toRGB) { const p = toRGB.split('-'); to = `${p[2]}/${p[1]}/${p[0]}`; }
            if (fromRGB || toRGB) activeColumnFilters[colKey] = { from, to, fromRGB, toRGB };
            else delete activeColumnFilters[colKey];
            document.getElementById('filterPopover').classList.remove('show');
            applyFilters();
        };

        window.clearDateFilter = function (colKey) {
            delete activeColumnFilters[colKey];
            document.getElementById('filterPopover').classList.remove('show');
            applyFilters();
        };

        window.onCheckboxChange = function (colKey) {
            const popover = document.getElementById('filterPopover');
            const checkboxes = popover.querySelectorAll('input[type="checkbox"]:not(.hidden)');
            const selected = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
            if (selected.length > 0) activeColumnFilters[colKey] = selected;
            else delete activeColumnFilters[colKey];
            applyFilters();
        };

        window.selectAllColumn = function (colKey, selectAll) {
            const popover = document.getElementById('filterPopover');
            const checkboxes = popover.querySelectorAll('input[type="checkbox"]:not(.hidden)');
            checkboxes.forEach(cb => cb.checked = selectAll);
            window.onCheckboxChange(colKey);
        };

        window.resetAllFilters = function () {
            activeColumnFilters = {};
            columnSearchTerms = {};
            applyFilters();
            showStatus("تم إعادة ضبط جميع الفلاتر", "info");
        };

        window.exportToExcel = function () {
            if (filteredKeysList.length === 0) { alert("لا توجد بيانات لتصديرها."); return; }
            const exportData = filteredKeysList.map((key) => {
                const record = allRecords[key];
                const rowObj = {};
                COLUMNS.forEach(col => {
                    let val = getRecordValue(record, col);
                    if (col.isDate && val !== 'N/A') val = formatToDDMMYYYY(val);
                    rowObj[col.label] = val;
                });
                return rowObj;
            });
            try {
                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "العدادات والمحولات");
                XLSX.writeFile(workbook, `سجلات_العدادات_A45_${handsa_code}.xlsx`);
                showStatus("تم تصدير البيانات بنجاح", "success");
            } catch (err) {
                showStatus("خطأ في التصدير: " + err.message, "error");
            }
        };

        window.editRecord = function (key) {
            const record = allRecords[key];
            if (!record) return;

            document.getElementById('meter_number').value = record["meter_number"] || '';
            document.getElementById('sim_number').value = record["sim_number"] || '';
            let typeVal = record["meter_type"] || 'A4';
            if (!ALLOWED_TYPES.includes(typeVal)) typeVal = 'A4';
            document.getElementById('meter_type').value = typeVal;
            document.getElementById('meter_voltage').value = record["meter_voltage"] || '380';

            const installDateVal = record["install_date"] || formatDate(new Date());
            document.getElementById('install_date').value = installDateVal;
            const dateObj = parseDate(installDateVal);
            if (dateObj && !isNaN(dateObj.getTime())) {
                document.getElementById('installDatePicker').value = dateToPicker(installDateVal);
                updateDateDisplay(dateObj);
            }

            document.getElementById('facility_type').value = record["facility_type"] || (typeVal === 'A5' ? 'Transformer-P' : 'Transformer');

            const hasSubName = record["sub_name"] && record["sub_name"] !== '';
            const hasSubCode = record["sub_code"] && record["sub_code"] !== '';

            let feedSourceVal = 'dp';
            if (hasSubName || hasSubCode) feedSourceVal = 'station';
            document.getElementById('feedSource').value = feedSourceVal;
            handleFeedSourceChange();

            document.getElementById('facility').value = record["facility"] || '';
            document.getElementById('facility_code').value = record["facility_code"] || '';
            document.getElementById('facility_capacity').value = record["facility_capacity"] || '';

            document.getElementById('sub_name').value = record["sub_name"] || '';
            document.getElementById('sub_code').value = record["sub_code"] || '';
            const codeDatalist = document.getElementById('stationCodeList');
            codeDatalist.innerHTML = '';
            if (document.getElementById('sub_name').value && stationCodesByName[document.getElementById('sub_name').value]) {
                stationCodesByName[document.getElementById('sub_name').value].forEach(code => {
                    const opt = document.createElement('option');
                    opt.value = code;
                    codeDatalist.appendChild(opt);
                });
            }
            renderPanelsList(document.getElementById('sub_code').value, document.getElementById('sub_name').value);

            document.getElementById('dp').value = record["dp"] || '';
            document.getElementById('feeder').value = record["feeder"] || '';
            document.getElementById('feeder_code').value = record["feeder_code"] || '';
            document.getElementById('feeder_outgoing').value = record["feeder_outgoing"] || '';
            renderFeedersList();
            renderOutgoingList();

            document.getElementById('lat').value = record["lat"] || '';
            document.getElementById('lng').value = record["lng"] || '';
            document.getElementById('address').value = record["address"] || '';

            editingKey = key;
            document.getElementById('editingKey').value = key;
            document.getElementById('addSingleBtn').innerHTML = '<i class="fas fa-save"></i> تحديث السجل';
            document.getElementById('cancelEditBtn').style.display = 'inline-block';
            document.getElementById('addSingleBtn').style.backgroundColor = '#f59e0b';
            document.getElementById('dataForm').scrollIntoView({ behavior: 'smooth' });
            checkValidation();
            applyFilters();
        };

        window.cancelEdit = function () {
            editingKey = null;
            document.getElementById('editingKey').value = '';
            document.getElementById('addSingleBtn').innerHTML = '<i class="fas fa-plus-circle"></i> حفظ السجل';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('addSingleBtn').style.backgroundColor = '#2563eb';
            clearForm();
            renderStationsList();
            renderPanelsList();
            renderFeedersList();
            renderOutgoingList();
            applyFilters();
            checkValidation();
        };

        window.deleteRecord = function (key) {
            if (!confirm(`هل أنت متأكد من حذف السجل رقم ${key}؟`)) return;
            const kId = norm(document.getElementById('keta3_code').value);
            const hCode = norm(document.getElementById('handsa_code').value);
            showStatus("جاري حذف السجل من القاعدة...", "info");
            updateSyncStatus(true);
            const recordRef = ref(db, `sectors/${kId}/districts/${hCode}/manual_entries/${key}`);
            remove(recordRef).then(() => {
                showStatus("تم حذف السجل بنجاح!", "success");
                updateSyncStatus(false);
                resetSessionTimer();
            }).catch(err => {
                showStatus("خطأ أثناء الحذف: " + err.message, "error");
                updateSyncStatus(false);
            });
        };

        function clearForm() {
            document.getElementById('meter_number').value = '';
            document.getElementById('sim_number').value = '';
            document.getElementById('meter_type').value = 'A4';
            document.getElementById('meter_voltage').value = '380';
            const today = new Date();
            document.getElementById('installDatePicker').value = today.toISOString().split('T')[0];
            document.getElementById('install_date').value = formatDate(today);
            updateDateDisplay(today);
            document.getElementById('facility_type').value = 'Transformer';
            document.getElementById('feedSource').value = '';
            handleFeedSourceChange();
            document.getElementById('facility').value = '';
            document.getElementById('facility_code').value = '';
            document.getElementById('facility_capacity').value = '';
            document.getElementById('sub_name').value = '';
            document.getElementById('sub_code').value = '';
            document.getElementById('stationCodeList').innerHTML = '';
            document.getElementById('dp').value = '';
            document.getElementById('feeder').value = '';
            document.getElementById('feeder_code').value = '';
            document.getElementById('feeder_outgoing').value = '';
            document.getElementById('lat').value = '';
            document.getElementById('lng').value = '';
            document.getElementById('address').value = '';
        }

        function checkValidation() {
            const meterNum = norm(document.getElementById('meter_number').value);
            const simNum = norm(document.getElementById('sim_number').value);
            const feedSourceVal = document.getElementById('feedSource').value;
            const editingKeyVal = document.getElementById('editingKey').value;
            const facility = norm(document.getElementById('facility').value);
            const facilityCode = norm(document.getElementById('facility_code').value);
            const subCode = norm(document.getElementById('sub_code').value);
            const feederCode = norm(document.getElementById('feeder_code').value);

            let isValid = true;

            const meterInput = document.getElementById('meter_number');
            const meterWarn = document.getElementById('meterNumberWarning');
            if (!meterNum) {
                isValid = false;
                meterInput.classList.remove('valid', 'duplicate');
                meterWarn.classList.remove('show');
            } else if (meterNum.length !== 8 || !/^\d+$/.test(meterNum)) {
                isValid = false;
                meterInput.classList.add('duplicate');
                meterInput.classList.remove('valid');
                meterWarn.textContent = 'رقم العداد يجب أن يتكون من 8 أرقام فقط';
                meterWarn.classList.add('show');
            } else if (existingMeters.has(meterNum) && (!editingKeyVal || allRecords[editingKeyVal]?.meter_number !== meterNum)) {
                isValid = false;
                meterInput.classList.add('duplicate');
                meterInput.classList.remove('valid');
                meterWarn.textContent = 'رقم العداد مسجل مسبقاً!';
                meterWarn.classList.add('show');
            } else {
                meterInput.classList.remove('duplicate');
                meterInput.classList.add('valid');
                meterWarn.classList.remove('show');
            }

            const simInput = document.getElementById('sim_number');
            const simWarn = document.getElementById('simNumberWarning');
            if (simNum) {
                if (simNum.length !== 19 || !/^\d+$/.test(simNum)) {
                    isValid = false;
                    simInput.classList.add('duplicate');
                    simInput.classList.remove('valid');
                    simWarn.textContent = 'رقم الشريحة يجب أن يتكون من 19 رقم';
                    simWarn.classList.add('show');
                } else if (existingSims.has(simNum) && (!editingKeyVal || allRecords[editingKeyVal]?.sim_number !== simNum)) {
                    isValid = false;
                    simInput.classList.add('duplicate');
                    simInput.classList.remove('valid');
                    simWarn.textContent = 'رقم الشريحة مسجل مسبقاً!';
                    simWarn.classList.add('show');
                } else {
                    simInput.classList.remove('duplicate');
                    simInput.classList.add('valid');
                    simWarn.classList.remove('show');
                }
            } else {
                simInput.classList.remove('duplicate', 'valid');
                simWarn.classList.remove('show');
            }

            if (!facility || !facilityCode) isValid = false;
            if (!feedSourceVal) isValid = false;

            const stCodeInput = document.getElementById('sub_code');
            const stWarn = document.getElementById('stationCodeWarning');
            if (subCode && !validateStationCode(subCode)) {
                isValid = false;
                stCodeInput.classList.add('duplicate');
                stWarn.textContent = 'كود المحطة غير مطابق للنمط المطلوب';
                stWarn.classList.add('show');
            } else {
                stCodeInput.classList.remove('duplicate');
                stWarn.classList.remove('show');
            }

            const feederCodeInput = document.getElementById('feeder_code');
            const feederWarn = document.getElementById('feederCodeWarning');
            if (feederCode && !validateFeederCode(feederCode)) {
                isValid = false;
                feederCodeInput.classList.add('duplicate');
                feederWarn.textContent = 'كود المغذي غير مطابق للنمط المطلوب';
                feederWarn.classList.add('show');
            } else {
                feederCodeInput.classList.remove('duplicate');
                feederWarn.classList.remove('show');
            }

            document.getElementById('addSingleBtn').disabled = !isValid;
        }

        ['meter_number', 'sim_number', 'facility', 'facility_code', 'sub_code', 'feeder_code'].forEach(id => {
            const element = document.getElementById(id);
            if (element) element.addEventListener('input', checkValidation);
        });

        document.getElementById('addSingleBtn').addEventListener('click', async function () {
            const kId = norm(document.getElementById('keta3_code').value);
            const hCode = norm(document.getElementById('handsa_code').value);
            const editKeyVal = document.getElementById('editingKey').value;

            const recordData = {
                meter_number: norm(document.getElementById('meter_number').value),
                sim_number: norm(document.getElementById('sim_number').value),
                meter_type: document.getElementById('meter_type').value,
                meter_voltage: norm(document.getElementById('meter_voltage').value),
                install_date: document.getElementById('install_date').value,
                facility: norm(document.getElementById('facility').value),
                facility_code: norm(document.getElementById('facility_code').value),
                facility_capacity: norm(document.getElementById('facility_capacity').value),
                facility_type: document.getElementById('facility_type').value,
                feedSource: document.getElementById('feedSource').value,
                sub_name: norm(document.getElementById('sub_name').value),
                sub_code: norm(document.getElementById('sub_code').value),
                dp: norm(document.getElementById('dp').value),
                feeder: norm(document.getElementById('feeder').value),
                feeder_code: norm(document.getElementById('feeder_code').value),
                feeder_outgoing: norm(document.getElementById('feeder_outgoing').value),
                lat: norm(document.getElementById('lat').value),
                lng: norm(document.getElementById('lng').value),
                address: norm(document.getElementById('address').value),
                keta3_code: kId,
                handsa_code: hCode
            };

            showStatus("جاري حفظ البيانات...", "info");
            updateSyncStatus(true);

            try {
                let targetKey = editKeyVal;
                if (!targetKey) targetKey = Date.now().toString();

                const recordRef = ref(db, `sectors/${kId}/districts/${hCode}/manual_entries/${targetKey}`);
                await set(recordRef, recordData);

                showStatus(editKeyVal ? "تم تحديث السجل بنجاح!" : "تم حفظ السجل الجديد بنجاح!", "success");
                if (editKeyVal) cancelEdit();
                else { clearForm(); checkValidation(); }
            } catch (err) {
                console.error("Save error:", err);
                showStatus("خطأ في حفظ السجل: " + err.message, "error");
            } finally {
                updateSyncStatus(false);
            }
        });

        document.addEventListener('click', function (e) {
            const popover = document.getElementById('filterPopover');
            if (popover && popover.classList.contains('show')) {
                if (!popover.contains(e.target) && !e.target.closest('.filter-btn')) {
                    popover.classList.remove('show');
                }
            }
        });

        authenticateAndInit();
    </script>
</body>

</html>
