<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - شركة شمال الدلتا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #1e293b;
        }

        .form-field {
            margin-bottom: 18px;
        }

        .form-field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }

        .inline-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .inline-select:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #1d4ed8;
        }

        .login-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .error-msg {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .hint-msg {
            color: #0284c7;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2><i class="fas fa-bolt"></i> تسجيل الدخول</h2>
        <form id="loginForm">
            <!-- User Type Dropdown -->
            <div class="form-field">
                <label for="inputUserType"><i class="fas fa-users-cog"></i> جهة الدخول</label>
                <select id="inputUserType" class="inline-select" title="جهة الدخول" aria-label="جهة الدخول" required>
                    <option value="">اختر جهة الدخول</option>
                    <option value="المعمل">المعمل</option>
                    <option value="الهندسات">الهندسات</option>
                    <option value="Admin">Admin - (أمير)</option>
                </select>
            </div>

            <div class="form-field">
                <label for="inputKeta3"><i class="fas fa-chart-line"></i> القطاع</label>
                <select id="inputKeta3" class="inline-select" title="القطاع" aria-label="القطاع" required disabled>
                    <option value="">اختر القطاع</option>
                    <option value="1">دمياط</option>
                    <option value="2">شمال الدقهلية</option>
                    <option value="3">جنوب الدقهلية</option>
                    <option value="4">كفر الشيخ</option>
                </select>
            </div>

            <div class="form-field">
                <label for="inputHandsa"><i class="fas fa-draw-polygon"></i> الهندسة</label>
                <select id="inputHandsa" class="inline-select" title="الهندسة" aria-label="الهندسة" required disabled>
                    <option value="">اختر الهندسة</option>
                </select>
            </div>

            <div class="form-field">
                <label><i class="fas fa-lock"></i> كلمة المرور</label>
                <input type="password" id="inputPassword" class="inline-select" placeholder="أدخل كلمة المرور" required
                    disabled>
                <span id="pwdHint" class="hint-msg"></span>
                <span id="pwdError" class="error-msg"></span>
            </div>

            <button type="submit" class="login-btn" id="submitBtn" disabled>دخول إلى النظام</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFXLCWmwrAQIrmRvnus3yJlTpra9Rv69k",
            authDomain: "trial-85.firebaseapp.com",
            projectId: "trial-85",
            storageBucket: "trial-85.firebasestorage.app",
            messagingSenderId: "660343156279",
            appId: "1:660343156279:web:3275f5d3da7721a35259b2",
            measurementId: "G-RLMVPCLZW3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const handsaData = {
            "1": [
                { id: 1, name: "هندسة شمال دمياط" },
                { id: 2, name: "هندسة جنوب دمياط" },
                { id: 3, name: "هندسة الشعراء" },
                { id: 4, name: "هندسة عزبة البرج" },
                { id: 5, name: "هندسة دمياط الجديدة" },
                { id: 6, name: "هندسة فارسكور" },
                { id: 7, name: "هندسة الروضة" },
                { id: 8, name: "هندسة كنر سعد" },
                { id: 9, name: "هندسة كنر البطيخ" },
                { id: 10, name: "هندسة رأس البر" },
                { id: 11, name: "هندسة الزرقا" }
            ],
            "3": [
                { id: 29, name: "هندسة المطرية" },
                { id: 30, name: "هندسة مدينة المنزلة" },
                { id: 31, name: "هندسة قرى المنزلة" },
                { id: 32, name: "هندسة الجمالية" },
                { id: 33, name: "هندسة ميت سلسيل" },
                { id: 34, name: "هندسة منية النصر" },
                { id: 35, name: "هندسة دكرنس" },
                { id: 36, name: "هندسة بنى عبيد" },
                { id: 37, name: "هندسة مدينة شربين" },
                { id: 38, name: "هندسة قرى شربين" },
                { id: 39, name: "هندسة جمصه" },
                { id: 40, name: "هندسة الستامونى" },
                { id: 41, name: "هندسة مدينة بلقاس" },
                { id: 42, name: "هندسة قرى بلقاس" }
            ],
            "4": [
                { id: 43, name: "هندسة شرق المنصورة" },
                { id: 44, name: "هندسة غرب المنصورة" },
                { id: 45, name: "هندسة طلخا" },
                { id: 46, name: "هندسة نبروه" },
                { id: 47, name: "هندسة أجا" },
                { id: 48, name: "هندسة مدينة ميت غمر" },
                { id: 49, name: "هندسة قرى ميت غمر" },
                { id: 50, name: "هندسة مدينة السنبلاوين" },
                { id: 51, name: "هندسة قرى السنبلاوين" },
                { id: 52, name: "هندسة تمى الأمديد" },
                { id: 53, name: "هندسة قرى المنصورة1" },
                { id: 54, name: "هندسة قرى المنصورة2" },
                { id: 55, name: "هندسة كوم النور" }
            ],
            "2": [
                { id: 12, name: "هندسة مدينة كفر الشيخ" },
                { id: 13, name: "هندسة قرى شرق كفر الشيخ" },
                { id: 14, name: "هندسة قرى غرب كفر الشيخ" },
                { id: 15, name: "هندسة مدينة دسوق" },
                { id: 16, name: "هندسة قرى شمال دسوق" },
                { id: 17, name: "هندسة قرى جنوب دسوق" },
                { id: 19, name: "هندسة قرى الحامول" },
                { id: 20, name: "هندسة بلطيم" },
                { id: 21, name: "هندسة الرياض" },
                { id: 22, name: "هندسة بيلا" },
                { id: 23, name: "هندسة قلين" },
                { id: 24, name: "هندسة فوه" },
                { id: 25, name: "هندسة مطوبس" },
                { id: 26, name: "هندسة مدينة سيدى سالم" },
                { id: 27, name: "هندسة قرى سيدى سالم" },
                { id: 28, name: "هندسة برج البرلس" }
            ]
        };

        const userTypeSelect = document.getElementById('inputUserType');
        const keta3Select = document.getElementById('inputKeta3');
        const handsaSelect = document.getElementById('inputHandsa');
        const passwordInput = document.getElementById('inputPassword');
        const submitBtn = document.getElementById('submitBtn');
        const pwdHint = document.getElementById('pwdHint');
        const pwdError = document.getElementById('pwdError');

        function updateAuthState() {
            passwordInput.value = '';
            pwdHint.textContent = '';
            pwdError.style.display = 'none';

            const userType = userTypeSelect.value;

            if (userType === 'Admin') {
                keta3Select.value = '';
                handsaSelect.value = '';
                keta3Select.disabled = true;
                handsaSelect.disabled = true;
                keta3Select.removeAttribute('required');
                handsaSelect.removeAttribute('required');

                passwordInput.disabled = false;
                submitBtn.disabled = false;
                return;
            }

            keta3Select.setAttribute('required', 'required');
            handsaSelect.setAttribute('required', 'required');
            keta3Select.disabled = false;

            const keta3Id = keta3Select.value;
            const handsaId = handsaSelect.value;

            if (userType && keta3Id && handsaId) {
                passwordInput.disabled = false;
                submitBtn.disabled = false;
                checkUserTypeAuth(userType, keta3Id, handsaId);
            } else {
                passwordInput.disabled = true;
                submitBtn.disabled = true;
            }
        }

        async function checkUserTypeAuth(userType, keta3Id, handsaId) {
            pwdHint.textContent = "جاري التحقق من قاعدة البيانات...";
            try {
                const userTypeAuthRef = ref(db, `auth_sectors/${keta3Id}/districts/${handsaId}/${userType}`);
                const snapshot = await get(userTypeAuthRef);

                if (!snapshot.exists()) {
                    pwdHint.textContent = `ℹ️ أول دخول لجهة (${userType}): سيتم حفظ كلمة المرور كـ Key جديد.`;
                } else {
                    pwdHint.textContent = `ℹ️ جهة (${userType}) مسجلة مسبقاً، يرجى إدخال كلمة المرور الصحيحة.`;
                }
            } catch (err) {
                console.error(err);
                pwdHint.textContent = "⚠️ فشل الاتصال بقاعدة البيانات. تأكد من إعدادات الاتصال.";
            }
        }

        userTypeSelect.addEventListener('change', updateAuthState);

        keta3Select.addEventListener('change', function () {
            const selectedId = this.value;
            handsaSelect.innerHTML = '<option value="">اختر الهندسة</option>';

            if (selectedId && handsaData[selectedId]) {
                handsaSelect.disabled = false;
                handsaData[selectedId].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.id;
                    opt.textContent = item.name;
                    handsaSelect.appendChild(opt);
                });
            } else {
                handsaSelect.disabled = true;
            }

            updateAuthState();
        });

        handsaSelect.addEventListener('change', updateAuthState);

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const userType = userTypeSelect.value;
            const password = passwordInput.value.trim();

            pwdError.style.display = 'none';
            // Admin Login Procedure (Dynamic creation on 1st time, validation afterwards)
            if (userType === 'Admin') {
                const digitsCount = (password.match(/\d/g) || []).length;
                const lettersCount = (password.match(/[a-zA-Z\u0600-\u06FF]/g) || []).length;

                if (digitsCount < 3 || lettersCount <= 3) {
                    pwdError.textContent = "خطأ: يجب أن تحتوي كلمة المرور على 3 أرقام على الأقل وأكثر من 3 حروف.";
                    pwdError.style.display = 'block';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = "جاري التحقق...";

                try {
                    const adminAuthRef = ref(db, `auth_sectors/admin/districts/admin/Admin`);
                    const snapshot = await get(adminAuthRef);
                    const redirectUrl = `Control_Smart.html?keta3=admin&handsa=admin&userType=${encodeURIComponent(userType)}`;

                    if (!snapshot.exists()) {
                        // أول مرة: إنشاء وحفظ كلمة المرور في الفايربيس
                        const passwordKeyRef = ref(db, `auth_sectors/admin/districts/admin/Admin/${password}`);
                        await set(passwordKeyRef, true);

                        alert("تم تسجيل وتعيين كلمة مرور حساب الآدمين بنجاح لأول مرة!");
                        window.location.href = redirectUrl;
                    } else {
                        // المرات القادمة: التحقق من وجود كلمة المرور
                        if (snapshot.hasChild(password)) {
                            window.location.href = redirectUrl;
                        } else {
                            pwdError.textContent = "فشل تسجيل الدخول: كلمة المرور غير صحيحة لحساب الآدمين.";
                            pwdError.style.display = 'block';
                            submitBtn.disabled = false;
                            submitBtn.textContent = "دخول إلى النظام";
                        }
                    }
                } catch (error) {
                    console.error(error);
                    pwdError.textContent = "حدث خطأ أثناء التواصل مع قاعدة البيانات: " + error.message;
                    pwdError.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = "دخول إلى النظام";
                }
                return;
            }

            // Standard Login Procedure
            const keta3 = keta3Select.value;
            const handsa = handsaSelect.value;

            const digitsCount = (password.match(/\d/g) || []).length;
            const lettersCount = (password.match(/[a-zA-Z\u0600-\u06FF]/g) || []).length;

            if (digitsCount < 3 || lettersCount <= 3) {
                pwdError.textContent = "خطأ: يجب أن تحتوي كلمة المرور على 3 أرقام على الأقل وأكثر من 3 حروف.";
                pwdError.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري التحقق...";

            try {
                const authUserTypeRef = ref(db, `auth_sectors/${keta3}/districts/${handsa}/${userType}`);
                const snapshot = await get(authUserTypeRef);

                const redirectUrl = `Control_Smart.html?keta3=${encodeURIComponent(keta3)}&handsa=${encodeURIComponent(handsa)}&userType=${encodeURIComponent(userType)}`;

                if (!snapshot.exists()) {
                    const passwordKeyRef = ref(db, `auth_sectors/${keta3}/districts/${handsa}/${userType}/${password}`);
                    await set(passwordKeyRef, true);

                    alert(`تم تسجيل الدخول وحفظ كلمة المرور لجهة (${userType}) بنجاح!`);
                    window.location.href = redirectUrl;
                } else {
                    if (snapshot.hasChild(password)) {
                        window.location.href = redirectUrl;
                    } else {
                        pwdError.textContent = `فشل تسجيل الدخول: كلمة المرور غير صحيحة لجهة (${userType}).`;
                        pwdError.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.textContent = "دخول إلى النظام";
                    }
                }
            } catch (error) {
                console.error(error);
                pwdError.textContent = "حدث خطأ أثناء التواصل مع قاعدة البيانات: " + error.message;
                pwdError.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = "دخول إلى النظام";
            }
        });
    </script>

</body>

</html>
