<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - شركة شمال الدلتا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #eef2f9;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --border: #e6eaf1;
            --text: #0f172a;
            --text-2: #334155;
            --muted: #64748b;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #eff4ff;
            --success: #10b981;
            --success-soft: #ecfdf5;
            --danger: #ef4444;
            --danger-soft: #fef2f2;
            --warning: #f59e0b;
            --warning-soft: #fffbeb;
            --info: #0ea5e9;
            --info-soft: #f0f9ff;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, .04);
            --shadow-lg: 0 24px 60px -20px rgba(15, 23, 42, .28);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
            background:
                radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 110%, #e0e7ff 0%, transparent 55%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            direction: rtl;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ============ CARD ============ */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #8b5cf6, var(--info));
        }

        /* ============ HEADER ============ */
        .login-head {
            padding: 28px 28px 20px;
            text-align: center;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            display: grid;
            place-items: center;
            font-size: 28px;
            color: #fff;
            box-shadow: 0 12px 28px -12px rgba(37, 99, 235, .55);
        }

        .login-head h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
            letter-spacing: -.2px;
        }

        .login-head p {
            font-size: .78rem;
            color: var(--muted);
        }

        /* ============ FORM ============ */
        .login-body {
            padding: 0 28px 28px;
        }

        .field {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: .76rem;
            font-weight: 700;
            color: var(--text-2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .field label i {
            color: var(--primary);
            font-size: .82rem;
            width: 14px;
            text-align: center;
        }

        .field label .opt {
            font-size: .68rem;
            font-weight: 500;
            color: var(--muted);
            margin-right: auto;
        }

        .field input,
        .field select {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--surface-2);
            font-size: .86rem;
            font-family: inherit;
            color: var(--text);
            outline: none;
            transition: .15s;
            appearance: none;
            -webkit-appearance: none;
        }

        .field input::placeholder {
            color: #94a3b8;
        }

        .field input:hover:not(:disabled),
        .field select:hover:not(:disabled) {
            border-color: #c7d7ff;
            background: #fff;
        }

        .field input:focus,
        .field select:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px var(--primary-soft);
        }

        .field input:disabled,
        .field select:disabled {
            opacity: .55;
            cursor: not-allowed;
            background: #f1f5f9;
        }

        /* Modern select wrapper with chevron */
        .select-wrap {
            position: relative;
        }

        .select-wrap select {
            padding-left: 40px;
            padding-right: 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .select-wrap::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: .68rem;
            pointer-events: none;
            transition: .2s;
        }

        .select-wrap:focus-within::after {
            color: var(--primary);
        }

        /* Password toggle */
        .pwd-wrap {
            position: relative;
        }

        .pwd-wrap input {
            padding-left: 46px;
        }

        .pwd-toggle {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            border-radius: 8px;
            color: var(--muted);
            cursor: pointer;
            display: grid;
            place-items: center;
            font-size: .8rem;
            transition: .15s;
        }

        .pwd-toggle:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        /* ============ MESSAGE ============ */
        .msg {
            display: none;
            align-items: flex-start;
            gap: 8px;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            font-size: .74rem;
            font-weight: 600;
            line-height: 1.4;
            margin-top: 6px;
        }

        .msg.show { display: flex; }
        .msg i { font-size: .82rem; margin-top: 1px; flex: none; }
        .msg.hint { background: var(--info-soft); color: #0369a1; border: 1px solid #bae6fd; }
        .msg.error { background: var(--danger-soft); color: #991b1b; border: 1px solid #fecaca; }
        .msg.success { background: var(--success-soft); color: #065f46; border: 1px solid #a7f3d0; }
        .msg.warning { background: var(--warning-soft); color: #92400e; border: 1px solid #fde68a; }

        /* ============ SUBMIT BUTTON ============ */
        .login-btn {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            padding: 0 16px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            font-family: inherit;
            font-size: .88rem;
            font-weight: 700;
            letter-spacing: .2px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .18s;
            box-shadow: 0 10px 24px -10px rgba(37, 99, 235, .55);
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px -10px rgba(37, 99, 235, .65);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-btn:disabled {
            background: #cbd5e1;
            color: #f1f5f9;
            box-shadow: none;
            cursor: not-allowed;
        }

        .login-btn .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============ FOOTER ============ */
        .login-foot {
            padding: 14px 28px;
            background: var(--surface-2);
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: .7rem;
            color: var(--muted);
        }

        .login-foot i {
            color: var(--primary);
            margin-left: 4px;
        }

        /* ============ ADMIN MODE ============ */
        .admin-badge {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f3e8ff, #ede9fe);
            border: 1px solid #ddd6fe;
            border-radius: var(--radius-sm);
            color: #6b21a8;
            font-size: .74rem;
            font-weight: 700;
        }

        .admin-badge.show { display: inline-flex; }

        .admin-badge i {
            font-size: .78rem;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .login-head { padding: 22px 20px 16px; }
            .login-body { padding: 0 20px 22px; }
            .login-logo { width: 56px; height: 56px; font-size: 24px; }
            .login-head h1 { font-size: 1.05rem; }
            .field input, .field select { height: 44px; font-size: .82rem; }
            .login-btn { height: 46px; }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-head">
            <div class="login-logo">
                <i class="fas fa-bolt"></i>
            </div>
            <h1>تسجيل الدخول</h1>
            <p>شركة شمال الدلتا لتوزيع الكهرباء</p>
        </div>

        <form id="loginForm" class="login-body">

            <div id="adminBadge" class="admin-badge">
                <i class="fas fa-shield-halved"></i>
                وضع الأدمن — صلاحيات كاملة
            </div>

            <!-- User Type -->
            <div class="field">
                <label for="inputUserType">
                    <i class="fas fa-users-cog"></i>
                    جهة الدخول
                </label>
                <div class="select-wrap">
                    <select id="inputUserType" required>
                        <option value="">اختر جهة الدخول</option>
                        <option value="المعمل">🧪 المعمل</option>
                        <option value="الهندسات">⚡ الهندسات</option>
                        <option value="Admin">👑 Admin (أمير)</option>
                    </select>
                </div>
            </div>

            <!-- Sector -->
            <div class="field">
                <label for="inputKeta3">
                    <i class="fas fa-chart-line"></i>
                    القطاع
                </label>
                <div class="select-wrap">
                    <select id="inputKeta3" required disabled>
                        <option value="">اختر القطاع</option>
                        <option value="1">دمياط</option>
                        <option value="3">شمال الدقهلية</option>
                        <option value="4">جنوب الدقهلية</option>
                        <option value="2">كفر الشيخ</option>
                    </select>
                </div>
            </div>

            <!-- Engineering -->
            <div class="field">
                <label for="inputHandsa">
                    <i class="fas fa-draw-polygon"></i>
                    الهندسة
                </label>
                <div class="select-wrap">
                    <select id="inputHandsa" required disabled>
                        <option value="">اختر الهندسة</option>
                    </select>
                </div>
            </div>

            <!-- Password -->
            <div class="field">
                <label for="inputPassword">
                    <i class="fas fa-lock"></i>
                    كلمة المرور
                </label>
                <div class="pwd-wrap">
                    <input type="password" id="inputPassword" placeholder="أدخل كلمة المرور" required disabled autocomplete="current-password">
                    <button type="button" class="pwd-toggle" id="pwdToggle" title="إظهار/إخفاء كلمة المرور" tabindex="-1">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div id="pwdHint" class="msg hint">
                    <i class="fas fa-circle-info"></i>
                    <span></span>
                </div>
                <div id="pwdError" class="msg error">
                    <i class="fas fa-circle-exclamation"></i>
                    <span></span>
                </div>
                <div id="pwdSuccess" class="msg success">
                    <i class="fas fa-circle-check"></i>
                    <span></span>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" id="submitBtn" class="login-btn" disabled>
                <span class="btn-label">دخول إلى النظام</span>
            </button>
        </form>

        <div class="login-foot">
            <i class="fas fa-shield-halved"></i>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFXLCWmwrAQIrmRvnus3yJlTpra9Rv69k",
            authDomain: "trial-85.firebaseapp.com",
            projectId: "trial-85",
            storageBucket: "trial-85.firebasestorage.app",
            messagingSenderId: "660343156279",
            appId: "1:660343156279:web:3275f5d3da7721a35259b2",
            measurementId: "G-RLMVPCLZW3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        /* ============ DATA ============ */
        const handsaData = {
            "1": [
                { id: 1, name: "هندسة شمال دمياط" },
                { id: 2, name: "هندسة جنوب دمياط" },
                { id: 3, name: "هندسة الشعراء" },
                { id: 4, name: "هندسة عزبة البرج" },
                { id: 5, name: "هندسة دمياط الجديدة" },
                { id: 6, name: "هندسة فارسكور" },
                { id: 7, name: "هندسة الروضة" },
                { id: 8, name: "هندسة كفر سعد" },
                { id: 9, name: "هندسة كفر البطيخ" },
                { id: 10, name: "هندسة رأس البر" },
                { id: 11, name: "هندسة الزرقا" }
            ],
            "3": [
                { id: 29, name: "هندسة المطرية" },
                { id: 30, name: "هندسة مدينة المنزلة" },
                { id: 31, name: "هندسة قرى المنزلة" },
                { id: 32, name: "هندسة الجمالية" },
                { id: 33, name: "هندسة ميت سلسيل" },
                { id: 34, name: "هندسة منية النصر" },
                { id: 35, name: "هندسة دكرنس" },
                { id: 36, name: "هندسة بني عبيد" },
                { id: 37, name: "هندسة مدينة شربين" },
                { id: 38, name: "هندسة قرى شربين" },
                { id: 39, name: "هندسة جمصة" },
                { id: 40, name: "هندسة الستاموني" },
                { id: 41, name: "هندسة مدينة بلقاس" },
                { id: 42, name: "هندسة قرى بلقاس" }
            ],
            "4": [
                { id: 43, name: "هندسة شرق المنصورة" },
                { id: 44, name: "هندسة غرب المنصورة" },
                { id: 45, name: "هندسة طلخا" },
                { id: 46, name: "هندسة نبروه" },
                { id: 47, name: "هندسة أجا" },
                { id: 48, name: "هندسة مدينة ميت غمر" },
                { id: 49, name: "هندسة قرى ميت غمر" },
                { id: 50, name: "هندسة مدينة السنبلاوين" },
                { id: 51, name: "هندسة قرى السنبلاوين" },
                { id: 52, name: "هندسة تمي الأمديد" },
                { id: 53, name: "هندسة قرى المنصورة 1" },
                { id: 54, name: "هندسة قرى المنصورة 2" },
                { id: 55, name: "هندسة كوم النور" }
            ],
            "2": [
                { id: 12, name: "هندسة مدينة كفر الشيخ" },
                { id: 13, name: "هندسة قرى شرق كفر الشيخ" },
                { id: 14, name: "هندسة قرى غرب كفر الشيخ" },
                { id: 15, name: "هندسة مدينة دسوق" },
                { id: 16, name: "هندسة قرى شمال دسوق" },
                { id: 17, name: "هندسة قرى جنوب دسوق" },
                { id: 19, name: "هندسة قرى الحامول" },
                { id: 20, name: "هندسة بلطيم" },
                { id: 21, name: "هندسة الرياض" },
                { id: 22, name: "هندسة بيلا" },
                { id: 23, name: "هندسة قلين" },
                { id: 24, name: "هندسة فوه" },
                { id: 25, name: "هندسة مطوبس" },
                { id: 26, name: "هندسة مدينة سيدي سالم" },
                { id: 27, name: "هندسة قرى سيدي سالم" },
                { id: 28, name: "هندسة برج البرلس" }
            ]
        };

        /* ============ ELEMENTS ============ */
        const $ = id => document.getElementById(id);

        const userTypeSelect = $('inputUserType');
        const keta3Select = $('inputKeta3');
        const handsaSelect = $('inputHandsa');
        const passwordInput = $('inputPassword');
        const submitBtn = $('submitBtn');
        const pwdHint = $('pwdHint');
        const pwdError = $('pwdError');
        const pwdSuccess = $('pwdSuccess');
        const adminBadge = $('adminBadge');
        const pwdToggle = $('pwdToggle');

        /* ============ MESSAGE HELPERS ============ */
        function hideAllMessages() {
            pwdHint.classList.remove('show');
            pwdError.classList.remove('show');
            pwdSuccess.classList.remove('show');
        }

        function showHint(text) {
            pwdHint.querySelector('span').textContent = text;
            pwdHint.classList.add('show');
        }

        function showError(text) {
            pwdError.querySelector('span').textContent = text;
            pwdError.classList.add('show');
        }

        function showSuccess(text) {
            pwdSuccess.querySelector('span').textContent = text;
            pwdSuccess.classList.add('show');
        }

        /* ============ PASSWORD TOGGLE ============ */
        pwdToggle.addEventListener('click', () => {
            const isPwd = passwordInput.type === 'password';
            passwordInput.type = isPwd ? 'text' : 'password';
            pwdToggle.querySelector('i').className = isPwd ? 'fas fa-eye-slash' : 'fas fa-eye';
            passwordInput.focus();
        });

        /* ============ STATE ============ */
        function updateAuthState() {
            passwordInput.value = '';
            passwordInput.type = 'password';
            pwdToggle.querySelector('i').className = 'fas fa-eye';
            hideAllMessages();

            const userType = userTypeSelect.value;

            /* ---- Admin mode ---- */
            if (userType === 'Admin') {
                adminBadge.classList.add('show');
                keta3Select.value = '';
                handsaSelect.value = '';
                keta3Select.disabled = true;
                handsaSelect.disabled = true;
                keta3Select.removeAttribute('required');
                handsaSelect.removeAttribute('required');

                passwordInput.disabled = false;
                submitBtn.disabled = false;
                return;
            }

            /* ---- Normal mode ---- */
            adminBadge.classList.remove('show');
            keta3Select.setAttribute('required', 'required');
            handsaSelect.setAttribute('required', 'required');
            keta3Select.disabled = false;

            const keta3Id = keta3Select.value;
            const handsaId = handsaSelect.value;

            if (userType && keta3Id && handsaId) {
                passwordInput.disabled = false;
                submitBtn.disabled = false;
                checkUserTypeAuth(userType, keta3Id, handsaId);
            } else {
                passwordInput.disabled = true;
                submitBtn.disabled = true;
            }
        }

        async function checkUserTypeAuth(userType, keta3Id, handsaId) {
            showHint('جاري التحقق من قاعدة البيانات…');
            try {
                const userTypeAuthRef = ref(db, `auth_sectors/${keta3Id}/districts/${handsaId}/${userType}`);
                const snapshot = await get(userTypeAuthRef);

                if (!snapshot.exists()) {
                    showHint(`أول دخول لجهة (${userType}) — سيتم حفظ كلمة المرور تلقائياً.`);
                } else {
                    showHint(`جهة (${userType}) مسجلة مسبقاً — أدخل كلمة المرور الصحيحة.`);
                }
            } catch (err) {
                console.error(err);
                showError('فشل الاتصال بقاعدة البيانات. تحقق من الاتصال بالإنترنت.');
            }
        }

        /* ============ VALIDATION ============ */
        function isPasswordValid(password) {
            const digitsCount = (password.match(/\d/g) || []).length;
            const lettersCount = (password.match(/[a-zA-Z\u0600-\u06FF]/g) || []).length;
            return digitsCount >= 3 && lettersCount > 3;
        }

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span> جاري التحقق…';
            } else {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="btn-label">دخول إلى النظام</span>';
            }
        }

        /* ============ EVENTS ============ */
        userTypeSelect.addEventListener('change', updateAuthState);

        keta3Select.addEventListener('change', function () {
            const selectedId = this.value;
            handsaSelect.innerHTML = '<option value="">اختر الهندسة</option>';

            if (selectedId && handsaData[selectedId]) {
                handsaSelect.disabled = false;
                const frag = document.createDocumentFragment();
                handsaData[selectedId].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.id;
                    opt.textContent = item.name;
                    frag.appendChild(opt);
                });
                handsaSelect.appendChild(frag);
            } else {
                handsaSelect.disabled = true;
            }

            updateAuthState();
        });

        handsaSelect.addEventListener('change', updateAuthState);

        /* ============ SUBMIT ============ */
        $('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            hideAllMessages();

            const userType = userTypeSelect.value;
            const password = passwordInput.value.trim();

            if (!password) {
                showError('يرجى إدخال كلمة المرور.');
                return;
            }

            if (!isPasswordValid(password)) {
                showError('كلمة المرور يجب أن تحتوي على 3 أرقام على الأقل وأكثر من 3 حروف.');
                return;
            }

            setLoading(true);

            try {
                /* ---- ADMIN FLOW ---- */
                if (userType === 'Admin') {
                    const adminAuthRef = ref(db, `auth_sectors/admin/districts/admin/Admin`);
                    const snapshot = await get(adminAuthRef);
                    const redirectUrl = `Control_Smart.html?keta3=admin&handsa=admin&userType=${encodeURIComponent(userType)}`;

                    if (!snapshot.exists()) {
                        // First-time: register password
                        await set(ref(db, `auth_sectors/admin/districts/admin/Admin/${password}`), true);
                        showSuccess('تم تسجيل كلمة المرور لأول مرة — جاري التحويل…');
                        setTimeout(() => { window.location.href = redirectUrl; }, 700);
                    } else if (snapshot.hasChild(password)) {
                        showSuccess('تم التحقق — جاري التحويل…');
                        setTimeout(() => { window.location.href = redirectUrl; }, 400);
                    } else {
                        showError('كلمة المرور غير صحيحة لحساب الآدمين.');
                        setLoading(false);
                    }
                    return;
                }

                /* ---- NORMAL FLOW ---- */
                const keta3 = keta3Select.value;
                const handsa = handsaSelect.value;

                const authRef = ref(db, `auth_sectors/${keta3}/districts/${handsa}/${userType}`);
                const snapshot = await get(authRef);
                const redirectUrl = `Control_Smart.html?keta3=${encodeURIComponent(keta3)}&handsa=${encodeURIComponent(handsa)}&userType=${encodeURIComponent(userType)}`;

                if (!snapshot.exists()) {
                    await set(ref(db, `auth_sectors/${keta3}/districts/${handsa}/${userType}/${password}`), true);
                    showSuccess(`تم تسجيل الدخول لجهة (${userType}) بنجاح — جاري التحويل…`);
                    setTimeout(() => { window.location.href = redirectUrl; }, 800);
                } else if (snapshot.hasChild(password)) {
                    showSuccess('تم التحقق — جاري التحويل…');
                    setTimeout(() => { window.location.href = redirectUrl; }, 400);
                } else {
                    showError(`كلمة المرور غير صحيحة لجهة (${userType}).`);
                    setLoading(false);
                }
            } catch (err) {
                console.error(err);
                showError('حدث خطأ أثناء التواصل مع قاعدة البيانات. حاول مرة أخرى.');
                setLoading(false);
            }
        });

        /* ============ BOOT ============ */
        updateAuthState();
    </script>
</body>

</html>
