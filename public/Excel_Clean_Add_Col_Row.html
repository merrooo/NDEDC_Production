<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Column & Row Manager - Editable Table</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2218e4;
            --primary-hover: #4338ca;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #e11d48;
            --warning: #f59e0b;
            --info: #0ea5e9;
            --row-height: 32px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app-layout { display: flex; flex-direction: column; height: 100vh; }

        /* TOOLBAR */
        .top-toolbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 7px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            flex-shrink: 0;
            z-index: 100;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 11px;
            border-radius: 6px;
            background: white;
            color: var(--text-dark);
            text-decoration: none;
            border: 1px solid var(--border);
            font-size: 11.5px;
            font-weight: 600;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .home-btn:hover { background: #eff6ff; border-color: var(--primary); color: var(--primary); }
        .home-btn svg { width: 11px; height: 11px; }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 10px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }
        .brand h1 { margin: 0; font-size: 13px; font-weight: 700; white-space: nowrap; }

        .action-groups {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
            min-width: 0;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 2px 7px 2px 5px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 7px;
            flex-shrink: 0;
        }

        .action-group-label {
            font-size: 9.5px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            padding: 0 3px 0 1px;
            border-right: 1px solid var(--border);
            margin-right: 3px;
            line-height: 1;
            white-space: nowrap;
        }

        .tb-btn {
            cursor: pointer;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            padding: 4px 8px;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: var(--text-dark);
            white-space: nowrap;
        }
        .tb-btn:hover:not(:disabled) { background: white; border-color: var(--border); }
        .tb-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .tb-btn.primary { background: var(--primary); color: white; }
        .tb-btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
        .tb-btn.primary:disabled { background: #cbd5e1; }

        .tb-btn.success { background: var(--success); color: white; }
        .tb-btn.success:hover:not(:disabled) { background: #047857; }

        .tb-btn.danger { background: white; color: var(--danger); border-color: #fecdd3; }
        .tb-btn.danger:hover:not(:disabled) { background: #fff1f2; }

        .tb-btn.info { background: white; color: var(--info); border-color: #bae6fd; }
        .tb-btn.info:hover:not(:disabled) { background: #f0f9ff; }

        .file-label-btn {
            cursor: pointer;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            padding: 4px 9px;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: var(--text-dark);
            white-space: nowrap;
        }
        .file-label-btn:hover { background: #f1f5f9; border-color: var(--primary); color: var(--primary); }

        .toolbar-info {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .badge.vscroll { background: #eff6ff; color: var(--primary); }

        .badge.filter {
            background: #fef3c7;
            color: #92400e;
            display: none;
            align-items: center;
            gap: 3px;
        }
        .badge.filter.active { display: inline-flex; }
        .badge.filter button {
            background: transparent;
            color: #92400e;
            padding: 0;
            font-size: 10px;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }

        .badge.selection { background: #f1f5f9; color: var(--text-muted); }

        .file-name-display {
            font-size: 10.5px;
            color: var(--text-muted);
            max-width: 130px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* GRID */
        .grid-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
            padding: 8px;
        }

        .grid-container {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .table-wrapper {
            flex: 1;
            overflow: auto;
            position: relative;
            min-height: 0;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
            table-layout: fixed;
            width: max-content;
            min-width: 100%;
        }

        table.auto-fit {
            table-layout: auto;
            width: auto;
            min-width: 0;
        }

        thead { position: sticky; top: 0; z-index: 20; }

        th {
            background: #f1f5f9;
            padding: 5px 7px;
            text-align: left;
            border-bottom: 2px solid var(--border);
            border-right: 1px solid var(--border);
            white-space: nowrap;
            font-weight: 600;
            font-size: 11.5px;
            position: relative;
            overflow: hidden;
        }

        th .header-content {
            display: flex;
            align-items: center;
            gap: 3px;
            overflow: hidden;
            min-width: 0;
        }

        .header-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            min-width: 0;
        }

        .filter-icon {
            padding: 0 3px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 3px;
            font-size: 8px;
            line-height: 1;
            color: var(--text-muted);
            cursor: pointer;
            flex-shrink: 0;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .filter-icon:hover { background: #e2e8f0; color: var(--primary); }
        .filter-icon.filtered { background: var(--primary); color: white; }

        td {
            padding: 4px 7px;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            height: var(--row-height);
            line-height: calc(var(--row-height) - 12px);
            cursor: cell;
            font-size: 12px;
        }

        tbody tr:hover td { background: #f8fafc; }

        .checkbox-col { width: 32px; text-align: center; padding: 0; cursor: default; }

        .row-num-col {
            width: 42px;
            text-align: center;
            color: var(--text-muted);
            font-size: 10.5px;
            background: #fafafa;
            cursor: default;
            position: relative;
            overflow: visible;
        }

        .row-resizer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: -3px;
            height: 6px;
            cursor: row-resize;
            z-index: 25;
        }
        .row-resizer:hover::after,
        .row-resizer.active::after {
            content: '';
            position: absolute;
            left: 20%;
            right: 20%;
            bottom: 2px;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
        }

        td.selected-for-fill {
            outline: 2px solid var(--primary);
            outline-offset: -2px;
            background: #eff6ff !important;
        }

        td.fill-preview {
            background: #dbeafe !important;
            outline: 1px dashed var(--primary);
            outline-offset: -1px;
        }

        .fill-handle {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border: 1.5px solid white;
            border-radius: 2px;
            cursor: crosshair;
            z-index: 30;
            display: none;
        }

        .editable-cell-input,
        .editable-header-input {
            width: 100%;
            border: 2px solid var(--primary);
            padding: 2px 5px;
            border-radius: 3px;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            background: white;
        }

        /* BOTTOM BAR WITH PAGINATION */
        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 11px;
            background: #fafafa;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            gap: 8px;
            flex-wrap: wrap;
        }

        .bottom-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10.5px;
        }

        .bottom-left label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .bottom-left input[type="checkbox"] { cursor: pointer; accent-color: var(--primary); }

        .fill-hint { font-size: 9px; color: var(--text-muted); font-style: italic; }

        /* PAGINATION */
        .pagination {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            user-select: none;
            flex-wrap: wrap;
        }

        .pagination .page-info {
            font-size: 10.5px;
            color: var(--text-muted);
            margin-right: 8px;
            font-weight: 600;
        }

        .pagination button {
            cursor: pointer;
            border: 1px solid var(--border);
            background: white;
            border-radius: 4px;
            min-width: 26px;
            height: 26px;
            padding: 0 7px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dark);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.12s;
        }

        .pagination button:hover:not(:disabled):not(.active) {
            background: #eff6ff;
            border-color: var(--primary);
            color: var(--primary);
        }

        .pagination button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            font-weight: 700;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination .nav-btn {
            font-size: 13px;
            padding: 0 6px;
        }

        .pagination .ellipsis {
            padding: 0 3px;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* LOG */
        .log-section {
            background: #0f172a;
            color: #cbd5e1;
            padding: 0;
            font-family: monospace;
            font-size: 10px;
            flex-shrink: 0;
            max-height: 0;
            overflow: hidden;
        }
        .log-section.expanded { max-height: 70px; overflow-y: auto; padding: 4px 11px; }

        .log-header {
            background: #0f172a;
            color: #94a3b8;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            flex-shrink: 0;
        }
        .log-header:hover { background: #111d34; }
        .log-header .arrow { font-size: 9px; }
        .log-header.expanded .arrow { transform: rotate(180deg); }

        .log-entry { margin-bottom: 1px; }
        .log-success { color: #4ade80; }
        .log-warning { color: #fbbf24; }
        .log-error { color: #f87171; }

        /* FILTER POPUP */
        .filter-popup {
            position: fixed;
            z-index: 10000;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.2);
            width: 260px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            font-size: 12px;
        }
        .filter-popup.open { display: flex; }

        .filter-popup-header {
            padding: 8px 10px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }
        .filter-popup-header .col-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; }
        .filter-popup-header .count {
            background: #eff6ff;
            color: var(--primary);
            padding: 1px 6px;
            border-radius: 9px;
            font-size: 10px;
            font-weight: 700;
        }

        .filter-search-wrap { padding: 6px 8px; border-bottom: 1px solid var(--border); }
        .filter-search {
            width: 100%;
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 11.5px;
            outline: none;
            font-family: inherit;
        }
        .filter-search:focus { border-color: var(--primary); }

        .filter-popup-actions {
            padding: 4px 8px;
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border);
            background: #fafafa;
        }
        .filter-popup-actions button {
            flex: 1;
            padding: 3px 6px;
            font-size: 10.5px;
            background: white;
            border: 1px solid var(--border);
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            color: var(--text-dark);
        }
        .filter-popup-actions button:hover { background: #eff6ff; border-color: var(--primary); color: var(--primary); }

        .filter-popup-list { max-height: 200px; overflow-y: auto; padding: 2px 0; }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 9px;
            cursor: pointer;
            font-size: 11.5px;
        }
        .filter-item:hover { background: #f1f5f9; }
        .filter-item input { cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
        .filter-item .val {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        .filter-item .val-count {
            background: #f1f5f9;
            color: var(--text-muted);
            font-size: 10px;
            padding: 0 5px;
            border-radius: 8px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .filter-empty-note {
            padding: 15px;
            text-align: center;
            color: var(--text-muted);
            font-size: 11px;
            font-style: italic;
        }

        .filter-popup-footer {
            padding: 6px 8px;
            border-top: 1px solid var(--border);
            background: #f8fafc;
            display: flex;
            gap: 4px;
        }
        .filter-popup-footer button {
            flex: 1;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            border: none;
        }
        .filter-apply-btn { background: var(--primary); color: white; }
        .filter-apply-btn:hover { background: var(--primary-hover); }
        .filter-cancel-btn { background: white; color: var(--text-dark); border: 1px solid var(--border); }
        .filter-cancel-btn:hover { background: #f1f5f9; }

        /* Loading */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            font-weight: 600;
            flex-direction: column;
            gap: 10px;
            font-size: 13px;
        }
        .loading-overlay.active { display: flex; }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { transform: rotate(360deg); }
        @keyframes spin2 { to { transform: rotate(360deg); } }
        .spinner { animation: spin2 0.7s linear infinite; }

        @media (max-width: 1100px) {
            .action-group-label { display: none; }
            .brand h1 { display: none; }
        }
    </style>
</head>

<body>
    <div class="app-layout">

        <div class="top-toolbar">
            <a href="Control_Excel.html" class="home-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                Return Home
            </a>

            <div class="brand">
                <span class="icon">📐</span>
                <h1>Table Editor</h1>
            </div>

            <div class="action-groups">
                <div class="action-group">
                    <span class="action-group-label">File</span>
                    <label for="excelFile" class="file-label-btn">📁 Upload</label>
                    <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" style="display:none;">
                    <button id="exportBtn" class="tb-btn primary" disabled>💾 Export</button>
                </div>

                <div class="action-group">
                    <span class="action-group-label">Columns</span>
                    <button id="addColumnBtn" class="tb-btn success" disabled>➕ Add</button>
                    <button id="deleteSelectedColsBtn" class="tb-btn danger" disabled>🗑️ Delete</button>
                </div>

                <div class="action-group">
                    <span class="action-group-label">Rows</span>
                    <button id="addRowBtn" class="tb-btn success" disabled>➕ Add</button>
                    <button id="deleteSelectedRowsBtn" class="tb-btn danger" disabled>🗑️ Delete</button>
                </div>

                <div class="action-group">
                    <span class="action-group-label">Filters</span>
                    <button id="clearAllFiltersBtn" class="tb-btn info" disabled>🧹 Clear</button>
                </div>
            </div>

            <div class="toolbar-info">
                <span class="file-name-display" id="fileNameCompact">No file</span>
                <span class="badge filter" id="filterBadge">
                    <span id="filterBadgeText">0</span>
                    <button onclick="clearAllFilters()">✕</button>
                </span>
                <span class="badge selection" id="selectionInfo" style="display:none;"></span>
                <span class="badge vscroll" id="vscrollInfo">0 × 0</span>
            </div>
        </div>

        <div class="grid-area">
            <div class="grid-container">
                <div class="table-wrapper" id="tableWrapper">
                    <table id="editableTable">
                        <colgroup id="tableColgroup"></colgroup>
                        <thead id="tableHeader"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>

                <div class="bottom-bar">
                    <div class="bottom-left">
                        <label>
                            <input type="checkbox" id="selectAllCheckbox">
                            <span>Select Page</span>
                        </label>
                        <span class="fill-hint">💡 500 rows per page · Columns auto-fit · Drag row # bottom to resize rows</span>
                    </div>

                    <div class="pagination" id="paginationControls"></div>
                </div>
            </div>
        </div>

        <div class="log-header" id="logHeader" onclick="toggleLog()">
            <span>📋 Activity Log</span>
            <span class="arrow">▼</span>
        </div>
        <div class="log-section" id="logSection"></div>
    </div>

    <div class="fill-handle" id="fillHandle"></div>

    <div class="filter-popup" id="filterPopup">
        <div class="filter-popup-header">
            <span class="col-name" id="filterColName">Column</span>
            <span class="count" id="filterCount">0</span>
        </div>
        <div class="filter-search-wrap">
            <input type="text" class="filter-search" id="filterSearch" placeholder="🔍 Search...">
        </div>
        <div class="filter-popup-actions">
            <button type="button" id="filterSelectAllBtn">All</button>
            <button type="button" id="filterClearBtn">None</button>
        </div>
        <div class="filter-popup-list" id="filterList"></div>
        <div class="filter-popup-footer">
            <button type="button" class="filter-apply-btn" id="filterApplyBtn">Apply</button>
            <button type="button" class="filter-cancel-btn" id="filterCancelBtn">Cancel</button>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">Loading...</div>
    </div>

    <script>
        /* ============================================================
           CONSTANTS
           ============================================================ */
        let ROW_HEIGHT = 32;
        const ROWS_PER_PAGE = 500;
        const MIN_COL_WIDTH = 40;
        const MAX_COL_WIDTH = 700;
        const MIN_ROW_HEIGHT = 20;
        const MAX_ROW_HEIGHT = 200;
        const FILTER_LIST_CAP = 300;

        /* ============================================================
           STATE
           ============================================================ */
        let currentGridData = [];
        let currentHeaders = [];
        let columnWidths = [];
        let selectedRows = new Set();
        let selectedCols = new Set();
        let activeFilters = new Map();
        let filteredRowIndices = null;
        let uniqueCache = new Map();
        let openFilterCol = null;
        let pendingFilterValues = new Set();
        let fillSource = null;
        let fillDragging = false;
        let fillTargetRow = null;
        let fillTargetCol = null;
        let fillDirection = null;
        let fillStartX = 0;
        let fillStartY = 0;
        let rowResize = null;

        let currentPage = 1;
        let totalPages = 1;

        /* ============================================================
           DOM
           ============================================================ */
        const fileInput = document.getElementById("excelFile");
        const fileNameSpan = document.getElementById("fileNameCompact");
        const deleteSelectedColsBtn = document.getElementById("deleteSelectedColsBtn");
        const addColumnBtn = document.getElementById("addColumnBtn");
        const addRowBtn = document.getElementById("addRowBtn");
        const deleteSelectedRowsBtn = document.getElementById("deleteSelectedRowsBtn");
        const clearAllFiltersBtn = document.getElementById("clearAllFiltersBtn");
        const selectAllCheckbox = document.getElementById("selectAllCheckbox");
        const exportBtn = document.getElementById("exportBtn");
        const editableTable = document.getElementById("editableTable");
        const tableHeader = document.getElementById("tableHeader");
        const tableBody = document.getElementById("tableBody");
        const tableWrapper = document.getElementById("tableWrapper");
        const tableColgroup = document.getElementById("tableColgroup");
        const vscrollInfo = document.getElementById("vscrollInfo");
        const filterBadge = document.getElementById("filterBadge");
        const filterBadgeText = document.getElementById("filterBadgeText");
        const selectionInfo = document.getElementById("selectionInfo");
        const logSection = document.getElementById("logSection");
        const logHeader = document.getElementById("logHeader");
        const loadingOverlay = document.getElementById("loadingOverlay");
        const loadingText = document.getElementById("loadingText");
        const fillHandle = document.getElementById("fillHandle");
        const paginationControls = document.getElementById("paginationControls");

        const filterPopup = document.getElementById("filterPopup");
        const filterColName = document.getElementById("filterColName");
        const filterCount = document.getElementById("filterCount");
        const filterSearch = document.getElementById("filterSearch");
        const filterList = document.getElementById("filterList");
        const filterSelectAllBtn = document.getElementById("filterSelectAllBtn");
        const filterClearBtn = document.getElementById("filterClearBtn");
        const filterApplyBtn = document.getElementById("filterApplyBtn");
        const filterCancelBtn = document.getElementById("filterCancelBtn");

        /* ============================================================
           HELPERS
           ============================================================ */
        function addLog(msg, type = "info") {
            const entry = document.createElement("div");
            entry.className = `log-entry log-${type}`;
            entry.textContent = `> ${new Date().toLocaleTimeString()} — ${msg}`;
            logSection.appendChild(entry);
            logSection.scrollTop = logSection.scrollHeight;
            while (logSection.children.length > 30) logSection.removeChild(logSection.firstChild);
        }

        function toggleLog() {
            logSection.classList.toggle('expanded');
            logHeader.classList.toggle('expanded');
        }

        function cleanTextValue(text) {
            if (text === null || text === undefined) return "";
            let cleaned = String(text).trim();
            return (cleaned.toLowerCase() === "nan") ? "" : cleaned;
        }

        function escapeHtml(s) {
            if (s === null || s === undefined) return "";
            const str = String(s);
            if (str.indexOf('&') === -1 && str.indexOf('<') === -1 && str.indexOf('>') === -1 &&
                str.indexOf('"') === -1 && str.indexOf("'") === -1) return str;
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[m]));
        }

        function showLoading(msg) {
            loadingText.textContent = msg;
            loadingOverlay.classList.add('active');
        }
        function hideLoading() { loadingOverlay.classList.remove('active'); }

        function ensureFontsLoaded() {
            if (!document.fonts || !document.fonts.ready) return Promise.resolve();
            return Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]);
        }

        /* ============================================================
           AUTO-FIT COLUMNS
           ============================================================ */
        function autoFitColumns() {
            if (!currentHeaders.length) return;
            const previousColgroup = tableColgroup.innerHTML;
            editableTable.classList.add('auto-fit');
            tableColgroup.innerHTML = '';
            void editableTable.offsetWidth;

            const thEls = tableHeader.querySelectorAll('th');
            if (thEls.length < 3) {
                editableTable.classList.remove('auto-fit');
                tableColgroup.innerHTML = previousColgroup;
                return;
            }

            const newWidths = [];
            for (let i = 2; i < thEls.length; i++) {
                const w = thEls[i].offsetWidth;
                newWidths.push(Math.max(MIN_COL_WIDTH, Math.min(MAX_COL_WIDTH, w)));
            }
            editableTable.classList.remove('auto-fit');
            columnWidths = newWidths;
            applyColumnWidths();
        }

        function applyColumnWidths() {
            const parts = ['<col style="width: 32px;">', '<col style="width: 42px;">'];
            for (let i = 0; i < columnWidths.length; i++) parts.push('<col style="width:' + columnWidths[i] + 'px;">');
            tableColgroup.innerHTML = parts.join('');
        }

        function applyRowHeight() {
            document.documentElement.style.setProperty('--row-height', ROW_HEIGHT + 'px');
        }

        /* ============================================================
           FILTERS
           ============================================================ */
        function invalidateUniqueCache(colIdx) {
            if (colIdx !== undefined && colIdx !== null) uniqueCache.delete(colIdx);
            else uniqueCache.clear();
        }

        function getUniqueValues(colIdx) {
            if (uniqueCache.has(colIdx)) return uniqueCache.get(colIdx);
            const h = currentHeaders[colIdx];
            const counts = new Map();
            const n = currentGridData.length;
            for (let i = 0; i < n; i++) {
                const v = currentGridData[i][h];
                const key = (v === undefined || v === null) ? "" : String(v);
                counts.set(key, (counts.get(key) || 0) + 1);
            }
            const values = Array.from(counts.keys()).sort((a, b) => {
                const na = parseFloat(a), nb = parseFloat(b);
                if (!isNaN(na) && !isNaN(nb) && a !== "" && b !== "" && /^[+-]?\d+(\.\d+)?$/.test(a) && /^[+-]?\d+(\.\d+)?$/.test(b)) return na - nb;
                return a.localeCompare(b);
            });
            const result = { values, counts };
            uniqueCache.set(colIdx, result);
            return result;
        }

        function recomputeFilteredIndices() {
            if (activeFilters.size === 0) {
                filteredRowIndices = null;
                updateFilterBadge();
                return;
            }
            const n = currentGridData.length;
            const filters = Array.from(activeFilters.entries());
            const result = [];
            for (let i = 0; i < n; i++) {
                const row = currentGridData[i];
                let pass = true;
                for (let f = 0; f < filters.length; f++) {
                    const [colIdx, allowed] = filters[f];
                    const h = currentHeaders[colIdx];
                    const v = row[h];
                    const key = (v === undefined || v === null) ? "" : String(v);
                    if (!allowed.has(key)) { pass = false; break; }
                }
                if (pass) result.push(i);
            }
            filteredRowIndices = result;
            updateFilterBadge();
        }

        function getTotalFilteredRows() {
            return filteredRowIndices === null ? currentGridData.length : filteredRowIndices.length;
        }

        function getRealRowIndex(filteredPos) {
            return filteredRowIndices === null ? filteredPos : filteredRowIndices[filteredPos];
        }

        function updateFilterBadge() {
            const count = activeFilters.size;
            if (count === 0) filterBadge.classList.remove('active');
            else {
                filterBadge.classList.add('active');
                filterBadgeText.textContent = count + ' filter' + (count > 1 ? 's' : '');
            }
            clearAllFiltersBtn.disabled = count === 0;
        }

        function clearAllFilters() {
            if (activeFilters.size === 0) return;
            activeFilters.clear();
            recomputeFilteredIndices();
            currentPage = 1;
            renderTable();
            addLog("All filters cleared", "success");
        }

        /* ============================================================
           PAGINATION
           ============================================================ */
        function computeTotalPages() {
            const totalRows = getTotalFilteredRows();
            return Math.max(1, Math.ceil(totalRows / ROWS_PER_PAGE));
        }

        function renderPagination() {
            totalPages = computeTotalPages();
            if (currentPage > totalPages) currentPage = totalPages;

            const totalRows = getTotalFilteredRows();
            const startRow = totalRows === 0 ? 0 : (currentPage - 1) * ROWS_PER_PAGE + 1;
            const endRow = Math.min(currentPage * ROWS_PER_PAGE, totalRows);

            const parts = [];
            parts.push(`<span class="page-info">${startRow.toLocaleString()}–${endRow.toLocaleString()} of ${totalRows.toLocaleString()}</span>`);

            /* First & Prev */
            parts.push(`<button class="nav-btn" onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''} title="First page">«</button>`);
            parts.push(`<button class="nav-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} title="Previous page">‹</button>`);

            /* Page numbers with ellipsis */
            const pageNums = buildPageNumbers(currentPage, totalPages);
            for (let i = 0; i < pageNums.length; i++) {
                const p = pageNums[i];
                if (p === '…') {
                    parts.push(`<span class="ellipsis">…</span>`);
                } else {
                    parts.push(`<button class="${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`);
                }
            }

            /* Next & Last */
            parts.push(`<button class="nav-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} title="Next page">›</button>`);
            parts.push(`<button class="nav-btn" onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''} title="Last page">»</button>`);

            paginationControls.innerHTML = parts.join('');
        }

        function buildPageNumbers(current, total) {
            const pages = [];
            if (total <= 7) {
                for (let i = 1; i <= total; i++) pages.push(i);
                return pages;
            }
            pages.push(1);
            if (current > 4) pages.push('…');
            const start = Math.max(2, current - 1);
            const end = Math.min(total - 1, current + 1);
            for (let i = start; i <= end; i++) pages.push(i);
            if (current < total - 3) pages.push('…');
            pages.push(total);
            return pages;
        }

        function goToPage(p) {
            if (p < 1 || p > totalPages || p === currentPage) return;
            currentPage = p;
            tableWrapper.scrollTop = 0;
            renderBody();
            renderPagination();
        }

        /* ============================================================
           RENDER
           ============================================================ */
        function renderTable() {
            if (!currentHeaders.length) {
                tableHeader.innerHTML = "";
                tableBody.innerHTML = "";
                tableColgroup.innerHTML = "";
                paginationControls.innerHTML = "";
                updateControls(false);
                vscrollInfo.textContent = "0 × 0";
                return;
            }
            updateControls(true);
            renderHeader();
            renderBody();
            applyColumnWidths();
            renderPagination();
            updateSelectionInfo();
        }

        function renderHeader() {
            const parts = ['<tr><th class="checkbox-col"><input type="checkbox" id="selectAllColsCheckbox"></th><th class="row-num-col">#</th>'];
            for (let i = 0; i < currentHeaders.length; i++) {
                const h = currentHeaders[i];
                const isChecked = selectedCols.has(i);
                const isFiltered = activeFilters.has(i);
                parts.push('<th data-col="' + i + '"><div class="header-content"><input type="checkbox" class="col-checkbox" data-col="' + i + '"' + (isChecked ? ' checked' : '') + '><span class="header-title">' + escapeHtml(h) + '</span><button class="filter-icon' + (isFiltered ? ' filtered' : '') + '" data-col="' + i + '">▼</button></div></th>');
            }
            parts.push('</tr>');
            tableHeader.innerHTML = parts.join('');

            const sac = document.getElementById("selectAllColsCheckbox");
            if (sac) {
                sac.checked = selectedCols.size === currentHeaders.length;
                sac.onchange = (e) => {
                    if (e.target.checked) currentHeaders.forEach((_, i) => selectedCols.add(i));
                    else selectedCols.clear();
                    renderHeader();
                };
            }
        }

        /* ============================================================
           RENDER BODY — one page only
           ============================================================ */
        function renderBody() {
            const totalRows = getTotalFilteredRows();

            if (totalRows === 0) {
                tableBody.innerHTML = "";
                vscrollInfo.textContent = currentGridData.length === 0 ? "0 rows" : "0 of " + currentGridData.length.toLocaleString() + " (filtered)";
                renderPagination();
                updateFillHandlePosition();
                return;
            }

            totalPages = computeTotalPages();
            if (currentPage > totalPages) currentPage = totalPages;

            const startPos = (currentPage - 1) * ROWS_PER_PAGE;
            const endPos = Math.min(startPos + ROWS_PER_PAGE, totalRows);

            let previewVertical = null, previewHorizontal = null;
            if (fillDragging && fillSource) {
                if (fillDirection === 'vertical' && fillTargetRow !== null) {
                    previewVertical = {
                        min: Math.min(fillSource.row, fillTargetRow),
                        max: Math.max(fillSource.row, fillTargetRow),
                        col: fillSource.col
                    };
                } else if (fillDirection === 'horizontal' && fillTargetCol !== null) {
                    previewHorizontal = {
                        min: Math.min(fillSource.col, fillTargetCol),
                        max: Math.max(fillSource.col, fillTargetCol),
                        row: fillSource.row
                    };
                }
            }

            const headers = currentHeaders;
            const headersLen = headers.length;
            const parts = [];

            for (let pos = startPos; pos < endPos; pos++) {
                const realIdx = getRealRowIndex(pos);
                const row = currentGridData[realIdx];
                if (!row) continue;
                const isChecked = selectedRows.has(realIdx);

                parts.push('<tr data-row="', realIdx, '">');
                parts.push('<td class="checkbox-col"><input type="checkbox" class="row-checkbox" data-row="', realIdx, '"', isChecked ? ' checked' : '', '></td>');
                parts.push('<td class="row-num-col">', realIdx + 1, '<div class="row-resizer"></div></td>');

                for (let c = 0; c < headersLen; c++) {
                    const h = headers[c];
                    const val = row[h] !== undefined && row[h] !== null ? row[h] : "";

                    let cls = '';
                    if (fillSource && fillSource.row === realIdx && fillSource.col === c) {
                        cls = ' class="selected-for-fill"';
                    } else if (previewVertical && previewVertical.col === c && realIdx !== fillSource.row
                        && realIdx >= previewVertical.min && realIdx <= previewVertical.max) {
                        cls = ' class="fill-preview"';
                    } else if (previewHorizontal && previewHorizontal.row === realIdx && c !== fillSource.col
                        && c >= previewHorizontal.min && c <= previewHorizontal.max) {
                        cls = ' class="fill-preview"';
                    }

                    parts.push('<td data-r="', realIdx, '" data-c="', c, '"', cls, '>', escapeHtml(val), '</td>');
                }
                parts.push('</tr>');
            }

            tableBody.innerHTML = parts.join('');

            if (filteredRowIndices !== null) {
                vscrollInfo.textContent = totalRows.toLocaleString() + ' filtered · page ' + currentPage + '/' + totalPages;
            } else {
                vscrollInfo.textContent = totalRows.toLocaleString() + ' rows · page ' + currentPage + '/' + totalPages;
            }

            updateSelectAllState();
            updateFillHandlePosition();
        }

        /* ============================================================
           DELEGATED EVENTS
           ============================================================ */
        tableBody.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            const rz = e.target.closest('.row-resizer');
            if (rz) { onRowResizeStart(e, rz); return; }
            if (e.target.tagName === 'INPUT') return;
            const td = e.target.closest('td[data-r][data-c]');
            if (!td) return;
            selectCellForFill(parseInt(td.dataset.r), parseInt(td.dataset.c), td);
        });

        tableBody.addEventListener('dblclick', (e) => {
            const td = e.target.closest('td[data-r][data-c]');
            if (!td) return;
            editCell(parseInt(td.dataset.r), parseInt(td.dataset.c));
        });

        tableBody.addEventListener('change', (e) => {
            if (e.target.classList.contains('row-checkbox')) {
                const idx = parseInt(e.target.dataset.row);
                if (e.target.checked) selectedRows.add(idx);
                else selectedRows.delete(idx);
                updateSelectionInfo();
                updateSelectAllState();
            }
        });

        tableHeader.addEventListener('change', (e) => {
            if (e.target.classList.contains('col-checkbox')) {
                const idx = parseInt(e.target.dataset.col);
                if (e.target.checked) selectedCols.add(idx);
                else selectedCols.delete(idx);
                updateSelectionInfo();
            }
        });

        tableHeader.addEventListener('click', (e) => {
            const fi = e.target.closest('.filter-icon');
            if (!fi) return;
            e.stopPropagation();
            const colIdx = parseInt(fi.dataset.col);
            if (openFilterCol === colIdx) closeFilterPopup();
            else openFilter(colIdx, fi);
        });

        tableHeader.addEventListener('dblclick', (e) => {
            const title = e.target.closest('.header-title');
            if (!title) return;
            editHeader(parseInt(title.closest('th').dataset.col));
        });

        /* ============================================================
           ROW RESIZE
           ============================================================ */
        function onRowResizeStart(e, handleEl) {
            e.preventDefault();
            e.stopPropagation();
            closeFilterPopup();
            deselectFill();
            rowResize = { startY: e.clientY, startHeight: ROW_HEIGHT, handleEl };
            handleEl.classList.add('active');
            document.body.style.cursor = 'row-resize';
            document.body.style.userSelect = 'none';
            document.addEventListener('mousemove', onRowResizeMove);
            document.addEventListener('mouseup', onRowResizeEnd);
        }

        function onRowResizeMove(e) {
            if (!rowResize) return;
            const diff = e.clientY - rowResize.startY;
            ROW_HEIGHT = Math.max(MIN_ROW_HEIGHT, Math.min(MAX_ROW_HEIGHT, Math.round(rowResize.startHeight + diff)));
            applyRowHeight();
        }

        function onRowResizeEnd() {
            if (!rowResize) return;
            const { handleEl } = rowResize;
            if (handleEl) handleEl.classList.remove('active');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            document.removeEventListener('mousemove', onRowResizeMove);
            document.removeEventListener('mouseup', onRowResizeEnd);
            addLog(`Row height → ${ROW_HEIGHT}px`, "info");
            rowResize = null;
        }

        /* ============================================================
           FILTER POPUP
           ============================================================ */
        function openFilter(colIdx, anchorEl) {
            closeFilterPopup();
            openFilterCol = colIdx;
            const { values, counts } = getUniqueValues(colIdx);
            const existing = activeFilters.get(colIdx);
            pendingFilterValues = existing ? new Set(existing) : new Set(values);
            filterColName.textContent = currentHeaders[colIdx];
            filterSearch.value = "";
            filterCount.textContent = values.length + ' value' + (values.length !== 1 ? 's' : '');
            renderFilterList(values, counts);

            const rect = anchorEl.getBoundingClientRect();
            const popupWidth = 260, popupHeight = 400;
            let left = Math.max(8, Math.min(rect.right - popupWidth, window.innerWidth - popupWidth - 8));
            let top = rect.bottom + 4;
            if (top + popupHeight > window.innerHeight - 8) top = Math.max(8, window.innerHeight - popupHeight - 8);

            filterPopup.style.left = left + 'px';
            filterPopup.style.top = top + 'px';
            filterPopup.classList.add('open');
            setTimeout(() => filterSearch.focus(), 30);
        }

        function closeFilterPopup() {
            filterPopup.classList.remove('open');
            openFilterCol = null;
            pendingFilterValues = new Set();
        }

        function renderFilterList(values, counts) {
            const searchTerm = (filterSearch.value || "").trim().toLowerCase();
            let visible = searchTerm ? values.filter(v => v.toLowerCase().includes(searchTerm)) : values;
            const capped = visible.slice(0, FILTER_LIST_CAP);

            if (capped.length === 0) {
                filterList.innerHTML = '<div class="filter-empty-note">No values match</div>';
                return;
            }

            const parts = [];
            for (let i = 0; i < capped.length; i++) {
                const v = capped[i];
                const checked = pendingFilterValues.has(v);
                const cnt = counts.get(v) || 0;
                const display = v === "" ? "(empty)" : v;
                parts.push('<label class="filter-item"><input type="checkbox" data-val="' + escapeHtml(v) + '"' + (checked ? ' checked' : '') + '><span class="val">' + escapeHtml(display) + '</span><span class="val-count">' + cnt + '</span></label>');
            }
            if (visible.length > FILTER_LIST_CAP) {
                parts.push('<div class="filter-empty-note">… ' + (visible.length - FILTER_LIST_CAP) + ' more — refine search</div>');
            }
            filterList.innerHTML = parts.join('');
        }

        function unescapeHtml(s) {
            return String(s)
                .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
                .replace(/&quot;/g, '"').replace(/&#039;/g, "'");
        }

        filterList.addEventListener('change', (e) => {
            if (e.target.type !== 'checkbox') return;
            const realVal = unescapeHtml(e.target.dataset.val);
            if (e.target.checked) pendingFilterValues.add(realVal);
            else pendingFilterValues.delete(realVal);
        });

        function applyFilterFromPopup() {
            if (openFilterCol === null) return;
            const colIdx = openFilterCol;
            const { values } = getUniqueValues(colIdx);

            if (pendingFilterValues.size === values.length) {
                if (activeFilters.has(colIdx)) {
                    activeFilters.delete(colIdx);
                    addLog(`Filter removed from "${currentHeaders[colIdx]}"`, "info");
                }
            } else if (pendingFilterValues.size === 0) {
                addLog(`⚠️ No values selected`, "warning");
                closeFilterPopup();
                return;
            } else {
                activeFilters.set(colIdx, new Set(pendingFilterValues));
                addLog(`Filter on "${currentHeaders[colIdx]}" — ${pendingFilterValues.size} kept`, "success");
            }

            recomputeFilteredIndices();
            currentPage = 1;
            renderTable();
            closeFilterPopup();
        }

        filterSearch.addEventListener('input', () => {
            if (openFilterCol === null) return;
            const { values, counts } = getUniqueValues(openFilterCol);
            renderFilterList(values, counts);
        });

        filterSelectAllBtn.addEventListener('click', () => {
            if (openFilterCol === null) return;
            const { values, counts } = getUniqueValues(openFilterCol);
            const searchTerm = (filterSearch.value || "").trim().toLowerCase();
            const visible = searchTerm ? values.filter(v => v.toLowerCase().includes(searchTerm)) : values;
            visible.forEach(v => pendingFilterValues.add(v));
            renderFilterList(values, counts);
        });

        filterClearBtn.addEventListener('click', () => {
            if (openFilterCol === null) return;
            const { values, counts } = getUniqueValues(openFilterCol);
            const searchTerm = (filterSearch.value || "").trim().toLowerCase();
            const visible = searchTerm ? values.filter(v => v.toLowerCase().includes(searchTerm)) : values;
            visible.forEach(v => pendingFilterValues.delete(v));
            renderFilterList(values, counts);
        });

        filterApplyBtn.addEventListener('click', applyFilterFromPopup);
        filterCancelBtn.addEventListener('click', closeFilterPopup);

        document.addEventListener('mousedown', (e) => {
            if (!filterPopup.classList.contains('open')) return;
            if (filterPopup.contains(e.target)) return;
            if (e.target.classList.contains('filter-icon')) return;
            closeFilterPopup();
        });

        tableWrapper.addEventListener('scroll', () => {
            if (filterPopup.classList.contains('open')) closeFilterPopup();
        }, { passive: true });

        window.addEventListener('resize', () => {
            if (filterPopup.classList.contains('open')) closeFilterPopup();
            updateFillHandlePosition();
        });

        /* ============================================================
           CELL / HEADER EDITING
           ============================================================ */
        function editCell(rIdx, cIdx) {
            const tr = tableBody.querySelector('tr[data-row="' + rIdx + '"]');
            if (!tr) return;
            const td = tr.querySelector('td[data-c="' + cIdx + '"]');
            if (!td) return;

            const oldVal = currentGridData[rIdx][currentHeaders[cIdx]] || "";
            const input = document.createElement("input");
            input.className = "editable-cell-input";
            input.value = oldVal;
            td.innerHTML = "";
            td.appendChild(input);
            input.focus();
            input.select();

            let saved = false;
            const save = () => {
                if (saved) return;
                saved = true;
                const newVal = cleanTextValue(input.value);
                currentGridData[rIdx][currentHeaders[cIdx]] = newVal;
                invalidateUniqueCache(cIdx);
                if (activeFilters.size > 0) recomputeFilteredIndices();
                renderBody();
            };
            input.onblur = save;
            input.onkeydown = (e) => {
                if (e.key === "Enter") save();
                if (e.key === "Escape") { saved = true; renderBody(); }
            };
        }

        function editHeader(cIdx) {
            const th = tableHeader.querySelector('th[data-col="' + cIdx + '"]');
            if (!th) return;
            const headerTitle = th.querySelector('.header-title');
            const oldName = currentHeaders[cIdx];
            const input = document.createElement("input");
            input.className = "editable-header-input";
            input.value = oldName;
            headerTitle.replaceWith(input);
            input.focus();
            input.select();

            let saved = false;
            const save = () => {
                if (saved) return;
                saved = true;
                let newName = cleanTextValue(input.value);
                if (!newName || (newName !== oldName && currentHeaders.includes(newName))) newName = oldName;
                if (newName !== oldName) {
                    currentGridData.forEach(row => {
                        row[newName] = row[oldName];
                        delete row[oldName];
                    });
                    currentHeaders[cIdx] = newName;
                    invalidateUniqueCache(cIdx);
                    addLog(`Renamed to "${newName}"`, "success");
                }
                renderTable();
                setTimeout(autoFitColumns, 0);
            };
            input.onblur = save;
            input.onkeydown = (e) => {
                if (e.key === "Enter") save();
                if (e.key === "Escape") { saved = true; renderHeader(); }
            };
        }

        /* ============================================================
           FILL
           ============================================================ */
        function selectCellForFill(rowIdx, colIdx, td) {
            if (fillSource && fillSource.row === rowIdx && fillSource.col === colIdx) return;
            clearFillSelectionInDom();
            fillSource = { row: rowIdx, col: colIdx };
            if (td) td.classList.add('selected-for-fill');
            updateFillHandlePosition();
        }

        function clearFillSelectionInDom() {
            tableBody.querySelectorAll('td.selected-for-fill').forEach(td => td.classList.remove('selected-for-fill'));
            tableBody.querySelectorAll('td.fill-preview').forEach(td => td.classList.remove('fill-preview'));
        }

        function deselectFill() {
            fillSource = null;
            fillDragging = false;
            fillTargetRow = null;
            fillTargetCol = null;
            fillDirection = null;
            fillHandle.style.display = 'none';
            clearFillSelectionInDom();
        }

        function updateFillHandlePosition() {
            if (!fillSource) { fillHandle.style.display = 'none'; return; }
            const tr = tableBody.querySelector('tr[data-row="' + fillSource.row + '"]');
            const td = tr ? tr.querySelector('td[data-c="' + fillSource.col + '"]') : null;
            if (!td) { fillHandle.style.display = 'none'; return; }
            const r = td.getBoundingClientRect();
            fillHandle.style.display = 'block';
            fillHandle.style.left = (r.right - 4) + 'px';
            fillHandle.style.top = (r.bottom - 4) + 'px';
        }

        fillHandle.addEventListener('mousedown', (e) => {
            if (!fillSource) return;
            e.preventDefault();
            e.stopPropagation();
            fillDragging = true;
            fillTargetRow = null;
            fillTargetCol = null;
            fillDirection = null;
            fillStartX = e.clientX;
            fillStartY = e.clientY;
            document.body.style.userSelect = 'none';
            document.body.style.cursor = 'crosshair';
            document.addEventListener('mousemove', onFillDragMove);
            document.addEventListener('mouseup', onFillDragEnd);
        });

        function getCellAtPoint(x, y) {
            const el = document.elementFromPoint(x, y);
            if (!el) return null;
            const td = el.closest('td[data-r][data-c]');
            if (!td) return null;
            return { row: parseInt(td.dataset.r), col: parseInt(td.dataset.c) };
        }

        function onFillDragMove(e) {
            if (!fillDragging || !fillSource) return;
            const cell = getCellAtPoint(e.clientX, e.clientY);
            const dx = Math.abs(e.clientX - fillStartX);
            const dy = Math.abs(e.clientY - fillStartY);
            if (fillDirection === null && (dx > 5 || dy > 5)) fillDirection = dx > dy ? 'horizontal' : 'vertical';
            if (fillDirection === 'vertical') {
                if (cell) { fillTargetRow = cell.row; fillTargetCol = null; }
            } else if (fillDirection === 'horizontal') {
                if (cell) { fillTargetCol = cell.col; fillTargetRow = null; }
            }
            renderBody();
        }

        function onFillDragEnd() {
            if (!fillDragging) return;
            fillDragging = false;
            document.removeEventListener('mousemove', onFillDragMove);
            document.removeEventListener('mouseup', onFillDragEnd);
            document.body.style.userSelect = '';
            document.body.style.cursor = '';

            const tRow = fillTargetRow, tCol = fillTargetCol, dir = fillDirection;
            tableBody.querySelectorAll('td.fill-preview').forEach(td => td.classList.remove('fill-preview'));

            if (dir === 'vertical' && tRow !== null && fillSource && tRow !== fillSource.row) applyFillVertical(tRow);
            else if (dir === 'horizontal' && tCol !== null && fillSource && tCol !== fillSource.col) applyFillHorizontal(tCol);

            fillTargetRow = null; fillTargetCol = null; fillDirection = null;
            renderBody();
        }

        function applyFillVertical(targetRow) {
            if (!fillSource) return;
            const h = currentHeaders[fillSource.col];
            const value = currentGridData[fillSource.row][h];
            const minRow = Math.min(fillSource.row, targetRow);
            const maxRow = Math.max(fillSource.row, targetRow);
            let count = 0;
            for (let r = minRow; r <= maxRow; r++) {
                if (r === fillSource.row) continue;
                currentGridData[r][h] = value;
                count++;
            }
            invalidateUniqueCache(fillSource.col);
            if (activeFilters.size > 0) recomputeFilteredIndices();
            addLog(`Filled ${count} cell(s) ▼ with "${value === "" ? "(empty)" : value}"`, "success");
        }

        function applyFillHorizontal(targetCol) {
            if (!fillSource) return;
            const row = currentGridData[fillSource.row];
            const value = row[currentHeaders[fillSource.col]];
            const minCol = Math.min(fillSource.col, targetCol);
            const maxCol = Math.max(fillSource.col, targetCol);
            let count = 0;
            for (let c = minCol; c <= maxCol; c++) {
                if (c === fillSource.col) continue;
                row[currentHeaders[c]] = value;
                invalidateUniqueCache(c);
                count++;
            }
            if (activeFilters.size > 0) recomputeFilteredIndices();
            addLog(`Filled ${count} cell(s) ▶ with "${value === "" ? "(empty)" : value}"`, "success");
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !fillDragging) {
                if (filterPopup.classList.contains('open')) return;
                deselectFill();
            }
        });

        /* ============================================================
           SELECTION
           ============================================================ */
        function updateSelectionInfo() {
            const parts = [];
            if (selectedRows.size > 0) parts.push(selectedRows.size + ' row(s)');
            if (selectedCols.size > 0) parts.push(selectedCols.size + ' col(s)');
            if (parts.length) {
                selectionInfo.textContent = 'Selected: ' + parts.join(' · ');
                selectionInfo.style.display = 'inline-flex';
            } else {
                selectionInfo.style.display = 'none';
            }
        }

        function updateSelectAllState() {
            if (selectAllCheckbox) {
                /* "Select Page" checkbox reflects current page selection */
                const totalRows = getTotalFilteredRows();
                const startPos = (currentPage - 1) * ROWS_PER_PAGE;
                const endPos = Math.min(startPos + ROWS_PER_PAGE, totalRows);
                const pageCount = endPos - startPos;
                let selectedOnPage = 0;
                for (let pos = startPos; pos < endPos; pos++) {
                    if (selectedRows.has(getRealRowIndex(pos))) selectedOnPage++;
                }
                selectAllCheckbox.checked = pageCount > 0 && selectedOnPage === pageCount;
            }
        }

        function updateControls(enabled) {
            [deleteSelectedColsBtn, addColumnBtn, addRowBtn, deleteSelectedRowsBtn, exportBtn].forEach(btn => {
                if (btn) btn.disabled = !enabled;
            });
            if (!enabled) clearAllFiltersBtn.disabled = true;
            else clearAllFiltersBtn.disabled = activeFilters.size === 0;
        }

        /* ============================================================
           ACTIONS
           ============================================================ */
        addColumnBtn.onclick = () => {
            const name = 'Col_' + (currentHeaders.length + 1);
            currentHeaders.push(name);
            currentGridData.forEach(r => r[name] = "");
            columnWidths.push(120);
            invalidateUniqueCache();
            activeFilters.clear();
            recomputeFilteredIndices();
            addLog(`Added "${name}"`, "success");
            renderTable();
            setTimeout(autoFitColumns, 0);
        };

        deleteSelectedColsBtn.onclick = () => {
            if (selectedCols.size === 0) return addLog("No columns selected", "warning");
            const newHeaders = [], newWidths = [];
            currentHeaders.forEach((h, i) => {
                if (!selectedCols.has(i)) { newHeaders.push(h); newWidths.push(columnWidths[i]); }
            });
            currentGridData = currentGridData.map(row => {
                const nr = {};
                newHeaders.forEach(h => nr[h] = row[h] !== undefined ? row[h] : "");
                return nr;
            });
            const deletedCount = currentHeaders.length - newHeaders.length;
            currentHeaders = newHeaders;
            columnWidths = newWidths;
            selectedCols.clear();
            invalidateUniqueCache();
            activeFilters.clear();
            recomputeFilteredIndices();
            deselectFill();
            addLog(`Deleted ${deletedCount} col(s)`, "danger");
            renderTable();
            setTimeout(autoFitColumns, 0);
        };

        addRowBtn.onclick = () => {
            const newRow = {};
            currentHeaders.forEach(h => newRow[h] = "");
            currentGridData.push(newRow);
            invalidateUniqueCache();
            if (activeFilters.size > 0) recomputeFilteredIndices();
            /* Jump to last page to show new row */
            currentPage = computeTotalPages();
            addLog("Added new row", "success");
            renderTable();
        };

        deleteSelectedRowsBtn.onclick = () => {
            if (selectedRows.size === 0) return addLog("No rows selected", "warning");
            const before = currentGridData.length;
            const keepMask = new Array(before).fill(true);
            selectedRows.forEach(i => keepMask[i] = false);
            currentGridData = currentGridData.filter((_, i) => keepMask[i]);
            const deleted = before - currentGridData.length;
            selectedRows.clear();
            selectAllCheckbox.checked = false;
            invalidateUniqueCache();
            recomputeFilteredIndices();
            deselectFill();
            addLog(`Deleted ${deleted} row(s)`, "danger");
            renderTable();
        };

        /* "Select Page" — selects only the current page */
        selectAllCheckbox.onchange = (e) => {
            const totalRows = getTotalFilteredRows();
            const startPos = (currentPage - 1) * ROWS_PER_PAGE;
            const endPos = Math.min(startPos + ROWS_PER_PAGE, totalRows);
            if (e.target.checked) {
                for (let pos = startPos; pos < endPos; pos++) selectedRows.add(getRealRowIndex(pos));
            } else {
                for (let pos = startPos; pos < endPos; pos++) selectedRows.delete(getRealRowIndex(pos));
            }
            renderBody();
            updateSelectionInfo();
        };

        exportBtn.onclick = () => {
            showLoading("Exporting...");
            setTimeout(() => {
                try {
                    const dataToExport = filteredRowIndices === null
                        ? currentGridData
                        : filteredRowIndices.map(i => currentGridData[i]);
                    const ws = XLSX.utils.json_to_sheet(dataToExport, { header: currentHeaders });
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Data");
                    XLSX.writeFile(wb, "table_export.xlsx");
                    addLog(`Exported ${dataToExport.length} row(s)`, "success");
                } catch (err) {
                    addLog("Export failed: " + err.message, "error");
                }
                hideLoading();
            }, 50);
        };

        clearAllFiltersBtn.onclick = clearAllFilters;

        /* ============================================================
           FILE LOAD
           ============================================================ */
        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            fileNameSpan.textContent = file.name;
            fileNameSpan.title = file.name;
            showLoading(`Loading ${file.name}...`);

            await ensureFontsLoaded();
            await new Promise(r => requestAnimationFrame(r));

            try {
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data, { type: "array" });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

                if (rawRows.length === 0) {
                    addLog("File is empty", "warning");
                    hideLoading();
                    return;
                }

                currentHeaders = rawRows[0].map((h, i) => {
                    const v = cleanTextValue(h);
                    return v || 'Col_' + (i + 1);
                });

                const headersLen = currentHeaders.length;
                currentGridData = new Array(rawRows.length - 1);
                for (let r = 1; r < rawRows.length; r++) {
                    const rowArr = rawRows[r];
                    const rowObj = {};
                    for (let c = 0; c < headersLen; c++) {
                        rowObj[currentHeaders[c]] = rowArr[c] !== undefined && rowArr[c] !== null ? rowArr[c] : "";
                    }
                    currentGridData[r - 1] = rowObj;
                }

                selectedRows.clear();
                selectedCols.clear();
                selectAllCheckbox.checked = false;
                activeFilters.clear();
                invalidateUniqueCache();
                filteredRowIndices = null;
                updateFilterBadge();
                deselectFill();
                tableWrapper.scrollTop = 0;

                currentPage = 1;
                columnWidths = currentHeaders.map(() => 120);
                applyRowHeight();

                renderTable();

                setTimeout(() => {
                    autoFitColumns();
                    const totalRows = currentGridData.length;
                    const pages = Math.ceil(totalRows / ROWS_PER_PAGE);
                    addLog(`Loaded "${file.name}" — ${totalRows.toLocaleString()} rows × ${headersLen} cols · ${pages} page${pages !== 1 ? 's' : ''}`, "success");
                }, 20);

            } catch (err) {
                addLog("Error: " + err.message, "error");
                console.error(err);
            } finally {
                hideLoading();
            }
        };

        applyRowHeight();
        ensureFontsLoaded();
    </script>
</body>
