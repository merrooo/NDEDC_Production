<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإدارة العامة للعدادات الذكية — لوحة التحكم</title>

  <!-- Prevent Theme Flash -->
  <script>
    (function () {
      const saved = localStorage.getItem('ndedc_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <!-- Google Fonts & Ionicons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <style>
    /* ============================================================
       THEME TOKENS & ULTRA-TRANSPARENT GLASS SYSTEM
       ============================================================ */
    :root {
      color-scheme: light;

      /* Emerald & Mesh Palette */
      --brand-primary: #10b981;
      --brand-hover: #059669;
      --brand-soft: rgba(16, 185, 129, 0.10);
      --brand-glow: rgba(16, 185, 129, 0.25);

      /* High Transparency Ambient Mesh Background */
      --bg-gradient: radial-gradient(1200px 800px at 85% -10%, rgba(16, 185, 129, 0.18), transparent 60%),
                     radial-gradient(1000px 700px at -10% 110%, rgba(5, 150, 105, 0.12), transparent 55%),
                     #e8f3ec;

      /* High Transparency Frosted Glass Surfaces */
      --glass-bg: rgba(255, 255, 255, 0.38);
      --glass-bg-hover: rgba(255, 255, 255, 0.62);
      --glass-border: rgba(255, 255, 255, 0.65);
      --glass-border-hover: rgba(16, 185, 129, 0.4);
      --glass-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.03), 0 20px 30px -15px rgba(16, 185, 129, 0.06);
      --glass-shadow-lg: 0 30px 70px -15px rgba(16, 185, 129, 0.18);

      /* Item / Button Tokens */
      --item-bg: rgba(255, 255, 255, 0.20);
      --item-bg-hover: rgba(16, 185, 129, 0.10);
      --item-icon-bg: rgba(16, 185, 129, 0.10);
      --item-icon-bg-hover: rgba(16, 185, 129, 0.22);

      /* Typography & Accents */
      --text-main: #0b1324;
      --text-muted: #475569;
      --text-subtle: #94a3b8;
      --border-subtle: rgba(15, 23, 42, 0.05);

      --status-success: #10b981;
      --status-danger: #ef4444;

      /* Smooth Ease Timing & Slow Sidebar Expansion */
      --ease-smooth: cubic-bezier(0.25, 1, 0.3, 1);
      --sidebar-speed: 0.95s; 
    }

    [data-theme="dark"] {
      color-scheme: dark;

      /* Dark Emerald Palette */
      --brand-primary: #34d399;
      --brand-hover: #10b981;
      --brand-soft: rgba(52, 211, 153, 0.12);
      --brand-glow: rgba(52, 211, 153, 0.4);

      /* Dark Ambient Mesh */
      --bg-gradient: radial-gradient(1200px 900px at 90% -10%, rgba(52, 211, 153, 0.12), transparent 55%),
                     radial-gradient(900px 700px at -10% 100%, rgba(16, 185, 129, 0.08), transparent 55%),
                     #030705;

      /* High Transparency Dark Frosted Glass */
      --glass-bg: rgba(10, 20, 16, 0.42);
      --glass-bg-hover: rgba(18, 34, 28, 0.62);
      --glass-border: rgba(52, 211, 153, 0.12);
      --glass-border-hover: rgba(52, 211, 153, 0.32);
      --glass-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.6);
      --glass-shadow-lg: 0 30px 70px -15px rgba(0, 0, 0, 0.8);

      /* Item Tokens */
      --item-bg: rgba(255, 255, 255, 0.02);
      --item-bg-hover: rgba(52, 211, 153, 0.12);
      --item-icon-bg: rgba(52, 211, 153, 0.12);
      --item-icon-bg-hover: rgba(52, 211, 153, 0.24);

      /* Typography */
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --text-subtle: #64748b;
      --border-subtle: rgba(255, 255, 255, 0.06);

      --status-success: #34d399;
    }

    /* ============================================================
       BASE STYLES & RESET (Slightly smaller font size)
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      color: var(--text-main);
      font-size: 12.5px; /* Reduced base font size */
      line-height: 1.45;
      background: var(--bg-gradient);
      background-attachment: fixed;
      transition: background 0.6s ease, color 0.4s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       LAYOUT WRAPPER
       ============================================================ */
    .app-wrapper {
      display: flex;
      height: 100vh;
      padding: 16px;
      gap: 16px;
      position: relative;
    }

    /* ============================================================
       SIDEBARS (SLOW SMOOTH EXPANSION & CONTRACTION)
       ============================================================ */
    .sidebar {
      width: 68px;
      flex-shrink: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--glass-shadow);
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      z-index: 100;
      transition: width var(--sidebar-speed) var(--ease-smooth),
                  background 0.5s ease,
                  border-color 0.5s ease,
                  box-shadow 0.5s ease;
      will-change: width;
    }

    .sidebar:hover {
      width: 290px;
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
      box-shadow: var(--glass-shadow-lg);
    }

    .sidebar::-webkit-scrollbar {
      width: 3px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: var(--brand-soft);
      border-radius: 99px;
    }

    .divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 8px 6px;
      flex-shrink: 0;
    }

    /* ============================================================
       NAV BUTTONS
       ============================================================ */
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 46px;
      padding: 0 8px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: var(--item-bg);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.85rem; /* Reduced font size */
      font-weight: 700;
      text-align: right;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: background 0.4s ease,
                  border-color 0.4s ease,
                  color 0.4s ease,
                  transform 0.4s var(--ease-smooth),
                  box-shadow 0.4s ease;
    }

    .nav-btn:hover {
      background: var(--item-bg-hover);
      color: var(--text-main);
      border-color: var(--glass-border-hover);
      transform: translateY(-1px);
    }

    .nav-btn .icon {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: var(--item-icon-bg);
      color: var(--brand-primary);
      font-size: 19px;
      transition: background 0.4s ease,
                  color 0.4s ease,
                  transform 0.5s var(--ease-smooth);
    }

    .nav-btn:hover .icon {
      background: var(--item-icon-bg-hover);
      color: var(--brand-hover);
      transform: scale(1.08);
    }

    .nav-btn .label {
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-12px);
      transition: opacity calc(var(--sidebar-speed) * 0.7) var(--ease-smooth),
                  transform calc(var(--sidebar-speed) * 0.7) var(--ease-smooth);
    }

    .sidebar:hover .nav-btn .label {
      opacity: 1;
      transform: translateX(0);
    }

    .nav-btn .hint {
      margin-right: auto;
      font-size: 15px;
      color: var(--text-subtle);
      opacity: 0;
      transition: opacity calc(var(--sidebar-speed) * 0.6) ease;
      flex-shrink: 0;
    }

    .sidebar:hover .nav-btn .hint {
      opacity: 1;
    }

    /* Active State Indicator */
    .nav-btn.active {
      background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-hover) 100%);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 8px 20px -6px var(--brand-glow);
    }

    .nav-btn.active .icon {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .nav-btn.active .hint {
      color: rgba(255, 255, 255, 0.85);
    }

    /* ============================================================
       MAIN CONTENT CARD
       ============================================================ */
    .main-content {
      flex: 1;
      min-width: 0;
      display: flex;
    }

    .card {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--glass-shadow);
      overflow: hidden;
      transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.98rem; /* Slightly reduced font size */
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      color: var(--text-main);
    }

    .card-title::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-hover) 100%);
      box-shadow: 0 0 0 3px var(--brand-soft);
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .time-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      background: var(--brand-soft);
      color: var(--brand-hover);
      border: 1px solid var(--glass-border-hover);
      border-radius: 99px;
      font-size: 0.76rem; /* Reduced font size */
      font-weight: 700;
      white-space: nowrap;
      transition: all 0.4s ease;
    }

    [data-theme="dark"] .time-badge {
      color: var(--brand-primary);
    }

    .time-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      background: var(--status-success);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      animation: pulse-ring 2s infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
      50% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0.03); }
    }

    /* Modern Theme Switcher */
    .theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand-hover);
      font-size: 17px;
      transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease, transform 0.5s var(--ease-smooth);
    }

    .theme-toggle:hover {
      background: var(--brand-primary);
      color: #ffffff;
      border-color: var(--brand-primary);
      transform: rotate(180deg);
      box-shadow: 0 5px 15px -4px var(--brand-glow);
    }

    /* Frame Canvas */
    .iframe-wrapper {
      flex: 1;
      min-height: 0;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      background: var(--glass-bg-hover);
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    [data-theme="dark"] .iframe-wrapper iframe {
      background: #f8fafc;
    }

    /* ============================================================
       FLOATING NOTES COMPONENT
       ============================================================ */
    .floating-note-container {
      position: fixed;
      top: 86px;
      right: 96px;
      width: 310px;
      background: var(--glass-bg);
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow: var(--glass-shadow-lg);
      overflow: hidden;
      z-index: 950;
      transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .note-drag-handle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-hover) 100%);
      color: #ffffff;
      cursor: move;
      user-select: none;
    }

    .note-drag-handle h4 {
      font-size: 0.83rem;
      font-weight: 700;
      flex: 1;
    }

    .note-collapse-btn {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 7px;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .note-collapse-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.05);
    }

    .note-collapse-btn ion-icon {
      font-size: 15px;
      transition: transform 0.4s var(--ease-smooth);
    }

    .floating-note-container.collapsed .note-collapse-btn ion-icon {
      transform: rotate(180deg);
    }

    .floating-note-container.collapsed .note-body {
      display: none;
    }

    .note-body {
      padding: 12px;
    }

    .note-textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background: var(--glass-bg-hover);
      font-family: inherit;
      font-size: 0.82rem; /* Reduced font size */
      color: var(--text-main);
      resize: vertical;
      outline: none;
      line-height: 1.5;
      transition: all 0.3s ease;
    }

    .note-textarea:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px var(--brand-soft);
    }

    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .status-save {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-subtle);
    }

    .status-save.saved {
      color: var(--status-success);
    }

    .clear-notes-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 7px;
      color: var(--status-danger);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .clear-notes-btn:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: var(--status-danger);
    }

    /* ============================================================
       MODAL DIALOGS
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(11, 19, 36, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 9999;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      width: 100%;
      max-width: 400px;
      padding: 24px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      color: #f8fafc;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.75);
      animation: popIn 0.3s var(--ease-smooth);
    }

    @keyframes popIn {
      from { transform: scale(0.88); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid;
    }

    .modal-icon svg { width: 32px; height: 32px; }

    .modal-icon.error {
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.35);
      background: rgba(239, 68, 68, 0.12);
    }

    .modal-icon.lock {
      color: #10b981;
      border-color: rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.12);
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .modal-text {
      color: #94a3b8;
      margin-bottom: 18px;
      font-size: 0.87rem;
      line-height: 1.5;
    }

    .modal-input {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 16px;
      background: rgba(30, 41, 59, 0.8);
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 9px;
      font-size: 0.95rem;
      text-align: right;
      outline: none;
      transition: border-color 0.25s ease;
    }

    .modal-input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-btn {
      padding: 9px 20px;
      min-width: 105px;
      border: none;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.25s ease;
    }

    .modal-btn:hover { transform: translateY(-1px); }

    .modal-btn-confirm { background: #10b981; color: #fff; }
    .modal-btn-confirm:hover { background: #059669; }

    .modal-btn-cancel { background: #334155; color: #fff; }
    .modal-btn-cancel:hover { background: #475569; }

    .modal-btn-danger { background: #ef4444; color: #fff; }
    .modal-btn-danger:hover { background: #dc2626; }

    /* ============================================================
       RESPONSIVE DESIGN
       ============================================================ */
    @media (max-width: 768px) {
      .app-wrapper { padding: 8px; gap: 8px; }
      .sidebar { width: 56px; }
      .sidebar:hover { width: 210px; }
      .nav-btn { height: 42px; }
      .time-badge { display: none; }
      .floating-note-container { top: 70px; right: 10px; left: 10px; width: auto; }
    }
  </style>
</head>

<body>

  <div class="app-wrapper">
    <!-- Main Right Sidebar Tools -->
    <aside class="sidebar" id="sidebar-dashboard">
      <div id="dash-tools" style="display:contents"></div>
    </aside>

    <!-- Core Display Area -->
    <main class="main-content">
      <section class="card">
        <div class="card-header">
          <span class="card-title" id="frame-title">جاري التحميل...</span>
          <div class="header-actions">
            <div class="time-badge" id="liveTime">...</div>
            <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر">
              <ion-icon name="moon-outline"></ion-icon>
            </button>
          </div>
        </div>
        <div class="iframe-wrapper">
          <iframe id="main-frame" title="الصفحة المحددة" allow="clipboard-read; clipboard-write; fullscreen"
            referrerpolicy="same-origin"></iframe>
        </div>
      </section>
    </main>

    <!-- System Left Sidebar Tools -->
    <aside class="sidebar sidebar-system" id="sidebar-system">
      <div id="sys-tools" style="display:contents"></div>
      <div class="divider"></div>
      <button class="nav-btn" id="tools-btn" title="الأدوات (يفتح في صفحة مستقلة)">
        <span class="icon"><ion-icon name="folder-open-outline"></ion-icon></span>
        <span class="label">الأدوات</span>
        <ion-icon name="open-outline" class="hint"></ion-icon>
      </button>
    </aside>
  </div>

  <!-- Floating Note Drawer -->
  <div id="note" class="floating-note-container collapsed">
    <div class="note-drag-handle" id="note-handle">
      <ion-icon name="move-outline"></ion-icon>
      <h4>ملاحظات عامة</h4>
      <button class="note-collapse-btn" id="note-toggle" title="تصغير / تكبير">
        <ion-icon name="chevron-down-outline"></ion-icon>
      </button>
    </div>
    <div class="note-body">
      <textarea id="note-text" class="note-textarea" placeholder="اكتب ملاحظاتك هنا ..."></textarea>
      <div class="note-footer">
        <div id="note-status" class="status-save">
          <ion-icon name="cloud-done-outline"></ion-icon>
          <span>جاهز</span>
        </div>
        <button id="note-clear" class="clear-notes-btn">
          <ion-icon name="trash-outline"></ion-icon>
          مسح
        </button>
      </div>
    </div>
  </div>

  <script>
    /* ==================== CONFIGURATION ==================== */
    const DEFAULT_ID = 'ayat-ocr';

    const DASH_TOOLS = [
      { id: 'ayat-enter', file: 'Ayat_Enter.html', label: 'تسجيل دخول عداد المعمل', icon: 'person-add-outline' },
      { id: 'ayat', file: 'Ayat.html', label: 'تسجيل فحص عداد المعمل', icon: 'document-text-outline' },
      { id: 'ayat-print', file: 'Ayat_Print.html', label: 'طباعة تقرير عداد يدوي', icon: 'print-outline' },
      { id: 'ayat-takheen', file: 'Ayat_Takheen.html', label: 'تكهين التلاعبات', icon: 'trash-outline' },
      { id: 'add-loads', file: 'Add_Loads.html', label: 'قياس أحمال', icon: 'trending-up-outline' },
      { id: 'roller', file: 'Roller.html', label: 'فحص البكرات', icon: 'eye-outline' },
      { id: 'ayat-ocr', file: 'Ayat_OCR.html', label: 'OCR', icon: 'scan-outline' },
    ];

    const SYS_TOOLS = [
      { id: 'control-excel', file: 'Control_Excel/Control_Excel.html', label: 'تحليل الأكسيل', icon: 'document-attach-outline', secure: true },
      { id: 'mdm', file: 'Smart_Meters/Main_Dashboard_Smart_Meters.html', label: 'منظومة MDM-HES', icon: 'grid-outline', secure: true },
      { id: 'control-calc', file: 'Control_Calc/Control_Calc.html', label: 'حسابات كهربائية', icon: 'calculator-outline', secure: true },
      { id: 'deploy', file: 'Deploy/Main_Project_1.html', label: 'الـ Deployment', icon: 'cloud-upload-outline', secure: true },
      { id: 'maint', file: 'Maintainance/Control_Maint.html', label: 'الصيانة والتكهين', icon: 'build-outline', secure: true },
      { id: 'gehat', file: 'Gehat/Gehat.html', label: 'بيان (الأقل، كبار، مصالح، قوي)', icon: 'document-text-outline', secure: false },
    ];

    const TOOLS_LINK = { id: 'tools', file: 'Tools/Tools.html', label: 'الأدوات', icon: 'folder-open-outline', secure: false };

    /* ==================== SELECTORS ==================== */
    const $ = (id) => document.getElementById(id);
    const dashEl = $('dash-tools'), sysEl = $('sys-tools');
    const frame = $('main-frame'), frameTitle = $('frame-title');

    /* ==================== THEME MANAGEMENT ==================== */
    const themeToggle = $('theme-toggle');
    const themeIcon = themeToggle.querySelector('ion-icon');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('ndedc_theme', theme);
      themeIcon.setAttribute('name', theme === 'dark' ? 'sunny-outline' : 'moon-outline');
    }

    applyTheme(document.documentElement.getAttribute('data-theme') || 'light');

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    /* ==================== DIALOG SYSTEM ==================== */
    const ICON_SVG = {
      error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
      lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
    };

    function showModal({ title, text = '', input = null, icon = null, cancel = false, confirmText = 'حسناً', cancelText = 'إلغاء', danger = false, onConfirm, onCancel }) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          ${icon ? `<div class="modal-icon ${icon}">${ICON_SVG[icon]}</div>` : ''}
          <div class="modal-title">${title}</div>
          ${text ? `<div class="modal-text">${text}</div>` : ''}
          ${input ? `<input class="modal-input" type="${input.type || 'text'}" placeholder="${input.placeholder || ''}" autocomplete="new-password" spellcheck="false">` : ''}
          <div class="modal-actions">
            <button class="modal-btn ${danger ? 'modal-btn-danger' : 'modal-btn-confirm'}" data-act="ok">${confirmText}</button>
            ${cancel ? `<button class="modal-btn modal-btn-cancel" data-act="cancel">${cancelText}</button>` : ''}
          </div>
        </div>`;
      document.body.appendChild(overlay);

      const inputEl = overlay.querySelector('.modal-input');
      let closed = false;
      const close = (cb) => { if (closed) return; closed = true; overlay.style.animation = 'fadeIn 0.15s reverse'; setTimeout(() => { overlay.remove(); cb && cb(); }, 150); };
      const ok = () => close(() => onConfirm && onConfirm(inputEl ? inputEl.value : true));
      const cancelFn = () => close(() => onCancel && onCancel());

      overlay.querySelector('[data-act="ok"]').onclick = ok;
      const cancelBtn = overlay.querySelector('[data-act="cancel"]');
      if (cancelBtn) cancelBtn.onclick = cancelFn;

      if (inputEl) {
        setTimeout(() => inputEl.focus(), 100);
        inputEl.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); ok(); } };
      }
      overlay.onclick = (e) => { if (e.target === overlay && cancel) cancelFn(); };
    }

    /* ==================== BUTTON BUILDER ==================== */
    function makeBtn(tool, external = false) {
      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.title = tool.label;
      btn.dataset.id = tool.id;
      btn.innerHTML = `<span class="icon"><ion-icon name="${tool.icon}"></ion-icon></span>
                       <span class="label">${tool.label}</span>
                       ${external ? '<ion-icon name="open-outline" class="hint"></ion-icon>' : ''}`;
      return btn;
    }

    DASH_TOOLS.forEach(t => {
      const b = makeBtn(t);
      b.onclick = () => loadTool(t);
      dashEl.appendChild(b);
    });

    SYS_TOOLS.forEach(t => {
      const b = makeBtn(t, true);
      b.onclick = () => handleSystem(t);
      sysEl.appendChild(b);
    });

    $('tools-btn').onclick = () => handleSystem(TOOLS_LINK);

    /* ==================== NAVIGATION LOGIC ==================== */
    function setActive(id) {
      dashEl.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
    }

    function loadTool(tool) {
      frameTitle.textContent = tool.label;
      frameTitle.title = tool.label;
      frame.title = tool.label;
      frame.src = tool.file;
      setActive(tool.id);
    }

    function handleSystem(tool) {
      if (!tool.secure) return (window.location.href = tool.file);
      showModal({
        title: 'غير مصرح',
        text: 'يرجى إدخال كلمة المرور للمتابعة والوصول:',
        input: { type: 'password', placeholder: 'ادخل رمز المرور هنا' },
        icon: 'lock',
        cancel: true,
        confirmText: 'تأكيد الدخول',
        onConfirm: (pwd) => {
          if (pwd === '0000') window.location.href = tool.file;
          else showModal({ title: 'فشل التحقق', text: 'رمز المرور غير صحيح، حاول مرة أخرى.', icon: 'error', danger: true });
        }
      });
    }

    /* ==================== TIME UPDATER ==================== */
    function tick() {
      $('liveTime').textContent = new Date().toLocaleDateString('ar-EG', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }
    tick(); setInterval(tick, 60000);

    /* ==================== POSTMESSAGE LISTENER ==================== */
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === 'NDEDC_NAVIGATE' && d.url) {
        loadTool(DASH_TOOLS.find(t => t.file === d.url) || { id: 'custom', file: d.url, label: d.title || d.url });
      } else if (d.type === 'NDEDC_TITLE' && d.title) {
        frameTitle.textContent = d.title;
      } else if (d.type === 'NDEDC_HOME') {
        loadTool(DASH_TOOLS.find(t => t.id === DEFAULT_ID));
      }
    });

    /* Initialize Default View */
    window.addEventListener('DOMContentLoaded', () => {
      loadTool(DASH_TOOLS.find(t => t.id === DEFAULT_ID));
    });

    /* ==================== FLOATING NOTES SYSTEM ==================== */
    const note = $('note'), handle = $('note-handle'), noteText = $('note-text'),
      noteStatus = $('note-status'), noteToggle = $('note-toggle'), noteClear = $('note-clear');

    noteToggle.onclick = (e) => {
      e.stopPropagation();
      note.classList.toggle('collapsed');
      localStorage.setItem('ndedc_note_collapsed', note.classList.contains('collapsed') ? '1' : '0');
    };

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('ndedc_floating_notes');
      if (saved) {
        noteText.value = saved;
        noteStatus.innerHTML = '<ion-icon name="checkmark-circle-outline"></ion-icon><span>تم الاستدعاء</span>';
        noteStatus.classList.add('saved');
      }

      if (localStorage.getItem('ndedc_note_collapsed') === '0') note.classList.remove('collapsed');

      const pos = localStorage.getItem('ndedc_note_pos');
      if (pos) {
        try {
          const p = JSON.parse(pos);
          note.style.top = p.top + 'px';
          note.style.left = p.left + 'px';
          note.style.right = 'auto';
        } catch (_) { }
      }
    });

    noteText.oninput = () => {
      noteStatus.innerHTML = '<ion-icon name="sync-outline"></ion-icon><span>جارٍ الحفظ...</span>';
      noteStatus.classList.remove('saved');
      localStorage.setItem('ndedc_floating_notes', noteText.value);
      setTimeout(() => {
        noteStatus.innerHTML = '<ion-icon name="cloud-done-outline"></ion-icon><span>تم الحفظ</span>';
        noteStatus.classList.add('saved');
      }, 400);
    };

    noteClear.onclick = () => {
      showModal({
        title: 'تأكيد الحذف',
        text: 'هل أنت متأكد من مسح جميع الملاحظات؟',
        cancel: true,
        confirmText: 'مسح',
        danger: true,
        onConfirm: () => {
          noteText.value = '';
          localStorage.removeItem('ndedc_floating_notes');
          noteStatus.innerHTML = '<ion-icon name="trash-outline"></ion-icon><span>تم الحذف</span>';
          noteStatus.classList.remove('saved');
        }
      });
    };

    /* Drag Controller */
    let drag = false, dx = 0, dy = 0;
    handle.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      drag = true;
      const r = note.getBoundingClientRect();
      note.style.left = r.left + 'px';
      note.style.top = r.top + 'px';
      note.style.right = 'auto';
      dx = e.clientX - r.left;
      dy = e.clientY - r.top;
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const r = note.getBoundingClientRect();
      const x = Math.max(4, Math.min(window.innerWidth - r.width - 4, e.clientX - dx));
      const y = Math.max(4, Math.min(window.innerHeight - r.height - 4, e.clientY - dy));
      note.style.left = x + 'px';
      note.style.top = y + 'px';
    });
    handle.addEventListener('pointerup', () => {
      if (!drag) return;
      drag = false;
      localStorage.setItem('ndedc_note_pos', JSON.stringify({
        top: note.offsetTop, left: note.offsetLeft
      }));
    });
  </script>
</body>

</html>
