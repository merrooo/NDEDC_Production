<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل وحصر العدادات والمحولات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-dark: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-dark); padding: 20px; direction: rtl; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 25px 30px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-right: 6px solid var(--primary); position: relative; overflow: hidden; flex-wrap: wrap; gap: 15px; }
        header::before { content: ''; position: absolute; top: -50%; right: -20%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(37,99,235,0.08) 0%, transparent 70%); border-radius: 50%; }
        header::after { content: ''; position: absolute; bottom: -40%; left: -10%; width: 250px; height: 250px; background: radial-gradient(circle, rgba(37,99,235,0.06) 0%, transparent 70%); border-radius: 50%; }
        .header-left { display: flex; align-items: center; gap: 20px; position: relative; z-index: 1; flex-wrap: wrap; }
        .header-icon { width: 52px; height: 52px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
        .header-title h1 { font-size: 1.6rem; color: #ffffff; margin-bottom: 4px; font-weight: 700; }
        .header-title .subtitle { color: #94a3b8; font-size: 0.85rem; }
        .location-badge { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.06); backdrop-filter: blur(10px); padding: 8px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.08); position: relative; z-index: 1; flex-wrap: wrap; }
        .location-item { display: flex; align-items: center; gap: 8px; color: #e2e8f0; font-size: 0.9rem; }
        .location-item .label { color: #94a3b8; }
        .location-item .value { color: #ffffff; font-weight: 600; background: rgba(37,99,235,0.25); padding: 2px 12px; border-radius: 20px; font-size: 0.85rem; }
        .location-divider { width: 1px; height: 28px; background: rgba(255,255,255,0.1); }
        .location-item .value.sector { background: rgba(16,185,129,0.25); color: #6ee7b7; }
        .location-item .value.district { background: rgba(37,99,235,0.25); color: #93c5fd; }
        .header-actions { display: flex; align-items: center; gap: 15px; position: relative; z-index: 1; flex-wrap: wrap; }
        .sync-status { padding: 6px 16px; border-radius: 50px; font-size: 0.8rem; background: rgba(16,185,129,0.15); color: #6ee7b7; font-weight: 600; border: 1px solid rgba(16,185,129,0.2); }
        .sync-status.loading { background: rgba(245,158,11,0.15); color: #fcd34d; border-color: rgba(245,158,11,0.2); }
        .btn-back { background: rgba(37,99,235,0.2); color: #93c5fd; border: 1px solid rgba(37,99,235,0.3); padding: 8px 18px; border-radius: 50px; cursor: pointer; font-weight: 600; transition: all 0.3s; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-back:hover { background: rgba(37,99,235,0.35); transform: translateY(-1px); }
        .card { background: var(--card-bg); border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; color: var(--primary); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 25px; }
        @media (max-width: 1200px) { .card-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 768px) { .card-grid { grid-template-columns: 1fr; } }
        .card-inner { background: #f8fafc; border-radius: 10px; padding: 20px; border: 1px solid var(--border-color); }
        .card-inner .card-title { font-size: 1rem; color: var(--text-dark); border-bottom-color: var(--border-color); margin-bottom: 15px; padding-bottom: 8px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: #334155; }
        .form-group input, .form-group select { padding: 8px 10px; border: 1.5px solid var(--border-color); border-radius: 8px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; width: 100%; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
        .form-group input:disabled, .form-group select:disabled { background-color: #e2e8f0; color: #94a3b8; cursor: not-allowed; border-color: #cbd5e1; }
        .form-group input.duplicate { border-color: var(--danger); background-color: #fef2f2; }
        .form-group input.valid { border-color: var(--success); }
        .warning-msg { color: var(--danger); font-size: 0.7rem; display: none; margin-top: 2px; }
        .warning-msg.show { display: block; }
        .full-width { grid-column: 1 / -1; }
        .form-actions { margin-top: 20px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-primary:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background-color: #e2e8f0; color: #475569; }
        .btn-secondary:hover { background-color: #cbd5e1; }
        .btn-excel { background-color: #10b981; color: white; }
        .btn-excel:hover { background-color: #059669; }
        #statusMessage { padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; display: none; font-weight: 600; }
        #statusMessage.info { display: block; background-color: #e0f2fe; color: #0369a1; }
        #statusMessage.success { display: block; background-color: #d1fae5; color: #065f46; }
        #statusMessage.error { display: block; background-color: #fee2e2; color: #991b1b; }
        .table-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 15px; flex-wrap: wrap; }
        .action-btns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .table-container { overflow-x: auto; border: 1px solid var(--border-color); border-radius: 8px; position: relative; min-height: 250px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: right; white-space: nowrap; }
        th { background-color: #f1f5f9; color: #334155; padding: 8px 10px; font-weight: 700; border-bottom: 2px solid var(--border-color); position: sticky; top: 0; z-index: 10; }
        td { padding: 6px 10px; border-bottom: 1px solid var(--border-color); color: #334155; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
        tr:hover { background-color: #f8fafc; }
        tr.editing { background-color: #fef3c7; }
        .th-content { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .filter-btn { background: none; border: none; cursor: pointer; color: var(--secondary); font-size: 0.75rem; padding: 2px 5px; border-radius: 4px; }
        .filter-btn:hover, .filter-btn.active { color: var(--primary); background: #dbeafe; }
        .filter-popover { display: none; position: absolute; background: white; border: 1px solid var(--border-color); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-radius: 8px; padding: 12px; z-index: 100; width: 280px; max-height: 380px; overflow-y: auto; text-align: right; }
        .filter-popover.show { display: block; }
        .filter-search-input { width: 100%; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; margin-bottom: 10px; outline: none; }
        .filter-search-input:focus { border-color: var(--primary); }
        .filter-option { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.85rem; font-weight: normal; cursor: pointer; }
        .filter-option.hidden { display: none; }
        .filter-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 8px; margin-top: 8px; }
        .date-picker-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
        .date-picker-group label { font-size: 0.8rem; color: var(--secondary); font-weight: 600; }
        .date-picker-group input[type="date"] { padding: 6px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; width: 100%; text-align: center; }
        .btn-link { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .badge-type { padding: 4px 10px; border-radius: 12px; font-weight: 700; font-size: 0.75rem; }
        .badge-a123 { background-color: #e0e7ff; color: #4338ca; }
        .badge-a45 { background-color: #dcfce7; color: #15803d; }
        .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-sm { padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .btn-edit-sm { background-color: #fef3c7; color: #b45309; }
        .btn-edit-sm:hover { background-color: #fde68a; }
        .btn-delete-sm { background-color: #fee2e2; color: #dc2626; }
        .btn-delete-sm:hover { background-color: #fca5a5; }
        .no-data { text-align: center; padding: 40px; color: var(--secondary); font-size: 1rem; }
        .debug-info { font-size: 0.7rem; color: #475569; margin-top: 2px; direction: ltr; text-align: left; }
        .date-picker-wrapper { position: relative; direction: ltr; }
        .date-picker-wrapper input { padding-left: 40px; width: 100%; }
        .date-picker-wrapper .date-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--secondary); pointer-events: none; }
        .date-display { font-size: 0.8rem; color: var(--secondary); margin-top: 2px; text-align: right; }
        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--border-color); }
        .pagination-btns { display: flex; gap: 8px; align-items: center; }
        .na { color: #94a3b8; font-style: italic; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .table-controls { flex-direction: column; align-items: stretch; } header { flex-direction: column; align-items: stretch; } .location-badge { justify-content: center; } .action-btns { justify-content: center; } }
        @media (max-width: 600px) { .location-badge { flex-direction: column; align-items: center; gap: 6px; border-radius: 16px; } .location-item { font-size: 0.8rem; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <div class="header-icon"><i class="fas fa-bolt"></i></div>
                <div class="header-title">
                    <h1>تسجيل التركيبات</h1>
                    <div class="subtitle">العدادات الذكية (A1 / A2 / A3)</div>
                </div>
            </div>
            <div class="location-badge">
                <div class="location-item"><i class="fas fa-layer-group" style="color: #6ee7b7; font-size: 0.8rem;"></i><span class="label">القطاع</span><span class="value sector" id="sectorNameDisplay">جاري التحميل...</span></div>
                <div class="location-divider"></div>
                <div class="location-item"><i class="fas fa-building" style="color: #93c5fd; font-size: 0.8rem;"></i><span class="label">الهندسة</span><span class="value district" id="districtNameDisplay">جاري التحميل...</span></div>
            </div>
            <div class="header-actions">
                <span id="sessionTimer" class="sync-status" style="background:rgba(255,255,255,0.05);color:#94a3b8;border-color:rgba(255,255,255,0.06);">⏱ 05:00</span>
                <span id="syncStatus" class="sync-status loading">⏳ جاري الاتصال...</span>
                <button class="btn-back" onclick="goBack()"><i class="fas fa-arrow-right"></i> رجوع</button>
            </div>
        </header>

        <div id="statusMessage"></div>
        <input type="hidden" id="keta3_id">
        <input type="hidden" id="handsa_code">
        <input type="hidden" id="editingKey">

        <div class="card" id="dataForm">
            <div class="card-title"><i class="fas fa-edit"></i> تسجيل البيانات</div>

            <div style="margin-bottom:20px;">
                <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
                    <div class="form-group">
                        <label>meter_type <span style="color:red">*</span></label>
                        <select id="meter_type">
                            <option value="A1">A1</option>
                            <option value="A2">A2</option>
                            <option value="A3" selected>A3</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>feeder_type <span style="color:red">*</span></label>
                        <select id="feeder_type">
                            <option value="Subestation" selected>Subestation</option>
                            <option value="Feeder Incoming">Feeder Incoming</option>
                            <option value="Feeder Outgoing">Feeder Outgoing</option>
                            <option value="Compact">Compact</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>meter_voltage</label>
                        <input type="text" id="meter_voltage" value="110" readonly>
                    </div>
                    <div class="form-group">
                        <label>facility_capacity</label>
                        <input type="text" id="facility_capacity" placeholder="مثال: 500">
                    </div>
                </div>
            </div>

            <div id="dynamicCardsContainer">
                <!-- Will be populated by JavaScript -->
            </div>

            <div style="margin-top:20px;border-top:2px solid var(--border-color);padding-top:20px;">
                <div class="form-grid">
                    <div class="form-group">
                        <label>meter_number <span style="color:red">*</span></label>
                        <input type="text" id="meter_number" maxlength="8" placeholder="أدخل 8 أرقام">
                        <span class="warning-msg" id="meterNumberWarning"></span>
                    </div>
                    <div class="form-group">
                        <label>sim_number</label>
                        <input type="text" id="sim_number" maxlength="19" list="simList" placeholder="أدخل 19 رقم">
                        <datalist id="simList"></datalist>
                        <span class="warning-msg" id="simNumberWarning"></span>
                    </div>
                    <div class="form-group">
                        <label>install_date</label>
                        <div class="date-picker-wrapper">
                            <input type="date" id="installDatePicker" dir="ltr">
                            <i class="fas fa-calendar-alt date-icon"></i>
                        </div>
                        <div class="date-display" id="dateDisplay">التاريخ: --/--/----</div>
                        <input type="hidden" id="install_date">
                    </div>
                    <div class="form-group">
                        <label>address</label>
                        <input type="text" id="address" placeholder="أدخل العنوان التفصيلي">
                    </div>
                    <div class="form-group">
                        <label>lat</label>
                        <input type="text" id="lat" placeholder="31.xxxx">
                    </div>
                    <div class="form-group">
                        <label>lng</label>
                        <input type="text" id="lng" placeholder="31.xxxx">
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" id="addSingleBtn" disabled><i class="fas fa-plus-circle"></i> حفظ السجل</button>
                <button class="btn btn-secondary" id="cancelEditBtn" style="display: none;"><i class="fas fa-times"></i> إلغاء التعديل</button>
            </div>
        </div>

        <div class="card">
            <div class="table-controls">
                <div>
                    <span id="recordsCount" style="font-weight: bold; color: var(--secondary);">0 سجل</span>
                </div>
                <div class="action-btns">
                    <button class="btn btn-excel" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> Excel</button>
                    <button class="btn btn-secondary" onclick="resetAllFilters()"><i class="fas fa-undo"></i> إعادة ضبط</button>
                </div>
            </div>
            <div class="table-container" id="tableContainer">
                <div class="no-data">جاري تحميل البيانات...</div>
            </div>
            <div class="pagination" id="paginationControls">
                <span id="pageIndicator" style="font-size: 0.85rem; color: var(--secondary);">الصفحة 1 من 1</span>
                <div class="pagination-btns">
                    <button class="btn btn-secondary" id="btnPrev" onclick="changePage(-1)">السابق</button>
                    <button class="btn btn-secondary" id="btnNext" onclick="changePage(1)">التالي</button>
                </div>
            </div>
        </div>
    </div>

    <div id="filterPopover" class="filter-popover"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFXLCWmwrAQIrmRvnus3yJlTpra9Rv69k",
            authDomain: "trial-85.firebaseapp.com",
            databaseURL: "https://trial-85-default-rtdb.firebaseio.com",
            projectId: "trial-85",
            storageBucket: "trial-85.firebasestorage.app",
            messagingSenderId: "660343156279",
            appId: "1:660343156279:web:3275f5d3da7721a35259b2",
            measurementId: "G-RLMVPCLZW3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        let keta3_id = urlParams.get('keta3') || urlParams.get('keta3_id');
        let handsa_code = urlParams.get('handsa-code') || urlParams.get('handsa_code') || urlParams.get('handsa');
        const userType = urlParams.get('userType') || '';

        if (!keta3_id || !handsa_code) {
            const defaultKeta3 = "1";
            const defaultHandsa = "101";
            console.warn("No keta3/handsa in URL, using defaults:", defaultKeta3, defaultHandsa);
            keta3_id = defaultKeta3;
            handsa_code = defaultHandsa;
            const newUrl = `${window.location.pathname}?keta3=${defaultKeta3}&handsa=${defaultHandsa}&userType=${userType}`;
            window.history.replaceState({}, '', newUrl);
        }

        const norm = v => String(v ?? '').replace(/[\u200B-\u200D\uFEFF\u200E\u200F]/g, '').trim();
        const ALLOWED_TYPES = ['A1', 'A2', 'A3'];

        const sectorNames = {
            '1': 'قطاع دمياط', '2': 'قطاع شمال الدقهلية', '3': 'قطاع جنوب الدقهلية', '4': 'قطاع كفر الشيخ'
        };
        const districtNames = {
            '101': 'هندسة شمال دمياط', '102': 'هندسة جنوب دمياط', '103': 'هندسة عزبة البرج', '104': 'هندسة كفر سعد',
            '105': 'هندسة كفر البطيخ', '106': 'هندسة راس البر', '107': 'هندسة دمياط الجديدة', '108': 'هندسة الزرقا',
            '109': 'هندسة فارسكور', '110': 'هندسة الروضة', '111': 'هندسة الشعراء', '201': 'هندسة مدينة شربين',
            '202': 'هندسة قري شربين', '203': 'هندسة دكرنس', '204': 'هندسة جمصة', '205': 'هندسة قري بلقاس',
            '206': 'هندسة مدينة بلقاس', '207': 'هندسة الستاموني', '208': 'هندسة بني عبيد', '209': 'هندسة منية النصر',
            '210': 'هندسة ميت سلسيل', '211': 'هندسة الجمالية', '212': 'هندسة قري المنزلة', '213': 'هندسة مدينة المنزلة',
            '214': 'هندسة المطرية', '301': 'هندسة شرق المنصورة', '302': 'هندسة غرب المنصورة', '303': 'هندسة طلخا',
            '304': 'هندسة نبروه', '305': 'هندسة قري المنصورة 1', '306': 'هندسة قري المنصورة 2', '307': 'هندسة اجا',
            '308': 'هندسة مدينة السنبلاوين', '309': 'هندسة قري السنبلاوين', '310': 'هندسة تمي الامديد',
            '311': 'هندسة مدينة ميت غمر', '312': 'هندسة قري ميت غمر', '313': 'هندسة كوم النور',
            '401': 'هندسة مدينة كفر الشيخ', '402': 'هندسة غرب كفر الشيخ', '403': 'هندسة شرق كفر الشيخ',
            '404': 'هندسة قلين', '405': 'هندسة قرى سيدي سالم', '406': 'هندسة مدينة سيدي سالم',
            '407': 'هندسة الرياض', '408': 'هندسة مدينة دسوق', '409': 'هندسة قرى شمال دسوق', '410': 'هندسة قرى جنوب دسوق',
            '411': 'هندسة فوه', '412': 'هندسة مطوبس', '413': 'هندسة مدينة الحامول', '414': 'هندسة قرى الحامول',
            '415': 'هندسة بيلا', '416': 'هندسة بلطيم', '417': 'هندسة برج البرلس'
        };

        // Data stores
        let rawFeeders = [], rawPanels = [], rawStations = [], rawOutgoing = [];
        let feedersMap = {}, feedersReverseMap = {};
        let panelsMap = {}, panelsReverseMap = {};
        let stationCodesByName = {};

        let allRecords = {};
        let editingKey = null;
        let existingMeters = new Set();
        let existingSims = new Set();

        let sectorName = '', districtName = '', currentHandsaCode = '';

        // Table state
        let activeColumnFilters = {};
        let filteredKeysList = [];
        let currentPage = 1;

        function formatDate(d) {
            if (!d || isNaN(d)) return '';
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function formatToDDMMYYYY(dateStr) {
            if (!dateStr || dateStr === 'N/A') return 'N/A';
            let parts = String(dateStr).split(/[\/\-]/);
            if (parts.length === 3) {
                if (parts[0].length === 4) {
                    return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
                } else if (parts[2].length === 4) {
                    return `${parts[0].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[2]}`;
                }
            }
            return dateStr;
        }

        function parseDate(str) {
            if (!str) return null;
            const parts = str.split('/');
            if (parts.length === 3) {
                const d = parseInt(parts[0]);
                const m = parseInt(parts[1]) - 1;
                const y = parseInt(parts[2]);
                if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {
                    return new Date(y, m, d);
                }
            }
            return null;
        }

        function dateToPicker(str) {
            if (!str) return '';
            const d = parseDate(str);
            if (!d || isNaN(d)) return '';
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function parseToTimestamp(dateStr) {
            if (!dateStr || dateStr === 'N/A') return null;
            let day, month, year;
            let parts = dateStr.split(/[\/\-]/);
            if (parts.length === 3) {
                if (parts[2].length === 4) {
                    day = parseInt(parts[0], 10);
                    month = parseInt(parts[1], 10) - 1;
                    year = parseInt(parts[2], 10);
                } else if (parts[0].length === 4) {
                    year = parseInt(parts[0], 10);
                    month = parseInt(parts[1], 10) - 1;
                    day = parseInt(parts[2], 10);
                }
                const parsedDate = new Date(year, month, day);
                return isNaN(parsedDate.getTime()) ? null : parsedDate.getTime();
            }
            return null;
        }

                    list.forEach(item => {
                        if (!item) return;

                        const name = norm(
                            item.sub ||
                            item.sub_name ||
                            item.station ||
                            item["اسم المحطة"] ||
                            item["اسم المحطة/المحولات"] || ''
                        );

                        const code = norm(
                            item.sub_code ||
                            item.station_code ||
                            item["كود المحطة"] || ''
                        );

                        const itemHandsa = item.handsa_code !== undefined && item.handsa_code !== null
                            ? String(item.handsa_code).trim()
                            : (item.handsa ? String(item.handsa).trim() : '');

        // Table functions
        function loadRecords() {
            const recordsRef = ref(db, `sectors/${keta3_id}/districts/${handsa_code}/manual_entries`);
            onValue(recordsRef, (snapshot) => {
                const rawData = snapshot.val() || {};
                const filtered = {};
                Object.keys(rawData).forEach(key => {
                    const rec = rawData[key];
                    const meterType = norm(rec["meter_type"] || '');
                    if (ALLOWED_TYPES.some(type => meterType.toUpperCase() === type.toUpperCase())) {
                        filtered[key] = rec;
                    }
                });
                allRecords = filtered;
                existingMeters.clear();
                existingSims.clear();
                Object.values(allRecords).forEach(record => {
                    const meterNum = record["meter_number"] || '';
                    const simNum = record["sim_number"] || '';
                    if (meterNum) existingMeters.add(norm(meterNum));
                    if (simNum) existingSims.add(norm(simNum));
                });
                applyFilters();
                document.getElementById('recordsCount').textContent = `${Object.keys(allRecords).length} سجل`;
                checkValidation();
                updateSyncStatus(false);
            });
        }

        function applyFilters() {
            filteredKeysList = Object.keys(allRecords).filter(key => {
                const record = allRecords[key];

                for (const col of COLUMNS) {
                    if (col.isDate) {
                        const dateFilter = activeColumnFilters[col.key];
                        if (dateFilter) {
                            const recTimestamp = parseToTimestamp(getRecordValue(record, col));
                            if (!recTimestamp) return false;

                            if (dateFilter.from) {
                                const fromTs = parseToTimestamp(dateFilter.from);
                                if (fromTs && recTimestamp < fromTs) return false;
                            }
                            if (dateFilter.to) {
                                const toTs = parseToTimestamp(dateFilter.to);
                                if (toTs && recTimestamp > toTs) return false;
                            }
                        }
                    } else {
                        const selectedValues = activeColumnFilters[col.key];
                        if (selectedValues && selectedValues.length > 0) {
                            const val = getRecordValue(record, col);
                            if (!selectedValues.includes(val)) return false;
                        }
                    }
                }

                for (const col of COLUMNS) {
                    const searchTerm = columnSearchTerms[col.key];
                    if (searchTerm && searchTerm.trim() !== '') {
                        const val = getRecordValue(record, col);
                        if (!val.toLowerCase().includes(searchTerm.toLowerCase())) return false;
                    }
                }

                return true;
            });

            document.getElementById('recordsCount').textContent = `${filteredKeysList.length} سجل`;
            currentPage = 1;
            renderTablePage();
        }

        function renderTablePage() {
            const container = document.getElementById('tableContainer');
            if (filteredKeysList.length === 0) {
                container.innerHTML = `<div class="no-data">لا توجد بيانات مسجلة (A1 / A2 / A3)</div>`;
                updatePaginationControls();
                return;
            }

            const totalPages = Math.ceil(filteredKeysList.length / PAGE_SIZE);
            if (currentPage > totalPages) currentPage = totalPages;
            const startIndex = (currentPage - 1) * PAGE_SIZE;
            const pageKeys = filteredKeysList.slice(startIndex, startIndex + PAGE_SIZE);

            let html = `<table><thead><tr><th>#</th>`;

            COLUMNS.forEach(col => {
                const isActive = (activeColumnFilters[col.key] && (
                    col.isDate ? (activeColumnFilters[col.key].from || activeColumnFilters[col.key].to) : activeColumnFilters[col.key].length > 0
                )) || (columnSearchTerms[col.key] && columnSearchTerms[col.key].trim() !== '');
                html += `
                <th>
                    <div class="th-content">
                        <span>${col.label}</span>
                        <button class="filter-btn ${isActive ? 'active' : ''}" onclick="window.toggleFilterPopover(event, '${col.key}')">
                            <i class="fas fa-filter"></i>
                        </button>
                    </div>
                </th>`;
            });
            html += `<th>الإجراءات</th></tr></thead><tbody>`;

            let index = startIndex;
            pageKeys.forEach(key => {
                index++;
                const record = allRecords[key];
                const isEditing = (editingKey === key);

                html += `<tr class="${isEditing ? 'editing' : ''}"><td>${index}</td>`;

                COLUMNS.forEach(col => {
                    let val = getRecordValue(record, col);
                    if (col.isDate) val = formatToDDMMYYYY(val);

                    if (col.key === 'meter_type') {
                        const badgeClass = ['A4', 'A5'].includes(val) ? 'badge-a45' : 'badge-a123';
                        html += `<td><span class="badge-type ${badgeClass}">${val === 'N/A' ? '<span class="na">N/A</span>' : val}</span></td>`;
                    } else if (col.key === 'address') {
                        html += `<td style="max-width:150px;white-space:normal;word-break:break-word;">${val === 'N/A' ? '<span class="na">N/A</span>' : val}</td>`;
                    } else {
                        html += `<td>${val === 'N/A' ? '<span class="na">N/A</span>' : val}</td>`;
                    }
                });

                html += `<td><div class="actions-cell">
                <button class="btn-sm btn-edit-sm" onclick="window.editRecord('${key}')"><i class="fas fa-edit"></i> تعديل</button>
                <button class="btn-sm btn-delete-sm" onclick="window.deleteRecord('${key}')"><i class="fas fa-trash"></i></button>
            </div></td></tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
            updatePaginationControls();
        }

        function updatePaginationControls() {
            const totalPages = Math.ceil(filteredKeysList.length / PAGE_SIZE) || 1;
            document.getElementById('pageIndicator').textContent = `الصفحة ${currentPage} من ${totalPages}`;
            document.getElementById('btnPrev').disabled = (currentPage === 1);
            document.getElementById('btnNext').disabled = (currentPage >= totalPages);
        }

        window.changePage = function(delta) {
            const totalPages = Math.ceil(filteredKeysList.length / PAGE_SIZE) || 1;
            if (currentPage + delta >= 1 && currentPage + delta <= totalPages) {
                currentPage += delta;
                renderTablePage();
            }
        };

        // Filter Popover
        window.toggleFilterPopover = function(event, colKey) {
            event.stopPropagation();
            const popover = document.getElementById('filterPopover');
            const button = event.currentTarget;
            const rect = button.getBoundingClientRect();

            if (popover.classList.contains('show') && popover.dataset.colKey === colKey) {
                popover.classList.remove('show');
                return;
            }

            const col = COLUMNS.find(c => c.key === colKey);
            const currentSearch = columnSearchTerms[colKey] || '';
            let popHtml = `<strong style="display:block; margin-bottom:8px; font-size:0.85rem;">تصفية حسب ${col.label}</strong>`;

            if (!col.isDate) {
                popHtml += `
                <input type="text" class="filter-search-input" id="columnSearchInput" 
                       placeholder="بحث في ${col.label}..." value="${currentSearch}"
                       oninput="window.onColumnSearch('${colKey}', this.value)">
            `;
            }

            if (col.isDate) {
                const currentFilter = activeColumnFilters[colKey] || { fromRGB: '', toRGB: '' };
                popHtml += `
                <div class="date-picker-group">
                    <label>من تاريخ:</label>
                    <input type="date" id="dateFromPicker" value="${currentFilter.fromRGB || ''}">
                    <label>إلى تاريخ:</label>
                    <input type="date" id="dateToPicker" value="${currentFilter.toRGB || ''}">
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary btn-sm" onclick="window.applyDateFilter('${colKey}')">تطبيق</button>
                    <button class="btn-link" onclick="window.clearDateFilter('${colKey}')">إلغاء</button>
                </div>`;
            } else {
                const uniqueValues = new Set();
                Object.values(allRecords).forEach(rec => {
                    const val = getRecordValue(rec, col);
                    if (val !== 'N/A') uniqueValues.add(val);
                });
                const sortedValues = Array.from(uniqueValues).sort();
                const currentSelected = activeColumnFilters[colKey] || [];

                if (sortedValues.length === 0) {
                    popHtml += `<div style="color:#94a3b8;font-size:0.85rem;padding:8px 0;">لا توجد قيم للتصفية</div>`;
                } else {
                    sortedValues.forEach(val => {
                        const checked = currentSelected.includes(val) ? 'checked' : '';
                        const searchTermLower = (columnSearchTerms[colKey] || '').toLowerCase();
                        const show = !searchTermLower || val.toLowerCase().includes(searchTermLower);
                        popHtml += `
                        <label class="filter-option ${show ? '' : 'hidden'}" data-value="${val}">
                            <input type="checkbox" value="${val}" ${checked} onchange="window.onCheckboxChange('${colKey}')">
                            <span>${val}</span>
                        </label>`;
                    });
                }

                popHtml += `
                <div class="filter-actions">
                    <button class="btn-link" onclick="window.selectAllColumn('${colKey}', true)">تحديد الكل</button>
                    <button class="btn-link" onclick="window.selectAllColumn('${colKey}', false)">إلغاء الكل</button>
                </div>`;
            }

            popover.innerHTML = popHtml;
            popover.dataset.colKey = colKey;
            popover.style.top = `${rect.bottom + window.scrollY + 5}px`;
            popover.style.left = `${Math.min(rect.left + window.scrollX - 150, window.innerWidth - 290)}px`;
            popover.classList.add('show');

            setTimeout(() => {
                const searchInput = document.getElementById('columnSearchInput');
                if (searchInput) searchInput.focus();
            }, 100);
        };

        window.onColumnSearch = function(colKey, value) {
            if (value && value.trim() !== '') {
                columnSearchTerms[colKey] = value.trim();
            } else {
                delete columnSearchTerms[colKey];
            }

            const popover = document.getElementById('filterPopover');
            if (popover && popover.dataset.colKey === colKey) {
                const searchLower = value.toLowerCase();
                const options = popover.querySelectorAll('.filter-option');
                options.forEach(opt => {
                    const val = opt.dataset.value || '';
                    if (searchLower && !val.toLowerCase().includes(searchLower)) {
                        opt.classList.add('hidden');
                    } else {
                        opt.classList.remove('hidden');
                    }
                });
            }

            applyFilters();
        };

        window.applyDateFilter = function(colKey) {
            const fromRGB = document.getElementById('dateFromPicker').value;
            const toRGB = document.getElementById('dateToPicker').value;

            let from = '', to = '';
            if (fromRGB) {
                const parts = fromRGB.split('-');
                from = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            if (toRGB) {
                const parts = toRGB.split('-');
                to = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }

            if (fromRGB || toRGB) {
                activeColumnFilters[colKey] = { from, to, fromRGB, toRGB };
            } else {
                delete activeColumnFilters[colKey];
            }
            document.getElementById('filterPopover').classList.remove('show');
            applyFilters();
        };

        window.clearDateFilter = function(colKey) {
            delete activeColumnFilters[colKey];
            document.getElementById('filterPopover').classList.remove('show');
            applyFilters();
        };

        window.onCheckboxChange = function(colKey) {
            const popover = document.getElementById('filterPopover');
            const checkboxes = popover.querySelectorAll('input[type="checkbox"]:not(.hidden)');
            const selected = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);

            if (selected.length > 0) {
                activeColumnFilters[colKey] = selected;
            } else {
                delete activeColumnFilters[colKey];
            }
            applyFilters();
        };

        window.selectAllColumn = function(colKey, selectAll) {
            const popover = document.getElementById('filterPopover');
            const checkboxes = popover.querySelectorAll('input[type="checkbox"]:not(.hidden)');
            checkboxes.forEach(cb => cb.checked = selectAll);
            window.onCheckboxChange(colKey);
        };

        window.resetAllFilters = function() {
            activeColumnFilters = {};
            columnSearchTerms = {};
            applyFilters();
            showStatus("تم إعادة ضبط جميع الفلاتر", "info");
        };

        window.exportToExcel = function() {
            if (filteredKeysList.length === 0) {
                alert("لا توجد بيانات لتصديرها.");
                return;
            }

            const exportData = filteredKeysList.map((key) => {
                const record = allRecords[key];
                const rowObj = {};

                COLUMNS.forEach(col => {
                    let val = getRecordValue(record, col);
                    const headerKey = col.key;

                    if (col.isDate && val !== 'N/A') {
                        val = formatToDDMMYYYY(val);
                    }

                    rowObj[headerKey] = val;
                });

                return rowObj;
            });

            try {
                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "العدادات والمحولات");
                XLSX.writeFile(workbook, `سجلات_العدادات_A123_${handsa_code}.xlsx`);
                showStatus("تم تصدير البيانات بنجاح", "success");
            } catch (err) {
                showStatus("خطأ في التصدير: " + err.message, "error");
            }
        };

        // ===== FIXED EDIT FUNCTION =====
        window.editRecord = function(key) {
            const rec = allRecords[key];
            if (!rec) return;

            // Set basic fields
            document.getElementById('meter_number').value = rec["meter_number"] || '';
            document.getElementById('sim_number').value = rec["sim_number"] || '';
            document.getElementById('meter_type').value = rec["meter_type"] || 'A3';
            document.getElementById('meter_voltage').value = rec["meter_voltage"] || '110';

            const installDateStr = rec["install_date"] || formatDate(new Date());
            document.getElementById('install_date').value = installDateStr;
            const dateObj = parseDate(installDateStr);
            if (dateObj && !isNaN(dateObj.getTime())) {
                document.getElementById('installDatePicker').value = dateToPicker(installDateStr);
                updateDateDisplay(dateObj);
            } else {
                document.getElementById('installDatePicker').value = '';
                document.getElementById('dateDisplay').textContent = 'التاريخ: --/--/----';
            }

            // Set feeder_type first to rebuild cards
            const feederType = rec["feeder_type"] || rec["trans_type"] || 'Subestation';
            document.getElementById('feeder_type').value = feederType;
            
            // Rebuild cards
            buildDynamicCards();

            // After cards are rebuilt, populate values with a delay
            setTimeout(() => {
                // Common fields
                document.getElementById('facility_capacity').value = rec["facility_capacity"] || '';
                document.getElementById('address').value = rec["address"] || '';
                document.getElementById('lat').value = rec["lat"] || '';
                document.getElementById('lng').value = rec["lng"] || '';
                document.getElementById('dp').value = rec["dp"] || '';

                // Populate based on feeder type
                if (feederType === 'Subestation') {
                    document.getElementById('facility').value = rec["facility"] || '';
                    document.getElementById('facility_code').value = rec["facility_code"] || '';
                } else if (feederType === 'Feeder Incoming') {
                    document.getElementById('facility').value = rec["facility"] || '';
                    document.getElementById('facility_code').value = rec["facility_code"] || '';
                    const stName = rec["feeder"] || '';
                    document.getElementById('feeder').value = stName;
                    // Populate station code dropdown
                    const dl = document.getElementById('stationCodeList');
                    if (dl) {
                        dl.innerHTML = '';
                        if (stName && stationCodesByName[stName]) {
                            stationCodesByName[stName].forEach(c => {
                                const o = document.createElement('option');
                                o.value = c;
                                dl.appendChild(o);
                            });
                        }
                    }
                    document.getElementById('feeder_code').value = rec["feeder_code"] || '';
                } else if (feederType === 'Feeder Outgoing') {
                    document.getElementById('facility').value = rec["facility"] || '';
                    document.getElementById('facility_code').value = rec["facility_code"] || '';
                } else if (feederType === 'Compact') {
                    document.getElementById('facility').value = rec["facility"] || '';
                    document.getElementById('facility_code').value = rec["facility_code"] || '';
                    document.getElementById('feeder').value = rec["feeder"] || '';
                    document.getElementById('feeder_code').value = rec["feeder_code"] || '';
                }

                // Re-render dropdowns
                renderStationsList();
                renderStationCodeList();
                renderPanelsList();
                renderFeedersList();
                renderFeederCodeList();
                renderOutgoingList();

                editingKey = key;
                document.getElementById('editingKey').value = key;
                document.getElementById('addSingleBtn').innerHTML = '<i class="fas fa-save"></i> تحديث السجل';
                document.getElementById('cancelEditBtn').style.display = 'inline-block';
                document.getElementById('addSingleBtn').style.backgroundColor = '#f59e0b';
                document.getElementById('dataForm').scrollIntoView({ behavior: 'smooth' });
                checkValidation();
                applyFilters();
            }, 100);
        };

        window.deleteRecord = function(key) {
            if (!confirm(`هل أنت متأكد من حذف السجل رقم ${key}؟`)) return;
            const kId = norm(document.getElementById('keta3_id').value);
            const hCode = norm(document.getElementById('handsa_code').value);
            showStatus("جاري حذف السجل من القاعدة...", "info");
            updateSyncStatus(true);
            const recordRef = ref(db, `sectors/${kId}/districts/${hCode}/manual_entries/${key}`);
            remove(recordRef).then(() => {
                showStatus("تم حذف السجل بنجاح!", "success");
                updateSyncStatus(false);
                resetSessionTimer();
            }).catch(err => {
                showStatus("خطأ أثناء الحذف: " + err.message, "error");
                updateSyncStatus(false);
            });
        };

        function clearForm() {
            document.getElementById('meter_number').value = '';
            document.getElementById('sim_number').value = '';
            document.getElementById('meter_type').value = 'A3';
            document.getElementById('meter_voltage').value = '110';
            setCurrentDate();
            document.getElementById('feeder_type').value = 'Subestation';
            // Clear all fields
            document.getElementById('facility').value = '';
            document.getElementById('facility_capacity').value = '';
            document.getElementById('facility_code').value = '';
            document.getElementById('feeder').value = '';
            document.getElementById('feeder_code').value = '';
            document.getElementById('dp').value = '';
            document.getElementById('address').value = '';
            document.getElementById('lat').value = '';
            document.getElementById('lng').value = '';
            
            // Clear station code dropdown
            const dl = document.getElementById('stationCodeList');
            if (dl) dl.innerHTML = '';
            
            // Rebuild cards to reset UI
            buildDynamicCards();
        }

        function checkValidation() {
            const meterNum = norm(document.getElementById('meter_number').value);
            const simNum = norm(document.getElementById('sim_number').value);
            const editingKeyVal = document.getElementById('editingKey').value;
            const feederType = document.getElementById('feeder_type').value;
            const facilityCode = norm(document.getElementById('facility_code')?.value || '');
            const feederCode = norm(document.getElementById('feeder_code')?.value || '');

            let hasError = false;

            const meterField = document.getElementById('meter_number');
            const meterWarning = document.getElementById('meterNumberWarning');
            if (!meterNum) {
                meterField.classList.remove('duplicate', 'valid');
                meterWarning.classList.remove('show');
                hasError = true;
            } else if (meterNum.length !== 8 || !/^\d+$/.test(meterNum)) {
                meterField.classList.add('duplicate');
                meterField.classList.remove('valid');
                meterWarning.textContent = '⚠️ رقم العداد يجب أن يتكون من 8 أرقام !';
                meterWarning.classList.add('show');
                hasError = true;
            } else if (existingMeters.has(meterNum) && !(editingKeyVal && allRecords[editingKeyVal] && allRecords[editingKeyVal]["meter_number"] === meterNum)) {
                meterField.classList.add('duplicate');
                meterField.classList.remove('valid');
                meterWarning.textContent = '⚠️ رقم العداد مسجل مسبقاً!';
                meterWarning.classList.add('show');
                hasError = true;
            } else {
                meterField.classList.remove('duplicate');
                meterField.classList.add('valid');
                meterWarning.classList.remove('show');
            }

            const simField = document.getElementById('sim_number');
            const simWarning = document.getElementById('simNumberWarning');
            if (simNum) {
                if (simNum.length !== 19 || !/^\d+$/.test(simNum)) {
                    simField.classList.add('duplicate');
                    simField.classList.remove('valid');
                    simWarning.textContent = '⚠️ رقم الشريحة يجب أن يتكون من 19 رقم بالضبط!';
                    simWarning.classList.add('show');
                    hasError = true;
                } else if (existingSims.has(simNum) && !(editingKeyVal && allRecords[editingKeyVal] && allRecords[editingKeyVal]["sim_number"] === simNum)) {
                    simField.classList.add('duplicate');
                    simField.classList.remove('valid');
                    simWarning.textContent = '⚠️ رقم الشريحة مسجل مسبقاً!';
                    simWarning.classList.add('show');
                    hasError = true;
                } else {
                    simField.classList.remove('duplicate');
                    simField.classList.add('valid');
                    simWarning.classList.remove('show');
                }
            } else {
                simField.classList.remove('duplicate', 'valid');
                simWarning.classList.remove('show');
            }

            if ((feederType === 'Feeder Incoming' || feederType === 'Feeder Outgoing') && facilityCode && !validateCellCode(facilityCode)) {
                const fcField = document.getElementById('facility_code');
                const fcWarn = document.getElementById('facilityCodeWarning');
                if (fcField && fcWarn) {
                    fcField.classList.add('duplicate');
                    fcField.classList.remove('valid');
                    fcWarn.textContent = '⚠️ كود المغذي غير صحيح!';
                    fcWarn.classList.add('show');
                    hasError = true;
                }
            }

            if (feederType === 'Compact' && feederCode && !validateCellCode(feederCode)) {
                const fcField = document.getElementById('feeder_code');
                const fcWarn = document.getElementById('feederCodeWarning');
                if (fcField && fcWarn) {
                    fcField.classList.add('duplicate');
                    fcField.classList.remove('valid');
                    fcWarn.textContent = '⚠️ كود المغذي غير صحيح!';
                    fcWarn.classList.add('show');
                    hasError = true;
                }
            }

            document.getElementById('addSingleBtn').disabled = hasError;
        }

        document.getElementById('meter_number').addEventListener('input', checkValidation);
        document.getElementById('sim_number').addEventListener('input', checkValidation);

        document.addEventListener('click', (e) => {
            const popover = document.getElementById('filterPopover');
            if (popover && !popover.contains(e.target) && !e.target.closest('.filter-btn')) {
                popover.classList.remove('show');
            }
        });

        // ===== FIXED SAVE RECORD =====
        document.getElementById('addSingleBtn').addEventListener('click', function() {
            const kId = norm(document.getElementById('keta3_id').value);
            const hCode = norm(document.getElementById('handsa_code').value);
            const meterNum = norm(document.getElementById('meter_number').value);
            const simNum = norm(document.getElementById('sim_number').value);
            const feederType = document.getElementById('feeder_type').value;

            const facility = norm(document.getElementById('facility')?.value || '');
            const facilityCapacity = norm(document.getElementById('facility_capacity')?.value || '');
            const facilityCode = norm(document.getElementById('facility_code')?.value || '');
            const feeder = norm(document.getElementById('feeder')?.value || '');
            const feederCode = norm(document.getElementById('feeder_code')?.value || '');
            const dp = norm(document.getElementById('dp')?.value || '');
            
            const editingKeyVal = document.getElementById('editingKey').value;

            if (!meterNum || meterNum.length !== 8) {
                showStatus("يرجى التأكد من إدخال رقم العداد الرئيسي المكون من 8 أرقام.", "error");
                return;
            }

            if ((feederType === 'Feeder Incoming' || feederType === 'Feeder Outgoing') && facilityCode && !validateCellCode(facilityCode)) {
                showStatus("كود المغذي غير صحيح!", "error");
                return;
            }
            if (feederType === 'Compact' && feederCode && !validateCellCode(feederCode)) {
                showStatus("كود المغذي غير صحيح!", "error");
                return;
            }

            const installDate = document.getElementById('install_date').value;
            const dateParts = installDate.split('/');
            if (dateParts.length !== 3 || !/^\d{2}$/.test(dateParts[0]) || !/^\d{2}$/.test(dateParts[1]) || !/^\d{4}$/.test(dateParts[2])) {
                showStatus("تاريخ التركيب يجب أن يكون بصيغة dd/mm/yyyy", "error");
                return;
            }

            // Database keys must match Excel headers exactly
            const recordData = {
                "meter_number": meterNum,
                "sim_number": simNum,
                "meter_type": document.getElementById('meter_type').value,
                "meter_voltage": norm(document.getElementById('meter_voltage').value),
                "install_date": installDate,
                "feeder_type": feederType,
                "facility": facility,
                "facility_capacity": facilityCapacity,
                "facility_code": facilityCode,
                "feeder": feeder,
                "feeder_code": feederCode,
                "dp": dp,
                "keta3": sectorName,
                "keta3_id": kId,
                "handsa": districtName,
                "handsa_code": hCode,
                "address": norm(document.getElementById('address').value),
                "lat": norm(document.getElementById('lat').value),
                "lng": norm(document.getElementById('lng').value)
            };

            // Add trans_type for backward compatibility
            recordData["trans_type"] = feederType;

            const targetKey = editingKeyVal || meterNum;
            const targetRef = ref(db, `sectors/${kId}/districts/${hCode}/manual_entries/${targetKey}`);
            const action = editingKeyVal ? 'تحديث' : 'حفظ';
            showStatus(`جاري ${action} السجل...`, "info");
            updateSyncStatus(true);

            set(targetRef, recordData).then(() => {
                showStatus(`تم ${action} السجل بنجاح!`, "success");
                updateSyncStatus(false);
                resetSessionTimer();
                if (!editingKeyVal) {
                    clearForm();
                } else {
                    window.cancelEdit();
                }
                checkValidation();
            }).catch(err => {
                showStatus(`خطأ أثناء ${action}: ` + err.message, "error");
                updateSyncStatus(false);
            });
        });

        document.getElementById('cancelEditBtn').addEventListener('click', window.cancelEdit);

        // Init
        console.log("Initializing with keta3_id:", keta3_id, "handsa_code:", handsa_code);
        document.getElementById('keta3_id').value = keta3_id;
        document.getElementById('handsa_code').value = handsa_code;
        currentHandsaCode = norm(handsa_code);
        
        setCurrentDate();
        authenticateAndInit();
        resetSessionTimer();
        startCountdown();
        checkValidation();
    </script>
</body>
</html>
