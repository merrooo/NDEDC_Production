<!DOCTYPE html>
<html lang="ar" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Admin - Removal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        [data-theme="dark"] {
            --bg: #0B0F19; --card: rgba(21, 28, 44, 0.75); --card-hover: #1E293B;
            --accent: #38BDF8; --accent-hover: #0EA5E9; --success: #10B981; --danger: #EF4444;
            --text-main: #F8FAFC; --text-sub: #94A3B8; --border: rgba(30, 41, 59, 0.8);
            --input-bg: rgba(7, 10, 18, 0.6); --matrix-color: #0F0;
        }
        [data-theme="light"] {
            --bg: #F4F7FB; --card: rgba(255, 255, 255, 0.8); --card-hover: #E7EEF7;
            --accent: #0284C7; --accent-hover: #0369A1; --success: #059669; --danger: #DC2626;
            --text-main: #111827; --text-sub: #526174; --border: rgba(216, 224, 234, 0.8);
            --input-bg: rgba(234, 240, 246, 0.6); --matrix-color: #047857;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text-main); height: 100vh; overflow: hidden; user-select: none; }
        #matrixCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; opacity: 0.15; pointer-events: none; }
        .main-container { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; padding: 12px; gap: 12px; }
        
        .header { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 4px; flex-shrink: 0; -webkit-app-region: drag; }
        .brand { font-size: 16px; font-weight: 700; color: var(--danger); display: flex; align-items: center; gap: 8px; }
        .controls { display: flex; gap: 8px; -webkit-app-region: no-drag; }
        
        .dashboard { flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px; display: flex; justify-content: center; align-items: flex-start; }
        .card { background: var(--card); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 700px; }
        
        .card-header { border-bottom: 1px solid var(--border); padding-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .card-title { font-size: 14px; font-weight: 700; color: var(--danger); text-transform: uppercase; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; font-weight: 700; color: var(--text-sub); }
        input, textarea { width: 100%; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none; transition: 0.2s; }
        input:focus, textarea:focus { border-color: var(--danger); }
        
        .btn { font-size: 13px; font-weight: 700; height: 36px; padding: 0 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--input-bg); color: var(--text-main); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.15s; }
        .btn:hover:not(:disabled) { background: var(--card-hover); }
        .btn.danger { background: var(--danger); color: #fff; border: none; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .console-wrapper { background: #000; border-radius: 6px; border: 1px solid var(--border); overflow: hidden; }
        .console-header { background: #111; padding: 8px 12px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid #333; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.red { background: #ff5f56; } .dot.yellow { background: #ffbd2e; } .dot.green { background: #27c93f; }
        #logConsole { padding: 12px; color: #38bdf8; font-family: 'JetBrains Mono', monospace; font-size: 12px; max-height: 150px; overflow-y: auto; line-height: 1.5; }
        .loader { border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid #fff; border-radius: 50%; width: 14px; height: 14px; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        select.btn { padding: 0 8px; outline: none; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="main-container">
        <div class="header">
            <span class="brand">🔥 Firebase Removal</span>
            <div class="controls">
                <select id="themeSelect" class="btn"><option value="dark">Dark</option><option value="light">Light</option></select>
            </div>
        </div>
        
        <div class="dashboard">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">حذف مسار من Database</span>
                </div>
                
                <div class="form-group">
                    <label>إعدادات المشروع (JSON Config)</label>
                    <textarea id="firebaseConfigInput" rows="6" placeholder='const firebaseConfig = { "apiKey": "...", ... }'></textarea>
                </div>
                
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="form-group">
                        <label>المسار المستهدف</label>
                        <input type="text" id="targetPath" value="/" placeholder="/users/data">
                    </div>
                    <div class="form-group">
                        <label>تأكيد الهوية (اكتب DELETE)</label>
                        <input type="text" id="confirmText" placeholder="DELETE">
                    </div>
                </div>
                
                <button class="btn danger" id="startAction" disabled style="width:100%; height:40px;">
                    <span class="loader" id="loader"></span>
                    <span id="btnText">تنفيذ المسح النهائي</span>
                    <i class="fas fa-trash-alt"></i>
                </button>
                
                <div class="console-wrapper">
                    <div class="console-header">
                        <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
                        <span style="color: #94a3b8; font-size: 10px; margin-left: 8px;">Terminal</span>
                    </div>
                    <div id="logConsole"><div id="logContent">> النظام جاهز...</div></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        // Matrix & Theme
        const themeSelect = document.getElementById('themeSelect');
        themeSelect.addEventListener('change', (e) => { document.documentElement.setAttribute('data-theme', e.target.value); updateMatrixColor(); });
        const canvas = document.getElementById('matrixCanvas'), ctx = canvas.getContext('2d');
        let matrixColor = '#0F0', width = window.innerWidth, height = window.innerHeight, columns = Math.floor(width / 20), drops = [];
        function updateMatrixColor() { matrixColor = document.documentElement.getAttribute('data-theme') === 'dark' ? '#0F0' : '#047857'; }
        function initMatrix() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; columns = Math.floor(width / 20); drops = Array(columns).fill(1); updateMatrixColor(); }
        const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()";
        function drawMatrix() {
            ctx.fillStyle = document.documentElement.getAttribute('data-theme') === 'light' ? "rgba(244, 247, 251, 0.1)" : "rgba(11, 15, 25, 0.05)";
            ctx.fillRect(0, 0, width, height); ctx.fillStyle = matrixColor; ctx.font = "15px monospace";
            for (let i = 0; i < drops.length; i++) {
                ctx.fillText(matrixChars.charAt(Math.floor(Math.random() * matrixChars.length)), i * 20, drops[i] * 20);
                if (drops[i] * 20 > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        initMatrix(); setInterval(drawMatrix, 50); window.addEventListener('resize', initMatrix);

        // Logic
        const btn = document.getElementById('startAction'), confirmInput = document.getElementById('confirmText'), loader = document.getElementById('loader'), btnText = document.getElementById('btnText'), logContent = document.getElementById('logContent');
        confirmInput.addEventListener('input', (e) => { btn.disabled = e.target.value.trim().toUpperCase() !== 'DELETE'; });
        function log(msg, type = 'info') {
            const colors = { info: '#38bdf8', error: '#f87171', warn: '#fbbf24' };
            logContent.innerHTML += `<div style="color:${colors[type]}"><span style="color:#64748b">[${new Date().toLocaleTimeString()}]</span> ${msg}</div>`;
            logContent.parentElement.scrollTop = logContent.parentElement.scrollHeight;
        }
        btn.onclick = async () => {
            const configText = document.getElementById('firebaseConfigInput').value;
            const path = document.getElementById('targetPath').value.trim() || "/";
            btn.disabled = true; loader.style.display = 'inline-block'; btnText.innerText = "جاري الحذف...";
            try {
                const config = new Function(`return ${configText.match(/\{[\s\S]*\}/)[0]}`)();
                if (firebase.apps.length) await firebase.app().delete();
                firebase.initializeApp(config);
                log(`بدء الاتصال... المسار: [${path}]`, 'warn');
                await firebase.database().ref(path).remove();
                log("✅ تم مسح البيانات بنجاح.", "info"); confirmInput.value = ""; btnText.innerText = "اكتمل";
            } catch (err) { log("🛑 خطأ: " + err.message, "error"); btnText.innerText = "فشل"; }
            finally { loader.style.display = 'none'; }
        };
    </script>
</body>
</html>
