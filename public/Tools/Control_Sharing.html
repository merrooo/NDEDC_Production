<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VNC · Chat</title>
<style>
[data-theme="dark"]{--bg:#0f172a;--card:rgba(21,28,44,0.85);--accent:#38BDF8;--success:#10B981;--danger:#EF4444;--warning:#F59E0B;--text-main:#F8FAFC;--text-sub:#94A3B8;--border:rgba(30,41,59,0.8);--input-bg:rgba(7,10,18,0.7);--own-msg:#2563eb;--peer-msg:rgba(56,189,248,.15)}
[data-theme="light"]{--bg:#f4f7fb;--card:#FFFFFF;--accent:#0284C7;--success:#059669;--danger:#DC2626;--warning:#D97706;--text-main:#111827;--text-sub:#526174;--border:#E2E8F0;--input-bg:#F8FAFC;--own-msg:#0284C7;--peer-msg:#E0F2FE}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text-main);width:100vw;user-select:none}
#matrixCanvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;opacity:0.12;pointer-events:none}

.main-container{position:relative;z-index:1;height:100vh;width:100vw;display:flex;flex-direction:column;padding:16px 20px 20px;gap:14px;overflow:hidden;box-sizing:border-box;max-width:900px;margin:0 auto}

.top-bar{display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.top-bar h1{font-size:1.15rem;font-weight:800;letter-spacing:0.5px;display:flex;align-items:center;gap:10px}
.top-bar h1 .logo{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--success));color:#fff;font-size:16px}
.top-bar .tagline{font-size:11px;color:var(--text-sub);font-weight:400;margin-left:6px}
select.btn{padding:0 10px;outline:none;cursor:pointer;font-size:11px;background:var(--input-bg);color:var(--text-main);border:1px solid var(--border);border-radius:6px;height:28px}

.content{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;width:100%}

.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.25);width:100%}
.card.chat-card{flex:1;min-height:0}

.conn-title{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:8px}
.conn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);transition:background .3s}
.conn-dot.ok{background:var(--success);box-shadow:0 0 8px var(--success)}

.infoBar{padding:9px 12px;font-size:11px;font-weight:700;border-radius:6px;text-align:center;background:rgba(120,53,15,.25);color:var(--warning);border:1px solid var(--warning);transition:all .3s}
.infoBar.ok{background:rgba(6,78,59,.25);color:var(--success);border-color:var(--success)}
.infoBar.err{background:rgba(127,29,29,.25);color:var(--danger);border-color:var(--danger)}
.infoBar.hidden{display:none}

.buttonRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn-conn{border:none;border-radius:10px;padding:13px 8px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;color:#fff}
.btn-conn:disabled{opacity:.22;cursor:not-allowed;transform:none !important}
.btn-conn:active:not(:disabled){transform:scale(.97)}
.btn-create{background:#2563eb}
.btn-create:hover:not(:disabled){background:#1d4ed8}
.btn-join{background:#7c3aed}
.btn-join:hover:not(:disabled){background:#6d28d9}
.btn-disc{background:#ef4444}
.btn-disc:hover:not(:disabled){background:#dc2626}

.conn-status{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;text-align:center;background:var(--input-bg);color:var(--text-sub);border:1px solid var(--border);transition:all .3s}
.conn-status.ok{background:rgba(6,78,59,.25);color:var(--success);border-color:var(--success)}
.conn-status.err{background:rgba(127,29,29,.25);color:var(--danger);border-color:var(--danger)}
.conn-status.warn{background:rgba(120,53,15,.25);color:var(--warning);border-color:var(--warning)}

.session-display{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;font-family:'Courier New',monospace}
.session-display .label{font-size:11px;color:var(--text-sub);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.session-display .code{font-size:20px;font-weight:800;letter-spacing:4px;color:var(--accent)}
.copy-btn{background:none;border:none;cursor:pointer;font-size:16px;opacity:.7;padding:4px 6px;border-radius:4px;transition:.15s;color:var(--text-main)}
.copy-btn:hover{opacity:1;background:rgba(56,189,248,.15)}

.message-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:12px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px}
.empty-state{color:var(--text-sub);font-size:13px;font-style:italic;text-align:center;padding:40px 20px;line-height:1.6}

.msg{display:flex;flex-direction:column;max-width:75%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.4;word-wrap:break-word;animation:msgIn .2s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.them{align-self:flex-start;background:var(--peer-msg);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--own-msg);color:#fff;border-bottom-right-radius:4px}
.msg .sender{font-size:10px;opacity:.7;margin-bottom:3px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.msg .body{white-space:pre-wrap}
.msg .time{font-size:9px;opacity:.6;margin-top:4px;align-self:flex-end}

.input-row{display:flex;gap:8px;align-items:stretch}
#messageInput{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--input-bg);color:var(--text-main);font-family:'Segoe UI',sans-serif;font-size:14px;resize:none;min-height:48px;max-height:120px;line-height:1.4}
#messageInput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.2)}
#messageInput:disabled{opacity:.4;cursor:not-allowed}
.btn-send{border:none;border-radius:10px;padding:0 20px;font-size:14px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff;transition:.15s}
.btn-send:hover:not(:disabled){background:#1d4ed8}
.btn-send:disabled{opacity:.3;cursor:not-allowed}
.btn-send:active:not(:disabled){transform:scale(.97)}

@media (max-width:520px){
    .main-container{padding:10px 12px 12px}
    .top-bar h1{font-size:1rem}
    .top-bar .tagline{display:none}
    .buttonRow{grid-template-columns:1fr 1fr}
    .buttonRow #btnLeave{grid-column:span 2}
    .session-display .code{font-size:16px;letter-spacing:2px}
}
</style>
</head>
<body>
<canvas id="matrixCanvas"></canvas>

<div class="main-container">
    <div class="top-bar">
        <h1><span class="logo">💬</span>VNC <span class="tagline">Chat · Session</span></h1>
        <select id="themeSelect" class="btn">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </select>
    </div>

    <div class="content">
        <div class="card">
            <div class="conn-title"><span class="conn-dot" id="connDot"></span>🌐 Session</div>
            <div class="infoBar" id="fbBar">🔥 Firebase: connecting…</div>
            <div class="buttonRow">
                <button id="btnCreate" class="btn-conn btn-create">📤 Create</button>
                <button id="btnJoin" class="btn-conn btn-join" disabled>📥 Join</button>
                <button id="btnLeave" class="btn-conn btn-disc" disabled>✖ Leave</button>
            </div>
            <div id="connStatus" class="conn-status">Not connected</div>
            <div id="sessionDisplay" class="session-display" style="display:none;">
                <span class="label">Code</span>
                <span class="code" id="sessionCode">----</span>
                <button id="btnCopyCode" class="copy-btn" title="Copy code">📋</button>
            </div>
        </div>

        <div class="card chat-card">
            <div class="conn-title">💬 Messages</div>
            <div id="messageList" class="message-list">
                <div class="empty-state">Create or Join a session to start chatting</div>
            </div>
            <div class="input-row">
                <textarea id="messageInput" placeholder="Type a message… (Enter to send, Shift+Enter for new line)" rows="2" disabled></textarea>
                <button id="btnSend" class="btn-send" disabled>Send</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, set, get, onValue, onChildAdded, push, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAnKRhT5xJTBvsQKpW7e9w-hGSbAQJWTSo",
    authDomain: "production1-ae85.firebaseapp.com",
    databaseURL: "https://production1-ae85-default-rtdb.firebaseio.com",
    projectId: "production1-ae85",
    storageBucket: "production1-ae85.firebasestorage.app",
    messagingSenderId: "490438031865",
    appId: "1:490438031865:web:a4a69335989f30cd13a528"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const $ = id => document.getElementById(id);

const AUTO_JOIN = new URLSearchParams(location.search).get('autojoin') === '1';
if (AUTO_JOIN) console.log('[autojoin] auto-mode enabled');

let myRole = null;
let activeCode = null;
let slaveHasCode = false;
let appState = 'idle';
let firebaseOk = false;
let unsubMessages = null;
let unsubSessionWatch = null;
let unsubSlavePresence = null;
const renderedKeys = new Set();

function setConnStatus(msg, cls='') { const el=$('connStatus'); el.innerHTML=msg; el.className='conn-status'+(cls?' '+cls:''); }
function setConnDot(on) { $('connDot').className='conn-dot'+(on?' ok':''); }

function genCode() {
    const c = 'abcdefghjkmnpqrstuvwxyz23456789';
    let o = ''; for (let i = 0; i < 4; i++) o += c[Math.floor(Math.random() * c.length)];
    return o;
}

function updateUI() {
    const idle = appState === 'idle';
    const hasSession = !!activeCode;

    $('btnCreate').disabled = !idle || slaveHasCode || myRole === 'slave' || !firebaseOk;
    $('btnJoin').disabled = !slaveHasCode || !idle || myRole === 'master' || !firebaseOk;
    $('btnLeave').disabled = idle;

    $('messageInput').disabled = !hasSession || !myRole;
    $('btnSend').disabled = !hasSession || !myRole;

    const sessionDisplay = $('sessionDisplay');
    if (hasSession) {
        sessionDisplay.style.display = 'flex';
        $('sessionCode').textContent = activeCode.toUpperCase();
    } else {
        sessionDisplay.style.display = 'none';
    }

    setConnDot(appState === 'connected');
}

function clearMessages() {
    $('messageList').innerHTML = '';
    renderedKeys.clear();
}

function showEmptyState(text) {
    $('messageList').innerHTML = `<div class="empty-state">${text}</div>`;
}

function renderMessage(msg, key) {
    if (!msg || !msg.text) return;
    if (renderedKeys.has(key)) return;
    renderedKeys.add(key);

    const list = $('messageList');
    const empty = list.querySelector('.empty-state');
    if (empty) empty.remove();

    const isOwn = msg.sender === myRole;
    const el = document.createElement('div');
    el.className = 'msg ' + (isOwn ? 'me' : 'them');
    el.dataset.key = key;

    const sender = document.createElement('div');
    sender.className = 'sender';
    sender.textContent = isOwn ? 'You' : 'Them';

    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = msg.text;

    const time = document.createElement('div');
    time.className = 'time';
    const d = new Date(msg.ts || Date.now());
    time.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    el.appendChild(sender);
    el.appendChild(body);
    el.appendChild(time);
    list.appendChild(el);

    list.scrollTop = list.scrollHeight;
}

function attachMessageListener(code) {
    if (unsubMessages) { try { unsubMessages(); } catch(_){} }
    unsubMessages = onChildAdded(ref(db, `sessions/${code}/messages`), snap => {
        renderMessage(snap.val(), snap.key);
    });
}

function detachAllListeners() {
    if (unsubMessages) { try { unsubMessages(); } catch(_){} unsubMessages = null; }
    if (unsubSlavePresence) { try { unsubSlavePresence(); } catch(_){} unsubSlavePresence = null; }
}

async function testFirebase() {
    const bar = $('fbBar');
    try {
        await set(ref(db, '_hc'), { ts: Date.now() });
        await remove(ref(db, '_hc'));
        firebaseOk = true;
        bar.textContent = '🔥 Firebase: OK';
        bar.className = 'infoBar ok';
        setTimeout(() => bar.classList.add('hidden'), 2500);
        return true;
    } catch(e) {
        firebaseOk = false;
        bar.textContent = '❌ Firebase: ' + (e.message || e.code || e);
        bar.className = 'infoBar err';
        return false;
    }
}

async function sweepStaleSession() {
    try {
        const snap = await get(ref(db, 'currentSession'));
        const val = snap.val();
        if (val && val.ts && (Date.now() - val.ts > 5 * 60 * 1000)) {
            try { await remove(ref(db, `sessions/${val.code}`)); } catch(_){}
            try { await remove(ref(db, 'currentSession')); } catch(_){}
        }
    } catch(_) {}
}

// ── Create session (master) ──
$('btnCreate').onclick = async () => {
    if (!firebaseOk) return;
    await sweepStaleSession();

    myRole = 'master';
    const code = genCode();
    activeCode = code;
    appState = 'waiting';
    updateUI();
    setConnStatus('Creating session…');

    try {
        await set(ref(db, `sessions/${code}/meta`), {
            created: Date.now(),
            master_online: true,
            slave_joined: false
        });
        await set(ref(db, 'currentSession'), { code, ts: Date.now() });

        onDisconnect(ref(db, 'currentSession')).remove();
        onDisconnect(ref(db, `sessions/${code}`)).remove();

        clearMessages();
        showEmptyState('Waiting for peer to join…');
        attachMessageListener(code);

        unsubSlavePresence = onValue(ref(db, `sessions/${code}/meta/slave_joined`), snap => {
            const joined = snap.val() === true;
            if (joined && appState === 'waiting') {
                appState = 'connected';
                setConnStatus('✅ Peer connected — say hi!', 'ok');
                updateUI();
            } else if (!joined && appState === 'connected') {
                appState = 'waiting';
                setConnStatus('Peer left — waiting for them to rejoin…', 'warn');
                updateUI();
            }
        });

        setConnStatus('Waiting for peer — share code ' + code.toUpperCase(), 'warn');
    } catch(e) {
        setConnStatus('Create failed: ' + e.message, 'err');
        myRole = null; activeCode = null; appState = 'idle';
        updateUI();
    }
};

// ── Join session (slave) ──
$('btnJoin').onclick = async () => {
    if (!firebaseOk || !activeCode) return;

    myRole = 'slave';
    const code = activeCode;
    appState = 'waiting';
    updateUI();
    setConnStatus('Joining session ' + code.toUpperCase() + '…');

    try {
        const snap = await get(ref(db, `sessions/${code}/meta`));
        if (!snap.exists()) {
            setConnStatus('Session not found', 'err');
            myRole = null; activeCode = null; appState = 'idle';
            updateUI();
            return;
        }

        await set(ref(db, `sessions/${code}/meta/slave_joined`), true);
        onDisconnect(ref(db, `sessions/${code}/meta/slave_joined`)).set(false);

        clearMessages();
        attachMessageListener(code);

        appState = 'connected';
        setConnStatus('✅ Joined — start chatting', 'ok');
        updateUI();
    } catch(e) {
        setConnStatus('Join failed: ' + e.message, 'err');
        myRole = null; appState = 'idle';
        updateUI();
    }
};

// ── Leave session ──
$('btnLeave').onclick = async () => {
    const wasMaster = myRole === 'master';
    const code = activeCode;

    detachAllListeners();

    if (wasMaster && code) {
        try { await onDisconnect(ref(db, 'currentSession')).cancel(); } catch(_){}
        try { await onDisconnect(ref(db, `sessions/${code}`)).cancel(); } catch(_){}
        try { await remove(ref(db, 'currentSession')); } catch(_){}
        try { await remove(ref(db, `sessions/${code}`)); } catch(_){}
    } else if (code) {
        try { await set(ref(db, `sessions/${code}/meta/slave_joined`), false); } catch(_){}
        try { await onDisconnect(ref(db, `sessions/${code}/meta/slave_joined`)).cancel(); } catch(_){}
    }

    myRole = null; activeCode = null; appState = 'idle';
    clearMessages();
    showEmptyState('Create or Join a session to start chatting');
    setConnStatus(AUTO_JOIN ? 'Auto-mode: waiting for a session…' : 'Ready — click Create or Join');
    updateUI();
};

// ── Send message ──
async function sendMessage() {
    const input = $('messageInput');
    const text = input.value.trim();
    if (!text || !activeCode || !myRole) return;

    input.value = '';
    input.style.height = 'auto';

    const msgRef = push(ref(db, `sessions/${activeCode}/messages`));
    const key = msgRef.key;
    const msg = { sender: myRole, text, ts: Date.now() };

    renderedKeys.add(key);
    renderMessage(msg, key);

    try { await set(msgRef, msg); } catch(e) { console.error('[send]', e); }
}

$('btnSend').onclick = sendMessage;

$('messageInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

$('messageInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ── Watch for sessions (slave discovery + auto-join) ──
function startSessionWatcher() {
    unsubSessionWatch = onValue(ref(db, 'currentSession'), snap => {
        const val = snap.val();

        // Session disappeared
        if (!val || !val.code) {
            if (myRole === 'slave' && activeCode && appState !== 'idle') {
                detachAllListeners();
                myRole = null; activeCode = null; appState = 'idle';
                clearMessages();
                showEmptyState('Session ended by peer');
                setConnStatus('Session ended by peer', 'warn');
                updateUI();
                return;
            }
            if (slaveHasCode) {
                slaveHasCode = false;
                updateUI();
            }
            return;
        }

        if (myRole === 'master') return;
        if (appState !== 'idle') return;

        slaveHasCode = true;
        activeCode = val.code;
        updateUI();
        setConnStatus('Session available — click Join');

        if (AUTO_JOIN) {
            setTimeout(() => {
                if (appState === 'idle' && slaveHasCode && activeCode === val.code) {
                    $('btnJoin').click();
                }
            }, 600);
        }
    });
}

// ── Copy session code ──
$('btnCopyCode').onclick = async () => {
    if (!activeCode) return;
    try {
        await navigator.clipboard.writeText(activeCode.toUpperCase());
        const btn = $('btnCopyCode');
        btn.textContent = '✓';
        setTimeout(() => { btn.textContent = '📋'; }, 1200);
    } catch(_) {}
};

// ── Init ──
(async () => {
    setConnStatus('Testing Firebase…');
    const ok = await testFirebase();
    if (!ok) { setConnStatus('Firebase failed', 'err'); updateUI(); return; }
    sweepStaleSession();
    startSessionWatcher();
    updateUI();
    setConnStatus(AUTO_JOIN ? 'Auto-mode: waiting for a session…' : 'Ready — click Create or Join');
})();
</script>

<script>
// Theme switcher
const themeSelect = document.getElementById('themeSelect');
try {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeSelect.value = savedTheme;
    }
} catch(e) {}

themeSelect.addEventListener('change', (e) => {
    document.documentElement.setAttribute('data-theme', e.target.value);
    updateMatrixColor();
    try { localStorage.setItem('theme', e.target.value); } catch(e) {}
});

// Matrix background
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
let matrixColor = '#0F0';
let width = window.innerWidth, height = window.innerHeight;
let columns = Math.floor(width / 20), drops = [];
function updateMatrixColor() { matrixColor = document.documentElement.getAttribute('data-theme') === 'dark' ? '#0F0' : '#047857'; }
function initMatrix() {
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = width; canvas.height = height;
    columns = Math.floor(width / 20); drops = Array(columns).fill(1);
    updateMatrixColor();
}
const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
function drawMatrix() {
    ctx.fillStyle = document.documentElement.getAttribute('data-theme') === 'light' ? "rgba(244,247,251,0.1)" : "rgba(11,15,25,0.05)";
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = matrixColor; ctx.font = "15px monospace";
    for (let i = 0; i < drops.length; i++) {
        ctx.fillText(matrixChars.charAt(Math.floor(Math.random() * matrixChars.length)), i * 20, drops[i] * 20);
        if (drops[i] * 20 > height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
initMatrix(); setInterval(drawMatrix, 50); window.addEventListener('resize', initMatrix);
</script>
</body>
</html>
