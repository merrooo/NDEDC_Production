<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أقرب قرية</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        [data-theme="dark"] {
            --bg: #0B0F19; --card: rgba(21, 28, 44, 0.75); --card-hover: #1E293B;
            --accent: #38BDF8; --accent-hover: #0EA5E9; --success: #10B981; --danger: #EF4444;
            --text-main: #F8FAFC; --text-sub: #94A3B8; --border: rgba(30, 41, 59, 0.8);
            --input-bg: rgba(7, 10, 18, 0.6); --matrix-color: #0F0;
        }
        [data-theme="light"] {
            --bg: #F4F7FB; --card: rgba(255, 255, 255, 0.8); --card-hover: #E7EEF7;
            --accent: #0284C7; --accent-hover: #0369A1; --success: #059669; --danger: #DC2626;
            --text-main: #111827; --text-sub: #526174; --border: rgba(216, 224, 234, 0.8);
            --input-bg: rgba(234, 240, 246, 0.6); --matrix-color: #047857;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: var(--text-main); height: 100vh; overflow: hidden; user-select: none; display: flex; }
        #matrixCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; opacity: 0.15; pointer-events: none; }
        
        .main-container { position: relative; z-index: 1; display: flex; flex-direction: column; width: 100%; height: 100vh; padding: 12px; gap: 12px; }
        
        .header { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 4px; flex-shrink: 0; -webkit-app-region: drag; background: var(--card); backdrop-filter: blur(10px); border-radius: 8px; border: 1px solid var(--border); padding: 0 16px; }
        .brand { font-size: 16px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .controls { display: flex; gap: 8px; -webkit-app-region: no-drag; }
        
        .btn { font-size: 12px; font-weight: 700; height: 32px; padding: 0 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--input-bg); color: var(--text-main); cursor: pointer; transition: 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:hover { background: var(--card-hover); }
        .btn.accent { background: var(--accent); color: #fff; border: none; }
        
        input[type="text"] { height: 32px; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border); border-radius: 6px; padding: 0 12px; font-size: 13px; outline: none; width: 140px; }
        input[type="text"]:focus { border-color: var(--accent); }

        .content-wrapper { display: flex; flex: 1; min-height: 0; gap: 12px; }
        
        /* Map Card */
        .map-card { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; }
        #map { flex: 1; width: 100%; border-radius: 6px; z-index: 1; border: 1px solid var(--border); }
        
        /* Sidebar */
        .sidebar { width: 300px; background: var(--card); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .sidebar h2 { font-size: 14px; font-weight: 700; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        #infoPanel { font-size: 13px; color: var(--text-main); display: flex; flex-direction: column; gap: 10px; }
        
        .info-box { background: var(--input-bg); padding: 12px; border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
        .info-box .lbl { font-size: 11px; color: var(--text-sub); font-weight: 600; }
        .info-box .val { font-weight: 700; font-size: 14px; }
        .distance-badge { background: var(--accent); color: #fff; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 700; display: inline-block; }
        
        select.btn { padding: 0 8px; outline: none; cursor: pointer; }
        .leaflet-control-layers { direction: ltr; }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    
    <div class="main-container">
        <div class="header">
            <span class="brand">📍 أقرب قرية (نقرة واحدة)</span>
            <div class="controls">
                <input type="text" id="latInput" placeholder="Latitude">
                <input type="text" id="lngInput" placeholder="Longitude">
                <button class="btn accent" onclick="searchCoordinates()">بحث</button>
                <select id="themeSelect" class="btn"><option value="dark">Dark</option><option value="light">Light</option></select>
            </div>
        </div>
        
        <div class="content-wrapper">
            <div class="map-card">
                <div id="map"></div>
            </div>
            
            <div class="sidebar">
                <h2>🏡 أقرب قرية / تجمع</h2>
                <div id="infoPanel">
                    <div class="info-box" style="text-align: center; color: var(--text-sub);">
                        <span style="font-size: 24px; margin-bottom: 8px;">👆</span>
                        انقر على الخريطة لتحديد الموقع
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Matrix & Theme
        const themeSelect = document.getElementById('themeSelect');
        themeSelect.addEventListener('change', (e) => { document.documentElement.setAttribute('data-theme', e.target.value); updateMatrixColor(); });
        const canvas = document.getElementById('matrixCanvas'), ctx = canvas.getContext('2d');
        let matrixColor = '#0F0', width = window.innerWidth, height = window.innerHeight, columns = Math.floor(width / 20), drops = [];
        function updateMatrixColor() { matrixColor = document.documentElement.getAttribute('data-theme') === 'dark' ? '#0F0' : '#047857'; }
        function initMatrix() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; columns = Math.floor(width / 20); drops = Array(columns).fill(1); updateMatrixColor(); }
        const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()";
        function drawMatrix() {
            ctx.fillStyle = document.documentElement.getAttribute('data-theme') === 'light' ? "rgba(244, 247, 251, 0.1)" : "rgba(11, 15, 25, 0.05)";
            ctx.fillRect(0, 0, width, height); ctx.fillStyle = matrixColor; ctx.font = "15px monospace";
            for (let i = 0; i < drops.length; i++) {
                ctx.fillText(matrixChars.charAt(Math.floor(Math.random() * matrixChars.length)), i * 20, drops[i] * 20);
                if (drops[i] * 20 > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        initMatrix(); setInterval(drawMatrix, 50); window.addEventListener('resize', initMatrix);

        // Map Logic
        const map = L.map('map', { center: [31.0364, 31.3807], zoom: 14, zoomControl: true });
        const esriStreet = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, attribution: '&copy; Esri' });
        const osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OSM' });
        const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, attribution: '&copy; Esri' });
        
        esriStreet.addTo(map);
        L.control.layers({ "🛣️ تفاصيل الشوارع": esriStreet, "🗺️ عادية (OSM)": osmStandard, "🛰️ قمر صناعي": esriSatellite }, null, { position: 'topright', collapsed: false }).addTo(map);
        L.control.scale({ position: 'bottomleft', metric: true, imperial: false }).addTo(map);

        let marker = null, circle = null;

        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; const toRad = (deg) => deg * Math.PI / 180;
            const dLat = toRad(lat2 - lat1); const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        async function fetchNearestVillage(lat, lng) {
            map.setView([lat, lng], 16, { animate: true });
            if (marker) marker.setLatLng([lat, lng]); else marker = L.marker([lat, lng], { riseOnHover: true }).addTo(map);
            if (circle) { map.removeLayer(circle); circle = null; }
            
            const panel = document.getElementById('infoPanel');
            panel.innerHTML = `<div style="text-align:center; padding:20px; color:var(--accent);">⏳ جاري البحث...</div>`;

            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=ar`;
                const data = await (await fetch(url, { headers: { 'Accept-Language': 'ar,en' } })).json();
                const addr = data.address || {};
                const village = addr.village || addr.hamlet || addr.town || addr.suburb || addr.city || addr.municipality || null;
                const district = addr.county || addr.state_district || addr.district || addr.region || '';
                const governorate = addr.state || addr.region || addr.province || '';
                const road = addr.road || addr.path || '';
                
                let nearestName = village || 'غير محدد';
                let distanceMeters = 0, villageCoordsFound = false, nearestLat = lat, nearestLng = lng;

                if (village) {
                    try {
                        const searchUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(village + ' ' + governorate + ' مصر')}&limit=1&accept-language=ar`;
                        const sData = await (await fetch(searchUrl)).json();
                        if (sData && sData.length > 0) {
                            nearestLat = parseFloat(sData[0].lat); nearestLng = parseFloat(sData[0].lon);
                            distanceMeters = haversineDistance(lat, lng, nearestLat, nearestLng);
                            villageCoordsFound = true;
                        }
                    } catch (e) {}
                }
                
                let distanceStr = distanceMeters > 0 ? (distanceMeters < 1000 ? `${Math.round(distanceMeters)} متر` : `${(distanceMeters / 1000).toFixed(2)} كم`) : '📍 الموقع نفسه';

                panel.innerHTML = `
                    <div class="info-box"><span class="lbl">الإحداثيات</span><span class="val" style="font-family:monospace;">${lat.toFixed(6)}, ${lng.toFixed(6)}</span></div>
                    <div class="info-box"><span class="lbl">🏡 أقرب قرية / تجمع</span><span class="val" style="color:var(--accent); font-size:16px;">${nearestName}</span></div>
                    ${district ? `<div class="info-box"><span class="lbl">🏛️ المركز</span><span class="val">${district}</span></div>` : ''}
                    ${governorate ? `<div class="info-box"><span class="lbl">🏙️ المحافظة</span><span class="val">${governorate}</span></div>` : ''}
                    ${road ? `<div class="info-box"><span class="lbl">🛣️ الطريق</span><span class="val">${road}</span></div>` : ''}
                    <div style="margin-top:8px;"><span class="distance-badge">📏 ${distanceStr}</span></div>
                `;

                if (villageCoordsFound && distanceMeters > 0) {
                    circle = L.circle([nearestLat, nearestLng], { radius: distanceMeters, color: 'var(--accent)', fillColor: 'var(--accent)', fillOpacity: 0.15, weight: 2, dashArray: '5,5' }).addTo(map);
                    L.marker([nearestLat, nearestLng], { icon: L.divIcon({ className: 'bg-green-600 rounded-full w-3 h-3 border-2 border-white shadow' }) }).addTo(map).bindPopup(`🏡 ${nearestName}`).openPopup();
                }
                marker.bindPopup(`<b>🏡 ${nearestName}</b><br><span style="font-size:11px;">${governorate}</span>`).openPopup();
            } catch (error) {
                panel.innerHTML = `<div style="color:var(--danger); text-align:center; padding:20px;">❌ حدث خطأ في الاتصال.</div>`;
            }
        }

        window.searchCoordinates = function () {
            const lat = parseFloat(document.getElementById('latInput').value.replace(',', '.'));
            const lng = parseFloat(document.getElementById('lngInput').value.replace(',', '.'));
            if (isNaN(lat) || isNaN(lng)) return alert('⚠️ إحداثيات غير صحيحة');
            fetchNearestVillage(lat, lng);
        };

        map.on('click', (e) => {
            document.getElementById('latInput').value = e.latlng.lat.toFixed(6);
            document.getElementById('lngInput').value = e.latlng.lng.toFixed(6);
            fetchNearestVillage(e.latlng.lat, e.latlng.lng);
        });

        setTimeout(() => fetchNearestVillage(31.0364, 31.3807), 500);
    </script>
</body>
</html>
