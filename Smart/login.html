<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - شركة شمال الدلتا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #1e293b;
        }

        .form-field {
            margin-bottom: 18px;
        }

        .form-field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }

        .inline-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .inline-select:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #1d4ed8;
        }

        .login-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .error-msg {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .hint-msg {
            color: #0284c7;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2><i class="fas fa-bolt"></i> تسجيل الدخول</h2>
        <form id="loginForm">
            <!-- New Dropdown: User Type -->
            <div class="form-field">
                <label><i class="fas fa-users-cog"></i> جهة الدخول</label>
                <select id="inputUserType" class="inline-select" required>
                    <option value="">اختر جهة الدخول</option>
                    <option value="المعمل">المعمل</option>
                    <option value="الهندسات">الهندسات</option>
                </select>
            </div>

            <div class="form-field">
                <label><i class="fas fa-chart-line"></i> القطاع</label>
                <select id="inputKeta3" class="inline-select" required>
                    <option value="">اختر القطاع</option>
                    <option value="1">دمياط</option>
                    <option value="2">شمال الدقهلية</option>
                    <option value="3">جنوب الدقهلية</option>
                    <option value="4">كفر الشيخ</option>
                </select>
            </div>

            <div class="form-field">
                <label><i class="fas fa-draw-polygon"></i> الهندسة</label>
                <select id="inputHandsa" class="inline-select" required disabled>
                    <option value="">اختر الهندسة</option>
                </select>
            </div>

            <div class="form-field">
                <label><i class="fas fa-lock"></i> كلمة المرور</label>
                <input type="password" id="inputPassword" class="inline-select" placeholder="أدخل كلمة المرور" required
                    disabled>
                <span id="pwdHint" class="hint-msg"></span>
                <span id="pwdError" class="error-msg"></span>
            </div>

            <button type="submit" class="login-btn" id="submitBtn" disabled>دخول إلى النظام</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFXLCWmwrAQIrmRvnus3yJlTpra9Rv69k",
            authDomain: "trial-85.firebaseapp.com",
            projectId: "trial-85",
            storageBucket: "trial-85.firebasestorage.app",
            messagingSenderId: "660343156279",
            appId: "1:660343156279:web:3275f5d3da7721a35259b2",
            measurementId: "G-RLMVPCLZW3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const handsaData = {
            "1": [
                { id: 101, name: "هندسة شمال دمياط" }, { id: 102, name: "هندسة جنوب دمياط" },
                { id: 103, name: "هندسة عزبة البرج" }, { id: 104, name: "هندسة كفر سعد" },
                { id: 105, name: "هندسة كفر البطيخ" }, { id: 106, name: "هندسة راس البر" },
                { id: 107, name: "هندسة دمياط الجديدة" }, { id: 108, name: "هندسة الزرقا" },
                { id: 109, name: "هندسة فارسكور" }, { id: 110, name: "هندسة الروضة" },
                { id: 111, name: "هندسة الشعراء" }
            ],
            "2": [
                { id: 201, name: "هندسة مدينة شربين" }, { id: 202, name: "هندسة قري شربين" },
                { id: 203, name: "هندسة دكرنس" }, { id: 204, name: "هندسة جمصة" },
                { id: 205, name: "هندسة قري بلقاس" }, { id: 206, name: "هندسة مدينة بلقاس" },
                { id: 207, name: "هندسة الستاموني" }, { id: 208, name: "هندسة بني عبيد" },
                { id: 209, name: "هندسة منية النصر" }, { id: 210, name: "هندسة ميت سلسيل" },
                { id: 211, name: "هندسة الجمالية" }, { id: 212, name: "هندسة قري المنزلة" },
                { id: 213, name: "هندسة مدينة المنزلة" }, { id: 214, name: "هندسة المطرية" }
            ],
            "3": [
                { id: 301, name: "هندسة شرق المنصورة" }, { id: 302, name: "هندسة غرب المنصورة" },
                { id: 303, name: "هندسة طلخا" }, { id: 304, name: "هندسة نبروه" },
                { id: 305, name: "هندسة قري المنصورة 1" }, { id: 306, name: "هندسة قري المنصورة 2" },
                { id: 307, name: "هندسة اجا" }, { id: 308, name: "هندسة مدينة السنبلاوين" },
                { id: 309, name: "هندسة قري السنبلاوين" }, { id: 310, name: "هندسة تمي الامديد" },
                { id: 311, name: "هندسة مدينة ميت غمر" }, { id: 312, name: "هندسة قري ميت غمر" },
                { id: 313, name: "هندسة كوم النور" }
            ],
            "4": [
                { id: 401, name: "هندسة مدينة كفر الشيخ" }, { id: 402, name: "هندسة غرب كفر الشيخ" },
                { id: 403, name: "هندسة شرق كفر الشيخ" }, { id: 404, name: "هندسة قلين" },
                { id: 405, name: "هندسة قرى سيدي سالم" }, { id: 406, name: "هندسة مدينة سيدي سالم" },
                { id: 407, name: "هندسة الرياض" }, { id: 408, name: "هندسة مدينة دسوق" },
                { id: 409, name: "هندسة قرى شمال دسوق" }, { id: 410, name: "هندسة قرى جنوب دسوق" },
                { id: 411, name: "هندسة فوه" }, { id: 412, name: "هندسة مطوبس" },
                { id: 413, name: "هندسة مدينة الحامول" }, { id: 414, name: "هندسة قرى الحامول" },
                { id: 415, name: "هندسة بيلا" }, { id: 416, name: "هندسة بلطيم" },
                { id: 417, name: "هندسة برج البرلس" }
            ]
        };

        const userTypeSelect = document.getElementById('inputUserType');
        const keta3Select = document.getElementById('inputKeta3');
        const handsaSelect = document.getElementById('inputHandsa');
        const passwordInput = document.getElementById('inputPassword');
        const submitBtn = document.getElementById('submitBtn');
        const pwdHint = document.getElementById('pwdHint');
        const pwdError = document.getElementById('pwdError');

        keta3Select.addEventListener('change', function () {
            const selectedId = this.value;
            handsaSelect.innerHTML = '<option value="">اختر الهندسة</option>';
            passwordInput.disabled = true;
            passwordInput.value = '';
            submitBtn.disabled = true;
            pwdHint.textContent = '';
            pwdError.style.display = 'none';

            if (selectedId && handsaData[selectedId]) {
                handsaSelect.disabled = false;
                handsaData[selectedId].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.id;
                    opt.textContent = item.name;
                    handsaSelect.appendChild(opt);
                });
            } else {
                handsaSelect.disabled = true;
            }
        });

        handsaSelect.addEventListener('change', async function () {
            const keta3Id = keta3Select.value;
            const handsaId = this.value;

            if (handsaId && keta3Id) {
                passwordInput.disabled = false;
                submitBtn.disabled = false;
                pwdHint.textContent = "جاري التحقق من قاعدة البيانات...";

                try {
                    const districtAuthRef = ref(db, `auth_sectors/${keta3Id}/districts/${handsaId}`);
                    const snapshot = await get(districtAuthRef);

                    if (!snapshot.exists()) {
                        pwdHint.textContent = "ℹ️ أول دخول لهذه الهندسة: سيتم حفظ كلمة المرور كـ Key جديد في auth_sectors.";
                    } else {
                        pwdHint.textContent = "ℹ️ هذه الهندسة مسجلة مسبقاً، يرجى إدخال كلمة المرور الصحيحة.";
                    }
                } catch (err) {
                    console.error(err);
                    pwdHint.textContent = "⚠️ فشل الاتصال بقاعدة البيانات. تأكد من إعدادات الاتصال.";
                }
            } else {
                passwordInput.disabled = true;
                submitBtn.disabled = true;
                pwdHint.textContent = '';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const userType = userTypeSelect.value;
            const keta3 = keta3Select.value;
            const handsa = handsaSelect.value;
            const password = passwordInput.value.trim();

            pwdError.style.display = 'none';

            const digitsCount = (password.match(/\d/g) || []).length;
            const lettersCount = (password.match(/[a-zA-Z\u0600-\u06FF]/g) || []).length;

            if (digitsCount < 3 || lettersCount <= 3) {
                pwdError.textContent = "خطأ: يجب أن تحتوي كلمة المرور على 3 أرقام على الأقل وأكثر من 3 حروف.";
                pwdError.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري التحقق...";

            try {
                const authDistrictRef = ref(db, `auth_sectors/${keta3}/districts/${handsa}`);
                const snapshot = await get(authDistrictRef);

                const redirectUrl = `SM_DashBoard.html?keta3=${encodeURIComponent(keta3)}&handsa=${encodeURIComponent(handsa)}&userType=${encodeURIComponent(userType)}`;

                if (!snapshot.exists()) {
                    const passwordKeyRef = ref(db, `auth_sectors/${keta3}/districts/${handsa}/${password}`);
                    await set(passwordKeyRef, true);

                    alert("تم تسجيل الدخول وحفظ كلمة المرور بنجاح!");
                    window.location.href = redirectUrl;
                } else {
                    if (snapshot.hasChild(password)) {
                        window.location.href = redirectUrl;
                    } else {
                        pwdError.textContent = "فشل تسجيل الدخول: كلمة المرور غير صحيحة لهذه الهندسة.";
                        pwdError.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.textContent = "دخول إلى النظام";
                    }
                }
            } catch (error) {
                console.error(error);
                pwdError.textContent = "حدث خطأ أثناء التواصل مع قاعدة البيانات: " + error.message;
                pwdError.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = "دخول إلى النظام";
            }
        });
    </script>

</body>

</html>
