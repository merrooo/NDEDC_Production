<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل وحصر العدادات والمحولات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Export to Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-dark: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-right: 6px solid var(--primary);
            position: relative;
            overflow: hidden;
            flex-wrap: wrap;
            gap: 15px;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.06) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .header-icon {
            width: 52px;
            height: 52px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .header-title h1 {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .header-title .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .location-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .location-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e2e8f0;
            font-size: 0.9rem;
        }

        .location-item .label {
            color: #94a3b8;
        }

        .location-item .value {
            color: #ffffff;
            font-weight: 600;
            background: rgba(37, 99, 235, 0.25);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .location-divider {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
        }

        .location-item .value.sector {
            background: rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
        }

        .location-item .value.district {
            background: rgba(37, 99, 235, 0.25);
            color: #93c5fd;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .sync-status {
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .sync-status.loading {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.2);
        }

        .btn-back {
            background: rgba(37, 99, 235, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(37, 99, 235, 0.3);
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-back:hover {
            background: rgba(37, 99, 235, 0.35);
            transform: translateY(-1px);
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
        }

        .form-group input,
        .form-group select {
            padding: 10px 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
        }

        .form-group input:disabled,
        .form-group select:disabled {
            background-color: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #cbd5e1;
        }

        .form-group input.duplicate {
            border-color: var(--danger);
            background-color: #fef2f2;
        }

        .form-group input.valid {
            border-color: var(--success);
        }

        .warning-msg {
            color: var(--danger);
            font-size: 0.75rem;
            display: none;
            margin-top: 2px;
        }

        .warning-msg.show {
            display: block;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-actions {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .btn-excel {
            background-color: #10b981;
            color: white;
        }

        .btn-excel:hover {
            background-color: #059669;
        }

        #statusMessage {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
        }

        #statusMessage.info {
            display: block;
            background-color: #e0f2fe;
            color: #0369a1;
        }

        #statusMessage.success {
            display: block;
            background-color: #d1fae5;
            color: #065f46;
        }

        #statusMessage.error {
            display: block;
            background-color: #fee2e2;
            color: #991b1b;
        }

        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            min-height: 250px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: right;
            white-space: nowrap;
        }

        th {
            background-color: #f1f5f9;
            color: #334155;
            padding: 10px 12px;
            font-weight: 700;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            color: #334155;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        tr.editing {
            background-color: #fef3c7;
        }

        .th-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .filter-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary);
            font-size: 0.8rem;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            color: var(--primary);
            background: #dbeafe;
        }

        .filter-popover {
            display: none;
            position: absolute;
            background: white;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 12px;
            z-index: 100;
            width: 280px;
            max-height: 380px;
            overflow-y: auto;
            text-align: right;
        }

        .filter-popover.show {
            display: block;
        }

        .filter-search-input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            outline: none;
        }

        .filter-search-input:focus {
            border-color: var(--primary);
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: normal;
            cursor: pointer;
        }

        .filter-option.hidden {
            display: none;
        }

        .filter-actions {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            margin-top: 8px;
        }

        .date-picker-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
        }

        .date-picker-group label {
            font-size: 0.8rem;
            color: var(--secondary);
            font-weight: 600;
        }

        .date-picker-group input[type="date"] {
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            width: 100%;
            text-align: center;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-type {
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.78rem;
        }

        .badge-a123 {
            background-color: #e0e7ff;
            color: #4338ca;
        }

        .badge-a45 {
            background-color: #dcfce7;
            color: #15803d;
        }

        .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-edit-sm {
            background-color: #fef3c7;
            color: #b45309;
        }

        .btn-edit-sm:hover {
            background-color: #fde68a;
        }

        .btn-delete-sm {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .btn-delete-sm:hover {
            background-color: #fca5a5;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--secondary);
            font-size: 1rem;
        }

        .debug-info {
            font-size: 0.75rem;
            color: #475569;
            margin-top: 3px;
            direction: ltr;
            text-align: left;
        }

        .session-timer {
            font-size: 0.8rem;
            color: #94a3b8;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .session-timer.warning {
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.2);
            background: rgba(245, 158, 11, 0.1);
        }

        .na {
            color: #94a3b8;
            font-style: italic;
        }

        .date-picker-wrapper {
            position: relative;
            direction: ltr;
        }

        .date-picker-wrapper input {
            padding-left: 40px;
            width: 100%;
        }

        .date-picker-wrapper .date-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary);
            pointer-events: none;
        }

        .date-display {
            font-size: 0.85rem;
            color: var(--secondary);
            margin-top: 2px;
            text-align: right;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .pagination-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .table-controls {
                flex-direction: column;
                align-items: stretch;
            }

            header {
                flex-direction: column;
                align-items: stretch;
            }

            .location-badge {
                justify-content: center;
            }

            .action-btns {
                justify-content: center;
            }

            .filter-popover {
                width: 240px;
                max-height: 300px;
                right: 0;
                left: auto !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="header-left">
                <div class="header-icon"><i class="fas fa-bolt"></i></div>
                <div class="header-title">
                    <h1>تسجيل التركيبات</h1>
                    <div class="subtitle">العدادات الذكية (A1 / A2 / A3)</div>
                </div>
            </div>
            <div class="location-badge">
                <div class="location-item"><i class="fas fa-layer-group"
                        style="color: #6ee7b7; font-size: 0.8rem;"></i><span class="label">القطاع</span><span
                        class="value sector" id="sectorNameDisplay">جاري التحميل...</span></div>
                <div class="location-divider"></div>
                <div class="location-item"><i class="fas fa-building"
                        style="color: #93c5fd; font-size: 0.8rem;"></i><span class="label">الهندسة</span><span
                        class="value district" id="districtNameDisplay">جاري التحميل...</span></div>
            </div>
            <div class="header-actions">
                <span id="sessionTimer" class="session-timer">⏱ 05:00</span>
                <span id="syncStatus" class="sync-status loading">⏳ جاري الاتصال...</span>
                <a id="btnReturn" class="btn-back" href="#"><i class="fas fa-arrow-right"></i> رجوع</a>
            </div>
        </header>
        <div id="statusMessage"></div>
        <input type="hidden" id="keta3Id">
        <input type="hidden" id="handsaCode">
        <input type="hidden" id="editingKey">

        <div class="card" id="dataForm">
            <div class="card-title"><i class="fas fa-edit"></i> تسجيل البيانات</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>رقم العداد الرئيسي <span style="color:red">*</span></label>
                    <input type="text" id="meterNum" maxlength="8" placeholder="أدخل 8 أرقام">
                    <span class="warning-msg" id="meterNumWarning"></span>
                </div>
                <div class="form-group">
                    <label>رقم الشريحة</label>
                    <input type="text" id="simNum" maxlength="19" list="simList" placeholder="أدخل 19 رقم">
                    <datalist id="simList"></datalist>
                    <span class="warning-msg" id="simNumWarning"></span>
                </div>
                <div class="form-group">
                    <label>نوع العداد</label>
                    <select id="meterType">
                        <option value="A1">A1</option>
                        <option value="A2">A2</option>
                        <option value="A3">A3</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>جهد العداد</label>
                    <input type="text" id="meterVoltage" value="110" readonly>
                </div>
                <div class="form-group">
                    <label>تاريخ التركيب</label>
                    <div class="date-picker-wrapper">
                        <input type="date" id="installDatePicker" dir="ltr">
                        <i class="fas fa-calendar-alt date-icon"></i>
                    </div>
                    <div class="date-display" id="dateDisplay">التاريخ: --/--/----</div>
                    <input type="hidden" id="installDate">
                </div>
                <div class="form-group">
                    <label>نوع المغذي</label>
                    <select id="transType">
                        <option value="SUBESTATION" selected>SUBESTATION</option>
                        <option value="FEEDERINCOMING">FEEDERINCOMING</option>
                        <option value="FEEDEROUTGOING">FEEDEROUTGOING</option>
                        <option value="COMPACT">COMPACT</option>
                    </select>
                </div>
                <div class="form-group" id="compactNameGroup" style="display:none;">
                    <label>اسم الكومباكت</label>
                    <input type="text" id="transName" placeholder="أدخل اسم الكومباكت">
                </div>
                <div class="form-group" id="compactCodeGroup" style="display:none;">
                    <label>كود الكومباكت</label>
                    <input type="text" id="transCode" placeholder="أدخل كود الكومباكت">
                </div>
                <div class="form-group" id="feederNameGroup">
                    <label id="feederNameLabel">اسم المغذي</label>
                    <input type="text" id="feederName" list="feedersList" placeholder="أدخل أو اختر اسم المغذي">
                    <datalist id="feedersList"></datalist>
                </div>
                <div class="form-group" id="feederCodeGroup">
                    <label id="feederCodeLabel">كود المغذي</label>
                    <input type="text" id="feederCode" list="feederCodeList" placeholder="أدخل أو اختر كود المغذي">
                    <datalist id="feederCodeList"></datalist>
                    <span class="warning-msg" id="feederCodeWarning"></span>
                </div>
                <div class="form-group">
                    <label>اسم لوحة التوزيع</label>
                    <input type="text" id="panelName" list="panelsList" placeholder="اختر لوحة التوزيع">
                    <datalist id="panelsList"></datalist>
                    <div id="panelDebug" class="debug-info"></div>
                </div>
                <div class="form-group">
                    <label>كود لوحة التوزيع</label>
                    <input type="text" id="panelCode" list="panelCodeList" placeholder="كود اللوحة">
                    <datalist id="panelCodeList"></datalist>
                    <span class="warning-msg" id="panelCodeWarning"></span>
                </div>
                <div class="form-group">
                    <label>اسم المحطة</label>
                    <input type="text" id="stationName" list="stationsList" placeholder="اختر اسم المحطة">
                    <datalist id="stationsList"></datalist>
                    <div id="stationDebug" class="debug-info"></div>
                </div>
                <div class="form-group">
                    <label>كود المحطة</label>
                    <input type="text" id="stationCode" list="stationCodeList" placeholder="كود المحطة">
                    <datalist id="stationCodeList"></datalist>
                    <span class="warning-msg" id="stationCodeWarning"></span>
                </div>
                <div class="form-group">
                    <label>مغذي الخروج</label>
                    <input type="text" id="feederOutgoing" list="outgoingList" placeholder="اختر مغذي الخروج">
                    <datalist id="outgoingList"></datalist>
                </div>
                <div class="form-group">
                    <label>قدرة المحول (ك.ف.أ)</label>
                    <input type="text" id="transCap" placeholder="مثال: 500">
                </div>
                <div class="form-group">
                    <label>خط العرض (Latitude)</label>
                    <input type="text" id="lat" placeholder="31.xxxx">
                </div>
                <div class="form-group">
                    <label>خط الطول (Longitude)</label>
                    <input type="text" id="lng" placeholder="31.xxxx">
                </div>
                <div class="form-group full-width">
                    <label>عنوان الكومباكت/المغذي بالتفصيل</label>
                    <input type="text" id="transAddress" placeholder="أدخل العنوان التفصيلي للكومباكت أو المغذي">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="addSingleBtn" disabled><i class="fas fa-plus-circle"></i> حفظ
                    السجل</button>
                <button class="btn btn-secondary" id="cancelEditBtn" style="display: none;"><i class="fas fa-times"></i>
                    إلغاء التعديل</button>
            </div>
        </div>

        <div class="card">
            <div class="table-controls">
                <div>

                if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {

                val = record["install_date"] || record["تاريخ التركيب"] || '';
            } else {
                val = record[col.key] || '';
            }
            return (val !== undefined && val !== null && String(val).trim() !== '') ? String(val).trim() : 'N/A';
        }

        function formatToDDMMYYYY(dateStr) {
            if (!dateStr || dateStr === 'N/A') return 'N/A';
            let parts = dateStr.split(/[\/\-]/);
            if (parts.length === 3) {
                if (parts[0].length === 4) {
                    return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
                } else if (parts[2].length === 4) {
                    return `${parts[0].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[2]}`;
                }
            }
            return dateStr;
        }

        function parseToTimestamp(dateStr) {
            if (!dateStr || dateStr === 'N/A') return null;
            let day, month, year;
            let parts = dateStr.split(/[\/\-]/);
            if (parts.length === 3) {
                if (parts[2].length === 4) {
                    day = parseInt(parts[0], 10);
                    month = parseInt(parts[1], 10) - 1;
                    year = parseInt(parts[2], 10);
                } else if (parts[0].length === 4) {
                    year = parseInt(parts[0], 10);
                    month = parseInt(parts[1], 10) - 1;
                    day = parseInt(parts[2], 10);
                }
                const parsedDate = new Date(year, month, day);
                return isNaN(parsedDate.getTime()) ? null : parsedDate.getTime();
            }
            return null;
        }

        function matchesHandsa(item) {

        function handleTransTypeChange() {

            const isCompact = type === 'COMPACT';

            const compactNameGroup = document.getElementById('compactNameGroup');

            const transCode = document.getElementById('transCode');
            const panelName = document.getElementById('panelName');
            const panelCode = document.getElementById('panelCode');
            const stationName = document.getElementById('stationName');
            const stationCode = document.getElementById('stationCode');
            const feederOutgoing = document.getElementById('feederOutgoing');
            const transCap = document.getElementById('transCap');

            [feederName, feederCode, panelName, panelCode, stationName, stationCode, feederOutgoing, transCap, transName, transCode].forEach(el => el.disabled = true);

                feederNameGroup.style.display = 'none';

                panelCode.disabled = false;
                transCap.disabled = false;

                feederNameGroup.style.display = 'block';
                feederCodeGroup.style.display = 'block';
                compactNameGroup.style.display = 'none';
                compactCodeGroup.style.display = 'none';
                transName.value = ''; transCode.value = ''; transName.disabled = true; transCode.disabled = true;
                if (type === 'FEEDEROUTGOING') {
                    feederName.disabled = false; feederCode.disabled = false; panelName.disabled = false; panelCode.disabled = false;
                    stationName.disabled = true; stationCode.disabled = true; feederOutgoing.disabled = true; transCap.disabled = true;

                } else if (type === 'FEEDERINCOMING') {
                    feederName.disabled = false; feederCode.disabled = false; panelName.disabled = false; panelCode.disabled = false;
                    stationName.disabled = false; stationCode.disabled = false; feederOutgoing.disabled = false; transCap.disabled = true;
                    transCap.value = '';

                    feederName.disabled = true; feederCode.disabled = true; panelName.disabled = true; panelCode.disabled = true;

        async function authenticateAndInit() {
            updateSyncStatus(true);
            try {
                const authRef = ref(db, `auth_sectors/${keta3Id}/districts/${handsaCode}`);

                await loadDropdownsFromDatabase();

                    fetchOutgoingDropdown()

        async function fetchStationsDropdown() {
            try {
                const snap = await get(ref(db, 'reference_data/sub_codes'));
                rawStations = [];
                stationCodesByName = {};

                if (snap.exists()) {
                    const data = snap.val();
                    const list = Array.isArray(data) ? data : Object.values(data);

                    list.forEach(item => {
                        if (!item) return;

                        const name = norm(
                            item.sub ||
                            item.sub_name ||
                            item.station ||
                            item["اسم المحطة"] ||
                            item["اسم المحطة/المحولات"] || ''
                        );

                        const code = norm(
                            item.sub_code ||
                            item.station_code ||
                            item["كود المحطة"] || ''
                        );

                        const itemHandsa = item.handsa_code !== undefined && item.handsa_code !== null
                            ? String(item.handsa_code).trim()
                            : (item.handsa ? String(item.handsa).trim() : '');

                        const currentHandsa = String(currentHandsaCode).trim();

                        const isMatch = !itemHandsa ||
                            itemHandsa === currentHandsa ||
                            itemHandsa === String(keta3Id).trim();

                        if (name && isMatch) {
                            if (code) {
                                if (!stationCodesByName[name]) {
                                    stationCodesByName[name] = new Set();
                                }
                                stationCodesByName[name].add(code);
                            }

                            if (!rawStations.some(s => s.name === name)) {
                                rawStations.push({ name, code, raw: item });
                            }
                        }
                    });
                }

                for (let n in stationCodesByName) {
                    stationCodesByName[n] = Array.from(stationCodesByName[n]);
                }

                const debugEl = document.getElementById('stationDebug');
                if (debugEl) {
                    debugEl.textContent = `تم تحميل ${rawStations.length} محطة`;
                }

                renderStationsList();
            } catch (err) {
                console.error("Error fetching stations:", err);
            }
        }

        function renderStationsList() {
            const dl = document.getElementById('stationsList');

                    dl.appendChild(o);

        async function fetchPanelsDropdown() {
            const snap = await get(ref(db, 'reference_data/dp_codes'));
            rawPanels = []; panelsMap = {}; panelsReverseMap = {};
            if (snap.exists()) {
                const data = snap.val(), list = Array.isArray(data) ? data : Object.values(data);
                list.forEach(item => {
                    if (item && matchesHandsa(item)) {
                        const name = norm(item.dp || item["اسم لوحة التوزيع"] || '');
                        const code = norm(item.dp_code || item["الكود المقترح"] || item["كود لوحة التوزيع"] || '');
                        const mahataCode = norm(item.sub_code || item.mahata_code || item["كود المحطة"] || '');
                        const mahataName = norm(item.sub || item.sub_name || item.mahata_name || item.station || item["اسم المحطة"] || '');
                        if (name) {
                            rawPanels.push({ name, code, mahataCode, mahataName, raw: item });
                            panelsMap[name] = code;
                            if (code) panelsReverseMap[code] = name;
                        }
                    }
                });

            document.getElementById('panelDebug').textContent = `تم تحميل ${rawPanels.length} لوحة توزيع`;

        function renderPanelsList(filterMahataCode = '', filterMahataName = '') {
            const nameDl = document.getElementById('panelsList'), codeDl = document.getElementById('panelCodeList');
            nameDl.innerHTML = ''; codeDl.innerHTML = '';
            const filtered = rawPanels.filter(p => {
                if (!filterMahataCode && !filterMahataName) return true;
                return (filterMahataCode && p.mahataCode === filterMahataCode) || (filterMahataName && p.mahataName === filterMahataName);
            });
            const seenN = new Set(), seenC = new Set();
            filtered.forEach(p => {
                if (p.name && !seenN.has(p.name)) { seenN.add(p.name); const o = document.createElement('option'); o.value = p.name; nameDl.appendChild(o); }
                if (p.code && !seenC.has(p.code)) { seenC.add(p.code); const o = document.createElement('option'); o.value = p.code; codeDl.appendChild(o); }
            });
        }

        async function fetchFeedersDropdown() {

                let matchDp = true, matchMahata = true;

                if (filterMahataCode) matchMahata = f.mahataCode === filterMahataCode;
                return matchDp && matchMahata;
            });
            const seenN = new Set(), seenC = new Set();
            filtered.forEach(f => {
                if (f.name && !seenN.has(f.name)) { seenN.add(f.name); const o = document.createElement('option'); o.value = f.name; nameDl.appendChild(o); }
                if (f.code && !seenC.has(f.code)) { seenC.add(f.code); const o = document.createElement('option'); o.value = f.code; codeDl.appendChild(o); }
            });
        }

        function loadRecords() {
            const recordsRef = ref(db, `sectors/${keta3Id}/districts/${handsaCode}/manual_entries`);
            onValue(recordsRef, (snapshot) => {
                const rawData = snapshot.val() || {};
                const filtered = {};
                Object.keys(rawData).forEach(key => {
                    const rec = rawData[key];
                    const meterType = norm(rec["meter_type"] || rec["TYPE"] || rec["نوع العداد"] || '');
                    if (ALLOWED_TYPES.some(type => meterType.toUpperCase() === type.toUpperCase())) {
                        filtered[key] = rec;
                    }
                });
                allRecords = filtered;
                existingMeters.clear(); existingSims.clear();
                Object.values(allRecords).forEach(rec => {
                    const mNum = rec["meter_number"] || rec["رقم العداد"] || '';
                    const sNum = rec["sim_number"] || rec["رقم الشريحة"] || '';
                    if (mNum) existingMeters.add(norm(mNum));
                    if (sNum) existingSims.add(norm(sNum));
                });
                applyFilters();
                document.getElementById('recordsCount').textContent = `${Object.keys(allRecords).length} سجل`;
                checkValidation();
                updateSyncStatus(false);
            });
        }

        function applyFilters() {
            filteredKeysList = Object.keys(allRecords).filter(key => {
                const record = allRecords[key];

                for (const col of COLUMNS) {
                    if (col.isDate) {
                        const dateFilter = activeColumnFilters[col.key];
                        if (dateFilter) {
                            const recTimestamp = parseToTimestamp(getRecordValue(record, col));
                            if (!recTimestamp) return false;

                            if (dateFilter.from) {
                                const fromTs = parseToTimestamp(dateFilter.from);
                                if (fromTs && recTimestamp < fromTs) return false;
                            }
                            if (dateFilter.to) {
                                const toTs = parseToTimestamp(dateFilter.to);
                                if (toTs && recTimestamp > toTs) return false;
                            }
                        }
                    } else {
                        const selectedValues = activeColumnFilters[col.key];
                        if (selectedValues && selectedValues.length > 0) {
                            const val = getRecordValue(record, col);
                            if (!selectedValues.includes(val)) return false;
                        }
                    }
                }

                for (const col of COLUMNS) {
                    const searchTerm = columnSearchTerms[col.key];
                    if (searchTerm && searchTerm.trim() !== '') {
                        const val = getRecordValue(record, col);
                        if (!val.toLowerCase().includes(searchTerm.toLowerCase())) return false;
                    }
                }

                return true;
            });

            document.getElementById('recordsCount').textContent = `${filteredKeysList.length} سجل`;
            currentPage = 1;
            renderTablePage();
        }

        function renderTablePage() {
            const container = document.getElementById('tableContainer');
            if (filteredKeysList.length === 0) {
                container.innerHTML = `<div class="no-data">لا توجد بيانات مسجلة (A1 / A2 / A3)</div>`;
                updatePaginationControls();
                return;
            }

            const totalPages = Math.ceil(filteredKeysList.length / PAGE_SIZE);
            if (currentPage > totalPages) currentPage = totalPages;
            const startIndex = (currentPage - 1) * PAGE_SIZE;
            const pageKeys = filteredKeysList.slice(startIndex, startIndex + PAGE_SIZE);

            let html = `<table><thead><tr><th>#</th>`;

            COLUMNS.forEach(col => {
                const isActive = (activeColumnFilters[col.key] && (
                    col.isDate ? (activeColumnFilters[col.key].from || activeColumnFilters[col.key].to) : activeColumnFilters[col.key].length > 0
                )) || (columnSearchTerms[col.key] && columnSearchTerms[col.key].trim() !== '');
                html += `
                <th>
                    <div class="th-content">
                        <span>${col.label}</span>
                        <button class="filter-btn ${isActive ? 'active' : ''}" onclick="window.toggleFilterPopover(event, '${col.key}')">
                            <i class="fas fa-filter"></i>
                        </button>
                    </div>
                </th>`;
            });
            html += `<th>الإجراءات</th></tr></thead><tbody>`;

            let index = startIndex;
            pageKeys.forEach(key => {
                index++;
                const record = allRecords[key];
                const isEditing = (editingKey === key);

                html += `<tr class="${isEditing ? 'editing' : ''}"><td>${index}</td>`;

                COLUMNS.forEach(col => {
                    let val = getRecordValue(record, col);
                    if (col.isDate) val = formatToDDMMYYYY(val);

                    if (col.key === 'meter_type') {
                        const badgeClass = ['A4', 'A5'].includes(val) ? 'badge-a45' : 'badge-a123';
                        html += `<td><span class="badge-type ${badgeClass}">${val === 'N/A' ? '<span class="na">N/A</span>' : val}</span></td>`;
                    } else if (col.key === 'address') {
                        html += `<td style="max-width:150px;white-space:normal;word-break:break-word;">${val === 'N/A' ? '<span class="na">N/A</span>' : val}</td>`;
                    } else {
                        html += `<td>${val === 'N/A' ? '<span class="na">N/A</span>' : val}</td>`;
                    }
                });

                html += `<td><div class="actions-cell">
                <button class="btn-sm btn-edit-sm" onclick="window.editRecord('${key}')"><i class="fas fa-edit"></i> تعديل</button>
                <button class="btn-sm btn-delete-sm" onclick="window.deleteRecord('${key}')"><i class="fas fa-trash"></i></button>
            </div></td></tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
            updatePaginationControls();
        }

        function updatePaginationControls() {
            const totalPages = Math.ceil(filteredKeysList.length / PAGE_SIZE) || 1;
            document.getElementById('pageIndicator').textContent = `الصفحة ${currentPage} من ${totalPages}`;
            document.getElementById('btnPrev').disabled = (currentPage === 1);
            document.getElementById('btnNext').disabled = (currentPage >= totalPages);
        }

        window.changePage = function (delta) {
            const totalPages = Math.ceil(filteredKeysList.length / PAGE_SIZE) || 1;
            if (currentPage + delta >= 1 && currentPage + delta <= totalPages) {
                currentPage += delta;
                renderTablePage();
            }
        };

        window.toggleFilterPopover = function (event, colKey) {
            event.stopPropagation();
            const popover = document.getElementById('filterPopover');
            const button = event.currentTarget;
            const rect = button.getBoundingClientRect();

            if (popover.classList.contains('show') && popover.dataset.colKey === colKey) {
                popover.classList.remove('show');
                return;
            }

            const col = COLUMNS.find(c => c.key === colKey);
            const currentSearch = columnSearchTerms[colKey] || '';
            let popHtml = `<strong style="display:block; margin-bottom:8px; font-size:0.85rem;">تصفية حسب ${col.label}</strong>`;

            if (!col.isDate) {
                popHtml += `
                <input type="text" class="filter-search-input" id="columnSearchInput" 
                       placeholder="بحث في ${col.label}..." value="${currentSearch}"
                       oninput="window.onColumnSearch('${colKey}', this.value)">
            `;
            }

            if (col.isDate) {
                const currentFilter = activeColumnFilters[colKey] || { fromRGB: '', toRGB: '' };
                popHtml += `
                <div class="date-picker-group">
                    <label>من تاريخ:</label>
                    <input type="date" id="dateFromPicker" value="${currentFilter.fromRGB || ''}">
                    <label>إلى تاريخ:</label>
                    <input type="date" id="dateToPicker" value="${currentFilter.toRGB || ''}">
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary btn-sm" onclick="window.applyDateFilter('${colKey}')">تطبيق</button>
                    <button class="btn-link" onclick="window.clearDateFilter('${colKey}')">إلغاء</button>
                </div>`;
            } else {
                const uniqueValues = new Set();
                Object.values(allRecords).forEach(rec => {
                    const val = getRecordValue(rec, col);
                    if (val !== 'N/A') uniqueValues.add(val);
                });
                const sortedValues = Array.from(uniqueValues).sort();
                const currentSelected = activeColumnFilters[colKey] || [];

                if (sortedValues.length === 0) {
                    popHtml += `<div style="color:#94a3b8;font-size:0.85rem;padding:8px 0;">لا توجد قيم للتصفية</div>`;
                } else {
                    sortedValues.forEach(val => {
                        const checked = currentSelected.includes(val) ? 'checked' : '';
                        const searchTermLower = (columnSearchTerms[colKey] || '').toLowerCase();
                        const show = !searchTermLower || val.toLowerCase().includes(searchTermLower);
                        popHtml += `
                        <label class="filter-option ${show ? '' : 'hidden'}" data-value="${val}">
                            <input type="checkbox" value="${val}" ${checked} onchange="window.onCheckboxChange('${colKey}')">
                            <span>${val}</span>
                        </label>`;
                    });
                }

                popHtml += `
                <div class="filter-actions">
                    <button class="btn-link" onclick="window.selectAllColumn('${colKey}', true)">تحديد الكل</button>
                    <button class="btn-link" onclick="window.selectAllColumn('${colKey}', false)">إلغاء الكل</button>
                </div>`;
            }

            popover.innerHTML = popHtml;
            popover.dataset.colKey = colKey;
            popover.style.top = `${rect.bottom + window.scrollY + 5}px`;
            popover.style.left = `${Math.min(rect.left + window.scrollX - 150, window.innerWidth - 290)}px`;
            popover.classList.add('show');

            setTimeout(() => {
                const searchInput = document.getElementById('columnSearchInput');
                if (searchInput) searchInput.focus();
            }, 100);
        };

        window.onColumnSearch = function (colKey, value) {
            if (value && value.trim() !== '') {
                columnSearchTerms[colKey] = value.trim();
            } else {
                delete columnSearchTerms[colKey];
            }

            const popover = document.getElementById('filterPopover');
            if (popover && popover.dataset.colKey === colKey) {
                const searchLower = value.toLowerCase();
                const options = popover.querySelectorAll('.filter-option');
                options.forEach(opt => {
                    const val = opt.dataset.value || '';
                    if (searchLower && !val.toLowerCase().includes(searchLower)) {
                        opt.classList.add('hidden');
                    } else {
                        opt.classList.remove('hidden');
                    }
                });
            }

            applyFilters();
        };

        window.applyDateFilter = function (colKey) {
            const fromRGB = document.getElementById('dateFromPicker').value;
            const toRGB = document.getElementById('dateToPicker').value;

            let from = '', to = '';
            if (fromRGB) {
                const parts = fromRGB.split('-');
                from = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            if (toRGB) {
                const parts = toRGB.split('-');
                to = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }

            if (fromRGB || toRGB) {
                activeColumnFilters[colKey] = { from, to, fromRGB, toRGB };
            } else {
                delete activeColumnFilters[colKey];
            }
            document.getElementById('filterPopover').classList.remove('show');
            applyFilters();
        };

        window.clearDateFilter = function (colKey) {
            delete activeColumnFilters[colKey];
            document.getElementById('filterPopover').classList.remove('show');
            applyFilters();
        };

        window.onCheckboxChange = function (colKey) {
            const popover = document.getElementById('filterPopover');
            const checkboxes = popover.querySelectorAll('input[type="checkbox"]:not(.hidden)');
            const selected = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);

            if (selected.length > 0) {
                activeColumnFilters[colKey] = selected;
            } else {
                delete activeColumnFilters[colKey];
            }
            applyFilters();
        };

        window.selectAllColumn = function (colKey, selectAll) {
            const popover = document.getElementById('filterPopover');
            const checkboxes = popover.querySelectorAll('input[type="checkbox"]:not(.hidden)');
            checkboxes.forEach(cb => cb.checked = selectAll);
            window.onCheckboxChange(colKey);
        };

        window.resetAllFilters = function () {

        window.exportToExcel = function () {
            if (filteredKeysList.length === 0) {
                alert("لا توجد بيانات لتصديرها.");
                return;
            }

            const exportData = filteredKeysList.map((key) => {
                const record = allRecords[key];
                const rowObj = {};

                COLUMNS.forEach(col => {
                    let val = getRecordValue(record, col);
                    const headerKey = col.key;

                    if (col.isDate && val !== 'N/A') {
                        val = formatToDDMMYYYY(val);
                    }

                    rowObj[headerKey] = val;
                });

                return rowObj;
            });

            try {
                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "العدادات والمحولات");
                XLSX.writeFile(workbook, `سجلات_العدادات_A123_${handsaCode}.xlsx`);
                showStatus("تم تصدير البيانات بنجاح", "success");
            } catch (err) {
                showStatus("خطأ في التصدير: " + err.message, "error");
            }
        };

            const meterNum = norm(document.getElementById('meterNum').value);
            const simNum = norm(document.getElementById('simNum').value);
            const editingKeyVal = document.getElementById('editingKey').value;
            const transType = document.getElementById('transType').value;
            const stationCode = norm(document.getElementById('stationCode').value);
            const panelCode = norm(document.getElementById('panelCode').value);
            const feederCode = norm(document.getElementById('feederCode').value);
            let hasError = false;

            const meterField = document.getElementById('meterNum'), meterWarn = document.getElementById('meterNumWarning');
            if (!meterNum) { meterField.classList.remove('duplicate', 'valid'); meterWarn.classList.remove('show'); hasError = true; }
            else if (meterNum.length !== 8 || !/^\d+$/.test(meterNum)) {
                meterField.classList.add('duplicate'); meterField.classList.remove('valid');
                meterWarn.textContent = '⚠️ رقم العداد يجب أن يتكون من 8 أرقام !'; meterWarn.classList.add('show'); hasError = true;
            } else if (existingMeters.has(meterNum) && !(editingKeyVal && allRecords[editingKeyVal] && norm(allRecords[editingKeyVal]["meter_number"] || allRecords[editingKeyVal]["رقم العداد"] || '') === meterNum)) {
                meterField.classList.add('duplicate'); meterField.classList.remove('valid');
                meterWarn.textContent = '⚠️ رقم العداد مسجل مسبقاً!'; meterWarn.classList.add('show'); hasError = true;
            } else { meterField.classList.remove('duplicate'); meterField.classList.add('valid'); meterWarn.classList.remove('show'); }

            const simField = document.getElementById('simNum'), simWarn = document.getElementById('simNumWarning');
            if (simNum) {
                if (simNum.length !== 19 || !/^\d+$/.test(simNum)) {
                    simField.classList.add('duplicate'); simField.classList.remove('valid');
                    simWarn.textContent = '⚠️ رقم الشريحة يجب أن يتكون من 19 رقم بالضبط!'; simWarn.classList.add('show'); hasError = true;
                } else if (existingSims.has(simNum) && !(editingKeyVal && allRecords[editingKeyVal] && norm(allRecords[editingKeyVal]["sim_number"] || allRecords[editingKeyVal]["رقم الشريحة"] || '') === simNum)) {
                    simField.classList.add('duplicate'); simField.classList.remove('valid');
                    simWarn.textContent = '⚠️ رقم الشريحة مسجل مسبقاً!'; simWarn.classList.add('show'); hasError = true;
                } else { simField.classList.remove('duplicate'); simField.classList.add('valid'); simWarn.classList.remove('show'); }
            } else { simField.classList.remove('duplicate', 'valid'); simWarn.classList.remove('show'); }

            const scField = document.getElementById('stationCode'), scWarn = document.getElementById('stationCodeWarning');
            if (stationCode && !/^[A-Z]{3}-[A-Z]{3}-[A-Z]{2}\d{2,3}-[A-Z]{2}\d{2}$/.test(stationCode.trim().toUpperCase())) {
                scField.classList.add('duplicate'); scField.classList.remove('valid');
                scWarn.textContent = '⚠️ كود المحطة غير صحيح!'; scWarn.classList.add('show'); hasError = true;
            } else { scField.classList.remove('duplicate'); scField.classList.add('valid'); scWarn.classList.remove('show'); }

            const pcField = document.getElementById('panelCode'), pcWarn = document.getElementById('panelCodeWarning');
            if (panelCode && !/^[A-Z]{3}-[A-Z]{3}-[A-Z]{2}\d{3}(-[A-Z])?$/.test(panelCode.trim().toUpperCase())) {
                pcField.classList.add('duplicate'); pcField.classList.remove('valid');
                pcWarn.textContent = '⚠️ كود لوحة التوزيع غير صحيح!'; pcWarn.classList.add('show'); hasError = true;
            } else { pcField.classList.remove('duplicate'); pcField.classList.add('valid'); pcWarn.classList.remove('show'); }

            const fcField = document.getElementById('feederCode'), fcWarn = document.getElementById('feederCodeWarning');
            if (feederCode && transType !== 'COMPACT' && transType !== 'FEEDERINCOMING' && !/^[A-Z]{3}-[A-Z]{3}-[A-Z]{2}\d{3}-[A-Z]\d{2}$/.test(feederCode.trim().toUpperCase())) {
                fcField.classList.add('duplicate'); fcField.classList.remove('valid');
                fcWarn.textContent = '⚠️ كود المغذي غير صحيح!'; fcWarn.classList.add('show'); hasError = true;
            } else { fcField.classList.remove('duplicate'); if (feederCode) fcField.classList.add('valid'); fcWarn.classList.remove('show'); }

            document.getElementById('addSingleBtn').disabled = hasError;
        }

        document.getElementById('meterNum').addEventListener('input', checkValidation);
        document.getElementById('simNum').addEventListener('input', checkValidation);
        document.getElementById('stationCode').addEventListener('input', checkValidation);
        document.getElementById('panelCode').addEventListener('input', checkValidation);
        document.getElementById('feederCode').addEventListener('input', checkValidation);

        document.addEventListener('click', (e) => {
            const popover = document.getElementById('filterPopover');
            if (popover && !popover.contains(e.target) && !e.target.closest('.filter-btn')) {
                popover.classList.remove('show');
            }
        });

        document.getElementById('addSingleBtn').addEventListener('click', function () {
            const kId = norm(document.getElementById('keta3Id').value), hCode = norm(document.getElementById('handsaCode').value);
            const meterNum = norm(document.getElementById('meterNum').value);
            const simNum = norm(document.getElementById('simNum').value);
            const transType = document.getElementById('transType').value;
            const isCompact = transType === 'COMPACT';
            let feederName, feederCode;
            if (isCompact) { feederName = norm(document.getElementById('transName').value); feederCode = norm(document.getElementById('transCode').value); }
            else { feederName = norm(document.getElementById('feederName').value); feederCode = norm(document.getElementById('feederCode').value); }
            const transName = norm(document.getElementById('transName').value), transCode = norm(document.getElementById('transCode').value);
            const panelName = norm(document.getElementById('panelName').value), panelCode = norm(document.getElementById('panelCode').value);
            const stationName = norm(document.getElementById('stationName').value), stationCode = norm(document.getElementById('stationCode').value);
            const feederOutgoing = norm(document.getElementById('feederOutgoing').value);
            const editingKeyVal = document.getElementById('editingKey').value;

            if (!meterNum || meterNum.length !== 8) { showStatus("يرجى التأكد من إدخال رقم العداد الرئيسي المكون من 8 أرقام.", "error"); return; }
            if (stationCode && !/^[A-Z]{3}-[A-Z]{3}-[A-Z]{2}\d{2,3}-[A-Z]{2}\d{2}$/.test(stationCode.trim().toUpperCase())) { showStatus("كود المحطة غير صحيح!", "error"); return; }
            if (panelCode && !/^[A-Z]{3}-[A-Z]{3}-[A-Z]{2}\d{3}(-[A-Z])?$/.test(panelCode.trim().toUpperCase())) { showStatus("كود لوحة التوزيع غير صحيح!", "error"); return; }
            if (feederCode && !isCompact && transType !== 'FEEDERINCOMING' && !/^[A-Z]{3}-[A-Z]{3}-[A-Z]{2}\d{3}-[A-Z]\d{2}$/.test(feederCode.trim().toUpperCase())) { showStatus("كود المغذي غير صحيح!", "error"); return; }

            const installDate = document.getElementById('installDate').value;
            const dateParts = installDate.split('/');
            if (dateParts.length !== 3 || !/^\d{2}$/.test(dateParts[0]) || !/^\d{2}$/.test(dateParts[1]) || !/^\d{4}$/.test(dateParts[2])) {
                showStatus("تاريخ التركيب يجب أن يكون بصيغة dd/mm/yyyy", "error");
                return;
            }

            // 4. Guaranteed storing of names along with raw IDs
            const recordData = {
                "meter_number": meterNum,
                "sim_number": simNum,
                "meter_type": document.getElementById('meterType').value,
                "meter_voltage": norm(document.getElementById('meterVoltage').value),
                "install_date": installDate,
                "trans_type": transType,
                "compact_name": transName,
                "compact_code": transCode,
                "cell": feederName,
                "cell_code": feederCode,
                "dp": panelName,
                "dp_code": panelCode,
                "sub_name": stationName,
                "sub_code": stationCode,
                "cell_out": feederOutgoing,
                "trans_capacity": norm(document.getElementById('transCap').value),
                "lat": norm(document.getElementById('lat').value),
                "lng": norm(document.getElementById('lng').value),
                "keta3_id": kId,
                "handsa_code": hCode,
                "address": norm(document.getElementById('transAddress').value),
                "keta3": sectorName,
                "handsa": districtName,
                "القطاع": sectorName,
                "الهندسة": districtName,
                "_timestamp": Date.now()
            };

            const targetKey = editingKeyVal || meterNum;
            const targetRef = ref(db, `sectors/${kId}/districts/${hCode}/manual_entries/${targetKey}`);
            const action = editingKeyVal ? 'تحديث' : 'حفظ';
            showStatus(`جاري ${action} السجل...`, "info"); updateSyncStatus(true);
            set(targetRef, recordData)
                .then(() => {
                    showStatus(`تم ${action} السجل بنجاح!`, "success");
                    updateSyncStatus(false);
                    resetSessionTimer();
                    if (!editingKeyVal) { clearForm(); renderStationsList(); renderPanelsList(); renderFeedersList(); renderOutgoingList(); }
                    else { window.cancelEdit(); }
                    checkValidation();
                })
                .catch(err => { showStatus(`خطأ أثناء ${action}: ` + err.message, "error"); updateSyncStatus(false); });
        });

        document.getElementById('cancelEditBtn').addEventListener('click', window.cancelEdit);
        checkValidation();
    </script>
</body>

</html>
