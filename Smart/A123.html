<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل وحصر العدادات والمحولات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-dark: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-right: 6px solid var(--primary);
            position: relative;
            overflow: hidden;
            flex-wrap: wrap;
            gap: 15px;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.06) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .header-icon {
            width: 52px;
            height: 52px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .header-title h1 {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .header-title .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .location-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .location-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e2e8f0;
            font-size: 0.9rem;
        }

        .location-item .label {
            color: #94a3b8;
        }

        .location-item .value {
            color: #ffffff;
            font-weight: 600;
            background: rgba(37, 99, 235, 0.25);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .location-divider {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
        }

        .location-item .value.sector {
            background: rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
        }

        .location-item .value.district {
            background: rgba(37, 99, 235, 0.25);
            color: #93c5fd;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .sync-status {
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .sync-status.loading {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.2);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.85rem;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: translateY(-1px);
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
        }

        .form-group input,
        .form-group select {
            padding: 10px 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
        }

        .form-group input:disabled,
        .form-group select:disabled {
            background-color: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #cbd5e1;
        }

        .form-group input.duplicate {
            border-color: var(--danger);
            background-color: #fef2f2;
        }

        .form-group input.valid {
            border-color: var(--success);
        }

        .warning-msg {
            color: var(--danger);
            font-size: 0.75rem;
            display: none;
            margin-top: 2px;
        }

        .warning-msg.show {
            display: block;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-actions {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        #statusMessage {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
        }

        #statusMessage.info {
            display: block;
            background-color: #e0f2fe;
            color: #0369a1;
        }

        #statusMessage.success {
            display: block;
            background-color: #d1fae5;
            color: #065f46;
        }

        #statusMessage.error {
            display: block;
            background-color: #fee2e2;
            color: #991b1b;
        }

        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 38px 10px 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary);
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            text-align: right;
            white-space: nowrap;
        }

        th {
            background-color: #f1f5f9;
            color: #334155;
            padding: 12px;
            font-weight: 700;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            color: #334155;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        tr.editing {
            background-color: #fef3c7;
        }

        .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-edit-sm {
            background-color: #fef3c7;
            color: #b45309;
        }

        .btn-edit-sm:hover {
            background-color: #fde68a;
        }

        .btn-delete-sm {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .btn-delete-sm:hover {
            background-color: #fca5a5;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--secondary);
            font-size: 1rem;
        }

        .debug-info {
            font-size: 0.75rem;
            color: #475569;
            margin-top: 3px;
            direction: ltr;
            text-align: left;
        }

        .session-timer {
            font-size: 0.8rem;
            color: #94a3b8;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .session-timer.warning {
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.2);
            background: rgba(245, 158, 11, 0.1);
        }

        .na {
            color: #94a3b8;
            font-style: italic;
        }

        .date-picker-wrapper {
            position: relative;
            direction: ltr;
        }

        .date-picker-wrapper input {
            padding-left: 40px;
            width: 100%;
        }

        .date-picker-wrapper .date-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary);
            pointer-events: none;
        }

        .date-display {
            font-size: 0.85rem;
            color: var(--secondary);
            margin-top: 2px;
            text-align: right;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .table-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: 100%;
            }

            header {
                flex-direction: column;
                align-items: stretch;
            }

            .location-badge {
                justify-content: center;
            }
        }
    </style>
    <base target="_blank">
</head>

<body>
    <div class="container">
        <header>
            <div class="header-left">
                <div class="header-icon"><i class="fas fa-bolt"></i></div>
                <div class="header-title">
                    <h1>تسجيل التركيبات</h1>
                    <div class="subtitle">العدادات الذكية</div>
                </div>
            </div>
            <div class="location-badge">
                <div class="location-item"><i class="fas fa-layer-group"
                        style="color: #6ee7b7; font-size: 0.8rem;"></i><span class="label">القطاع</span><span
                        class="value sector" id="sectorNameDisplay">جاري التحميل...</span></div>
                <div class="location-divider"></div>
                <div class="location-item"><i class="fas fa-building"
                        style="color: #93c5fd; font-size: 0.8rem;"></i><span class="label">الهندسة</span><span
                        class="value district" id="districtNameDisplay">جاري التحميل...</span></div>
            </div>
            <div class="header-actions">
                <span id="sessionTimer" class="session-timer">⏱ 05:00</span>
                <span id="syncStatus" class="sync-status loading">⏳ جاري الاتصال...</span>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>
        </header>
        <div id="statusMessage"></div>
        <input type="hidden" id="keta3Id">
        <input type="hidden" id="handsaCode">
        <input type="hidden" id="editingKey">

        <div class="card" id="dataForm">
            <div class="card-title"><i class="fas fa-edit"></i> تسجيل البيانات</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>رقم العداد الرئيسي <span style="color:red">*</span></label>
                    <input type="text" id="meterNum" maxlength="8" placeholder="أدخل 8 أرقام">
                    <span class="warning-msg" id="meterNumWarning"></span>
                </div>
                <div class="form-group">
                    <label>رقم الشريحة</label>
                    <input type="text" id="simNum" maxlength="19" list="simList" placeholder="أدخل 19 رقم">
                    <datalist id="simList"></datalist>
                    <span class="warning-msg" id="simNumWarning"></span>
                </div>
                <div class="form-group">
                    <label>نوع العداد</label>
                    <select id="meterType">
                        <option value="A1">A1</option>
                        <option value="A2">A2</option>
                        <option value="A3">A3</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>جهد العداد</label>
                    <input type="text" id="meterVoltage" value="110" readonly>
                </div>
                <div class="form-group">
                    <label>تاريخ التركيب</label>
                    <div class="date-picker-wrapper">
                        <input type="date" id="installDatePicker" dir="ltr">
                        <i class="fas fa-calendar-alt date-icon"></i>
                    </div>
                    <div class="date-display" id="dateDisplay">التاريخ: --/--/----</div>
                    <input type="hidden" id="installDate">
                </div>
                <div class="form-group">
                    <label>نوع المغذي</label>
                    <select id="transType">
                        <option value="SUBESTATION">SUBESTATION</option>
                        <option value="FEEDERINCOMING">FEEDERINCOMING</option>
                        <option value="FEEDEROUTGOING" selected>FEEDEROUTGOING</option>
                        <option value="COMPACT">COMPACT</option>
                    </select>
                </div>
                <div class="form-group" id="compactNameGroup" style="display:none;">
                    <label>اسم الكومباكت</label>
                    <input type="text" id="transName" placeholder="أدخل اسم الكومباكت">
                </div>
                <div class="form-group" id="compactCodeGroup" style="display:none;">
                    <label>كود الكومباكت</label>
                    <input type="text" id="transCode" placeholder="أدخل كود الكومباكت">
                </div>
                <div class="form-group" id="feederNameGroup">
                    <label id="feederNameLabel">اسم المغذي</label>
                    <input type="text" id="feederName" list="feedersList" placeholder="أدخل أو اختر اسم المغذي">
                    <datalist id="feedersList"></datalist>
                </div>
                <div class="form-group" id="feederCodeGroup">
                    <label id="feederCodeLabel">كود المغذي</label>
                    <input type="text" id="feederCode" list="feederCodeList" placeholder="أدخل أو اختر كود المغذي">
                    <datalist id="feederCodeList"></datalist>
                    <span class="warning-msg" id="feederCodeWarning"></span>
                </div>
                <div class="form-group">
                    <label>اسم لوحة التوزيع</label>
                    <input type="text" id="panelName" list="panelsList" placeholder="اختر لوحة التوزيع">
                    <datalist id="panelsList"></datalist>
                    <div id="panelDebug" class="debug-info"></div>
                </div>
                <div class="form-group">
                    <label>كود لوحة التوزيع</label>
                    <input type="text" id="panelCode" list="panelCodeList" placeholder="كود اللوحة">
                    <datalist id="panelCodeList"></datalist>
                    <span class="warning-msg" id="panelCodeWarning"></span>
                </div>
                <div class="form-group">
                    <label>اسم المحطة</label>
                    <input type="text" id="stationName" list="stationsList" placeholder="اختر اسم المحطة">
                    <datalist id="stationsList"></datalist>
                    <div id="stationDebug" class="debug-info"></div>
                </div>
                <div class="form-group">
                    <label>كود المحطة</label>
                    <input type="text" id="stationCode" list="stationCodeList" placeholder="كود المحطة">
                    <datalist id="stationCodeList"></datalist>
                    <span class="warning-msg" id="stationCodeWarning"></span>
                </div>
                <div class="form-group">
                    <label>مغذي الخروج</label>
                    <input type="text" id="feederOutgoing" list="outgoingList" placeholder="اختر مغذي الخروج">
                    <datalist id="outgoingList"></datalist>
                </div>
                <div class="form-group">
                    <label>قدرة المحول (ك.ف.أ)</label>
                    <input type="text" id="transCap" placeholder="مثال: 500">
                </div>
                <div class="form-group">
                    <label>خط العرض (Latitude)</label>
                    <input type="text" id="lat" placeholder="31.xxxx">
                </div>
                <div class="form-group">
                    <label>خط الطول (Longitude)</label>
                    <input type="text" id="lng" placeholder="31.xxxx">
                </div>
                <div class="form-group full-width">
                    <label>عنوان الكومباكت/المغذي بالتفصيل</label>
                    <input type="text" id="transAddress" placeholder="أدخل العنوان التفصيلي للكومباكت أو المغذي">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="addSingleBtn" disabled><i class="fas fa-plus-circle"></i> حفظ
                    السجل</button>
                <button class="btn btn-secondary" id="cancelEditBtn" style="display: none;"><i class="fas fa-times"></i>
                    إلغاء التعديل</button>
            </div>
        </div>

        <div class="card">
            <div class="table-controls">
                <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput"
                        placeholder="بحث في السجلات..." oninput="renderTable(allRecords)"></div>
                <div><span id="recordsCount" style="font-weight: bold; color: var(--secondary);">0 سجل</span>
                    <button class="btn btn-secondary" style="margin-right: 10px;" onclick="refreshData()"><i
                            class="fas fa-sync-alt"></i> تحديث</button>
                </div>
            </div>
            <div class="table-container" id="tableContainer">
                <div class="no-data">جاري تحميل البيانات...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFXLCWmwrAQIrmRvnus3yJlTpra9Rv69k",
            authDomain: "trial-85.firebaseapp.com",
            databaseURL: "https://trial-85-default-rtdb.firebaseio.com",
            projectId: "trial-85",
            storageBucket: "trial-85.firebasestorage.app",
            messagingSenderId: "660343156279",
            appId: "1:660343156279:web:3275f5d3da7721a35259b2",
            measurementId: "G-RLMVPCLZW3"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const keta3Id = urlParams.get('keta3') || urlParams.get('keta3_id');
        const handsaCode = urlParams.get('handsa-code') || urlParams.get('handsa_code') || urlParams.get('handsa');
        const norm = v => String(v ?? '').replace(/[\u200B-\u200D\uFEFF]/g, '').trim();

        // --- session timer ---
        let sessionTimeout, remainingSeconds = 300, countdownInterval;
        function resetSessionTimer() { remainingSeconds = 300; updateTimerDisplay(); clearTimeout(sessionTimeout); startSessionTimer(); }
        function startSessionTimer() { sessionTimeout = setTimeout(() => { logout(); }, remainingSeconds * 1000); }
        function updateTimerDisplay() {
            const m = Math.floor(remainingSeconds / 60), s = remainingSeconds % 60;
            const el = document.getElementById('sessionTimer');
            el.textContent = `⏱ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            el.classList.toggle('warning', remainingSeconds <= 60);
        }
        function startCountdown() { if (countdownInterval) clearInterval(countdownInterval); countdownInterval = setInterval(() => { remainingSeconds--; updateTimerDisplay(); if (remainingSeconds <= 0) clearInterval(countdownInterval); }, 1000); }
        ['click', 'keydown', 'mousemove', 'touchstart', 'scroll'].forEach(ev => document.addEventListener(ev, resetSessionTimer));
        window.logout = function () { clearInterval(countdownInterval); clearTimeout(sessionTimeout); window.location.href = "login.html"; };

        if (!keta3Id || !handsaCode) window.location.href = "login.html";
        else {
            document.getElementById('keta3Id').value = keta3Id;
            document.getElementById('handsaCode').value = handsaCode;
            // Set default date to today
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('installDatePicker').value = `${year}-${month}-${day}`;
            document.getElementById('installDate').value = formatDate(today);
            updateDateDisplay(today);
            authenticateAndInit();
            resetSessionTimer();
            startCountdown();
        }

        // Date picker -> hidden field conversion
        document.getElementById('installDatePicker').addEventListener('change', function () {
            const val = this.value;
            if (val) {
                const parts = val.split('-');
                const d = new Date(parts[0], parts[1] - 1, parts[2]);
                document.getElementById('installDate').value = formatDate(d);
                updateDateDisplay(d);
            } else {
                document.getElementById('installDate').value = '';
                document.getElementById('dateDisplay').textContent = 'التاريخ: --/--/----';
            }
        });

        function updateDateDisplay(date) {
            if (date && !isNaN(date)) {
                document.getElementById('dateDisplay').textContent = `التاريخ: ${formatDate(date)}`;
            }
        }

        function formatDate(date) {
            if (!date || isNaN(date)) return '';
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            return `${d}/${m}/${y}`;
        }

        function parseDate(str) {
            if (!str) return null;
            const parts = str.split('/');
            if (parts.length === 3) {
                const d = parseInt(parts[0]);
                const m = parseInt(parts[1]) - 1;
                const y = parseInt(parts[2]);
                if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {
                    return new Date(y, m, d);
                }
            }
            return null;
        }

        function dateToPicker(str) {
            if (!str) return '';
            const d = parseDate(str);
            if (!d || isNaN(d)) return '';
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

                const data = snap.val();
                const list = Array.isArray(data) ? data : Object.values(data);
                list.forEach(item => {
                    if (!item) return;
                    const name = norm(item.sub_name || item.sub || item.station || item["اسم المحطة"] || '');
                    const code = norm(item.sub_code || item.station_code || item["كود المحطة"] || '');

                    if (name && code && itemHandsa === currentHandsaCode) {
                        if (!stationCodesByName[name]) stationCodesByName[name] = new Set();
                        stationCodesByName[name].add(code);
                    }
                });
                const seen = new Set();
                list.forEach(item => {
                    if (!item) return;
                    const name = norm(item.sub_name || item.sub || item.station || item["اسم المحطة"] || '');
                    const code = norm(item.sub_code || item.station_code || item["كود المحطة"] || '');
                    const itemHandsa = norm(item["handsa-code"] ?? item["handsa_code"] ?? item["handsaCode"] ?? item["كود الهندسة"] ?? item["handsa"] ?? item["code"] ?? "");
                    if (name && itemHandsa === currentHandsaCode && !seen.has(name)) {
                        seen.add(name);
                        rawStations.push({ name, code, raw: item });

        window.renderTable = function (records) {
            const container = document.getElementById('tableContainer');
            const searchTerm = norm(document.getElementById('searchInput').value.toLowerCase());
            const keys = Object.keys(records);
            const sortedKeys = keys.sort((a, b) => {
                const ta = records[a]['_timestamp'] || 0, tb = records[b]['_timestamp'] || 0;
                return tb - ta || b.localeCompare(a);
            });
            const newestKeys = sortedKeys.slice(0, 5);
            let filteredRecords = {};
            let hasSearchTerm = false;
            if (searchTerm) {
                const matchingKeys = keys.filter(key => {
                    const rec = records[key];
                    return Object.values(rec).join(' ').toLowerCase().includes(searchTerm);
                });
                const sortedMatching = matchingKeys.sort((a, b) => (records[b]['_timestamp'] || 0) - (records[a]['_timestamp'] || 0) || b.localeCompare(a));
                sortedMatching.slice(0, 5).forEach(k => filteredRecords[k] = records[k]);
                hasSearchTerm = true;
            } else {
                newestKeys.forEach(k => filteredRecords[k] = records[k]);
            }
            if (Object.keys(filteredRecords).length === 0) {
                container.innerHTML = `<div class="no-data">${searchTerm ? 'لا توجد نتائج مطابقة للبحث' : 'لا توجد بيانات مسجلة'}</div>`;
                return;
            }
            let html = `<table><thead><tr>
        <th>رقم العداد</th><th>رقم الشريحة</th><th>اسم المغذي</th><th>كود المغذي</th>
        <th>اسم لوحة التوزيع</th><th>كود لوحة التوزيع</th><th>نوع المغذي</th>
        <th>القطاع</th><th>الهندسة</th><th>عنوان المغذي بالتفصيل</th>
        <th>التغذية الرئيسية</th><th>كود التغذية الرئيسية</th>
        <th>تاريخ التركيب</th><th>Latitude(y)</th><th>Longitude(x)</th><th>TYPE</th><th>الإجراءات</th>
    </tr></thead><tbody>`;
            Object.keys(filteredRecords).forEach(key => {
                const rec = filteredRecords[key];
                const isEditing = (editingKey === key);
                const isCompact = (rec["trans_type"] === "COMPACT" || rec["نوع المغذي"] === "COMPACT");
                let feederNameDisplay = rec["اسم المغذي"] || '';
                let feederCodeDisplay = rec["كود المغذي"] || '';
                let mainFeed = rec["sub_name"] || rec["اسم المحطة"] || rec["cell_out"] || '';
                let mainFeedCode = rec["sub_code"] || rec["كود المحطة"] || '';
                if (isCompact) {
                    feederNameDisplay = rec["اسم الكومباكت"] || rec["اسم المغذي"] || '';
                    feederCodeDisplay = rec["كود الكومباكت"] || rec["كود المغذي"] || '';
                    mainFeed = rec["اسم الكومباكت"] || rec["اسم المغذي"] || '';
                    mainFeedCode = rec["كود الكومباكت"] || rec["كود المغذي"] || '';
                }
                const na = v => (v && v !== '') ? v : '<span class="na">N/A</span>';
                const lat = rec["Latitude(y)"] || rec["Latitude"] || '';
                const lng = rec["Longitude(x)"] || rec["Longitude"] || '';
                const installDate = formatDateForDisplay(rec["تاريخ التركيب"] || '');
                html += `<tr class="${isEditing ? 'editing' : ''}">
            <td>${na(rec["رقم العداد"])}</td>
            <td>${na(rec["رقم الشريحة"])}</td>
            <td>${na(feederNameDisplay)}</td>
            <td>${na(feederCodeDisplay)}</td>
            <td>${na(rec["اسم لوحة التوزيع"])}</td>
            <td>${na(rec["كود لوحة التوزيع"])}</td>
            <td>${na(rec["trans_type"] || rec["نوع المغذي"])}</td>
            <td>${na(rec["القطاع"])}</td>
            <td>${na(rec["الهندسة"])}</td>
            <td style="max-width:150px;white-space:normal;word-break:break-word;">${na(rec["عنوان المحول بالتفصيل"])}</td>
            <td>${na(mainFeed)}</td>
            <td>${na(mainFeedCode)}</td>
            <td>${na(installDate)}</td>
            <td>${lat || '<span class="na">N/A</span>'}</td>
            <td>${lng || '<span class="na">N/A</span>'}</td>
            <td>${na(rec["TYPE"] || rec["نوع العداد"] || 'A1')}</td>
            <td><div class="actions-cell">
                <button class="btn-sm btn-edit-sm" onclick="window.editRecord('${key}')"><i class="fas fa-edit"></i> تعديل</button>
                <button class="btn-sm btn-delete-sm" onclick="window.deleteRecord('${key}')"><i class="fas fa-trash"></i></button>
            </div></td>
        </tr>`;
            });
            if (!hasSearchTerm && Object.keys(records).length > 5) {
                html += `<tr><td colspan="17" style="text-align:center;color:#64748b;font-style:italic;padding:10px;">عرض أحدث 5 سجلات فقط. استخدم البحث للعثور على سجلات أقدم.</td></tr>`;
            }
            html += `</tbody></table>`;
            container.innerHTML = html;
        };

        window.editRecord = function (key) {
            const rec = allRecords[key];
            if (!rec) return;
            editingKey = key;
            document.getElementById('editingKey').value = key;
            document.getElementById('meterNum').value = rec["رقم العداد"] || '';
            document.getElementById('simNum').value = rec["رقم الشريحة"] || '';
            document.getElementById('meterType').value = rec["TYPE"] || rec["نوع العداد"] || 'A1';
            document.getElementById('meterVoltage').value = rec["جهد العداد"] || '110';
            const installDateStr = rec["تاريخ التركيب"] || formatDate(new Date());
            document.getElementById('installDate').value = installDateStr;
            const dateObj = parseDate(installDateStr);
            if (dateObj && !isNaN(dateObj)) {
                document.getElementById('installDatePicker').value = dateToPicker(installDateStr);
                updateDateDisplay(dateObj);
            } else {
                document.getElementById('installDatePicker').value = '';
                document.getElementById('dateDisplay').textContent = 'التاريخ: --/--/----';
            }
            document.getElementById('transType').value = rec["trans_type"] || rec["نوع المغذي"] || 'SUBESTATION';
            handleTransTypeChange();
            document.getElementById('transName').value = rec["اسم الكومباكت"] || rec["اسم المحول"] || '';
            document.getElementById('transCode').value = rec["كود الكومباكت"] || rec["كود المحول"] || '';
            document.getElementById('feederName').value = rec["اسم المغذي"] || '';
            document.getElementById('feederCode').value = rec["كود المغذي"] || '';
            document.getElementById('panelName').value = rec["اسم لوحة التوزيع"] || '';
            document.getElementById('panelCode').value = rec["كود لوحة التوزيع"] || '';
            const stName = rec["sub_name"] || rec["اسم المحطة"] || '';
            document.getElementById('stationName').value = stName;
            const dl = document.getElementById('stationCodeList'); dl.innerHTML = '';
            if (stName && stationCodesByName[stName]) stationCodesByName[stName].forEach(c => { const o = document.createElement('option'); o.value = c; dl.appendChild(o); });
            document.getElementById('stationCode').value = rec["sub_code"] || rec["كود المحطة"] || '';
            document.getElementById('feederOutgoing').value = rec["cell_out"] || rec["مغذي الخروج"] || '';
            document.getElementById('transCap').value = rec["قدرة المحول"] || '';
            document.getElementById('lat').value = rec["Latitude(y)"] || rec["Latitude"] || '';
            document.getElementById('lng').value = rec["Longitude(x)"] || rec["Longitude"] || '';
            document.getElementById('transAddress').value = rec["عنوان المحول بالتفصيل"] || '';

            renderPanelsList(document.getElementById('stationCode').value, document.getElementById('stationName').value);
            renderFeedersList(rec["كود لوحة التوزيع"], document.getElementById('stationCode').value);

            document.getElementById('addSingleBtn').innerHTML = '<i class="fas fa-save"></i> تحديث السجل';
            document.getElementById('cancelEditBtn').style.display = 'inline-block';
            document.getElementById('addSingleBtn').style.backgroundColor = '#f59e0b';
            document.getElementById('dataForm').scrollIntoView({ behavior: 'smooth' });
            checkValidation();
            renderTable(allRecords);
        };

        window.cancelEdit = function () {
            editingKey = null;
            document.getElementById('editingKey').value = '';
            document.getElementById('addSingleBtn').innerHTML = '<i class="fas fa-plus-circle"></i> حفظ السجل';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('addSingleBtn').style.backgroundColor = '#2563eb';
            clearForm();
            renderStationsList(); renderPanelsList(); renderFeedersList(); renderOutgoingList();
            renderTable(allRecords);
            checkValidation();
        };

        window.deleteRecord = function (key) {
            if (!confirm(`هل أنت متأكد من حذف السجل رقم ${key}؟`)) return;
            const kId = norm(document.getElementById('keta3Id').value), hCode = norm(document.getElementById('handsaCode').value);
            showStatus("جاري حذف السجل من القاعدة...", "info"); updateSyncStatus(true);
            remove(ref(db, `sectors/${kId}/districts/${hCode}/manual_entries/${key}`))
                .then(() => { showStatus("تم حذف السجل بنجاح!", "success"); updateSyncStatus(false); resetSessionTimer(); })
                .catch(err => { showStatus("خطأ أثناء الحذف: " + err.message, "error"); updateSyncStatus(false); });
        };

        window.refreshData = function () { authenticateAndInit(); showStatus("جاري مزامنة البيانات...", "info"); resetSessionTimer(); };

        function clearForm() {
            document.getElementById('meterNum').value = ''; document.getElementById('simNum').value = '';
            document.getElementById('meterType').value = 'A1'; document.getElementById('meterVoltage').value = '110';
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('installDatePicker').value = `${year}-${month}-${day}`;
            document.getElementById('installDate').value = formatDate(today);
            updateDateDisplay(today);
            document.getElementById('transType').value = 'SUBESTATION';
            handleTransTypeChange();
            document.getElementById('transName').value = ''; document.getElementById('transCode').value = '';
            document.getElementById('feederName').value = ''; document.getElementById('feederCode').value = '';
            document.getElementById('panelName').value = ''; document.getElementById('panelCode').value = '';
            document.getElementById('stationName').value = ''; document.getElementById('stationCode').value = '';
            document.getElementById('stationCodeList').innerHTML = '';
            document.getElementById('feederOutgoing').value = ''; document.getElementById('transCap').value = '';
            document.getElementById('lat').value = ''; document.getElementById('lng').value = ''; document.getElementById('transAddress').value = '';
        }

        function checkValidation() {
            const meterNum = norm(document.getElementById('meterNum').value);
            const simNum = norm(document.getElementById('simNum').value);
            const editingKeyVal = document.getElementById('editingKey').value;
            const transType = document.getElementById('transType').value;
            const stationCode = norm(document.getElementById('stationCode').value);
            const panelCode = norm(document.getElementById('panelCode').value);
            const feederCode = norm(document.getElementById('feederCode').value);
            let hasError = false;

            const meterField = document.getElementById('meterNum'), meterWarn = document.getElementById('meterNumWarning');
            if (!meterNum) { meterField.classList.remove('duplicate', 'valid'); meterWarn.classList.remove('show'); hasError = true; }
            else if (meterNum.length !== 8 || !/^\d+$/.test(meterNum)) {
                meterField.classList.add('duplicate'); meterField.classList.remove('valid');
                meterWarn.textContent = '⚠️ رقم العداد يجب أن يتكون من 8 أرقام !'; meterWarn.classList.add('show'); hasError = true;
            } else if (existingMeters.has(meterNum) && !(editingKeyVal && allRecords[editingKeyVal] && norm(allRecords[editingKeyVal]["رقم العداد"]) === meterNum)) {
                meterField.classList.add('duplicate'); meterField.classList.remove('valid');
                meterWarn.textContent = '⚠️ رقم العداد مسجل مسبقاً!'; meterWarn.classList.add('show'); hasError = true;
            } else { meterField.classList.remove('duplicate'); meterField.classList.add('valid'); meterWarn.classList.remove('show'); }

            const simField = document.getElementById('simNum'), simWarn = document.getElementById('simNumWarning');
            if (simNum) {
                if (simNum.length !== 19 || !/^\d+$/.test(simNum)) {
                    simField.classList.add('duplicate'); simField.classList.remove('valid');
                    simWarn.textContent = '⚠️ رقم الشريحة يجب أن يتكون من 19 رقم بالضبط!'; simWarn.classList.add('show'); hasError = true;
                } else if (existingSims.has(simNum) && !(editingKeyVal && allRecords[editingKeyVal] && norm(allRecords[editingKeyVal]["رقم الشريحة"]) === simNum)) {
                    simField.classList.add('duplicate'); simField.classList.remove('valid');
                    simWarn.textContent = '⚠️ رقم الشريحة مسجل مسبقاً!'; simWarn.classList.add('show'); hasError = true;
                } else { simField.classList.remove('duplicate'); simField.classList.add('valid'); simWarn.classList.remove('show'); }
            } else { simField.classList.remove('duplicate', 'valid'); simWarn.classList.remove('show'); }

            const scField = document.getElementById('stationCode'), scWarn = document.getElementById('stationCodeWarning');
            if (stationCode && !/^[A-Z]{3}-[A-Z]{3}-[A-Z]{2}\d{2,3}-[A-Z]{2}\d{2}$/.test(stationCode.trim().toUpperCase())) {
                scField.classList.add('duplicate'); scField.classList.remove('valid');
                scWarn.textContent = '⚠️ كود المحطة غير صحيح!'; scWarn.classList.add('show'); hasError = true;
            } else { scField.classList.remove('duplicate'); scField.classList.add('valid'); scWarn.classList.remove('show'); }

            const pcField = document.getElementById('panelCode'), pcWarn = document.getElementById('panelCodeWarning');
            if (panelCode && !/^[A-Z]{3}-[A-Z]{3}-[A-Z]{2}\d{3}(-[A-Z])?$/.test(panelCode.trim().toUpperCase())) {
                pcField.classList.add('duplicate'); pcField.classList.remove('valid');
                pcWarn.textContent = '⚠️ كود لوحة التوزيع غير صحيح!'; pcWarn.classList.add('show'); hasError = true;
            } else { pcField.classList.remove('duplicate'); pcField.classList.add('valid'); pcWarn.classList.remove('show'); }

            const fcField = document.getElementById('feederCode'), fcWarn = document.getElementById('feederCodeWarning');
            if (feederCode && transType !== 'COMPACT' && transType !== 'FEEDERINCOMING' && !/^[A-Z]{3}-[A-Z]{3}-[A-Z]{2}\d{3}-[A-Z]\d{2}$/.test(feederCode.trim().toUpperCase())) {
                fcField.classList.add('duplicate'); fcField.classList.remove('valid');
                fcWarn.textContent = '⚠️ كود المغذي غير صحيح!'; fcWarn.classList.add('show'); hasError = true;
            } else { fcField.classList.remove('duplicate'); if (feederCode) fcField.classList.add('valid'); fcWarn.classList.remove('show'); }

            document.getElementById('addSingleBtn').disabled = hasError;
        }

        document.getElementById('meterNum').addEventListener('input', checkValidation);
        document.getElementById('simNum').addEventListener('input', checkValidation);
        document.getElementById('stationCode').addEventListener('input', checkValidation);
        document.getElementById('panelCode').addEventListener('input', checkValidation);
        document.getElementById('feederCode').addEventListener('input', checkValidation);

        document.getElementById('searchInput').addEventListener('input', function () { renderTable(allRecords); resetSessionTimer(); });

        document.getElementById('addSingleBtn').addEventListener('click', function () {
            const kId = norm(document.getElementById('keta3Id').value), hCode = norm(document.getElementById('handsaCode').value);
            const meterNum = norm(document.getElementById('meterNum').value);
            const simNum = norm(document.getElementById('simNum').value);
            const transType = document.getElementById('transType').value;
            const isCompact = transType === 'COMPACT';
            let feederName, feederCode;
            if (isCompact) { feederName = norm(document.getElementById('transName').value); feederCode = norm(document.getElementById('transCode').value); }
            else { feederName = norm(document.getElementById('feederName').value); feederCode = norm(document.getElementById('feederCode').value); }
            const transName = norm(document.getElementById('transName').value), transCode = norm(document.getElementById('transCode').value);
            const panelName = norm(document.getElementById('panelName').value), panelCode = norm(document.getElementById('panelCode').value);
            const stationName = norm(document.getElementById('stationName').value), stationCode = norm(document.getElementById('stationCode').value);
            const feederOutgoing = norm(document.getElementById('feederOutgoing').value);
            const editingKeyVal = document.getElementById('editingKey').value;

            if (!meterNum || meterNum.length !== 8) { showStatus("يرجى التأكد من إدخال رقم العداد الرئيسي المكون من 8 أرقام.", "error"); return; }
            if (stationCode && !/^[A-Z]{3}-[A-Z]{3}-[A-Z]{2}\d{2,3}-[A-Z]{2}\d{2}$/.test(stationCode.trim().toUpperCase())) { showStatus("كود المحطة غير صحيح!", "error"); return; }
            if (panelCode && !/^[A-Z]{3}-[A-Z]{3}-[A-Z]{2}\d{3}(-[A-Z])?$/.test(panelCode.trim().toUpperCase())) { showStatus("كود لوحة التوزيع غير صحيح!", "error"); return; }
            if (feederCode && !isCompact && transType !== 'FEEDERINCOMING' && !/^[A-Z]{3}-[A-Z]{3}-[A-Z]{2}\d{3}-[A-Z]\d{2}$/.test(feederCode.trim().toUpperCase())) { showStatus("كود المغذي غير صحيح!", "error"); return; }

            const installDate = document.getElementById('installDate').value;
            const dateParts = installDate.split('/');
            if (dateParts.length !== 3 || !/^\d{2}$/.test(dateParts[0]) || !/^\d{2}$/.test(dateParts[1]) || !/^\d{4}$/.test(dateParts[2])) {
                showStatus("تاريخ التركيب يجب أن يكون بصيغة dd/mm/yyyy", "error");
                return;
            }

            const recordData = {
                "رقم العداد": meterNum,
                "رقم الشريحة": simNum,
                "TYPE": document.getElementById('meterType').value,
                "جهد العداد": norm(document.getElementById('meterVoltage').value),
                "تاريخ التركيب": installDate,
                "trans_type": transType,
                "اسم الكومباكت": transName,
                "كود الكومباكت": transCode,
                "اسم المغذي": feederName,
                "كود المغذي": feederCode,
                "اسم لوحة التوزيع": panelName,
                "كود لوحة التوزيع": panelCode,
                "sub_name": stationName,
                "sub_code": stationCode,
                "cell_out": feederOutgoing,
                "قدرة المحول": norm(document.getElementById('transCap').value),
                "Latitude(y)": norm(document.getElementById('lat').value),
                "Longitude(x)": norm(document.getElementById('lng').value),
                "القطاع": sectorName,
                "الهندسة": districtName,
                "عنوان المحول بالتفصيل": norm(document.getElementById('transAddress').value),
                "_timestamp": Date.now()
            };

            const targetKey = editingKeyVal || meterNum;
            const targetRef = ref(db, `sectors/${kId}/districts/${hCode}/manual_entries/${targetKey}`);
            const action = editingKeyVal ? 'تحديث' : 'حفظ';
            showStatus(`جاري ${action} السجل...`, "info"); updateSyncStatus(true);
            set(targetRef, recordData)
                .then(() => {
                    showStatus(`تم ${action} السجل بنجاح!`, "success");
                    updateSyncStatus(false);
                    resetSessionTimer();
                    if (!editingKeyVal) { clearForm(); renderStationsList(); renderPanelsList(); renderFeedersList(); renderOutgoingList(); }
                    else { cancelEdit(); }
                    checkValidation();
                })
                .catch(err => { showStatus(`خطأ أثناء ${action}: ` + err.message, "error"); updateSyncStatus(false); });
        });

        document.getElementById('cancelEditBtn').addEventListener('click', cancelEdit);
        checkValidation();
    </script>
</body>

</html>
