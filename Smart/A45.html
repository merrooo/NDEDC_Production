<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل وحصر العدادات والمحولات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-dark: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-right: 6px solid var(--primary);
            position: relative;
            overflow: hidden;
            flex-wrap: wrap;
            gap: 15px;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.06) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .header-icon {
            width: 52px;
            height: 52px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .header-title h1 {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-title .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .location-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .location-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e2e8f0;
            font-size: 0.9rem;
        }

        .location-item .label {
            color: #94a3b8;
            font-weight: 400;
        }

        .location-item .value {
            color: #ffffff;
            font-weight: 600;
            background: rgba(37, 99, 235, 0.25);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .location-divider {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
        }

        .location-item .value.sector {
            background: rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
        }

        .location-item .value.district {
            background: rgba(37, 99, 235, 0.25);
            color: #93c5fd;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .sync-status {
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .sync-status.loading {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.2);
        }

        .btn-back {
            background: rgba(37, 99, 235, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(37, 99, 235, 0.3);
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: rgba(37, 99, 235, 0.35);
            transform: translateY(-1px);
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
        }

        .form-group input,
        .form-group select {
            padding: 10px 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
        }

        .form-group input:disabled,
        .form-group select:disabled {
            background-color: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #cbd5e1;
        }

        .form-group input.duplicate {
            border-color: var(--danger);
            background-color: #fef2f2;
        }

        .form-group input.valid {
            border-color: var(--success);
        }

        .warning-msg {
            color: var(--danger);
            font-size: 0.75rem;
            display: none;
            margin-top: 2px;
        }

        .warning-msg.show {
            display: block;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-actions {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .btn-excel {
            background-color: #10b981;
            color: white;
        }

        .btn-excel:hover {
            background-color: #059669;
        }

        #statusMessage {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
        }

        #statusMessage.info {
            display: block;
            background-color: #e0f2fe;
            color: #0369a1;
        }

        #statusMessage.success {
            display: block;
            background-color: #d1fae5;
            color: #065f46;
        }

        #statusMessage.error {
            display: block;
            background-color: #fee2e2;
            color: #991b1b;
        }

        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            min-height: 250px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: right;
            white-space: nowrap;
        }

        th {
            background-color: #f1f5f9;
            color: #334155;
            padding: 10px 12px;
            font-weight: 700;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            color: #334155;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        tr.editing {
            background-color: #fef3c7;
        }

        .th-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .filter-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary);
            font-size: 0.8rem;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            color: var(--primary);
            background: #dbeafe;
        }

        .filter-popover {
            display: none;
            position: absolute;
            background: white;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 12px;
            z-index: 100;
            width: 280px;
            max-height: 380px;
            overflow-y: auto;
            text-align: right;
        }

        .filter-popover.show {
            display: block;
        }

        .filter-search-input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            outline: none;
        }

        .filter-search-input:focus {
            border-color: var(--primary);
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: normal;
            cursor: pointer;
        }

        .filter-option.hidden {
            display: none;
        }

        .filter-actions {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            margin-top: 8px;
        }

        .date-picker-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
        }

        .date-picker-group label {
            font-size: 0.8rem;
            color: var(--secondary);
            font-weight: 600;
        }

        .date-picker-group input[type="date"] {
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            width: 100%;
            text-align: center;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-type {
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.78rem;
        }

        .badge-a45 {
            background-color: #dcfce7;
            color: #15803d;
        }

        .badge-a123 {
            background-color: #e0e7ff;
            color: #4338ca;
        }

        .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-edit-sm {
            background-color: #fef3c7;
            color: #b45309;
        }

        .btn-edit-sm:hover {
            background-color: #fde68a;
        }

        .btn-delete-sm {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .btn-delete-sm:hover {
            background-color: #fca5a5;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--secondary);
            font-size: 1rem;
        }

        .debug-info {
            font-size: 0.75rem;
            color: #475569;
            margin-top: 3px;
            direction: ltr;
            text-align: left;
        }

        .session-timer {
            font-size: 0.8rem;
            color: #94a3b8;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .session-timer.warning {
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.2);
            background: rgba(245, 158, 11, 0.1);
        }

        .na {
            color: #94a3b8;
            font-style: italic;
        }

        .date-picker-wrapper {
            position: relative;
            direction: ltr;
        }

        .date-picker-wrapper input {
            padding-left: 40px;
            width: 100%;
        }

        .date-picker-wrapper .date-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary);
            pointer-events: none;
        }

        .date-display {
            font-size: 0.85rem;
            color: var(--secondary);
            margin-top: 2px;
            text-align: right;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .pagination-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        @media (max-width: 992px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            .header-left {
                width: 100%;
                flex-wrap: wrap;
                justify-content: center;
            }

            .location-badge {
                flex-wrap: wrap;
                justify-content: center;
                padding: 10px 16px;
                width: 100%;
            }

            .location-divider {
                display: none;
            }

            .header-actions {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .header-title {
                text-align: center;
            }

            .header-title h1 {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .table-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .action-btns {
                justify-content: center;
            }

            .filter-popover {
                width: 240px;
                max-height: 300px;
                right: 0;
                left: auto !important;
            }
        }

        @media (max-width: 600px) {
            .location-badge {
                flex-direction: column;
                align-items: center;
                gap: 6px;
                border-radius: 16px;
            }

            .location-item {
                font-size: 0.8rem;
            }

            .header-icon {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }

            .header-title h1 {
                font-size: 1.1rem;
            }
        }
    </style>
    <base target="_self">
</head>

<body>
    <div class="container">
        <header>
            <div class="header-left">
                <div class="header-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <div class="header-title">
                    <h1>تسجيل التركيبات</h1>
                    <div class="subtitle">العدادات الذكية (A4 / A5)</div>
                </div>
            </div>

            <div class="location-badge">
                <div class="location-item">
                    <i class="fas fa-layer-group" style="color: #6ee7b7; font-size: 0.8rem;"></i>
                    <span class="label">القطاع</span>
                    <span class="value sector" id="sectorNameDisplay">جاري التحميل...</span>
                </div>
                <div class="location-divider"></div>
                <div class="location-item">
                    <i class="fas fa-building" style="color: #93c5fd; font-size: 0.8rem;"></i>
                    <span class="label">الهندسة</span>
                    <span class="value district" id="districtNameDisplay">جاري التحميل...</span>
                </div>
            </div>

            <div class="header-actions">
                <span id="sessionTimer" class="session-timer">⏱ 05:00</span>
                <span id="syncStatus" class="sync-status loading">⏳ جاري الاتصال...</span>
                <button class="btn-back" id="btnReturn" onclick="goBack()"><i class="fas fa-arrow-right"></i>
                    رجوع</button>
            </div>
        </header>

        <div id="statusMessage"></div>
        <input type="hidden" id="keta3Id">
        <input type="hidden" id="handsaCode">
        <input type="hidden" id="editingKey">

        <div class="card" id="dataForm">
            <div class="card-title"><i class="fas fa-edit"></i> تسجيل البيانات</div>
            <div class="form-grid">

                <!-- 1. رقم العداد -->
                <div class="form-group">
                    <label>رقم العداد الرئيسي <span style="color:red">*</span></label>
                    <input type="text" id="meterNum" maxlength="8" placeholder="أدخل 8 أرقام">
                    <span class="warning-msg" id="meterNumWarning"></span>
                </div>

                <!-- 2. رقم الشريحة -->
                <div class="form-group">
                    <label>رقم الشريحة</label>
                    <input type="text" id="simNum" maxlength="19" list="simList" placeholder="أدخل 19 رقم">
                    <datalist id="simList"></datalist>
                    <span class="warning-msg" id="simNumWarning"></span>
                </div>

                <!-- 3. نوع العداد -->
                <div class="form-group">
                    <label>نوع العداد</label>
                    <select id="meterType">
                        <option value="A4">A4</option>
                        <option value="A5" selected>A5</option>
                    </select>
                </div>

                <!-- 4. جهد العداد -->
                <div class="form-group">
                    <label>جهد العداد</label>
                    <input type="text" id="meterVoltage" placeholder="أدخل جهد العداد" value="380" readonly>
                </div>

                <!-- 5. تاريخ التركيب -->
                <div class="form-group">
                    <label>تاريخ التركيب</label>
                    <div class="date-picker-wrapper">
                        <input type="date" id="installDatePicker" dir="ltr">
                        <i class="fas fa-calendar-alt date-icon"></i>
                    </div>
                    <div class="date-display" id="dateDisplay">التاريخ: --/--/----</div>
                    <input type="hidden" id="installDate">
                </div>

                <!-- 6. نوع المحول -->
                <div class="form-group">
                    <label>نوع المحول</label>
                    <select id="transType" disabled>
                        <option value="TRANSFORMER" selected>TRANSFORMER</option>
                        <option value="TRANSFORMER-P">TRANSFORMER-P</option>
                    </select>
                </div>

                <!-- 7. مصدر تغذية المحول -->
                <div class="form-group full-width">
                    <label>مصدر تغذية المحول <span style="color:red">*</span></label>
                    <select id="feedSource">
                        <option value="" disabled selected>اختر مصدر التغذية</option>
                        <option value="dp">المحول مغذي من لوحة التوزيع</option>
                        <option value="station">المحول مغذي من محطة المحولات</option>
                    </select>
                </div>

                <!-- 8. اسم المحول -->
                <div class="form-group">
                    <label>اسم المحول</label>
                    <input type="text" id="transName" list="transformersList" placeholder="اختر أو أدخل اسم المحول"
                        disabled>
                    <datalist id="transformersList"></datalist>
                </div>

                <!-- 9. كود المحول -->
                <div class="form-group">
                    <label>كود المحول</label>
                    <input type="text" id="transCode" list="transCodeList" placeholder="اختر كود المحول" disabled>
                    <datalist id="transCodeList"></datalist>
                    <span class="warning-msg" id="transCodeWarning"></span>
                </div>

                <!-- 10. اسم المغذي -->
                <div class="form-group">
                    <label>اسم المغذي</label>
                    <input type="text" id="feederName" list="feedersList" placeholder="اختر اسم المغذي" disabled>
                    <datalist id="feedersList"></datalist>
                </div>

                <!-- 11. كود المغذي -->
                <div class="form-group">
                    <label>كود المغذي</label>
                    <input type="text" id="feederCode" list="feederCodeList" placeholder="اختر كود المغذي" disabled>
                    <datalist id="feederCodeList"></datalist>
                    <span class="warning-msg" id="feederCodeWarning"></span>
                </div>

                <!-- 12. لوحة التوزيع -->
                <div class="form-group">
                    <label>اسم لوحة التوزيع</label>
                    <input type="text" id="panelName" list="panelsList" placeholder="اختر لوحة التوزيع" disabled>
                    <datalist id="panelsList"></datalist>
                    <div id="panelDebug" class="debug-info"></div>
                </div>

                <!-- 13. كود لوحة التوزيع -->
                <div class="form-group">
                    <label>كود لوحة التوزيع</label>
                    <input type="text" id="panelCode" list="panelCodeList" placeholder="كود اللوحة" disabled>
                    <datalist id="panelCodeList"></datalist>
                    <span class="warning-msg" id="panelCodeWarning"></span>
                </div>

        function formatToDDMMYYYY(dateStr) {
            if (!dateStr || dateStr === 'N/A') return 'N/A';
            let parts = String(dateStr).split(/[\/\-]/);
            if (parts.length === 3) {
                if (parts[0].length === 4) {
                    return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
                } else if (parts[2].length === 4) {

            }

        function excelSerialToDate(serial) {
            const epoch = new Date(1899, 11, 30);

            if (!str) return null;

            if (!isNaN(str) && Number(str) > 10000) {
                return excelSerialToDate(Number(str));

            const parts = String(str).split(/[\/\-]/);
            if (parts.length === 3) {
                let d, m, y;
                if (parts[0].length === 4) {
                    y = parseInt(parts[0], 10);
                    m = parseInt(parts[1], 10) - 1;
                    d = parseInt(parts[2], 10);
                } else {
                    d = parseInt(parts[0], 10);
                    m = parseInt(parts[1], 10) - 1;
                    y = parseInt(parts[2], 10);
                }
                return new Date(y, m, d);
            }

            return null;

        async function fetchStationsDropdown() {
            const subSnap = await get(ref(db, 'reference_data/sub_codes'));
            rawStations = [];
            stationsMap = {};
            stationsReverseMap = {};
            stationCodesByName = {};

            if (subSnap.exists()) {
                const data = subSnap.val();
                const list = Array.isArray(data) ? data : Object.values(data);

                list.forEach(item => {
                    if (item) {
                        const name = norm(item.sub || item.sub_name || item.station || item["اسم المحطة"] || '');
                        const code = norm(item.sub_code || item.station_code || item["كود المحطة"] || '');

                        if (name && code) {
                            if (!stationCodesByName[name]) {
                                stationCodesByName[name] = new Set();
                            }
                            stationCodesByName[name].add(code);
                            stationsReverseMap[code] = name;
                        }
                    }
                });

                const seenNames = new Set();

        // ===== TABLE FUNCTIONS =====
        function loadRecords() {
            const recordsRef = ref(db, `sectors/${keta3Id}/districts/${handsaCode}/manual_entries`);
            onValue(recordsRef, (snapshot) => {
                const rawData = snapshot.val() || {};
                const filtered = {};
                Object.keys(rawData).forEach(key => {
                    const rec = rawData[key];
                    const meterType = norm(rec["TYPE"] || rec["نوع العداد"] || rec["meter_type"] || '');
                    if (ALLOWED_TYPES.some(type => meterType.toUpperCase() === type.toUpperCase())) {
                        filtered[key] = rec;
                    }
                });
                allRecords = filtered;
                existingMeters.clear();
                existingSims.clear();

                Object.values(allRecords).forEach(record => {
                    const meterNum = record["رقم العداد"] || record["meter_number"] || '';
                    const simNum = record["رقم الشريحة"] || record["sim_number"] || '';
                    if (meterNum) existingMeters.add(norm(meterNum));
                    if (simNum) existingSims.add(norm(simNum));
                });

                applyFilters();
                document.getElementById('recordsCount').textContent = `${Object.keys(allRecords).length} سجل`;
                checkValidation();
                updateSyncStatus(false);
            });
        }

        function applyFilters() {
            filteredKeysList = Object.keys(allRecords).filter(key => {
                const record = allRecords[key];
                for (const col of COLUMNS) {
                    if (col.isDate) {
                        const dateFilter = activeColumnFilters[col.key];
                        if (dateFilter) {
                            const recTimestamp = parseToTimestamp(getRecordValue(record, col));
                            if (!recTimestamp) return false;
                            if (dateFilter.from) {
                                const fromTs = parseToTimestamp(dateFilter.from);
                                if (fromTs && recTimestamp < fromTs) return false;
                            }
                            if (dateFilter.to) {
                                const toTs = parseToTimestamp(dateFilter.to);
                                if (toTs && recTimestamp > toTs) return false;
                            }
                        }
                    } else {
                        const selectedValues = activeColumnFilters[col.key];
                        if (selectedValues && selectedValues.length > 0) {
                            const val = getRecordValue(record, col);
                            if (!selectedValues.includes(val)) return false;
                        }
                    }
                }
                for (const col of COLUMNS) {
                    const searchTerm = columnSearchTerms[col.key];
                    if (searchTerm && searchTerm.trim() !== '') {
                        const val = getRecordValue(record, col);
                        if (!val.toLowerCase().includes(searchTerm.toLowerCase())) return false;
                    }
                }
                return true;
            });

            document.getElementById('recordsCount').textContent = `${filteredKeysList.length} سجل`;
            currentPage = 1;
            renderTablePage();
        }

        function renderTablePage() {
            const container = document.getElementById('tableContainer');
            if (filteredKeysList.length === 0) {
                container.innerHTML = `<div class="no-data">لا توجد بيانات مسجلة (A4 / A5)</div>`;
                updatePaginationControls();
                return;
            }

            const totalPages = Math.ceil(filteredKeysList.length / PAGE_SIZE);
            if (currentPage > totalPages) currentPage = totalPages;
            const startIndex = (currentPage - 1) * PAGE_SIZE;
            const pageKeys = filteredKeysList.slice(startIndex, startIndex + PAGE_SIZE);

            let html = `<table><thead><tr><th>#</th>`;
            COLUMNS.forEach(col => {
                const isActive = activeColumnFilters[col.key] && (
                    col.isDate ? (activeColumnFilters[col.key].from || activeColumnFilters[col.key].to) : activeColumnFilters[
                        col.key].length > 0
                ) || (columnSearchTerms[col.key] && columnSearchTerms[col.key].trim() !== '');
                html += `
                    <th>
                        <div class="th-content">
                            <span>${col.label}</span>
                            <button class="filter-btn ${isActive ? 'active' : ''}" onclick="window.toggleFilterPopover(event, '${col.key}')">
                                <i class="fas fa-filter"></i>
                            </button>
                        </div>
                    </th>`;
            });
            html += `<th>الإجراءات</th></tr></thead><tbody>`;

            let index = startIndex;
            pageKeys.forEach(key => {
                index++;
                const record = allRecords[key];
                const isEditingRow = (editingKey === key);

                html += `<tr class="${isEditingRow ? 'editing' : ''}"><td>${index}</td>`;

                COLUMNS.forEach(col => {
                    let val = getRecordValue(record, col);
                    if (col.isDate) val = formatToDDMMYYYY(val);

                    if (col.key === 'meter_type') {
                        const badgeClass = ['A4', 'A5'].includes(val) ? 'badge-a45' : 'badge-a123';
                        html +=
                            `<td><span class="badge-type ${badgeClass}">${val === 'N/A' ? '<span class="na">N/A</span>' : val}</span></td>`;
                    } else if (col.key === 'address') {
                        html +=
                            `<td style="max-width:150px;white-space:normal;word-break:break-word;">${val === 'N/A' ? '<span class="na">N/A</span>' : val}</td>`;
                    } else {
                        html += `<td>${val === 'N/A' ? '<span class="na">N/A</span>' : val}</td>`;
                    }
                });

                html += `<td><div class="actions-cell">
                    <button class="btn-sm btn-edit-sm" onclick="window.editRecord('${key}')"><i class="fas fa-edit"></i> تعديل</button>
                    <button class="btn-sm btn-delete-sm" onclick="window.deleteRecord('${key}')"><i class="fas fa-trash"></i></button>
                </div></td></tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
            updatePaginationControls();
        }

        function updatePaginationControls() {
            const totalPages = Math.ceil(filteredKeysList.length / PAGE_SIZE) || 1;
            document.getElementById('pageIndicator').textContent = `الصفحة ${currentPage} من ${totalPages}`;
            document.getElementById('btnPrev').disabled = (currentPage === 1);
            document.getElementById('btnNext').disabled = (currentPage >= totalPages);
        }

        window.changePage = function (delta) {
            const totalPages = Math.ceil(filteredKeysList.length / PAGE_SIZE) || 1;
            if (currentPage + delta >= 1 && currentPage + delta <= totalPages) {
                currentPage += delta;
                renderTablePage();
            }
        };

        // ===== FILTER POPOVER =====
        window.toggleFilterPopover = function (event, colKey) {
            event.stopPropagation();
            const popover = document.getElementById('filterPopover');
            const button = event.currentTarget;
            const rect = button.getBoundingClientRect();

            if (popover.classList.contains('show') && popover.dataset.colKey === colKey) {
                popover.classList.remove('show');
                return;
            }

            const col = COLUMNS.find(c => c.key === colKey);
            const currentSearch = columnSearchTerms[colKey] || '';
            let popHtml = `<strong style="display:block; margin-bottom:8px; font-size:0.85rem;">تصفية حسب ${col.label}</strong>`;

            if (!col.isDate) {
                popHtml += `
                    <input type="text" class="filter-search-input" id="columnSearchInput" 
                           placeholder="بحث في ${col.label}..." value="${currentSearch}"
                           oninput="window.onColumnSearch('${colKey}', this.value)">
                `;
            }

            if (col.isDate) {
                const currentFilter = activeColumnFilters[colKey] || { fromRGB: '', toRGB: '' };
                popHtml += `
                    <div class="date-picker-group">
                        <label>من تاريخ:</label>
                        <input type="date" id="dateFromPicker" value="${currentFilter.fromRGB || ''}">
                        <label>إلى تاريخ:</label>
                        <input type="date" id="dateToPicker" value="${currentFilter.toRGB || ''}">
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-primary btn-sm" onclick="window.applyDateFilter('${colKey}')">تطبيق</button>
                        <button class="btn-link" onclick="window.clearDateFilter('${colKey}')">إلغاء</button>
                    </div>`;
            } else {
                const uniqueValues = new Set();
                Object.values(allRecords).forEach(rec => {
                    const val = getRecordValue(rec, col);
                    if (val !== 'N/A') uniqueValues.add(val);
                });
                const sortedValues = Array.from(uniqueValues).sort();
                const currentSelected = activeColumnFilters[colKey] || [];

                if (sortedValues.length === 0) {
                    popHtml += `<div style="color:#94a3b8;font-size:0.85rem;padding:8px 0;">لا توجد قيم للتصفية</div>`;
                } else {
                    sortedValues.forEach(val => {
                        const checked = currentSelected.includes(val) ? 'checked' : '';
                        const searchTermLower = (columnSearchTerms[colKey] || '').toLowerCase();
                        const show = !searchTermLower || val.toLowerCase().includes(searchTermLower);
                        popHtml += `
                            <label class="filter-option ${show ? '' : 'hidden'}" data-value="${val}">
                                <input type="checkbox" value="${val}" ${checked} onchange="window.onCheckboxChange('${colKey}')">
                                <span>${val}</span>
                            </label>`;
                    });
                }

                popHtml += `
                    <div class="filter-actions">
                        <button class="btn-link" onclick="window.selectAllColumn('${colKey}', true)">تحديد الكل</button>
                        <button class="btn-link" onclick="window.selectAllColumn('${colKey}', false)">إلغاء الكل</button>
                    </div>`;
            }

            popover.innerHTML = popHtml;
            popover.dataset.colKey = colKey;
            popover.style.top = `${rect.bottom + window.scrollY + 5}px`;
            popover.style.left = `${Math.min(rect.left + window.scrollX - 150, window.innerWidth - 290)}px`;
            popover.classList.add('show');

            setTimeout(() => {
                const searchInput = document.getElementById('columnSearchInput');
                if (searchInput) searchInput.focus();
            }, 100);
        };

        window.onColumnSearch = function (colKey, value) {
            if (value && value.trim() !== '') {
                columnSearchTerms[colKey] = value.trim();
            } else {
                delete columnSearchTerms[colKey];
            }

            const popover = document.getElementById('filterPopover');
            if (popover && popover.dataset.colKey === colKey) {
                const searchLower = value.toLowerCase();
                const options = popover.querySelectorAll('.filter-option');
                options.forEach(opt => {
                    const val = opt.dataset.value || '';
                    if (searchLower && !val.toLowerCase().includes(searchLower)) {
                        opt.classList.add('hidden');
                    } else {
                        opt.classList.remove('hidden');
                    }
                });
            }

            applyFilters();
        };

        window.applyDateFilter = function (colKey) {
            const fromRGB = document.getElementById('dateFromPicker').value;
            const toRGB = document.getElementById('dateToPicker').value;

            let from = '', to = '';
            if (fromRGB) {
                const parts = fromRGB.split('-');
                from = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            if (toRGB) {
                const parts = toRGB.split('-');
                to = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }

            if (fromRGB || toRGB) {
                activeColumnFilters[colKey] = { from, to, fromRGB, toRGB };
            } else {
                delete activeColumnFilters[colKey];
            }
            document.getElementById('filterPopover').classList.remove('show');
            applyFilters();
        };

        window.clearDateFilter = function (colKey) {
            delete activeColumnFilters[colKey];
            document.getElementById('filterPopover').classList.remove('show');
            applyFilters();
        };

        window.onCheckboxChange = function (colKey) {
            const popover = document.getElementById('filterPopover');
            const checkboxes = popover.querySelectorAll('input[type="checkbox"]:not(.hidden)');
            const selected = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);

            if (selected.length > 0) {
                activeColumnFilters[colKey] = selected;
            } else {
                delete activeColumnFilters[colKey];
            }
            applyFilters();
        };

        window.selectAllColumn = function (colKey, selectAll) {
            const popover = document.getElementById('filterPopover');
            const checkboxes = popover.querySelectorAll('input[type="checkbox"]:not(.hidden)');
            checkboxes.forEach(cb => cb.checked = selectAll);
            window.onCheckboxChange(colKey);
        };

        window.resetAllFilters = function () {
            activeColumnFilters = {};
            columnSearchTerms = {};
            applyFilters();
            showStatus("تم إعادة ضبط جميع الفلاتر", "info");
        };

        window.exportToExcel = function () {
            if (filteredKeysList.length === 0) {
                alert("لا توجد بيانات لتصديرها.");
                return;
            }

            const exportData = filteredKeysList.map((key) => {
                const record = allRecords[key];
                const rowObj = {};

                COLUMNS.forEach(col => {
                    let val = getRecordValue(record, col);
                    const headerKey = col.key;

                    if (col.isDate && val !== 'N/A') {
                        val = formatToDDMMYYYY(val);
                    }

                    rowObj[headerKey] = val;
                });

                return rowObj;
            });

            try {
                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "العدادات والمحولات");
                XLSX.writeFile(workbook, `سجلات_العدادات_A45_${handsaCode}.xlsx`);
                showStatus("تم تصدير البيانات بنجاح", "success");
            } catch (err) {
                showStatus("خطأ في التصدير: " + err.message, "error");
            }
        };

        // ===== EDIT, DELETE, REFRESH =====
        window.editRecord = function (key) {
            const record = allRecords[key];
            if (!record) return;

            const recordData = {
                meterNum: record["رقم العداد"] || record["meter_number"] || '',
                simNum: record["رقم الشريحة"] || record["sim_number"] || '',
                meterType: record["TYPE"] || record["نوع العداد"] || record["meter_type"] || 'A5',
                meterVoltage: record["جهد العداد"] || '380',
                installDate: record["تاريخ التركيب"] || record["install_date"] || formatDate(new Date()),
                transType: record["trans_type"] || record["نوع المحول"] || 'TRANSFORMER',
                feedSource: record["feed_source"] || '',
                transName: record["اسم المحول"] || record["trans_name"] || '',
                transCode: record["كود المحول"] || record["trans_code"] || '',
                feederName: record["اسم المغذي"] || record["feeder_name"] || '',
                feederCode: record["كود المغذي"] || record["feeder_code"] || '',
                panelName: record["اسم لوحة التوزيع"] || record["panel_name"] || '',
                panelCode: record["كود لوحة التوزيع"] || record["panel_code"] || '',
                stationName: record["sub_name"] || record["اسم المحطة"] || '',
                stationCode: record["sub_code"] || record["كود المحطة"] || '',
                feederOutgoing: record["cell_out"] || record["اسم مغذي الخروج"] || '',
                transCap: record["قدرة المحول"] || record["trans_capacity"] || record["trans_cap"] || '',
                lat: record["Latitude(y)"] || record["Latitude"] || record["lat"] || '',
                lng: record["Longitude(x)"] || record["Longitude"] || record["lng"] || '',
                transAddress: record["عنوان المحول بالتفصيل"] || record["address"] || ''
            };

            editingKey = key;
            document.getElementById('editingKey').value = key;

            document.getElementById('meterNum').value = recordData.meterNum;
            document.getElementById('simNum').value = recordData.simNum;

            let typeVal = recordData.meterType;
            if (!ALLOWED_TYPES.includes(typeVal)) {
                typeVal = 'A5';
            }
            document.getElementById('meterType').value = typeVal;
            document.getElementById('meterVoltage').value = recordData.meterVoltage;

            document.getElementById('installDate').value = recordData.installDate;
            const dateObj = parseDate(recordData.installDate);
            if (dateObj && !isNaN(dateObj.getTime())) {
                document.getElementById('installDatePicker').value = dateToPicker(recordData.installDate);
                updateDateDisplay(dateObj);
            }

            document.getElementById('transType').value = recordData.transType;
            document.getElementById('feedSource').value = recordData.feedSource;
            handleFeedSourceChange();

            document.getElementById('transName').value = recordData.transName;
            document.getElementById('transCode').value = recordData.transCode;

            document.getElementById('stationName').value = recordData.stationName;
            document.getElementById('stationCode').value = recordData.stationCode;

            const codeDatalist = document.getElementById('stationCodeList');
            codeDatalist.innerHTML = '';
            if (recordData.stationName && stationCodesByName[recordData.stationName]) {
                stationCodesByName[recordData.stationName].forEach(code => {
                    const opt = document.createElement('option');
                    opt.value = code;
                    codeDatalist.appendChild(opt);
                });
            }

            renderPanelsList(recordData.stationCode, recordData.stationName);
            renderFeedersList(recordData.panelCode, recordData.stationCode);

            document.getElementById('panelName').value = recordData.panelName;
            document.getElementById('panelCode').value = recordData.panelCode;
            document.getElementById('feederName').value = recordData.feederName;
            document.getElementById('feederCode').value = recordData.feederCode;
            document.getElementById('feederOutgoing').value = recordData.feederOutgoing;

            document.getElementById('transCap').value = recordData.transCap;
            document.getElementById('lat').value = recordData.lat;
            document.getElementById('lng').value = recordData.lng;
            document.getElementById('transAddress').value = recordData.transAddress;

            document.getElementById('addSingleBtn').innerHTML = '<i class="fas fa-save"></i> تحديث السجل';
            document.getElementById('cancelEditBtn').style.display = 'inline-block';
            document.getElementById('addSingleBtn').style.backgroundColor = '#f59e0b';

            document.getElementById('dataForm').scrollIntoView({ behavior: 'smooth' });

            checkValidation();
            applyFilters();
        };

        window.cancelEdit = function () {
            editingKey = null;
            document.getElementById('editingKey').value = '';
            document.getElementById('addSingleBtn').innerHTML = '<i class="fas fa-plus-circle"></i> حفظ السجل';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('addSingleBtn').style.backgroundColor = '#2563eb';
            clearForm();
            renderStationsList();
            renderPanelsList();
            renderFeedersList();
            renderOutgoingList();
            applyFilters();
            checkValidation();
        };

        window.deleteRecord = function (key) {
            if (!confirm(`هل أنت متأكد من حذف السجل رقم ${key}؟`)) return;
            const kId = norm(document.getElementById('keta3Id').value);
            const hCode = norm(document.getElementById('handsaCode').value);
            showStatus("جاري حذف السجل من القاعدة...", "info");
            updateSyncStatus(true);
            const recordRef = ref(db, `sectors/${kId}/districts/${hCode}/manual_entries/${key}`);
            remove(recordRef)
                .then(() => {
                    showStatus("تم حذف السجل بنجاح!", "success");
                    updateSyncStatus(false);
                    resetSessionTimer();
                })
                .catch(err => {
                    showStatus("خطأ أثناء الحذف: " + err.message, "error");
                    updateSyncStatus(false);
                });
        };

        window.refreshData = function () {
            showStatus("جاري مزامنة البيانات...", "info");
            updateSyncStatus(true);
            loadRecords();
            resetSessionTimer();
        };

        function clearForm() {
            document.getElementById('meterNum').value = '';
            document.getElementById('simNum').value = '';
            document.getElementById('meterType').value = 'A5';
            document.getElementById('meterVoltage').value = '380';
            const today = new Date();
            document.getElementById('installDatePicker').value = today.toISOString().split('T')[0];
            document.getElementById('installDate').value = formatDate(today);
            updateDateDisplay(today);
            document.getElementById('transType').value = 'TRANSFORMER';
            document.getElementById('feedSource').value = '';
            handleFeedSourceChange();

            document.getElementById('transName').value = '';
            document.getElementById('transCode').value = '';
            document.getElementById('feederName').value = '';
            document.getElementById('feederCode').value = '';
            document.getElementById('panelName').value = '';
            document.getElementById('panelCode').value = '';
            document.getElementById('stationName').value = '';
            document.getElementById('stationCode').value = '';
            document.getElementById('stationCodeList').innerHTML = '';
            document.getElementById('feederOutgoing').value = '';
            document.getElementById('transCap').value = '';
            document.getElementById('lat').value = '';
            document.getElementById('lng').value = '';
            document.getElementById('transAddress').value = '';
        }

        function checkValidation() {
            const meterNum = norm(document.getElementById('meterNum').value);
            const simNum = norm(document.getElementById('simNum').value);
            const feedSourceVal = document.getElementById('feedSource').value;
            const editingKeyVal = document.getElementById('editingKey').value;

            const stationCode = norm(document.getElementById('stationCode').value);
            const panelCode = norm(document.getElementById('panelCode').value);
            const feederCode = norm(document.getElementById('feederCode').value);

            let hasError = false;

            const meterField = document.getElementById('meterNum');
            const meterWarning = document.getElementById('meterNumWarning');

            if (!meterNum) {
                meterField.classList.remove('duplicate', 'valid');
                meterWarning.classList.remove('show');
                hasError = true;
            } else if (meterNum.length !== 8 || !/^\d+$/.test(meterNum)) {
                meterField.classList.add('duplicate');
                meterField.classList.remove('valid');
                meterWarning.textContent = '⚠️ رقم العداد يجب أن يتكون من 8 أرقام !';
                meterWarning.classList.add('show');
                hasError = true;
            } else if (existingMeters.has(meterNum) && !(editingKeyVal && allRecords[editingKeyVal] && norm(allRecords[
                editingKeyVal]["رقم العداد"] || allRecords[editingKeyVal]["meter_number"] || '') === meterNum)) {
                meterField.classList.add('duplicate');
                meterField.classList.remove('valid');
                meterWarning.textContent = '⚠️ رقم العداد مسجل مسبقاً!';
                meterWarning.classList.add('show');
                hasError = true;
            } else {
                meterField.classList.remove('duplicate');
                meterField.classList.add('valid');
                meterWarning.classList.remove('show');
            }

            const simField = document.getElementById('simNum');
            const simWarning = document.getElementById('simNumWarning');

            if (simNum) {
                if (simNum.length !== 19 || !/^\d+$/.test(simNum)) {
                    simField.classList.add('duplicate');
                    simField.classList.remove('valid');
                    simWarning.textContent = '⚠️ رقم الشريحة يجب أن يتكون من 19 رقم بالضبط!';
                    simWarning.classList.add('show');
                    hasError = true;
                } else if (existingSims.has(simNum) && !(editingKeyVal && allRecords[editingKeyVal] && norm(allRecords[
                    editingKeyVal]["رقم الشريحة"] || allRecords[editingKeyVal]["sim_number"] || '') === simNum)) {
                    simField.classList.add('duplicate');
                    simField.classList.remove('valid');
                    simWarning.textContent = '⚠️ رقم الشريحة مسجل مسبقاً!';
                    simWarning.classList.add('show');
                    hasError = true;
                } else {
                    simField.classList.remove('duplicate');
                    simField.classList.add('valid');
                    simWarning.classList.remove('show');
                }
            } else {
                simField.classList.remove('duplicate', 'valid');
                simWarning.classList.remove('show');
            }

            const stationCodeField = document.getElementById('stationCode');
            const stationCodeWarning = document.getElementById('stationCodeWarning');
            if (stationCode && !validateStationCode(stationCode)) {
                stationCodeField.classList.add('duplicate');
                stationCodeField.classList.remove('valid');
                stationCodeWarning.textContent = '⚠️ كود المحطة غير صحيح!';
                stationCodeWarning.classList.add('show');
                hasError = true;
            } else {
                stationCodeField.classList.remove('duplicate');
                stationCodeField.classList.add('valid');
                stationCodeWarning.classList.remove('show');
            }

            const panelCodeField = document.getElementById('panelCode');
            const panelCodeWarning = document.getElementById('panelCodeWarning');
            if (panelCode && !validatePanelCode(panelCode)) {
                panelCodeField.classList.add('duplicate');
                panelCodeField.classList.remove('valid');
                panelCodeWarning.textContent = '⚠️ كود لوحة التوزيع غير صحيح!';
                panelCodeWarning.classList.add('show');
                hasError = true;
            } else {
                panelCodeField.classList.remove('duplicate');
                panelCodeField.classList.add('valid');
                panelCodeWarning.classList.remove('show');
            }

            const feederCodeField = document.getElementById('feederCode');
            const feederCodeWarning = document.getElementById('feederCodeWarning');
            if (feederCode && !validateFeederCode(feederCode)) {
                feederCodeField.classList.add('duplicate');
                feederCodeField.classList.remove('valid');
                feederCodeWarning.textContent = '⚠️ كود المغذي غير صحيح!';
                feederCodeWarning.classList.add('show');
                hasError = true;
            } else {
                feederCodeField.classList.remove('duplicate');
                feederCodeField.classList.add('valid');
                feederCodeWarning.classList.remove('show');
            }

            document.getElementById('addSingleBtn').disabled = hasError || !feedSourceVal;
        }

        document.getElementById('meterNum').addEventListener('input', checkValidation);
        document.getElementById('simNum').addEventListener('input', checkValidation);
        document.getElementById('stationCode').addEventListener('input', checkValidation);
        document.getElementById('panelCode').addEventListener('input', checkValidation);
        document.getElementById('feederCode').addEventListener('input', checkValidation);

        document.addEventListener('click', (e) => {
            const popover = document.getElementById('filterPopover');
            if (popover && !popover.contains(e.target)) {
                popover.classList.remove('show');
            }
        });

        document.getElementById('addSingleBtn').addEventListener('click', function () {
            const kId = norm(document.getElementById('keta3Id').value);
            const hCode = norm(document.getElementById('handsaCode').value);
            const meterNum = norm(document.getElementById('meterNum').value);
            const simNum = norm(document.getElementById('simNum').value);
            const feedSourceSelect = document.getElementById('feedSource');
            const feedSourceVal = feedSourceSelect.value;
            const feedSourceText = feedSourceSelect.options[feedSourceSelect.selectedIndex].text;

            const transName = norm(document.getElementById('transName').value);
            const transCode = norm(document.getElementById('transCode').value);
            const feederName = norm(document.getElementById('feederName').value);
            const feederCode = norm(document.getElementById('feederCode').value);
            const panelName = norm(document.getElementById('panelName').value);
            const panelCode = norm(document.getElementById('panelCode').value);
            const stationName = norm(document.getElementById('stationName').value);
            const stationCode = norm(document.getElementById('stationCode').value);
            const feederOutgoing = norm(document.getElementById('feederOutgoing').value);
            const editingKeyVal = document.getElementById('editingKey').value;

            if (!meterNum || meterNum.length !== 8) {
                showStatus("يرجى التأكد من إدخال رقم العداد الرئيسي المكون من 8 أرقام.", "error");
                return;
            }

            if (!feedSourceVal) {
                showStatus("يرجى اختيار مصدر تغذية المحول أولاً.", "error");
                return;
            }

            if (stationCode && !validateStationCode(stationCode)) {
                showStatus("كود المحطة غير صحيح!", "error");
                return;
            }
            if (panelCode && !validatePanelCode(panelCode)) {
                showStatus("كود لوحة التوزيع غير صحيح!", "error");
                return;
            }
            if (feederCode && !validateFeederCode(feederCode)) {
                showStatus("كود المغذي غير صحيح!", "error");
                return;
            }

            const installDate = document.getElementById('installDate').value;
            const dateParts = installDate.split('/');
            if (dateParts.length !== 3 || !/^\d{2}$/.test(dateParts[0]) || !/^\d{2}$/.test(dateParts[1]) || !/^\d{4}$/.test(
                dateParts[2])) {
                showStatus("تاريخ التركيب يجب أن يكون بصيغة dd/mm/yyyy", "error");
                return;
            }

            const recordData = {
                "رقم العداد": meterNum,
                "meter_number": meterNum,
                "رقم الشريحة": simNum,
                "sim_number": simNum,
                "TYPE": document.getElementById('meterType').value,
                "meter_type": document.getElementById('meterType').value,
                "جهد العداد": norm(document.getElementById('meterVoltage').value),
                "تاريخ التركيب": installDate,
                "install_date": installDate,
                "trans_type": document.getElementById('transType').value,
                "feed_source": feedSourceVal,
                "مصدر تغذية المحول": feedSourceText,
                "اسم المحول": transName,
                "trans_name": transName,
                "كود المحول": transCode,
                "trans_code": transCode,
                "اسم المغذي": feederName,
                "feeder_name": feederName,
                "كود المغذي": feederCode,
                "feeder_code": feederCode,
                "اسم لوحة التوزيع": panelName,
                "panel_name": panelName,
                "كود لوحة التوزيع": panelCode,
                "panel_code": panelCode,
                "sub_name": stationName,
                "sub_code": stationCode,
                "cell_out": feederOutgoing,
                "قدرة المحول": norm(document.getElementById('transCap').value),
                "trans_capacity": norm(document.getElementById('transCap').value),
                "trans_cap": norm(document.getElementById('transCap').value),
                "Latitude(y)": norm(document.getElementById('lat').value),
                "lat": norm(document.getElementById('lat').value),
                "Longitude(x)": norm(document.getElementById('lng').value),
                "lng": norm(document.getElementById('lng').value),
                "القطاع": sectorName,
                "keta3_id": keta3Id,
                "الهندسة": districtName,
                "handsa_code": handsaCode,
                "عنوان المحول بالتفصيل": norm(document.getElementById('transAddress').value),
                "address": norm(document.getElementById('transAddress').value),
                "_timestamp": Date.now()
            };

            const targetKey = editingKeyVal || meterNum;
            const targetRef = ref(db, `sectors/${kId}/districts/${hCode}/manual_entries/${targetKey}`);

            const action = editingKeyVal ? 'تحديث' : 'حفظ';
            showStatus(`جاري ${action} السجل...`, "info");
            updateSyncStatus(true);

            set(targetRef, recordData)
                .then(() => {
                    showStatus(`تم ${action} السجل بنجاح!`, "success");
                    updateSyncStatus(false);
                    resetSessionTimer();
                    if (!editingKeyVal) {
                        clearForm();
                        renderStationsList();
                        renderPanelsList();
                        renderFeedersList();
                        renderOutgoingList();
                    } else {
                        window.cancelEdit();
                    }
                    checkValidation();
                })
                .catch(err => {
                    showStatus(`خطأ أثناء ${action}: ` + err.message, "error");
                    updateSyncStatus(false);
                });
        });

        document.getElementById('cancelEditBtn').addEventListener('click', () => window.cancelEdit());
        checkValidation();
    </script>
</body>

</html>
