<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل وحصر العدادات والمحولات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-dark: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-right: 6px solid var(--primary);
            position: relative;
            overflow: hidden;
            flex-wrap: wrap;
            gap: 15px;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.06) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .header-icon {
            width: 52px;
            height: 52px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .header-title h1 {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-title .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .location-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .location-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e2e8f0;
            font-size: 0.9rem;
        }

        .location-item .label {
            color: #94a3b8;
            font-weight: 400;
        }

        .location-item .value {
            color: #ffffff;
            font-weight: 600;
            background: rgba(37, 99, 235, 0.25);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .location-divider {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
        }

        .location-item .value.sector {
            background: rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
        }

        .location-item .value.district {
            background: rgba(37, 99, 235, 0.25);
            color: #93c5fd;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .sync-status {
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .sync-status.loading {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.2);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.85rem;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: translateY(-1px);
        }

        @media (max-width: 992px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            .header-left {
                width: 100%;
                flex-wrap: wrap;
                justify-content: center;
            }

            .location-badge {
                flex-wrap: wrap;
                justify-content: center;
                padding: 10px 16px;
                width: 100%;
            }

            .location-divider {
                display: none;
            }

            .header-actions {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .header-title {
                text-align: center;
            }

            .header-title h1 {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 600px) {
            .location-badge {
                flex-direction: column;
                align-items: center;
                gap: 6px;
                border-radius: 16px;
            }

            .location-item {
                font-size: 0.8rem;
            }

            .header-icon {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }

            .header-title h1 {
                font-size: 1.1rem;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
        }

        .form-group input,
        .form-group select {
            padding: 10px 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
        }

        .form-group input:disabled,
        .form-group select:disabled {
            background-color: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #cbd5e1;
        }

        .form-group input.duplicate {
            border-color: var(--danger);
            background-color: #fef2f2;
        }

        .form-group input.valid {
            border-color: var(--success);
        }

        .warning-msg {
            color: var(--danger);
            font-size: 0.75rem;
            display: none;
            margin-top: 2px;
        }

        .warning-msg.show {
            display: block;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-actions {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        #statusMessage {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
        }

        #statusMessage.info {
            display: block;
            background-color: #e0f2fe;
            color: #0369a1;
        }

        #statusMessage.success {
            display: block;
            background-color: #d1fae5;
            color: #065f46;
        }

        #statusMessage.error {
            display: block;
            background-color: #fee2e2;
            color: #991b1b;
        }

        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 38px 10px 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary);
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            text-align: right;
            white-space: nowrap;
        }

        th {
            background-color: #f1f5f9;
            color: #334155;
            padding: 12px;
            font-weight: 700;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            color: #334155;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        tr.editing {
            background-color: #fef3c7;
        }

        .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-edit-sm {
            background-color: #fef3c7;
            color: #b45309;
        }

        .btn-edit-sm:hover {
            background-color: #fde68a;
        }

        .btn-delete-sm {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .btn-delete-sm:hover {
            background-color: #fca5a5;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--secondary);
            font-size: 1rem;
        }

        .debug-info {
            font-size: 0.75rem;
            color: #475569;
            margin-top: 3px;
            direction: ltr;
            text-align: left;
        }

        .session-timer {
            font-size: 0.8rem;
            color: #94a3b8;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .session-timer.warning {
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.2);
            background: rgba(245, 158, 11, 0.1);
        }

        .na {
            color: #94a3b8;
            font-style: italic;
        }

        .date-picker-wrapper {
            position: relative;
            direction: ltr;
        }

        .date-picker-wrapper input {
            padding-left: 40px;
            width: 100%;
        }

        .date-picker-wrapper .date-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary);
            pointer-events: none;
        }

        .date-display {
            font-size: 0.85rem;
            color: var(--secondary);
            margin-top: 2px;
            text-align: right;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .table-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: 100%;
            }
        }
    </style>
    <base target="_blank">
</head>

<body>
    <div class="container">
        <header>
            <div class="header-left">
                <div class="header-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <div class="header-title">
                    <h1>تسجيل التركيبات</h1>
                    <div class="subtitle">العدادات الذكية</div>
                </div>
            </div>

            <div class="location-badge">
                <div class="location-item">
                    <i class="fas fa-layer-group" style="color: #6ee7b7; font-size: 0.8rem;"></i>
                    <span class="label">القطاع</span>
                    <span class="value sector" id="sectorNameDisplay">جاري التحميل...</span>
                </div>
                <div class="location-divider"></div>
                <div class="location-item">
                    <i class="fas fa-building" style="color: #93c5fd; font-size: 0.8rem;"></i>
                    <span class="label">الهندسة</span>
                    <span class="value district" id="districtNameDisplay">جاري التحميل...</span>
                </div>
            </div>

            <div class="header-actions">
                <span id="sessionTimer" class="session-timer">⏱ 5:00</span>
                <span id="syncStatus" class="sync-status loading">⏳ جاري الاتصال...</span>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>
        </header>

        <div id="statusMessage"></div>
        <input type="hidden" id="keta3Id">
        <input type="hidden" id="handsaCode">
        <input type="hidden" id="editingKey">

        <div class="card" id="dataForm">
            <div class="card-title"><i class="fas fa-edit"></i> تسجيل البيانات</div>
            <div class="form-grid">

                <!-- 1. رقم العداد (EXACTLY 8 DIGITS) -->
                <div class="form-group">
                    <label>رقم العداد الرئيسي <span style="color:red">*</span></label>
                    <input type="text" id="meterNum" maxlength="8" placeholder="أدخل 8 أرقام">
                    <span class="warning-msg" id="meterNumWarning"></span>
                </div>

                <!-- 2. رقم الشريحة -->
                <div class="form-group">
                    <label>رقم الشريحة </label>
                    <input type="text" id="simNum" maxlength="19" list="simList" placeholder="أدخل 19 رقم">
                    <datalist id="simList"></datalist>
                    <span class="warning-msg" id="simNumWarning"></span>
                </div>

                <!-- 3. نوع العداد -->
                <div class="form-group">
                    <label>نوع العداد</label>
                    <select id="meterType">
                        <option value="A4" selected >A4</option>
                        <option value="A5">A5</option>
                    </select>
                </div>

                <!-- 4. جهد العداد -->
                <div class="form-group">
                    <label>جهد العداد</label>
                    <input type="text" id="meterVoltage" placeholder="أدخل جهد العداد" value="380" readonly>
                </div>

                <!-- 5. تاريخ التركيب -->
                <div class="form-group">
                    <label>تاريخ التركيب</label>
                    <div class="date-picker-wrapper">
                        <input type="date" id="installDatePicker" dir="ltr">
                        <i class="fas fa-calendar-alt date-icon"></i>
                    </div>
                    <div class="date-display" id="dateDisplay">التاريخ: --/--/----</div>
                    <input type="hidden" id="installDate">
                </div>

                <!-- 6. نوع المحول -->
                <div class="form-group">
                    <label>نوع المحول</label>
                    <select id="transType" disabled>
                        <option value="TRANSFORMER" selected>TRANSFORMER</option>
                        <option value="TRANSFORMER-P">TRANSFORMER-P</option>
                    </select>
                </div>

                <!-- 7. مصدر تغذية المحول (DEFAULT SELECTION) -->
                <div class="form-group full-width">
                    <label>مصدر تغذية المحول <span style="color:red">*</span></label>
                    <select id="feedSource">
                        <option value="" disabled selected>اختر مصدر التغذية</option>
                        <option value="dp">المحول مغذي من لوحة التوزيع</option>
                        <option value="station">المحول مغذي من محطة المحولات</option>
                    </select>
                </div>

                <!-- 8. اسم المحول -->
                <div class="form-group">
                    <label>اسم المحول</label>
                    <input type="text" id="transName" list="transformersList" placeholder="اختر أو أدخل اسم المحول"
                        disabled>
                    <datalist id="transformersList"></datalist>
                </div>

                <!-- 9. كود المحول -->
                <div class="form-group">
                    <label>كود المحول</label>
                    <input type="text" id="transCode" list="transCodeList" placeholder="اختر كود المحول" disabled>
                    <datalist id="transCodeList"></datalist>
                    <span class="warning-msg" id="transCodeWarning"></span>
                </div>

                <!-- 10. اسم المغذى -->
                <div class="form-group">
                    <label>اسم المغذي</label>
                    <input type="text" id="feederName" list="feedersList" placeholder="اختر اسم المغذي" disabled>
                    <datalist id="feedersList"></datalist>
                </div>

                <!-- 11. كود المغذي -->
                <div class="form-group">
                    <label>كود المغذي</label>
                    <input type="text" id="feederCode" list="feederCodeList" placeholder="اختر كود المغذي" disabled>
                    <datalist id="feederCodeList"></datalist>
                    <span class="warning-msg" id="feederCodeWarning"></span>
                </div>

                <!-- 12. لوحة التوزيع -->
                <div class="form-group">
                    <label>اسم لوحة التوزيع</label>
                    <input type="text" id="panelName" list="panelsList" placeholder="اختر لوحة التوزيع" disabled>
                    <datalist id="panelsList"></datalist>
                    <div id="panelDebug" class="debug-info"></div>
                </div>

                <!-- 13. كود لوحة التوزيع -->
                <div class="form-group">
                    <label>كود لوحة التوزيع</label>
                    <input type="text" id="panelCode" list="panelCodeList" placeholder="كود اللوحة" disabled>
                    <datalist id="panelCodeList"></datalist>
                    <span class="warning-msg" id="panelCodeWarning"></span>
                </div>

                <!-- 14. اسم المحطة -->
                <div class="form-group">
                    <label>اسم المحطة</label>
                    <input type="text" id="stationName" list="stationsList" placeholder="اختر اسم المحطة" disabled>
                    <datalist id="stationsList"></datalist>
                    <div id="stationDebug" class="debug-info"></div>
                </div>

                <!-- 15. كود المحطة  -->
                <div class="form-group">
                    <label>كود المحطة </label>
                    <input type="text" id="stationCode" list="stationCodeList" placeholder="كود المحطة" disabled>
                    <datalist id="stationCodeList"></datalist>
                    <span class="warning-msg" id="stationCodeWarning"></span>
                </div>

                <!-- 16. مغذي الخروج  -->
                <div class="form-group">
                    <label>مغذي الخروج </label>
                    <input type="text" id="feederOutgoing" list="outgoingList" placeholder="اختر مغذي الخروج" disabled>
                    <datalist id="outgoingList"></datalist>
                </div>

                <!-- بيانات إضافية -->
                <div class="form-group">
                    <label>قدرة المحول (ك.ف.أ)</label>
                    <input type="text" id="transCap" placeholder="مثال: 500">
                </div>
                <div class="form-group">
                    <label>خط العرض (Latitude)</label>
                    <input type="text" id="lat" placeholder="31.xxxx">
                </div>
                <div class="form-group">
                    <label>خط الطول (Longitude)</label>
                    <input type="text" id="lng" placeholder="31.xxxx">
                </div>
                <div class="form-group full-width">
                    <label>عنوان المحول بالتفصيل</label>
                    <input type="text" id="transAddress" placeholder="أدخل العنوان التفصيلي للمحول">
                </div>

            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="addSingleBtn" disabled><i class="fas fa-plus-circle"></i> حفظ
                    السجل</button>
                <button class="btn btn-secondary" id="cancelEditBtn" style="display: none;"><i class="fas fa-times"></i>
                    إلغاء التعديل</button>
            </div>
        </div>

        <div class="card">
            <div class="table-controls">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="بحث في السجلات..."
                        oninput="renderTable(allRecords)">
                </div>
                <div>
                    <span id="recordsCount" style="font-weight: bold; color: var(--secondary);">0 سجل</span>
                    <button class="btn btn-secondary" style="margin-right: 10px;" onclick="refreshData()"><i
                            class="fas fa-sync-alt"></i> تحديث</button>
                </div>
            </div>
            <div class="table-container" id="tableContainer">
                <div class="no-data">جاري تحميل البيانات...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFXLCWmwrAQIrmRvnus3yJlTpra9Rv69k",
            authDomain: "trial-85.firebaseapp.com",
            databaseURL: "https://trial-85-default-rtdb.firebaseio.com",
            projectId: "trial-85",

        function formatDate(date) {
            if (!date || isNaN(date)) return '';
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            return `${d}/${m}/${y}`;
        }

        function parseDate(str) {
            if (!str) return null;
            const parts = str.split('/');
            if (parts.length === 3) {
                const d = parseInt(parts[0]);
                const m = parseInt(parts[1]) - 1;
                const y = parseInt(parts[2]);
                if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {
                    return new Date(y, m, d);
                }
            }
            return null;
        }

        function dateToPicker(str) {
            if (!str) return '';
            const d = parseDate(str);
            if (!d || isNaN(d)) return '';
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        async function fetchStationsDropdown() {
            const subSnap = await get(ref(db, 'reference_data/sub_codes'));
            rawStations = [];
            stationsMap = {};
            stationsReverseMap = {};
            stationCodesByName = {};

            if (subSnap.exists()) {
                const data = subSnap.val();
                const list = Array.isArray(data) ? data : Object.values(data);

                list.forEach(item => {
                    if (item) {
                        const name = norm(item.sub_name || item.sub || item.station || item["اسم المحطة"] || '');
                        const code = norm(item.sub_code || item.station_code || item["كود المحطة"] || '');

                        if (name && code) {
                            if (!stationCodesByName[name]) {
                                stationCodesByName[name] = new Set();
                            }
                            stationCodesByName[name].add(code);
                            stationsReverseMap[code] = name;
                        }
                    }
                });

                const seenNames = new Set();
                list.forEach(item => {
                    if (item) {
                        const name = norm(item.sub_name || item.sub || item.station || item["اسم المحطة"] || '');
                        const code = norm(item.sub_code || item.station_code || item["كود المحطة"] || '');
                        const itemHandsa = norm(
                            item["handsa-code"] ??
                            item["handsa_code"] ??
                            item["handsaCode"] ??
                            item["كود الهندسة"] ??
                            item["handsa"] ??
                            item["code"] ?? ""
                        );

                        if (name && itemHandsa === currentHandsaCode && !seenNames.has(name)) {
                            seenNames.add(name);
                            rawStations.push({ name, code, raw: item });
                            if (code && !stationsMap[name]) {
                                stationsMap[name] = code;
                            }
                        }
                    }
                });
            }

            for (const name in stationCodesByName) {
                stationCodesByName[name] = Array.from(stationCodesByName[name]);
            }

            document.getElementById('stationDebug').textContent = `تم تحميل ${rawStations.length} محطة للهندسة (${currentHandsaCode})`;
        }

        window.renderTable = function (records) {
            const container = document.getElementById('tableContainer');
            const searchTerm = norm(document.getElementById('searchInput').value.toLowerCase());

            const keys = Object.keys(records);
            const sortedKeys = keys.sort((a, b) => {
                const recordA = records[a];
                const recordB = records[b];
                const timestampA = recordA['_timestamp'] || 0;
                const timestampB = recordB['_timestamp'] || 0;
                return timestampB - timestampA || b.localeCompare(a);
            });

            const newestKeys = sortedKeys.slice(0, 5);

            let filteredRecords = {};
            let hasSearchTerm = false;

            if (searchTerm) {
                const matchingKeys = keys.filter(key => {
                    const record = records[key];
                    const searchable = Object.values(record).join(' ').toLowerCase();
                    return searchable.includes(searchTerm);
                });

                const sortedMatchingKeys = matchingKeys.sort((a, b) => {
                    const recordA = records[a];
                    const recordB = records[b];
                    const timestampA = recordA['_timestamp'] || 0;
                    const timestampB = recordB['_timestamp'] || 0;
                    return timestampB - timestampA || b.localeCompare(a);
                });

                const newestMatchingKeys = sortedMatchingKeys.slice(0, 5);
                newestMatchingKeys.forEach(key => {
                    filteredRecords[key] = records[key];
                });
                hasSearchTerm = true;
            } else {
                newestKeys.forEach(key => {
                    filteredRecords[key] = records[key];
                });
            }

            if (Object.keys(filteredRecords).length === 0) {
                container.innerHTML =
                    `<div class="no-data">${searchTerm ? 'لا توجد نتائج مطابقة للبحث' : 'لا توجد بيانات مسجلة'}</div>`;
                return;
            }

            let html = `<table><thead><tr>
                <th>#</th>
                <th>رقم العداد</th>
                <th>رقم الشريحة</th>
                <th>اسم المحول</th>
                <th>قدرة المحول</th>
                <th>كود المحول</th>
                <th>عنوان المحول بالتفصيل</th>
                <th>تاريخ التركيب</th>
                <th>اسم المغذي الموصل بيه المحول</th>
                <th>كود المغذي الموصل بالمحول</th>
                <th>اسم لوحة التوزيع</th>
                <th>القطاع</th>
                <th>الهندسة</th>
                <th>Latitude(y)</th>
                <th>Longitude(x)</th>
                <th>TYPE</th>
                <th>الإجراءات</th>
            </tr></thead><tbody>`;

            let index = 0;
            Object.keys(filteredRecords).forEach(key => {
                const record = filteredRecords[key];
                index++;
                const isEditingRow = (editingKey === key);

                const na = v => (v && v !== '') ? v : '<span class="na">N/A</span>';
                const lat = record["Latitude(y)"] || record["Latitude"] || '';
                const lng = record["Longitude(x)"] || record["Longitude"] || '';
                const installDate = formatDateForDisplay(record["تاريخ التركيب"] || '');

                // Ensure TYPE is always A4 or A5 for this page
                let typeValue = record["TYPE"] || record["نوع العداد"] || 'A5';
                if (typeValue === 'A1' || typeValue === 'A2' || typeValue === 'A3') {
                    typeValue = 'A5';
                }

                html += `<tr class="${isEditingRow ? 'editing' : ''}">
                    <td>${index}</td>
                    <td>${na(record["رقم العداد"])}</td>
                    <td>${na(record["رقم الشريحة"])}</td>
                    <td>${na(record["اسم المحول"])}</td>
                    <td>${na(record["قدرة المحول"])}</td>
                    <td>${na(record["كود المحول"])}</td>
                    <td style="max-width:150px;white-space:normal;word-break:break-word;">${na(record["عنوان المحول بالتفصيل"])}</td>
                    <td>${installDate}</td>
                    <td>${na(record["اسم المغذي"])}</td>
                    <td>${na(record["كود المغذي"])}</td>
                    <td>${na(record["اسم لوحة التوزيع"])}</td>
                    <td>${na(record["القطاع"])}</td>
                    <td>${na(record["الهندسة"])}</td>
                    <td>${lat || ''}</td>
                    <td>${lng || ''}</td>
                    <td>${na(typeValue)}</td>
                    <td><div class="actions-cell">
                        <button class="btn-sm btn-edit-sm" onclick="window.editRecord('${key}')"><i class="fas fa-edit"></i> تعديل</button>
                        <button class="btn-sm btn-delete-sm" onclick="window.deleteRecord('${key}')"><i class="fas fa-trash"></i></button>
                    </div></td>
                </tr>`;
            });

            if (!hasSearchTerm && Object.keys(records).length > 5) {
                html += `<tr><td colspan="16" style="text-align:center;color:#64748b;font-style:italic;padding:10px;">
                    عرض أحدث 5 سجلات فقط. استخدم البحث للعثور على سجلات أقدم.
                </td></tr>`;
            }

            html += `</tbody></table>`;
            container.innerHTML = html;
        };



window.editRecord = function(key) {
    const record = allRecords[key];
    if (!record) return;
    
    // Store the record values BEFORE any changes
    const recordData = {
        meterNum: record["رقم العداد"] || '',
        simNum: record["رقم الشريحة"] || '',
        meterType: record["TYPE"] || record["نوع العداد"] || 'A5',
        meterVoltage: record["جهد العداد"] || '380',
        installDate: record["تاريخ التركيب"] || formatDate(new Date()),
        transType: record["trans_type"] || record["نوع المحول"] || 'TRANSFORMER',
        feedSource: record["feed_source"] || '',
        transName: record["اسم المحول"] || '',
        transCode: record["كود المحول"] || '',
        feederName: record["اسم المغذي"] || '',
        feederCode: record["كود المغذي"] || '',
        panelName: record["اسم لوحة التوزيع"] || '',
        panelCode: record["كود لوحة التوزيع"] || '',
        stationName: record["sub_name"] || record["اسم المحطة"] || '',
        stationCode: record["sub_code"] || record["كود المحطة"] || '',
        feederOutgoing: record["cell_out"] || record["اسم مغذي الخروج"] || '',
        transCap: record["قدرة المحول"] || '',
        lat: record["Latitude(y)"] || record["Latitude"] || '',
        lng: record["Longitude(x)"] || record["Longitude"] || '',
        transAddress: record["عنوان المحول بالتفصيل"] || ''
    };

    // Set editing state
    editingKey = key;
    document.getElementById('editingKey').value = key;

    // Set basic fields
    document.getElementById('meterNum').value = recordData.meterNum;
    document.getElementById('simNum').value = recordData.simNum;
    
    // Ensure TYPE is A4 or A5 only
    let typeVal = recordData.meterType;
    if (typeVal === 'A1' || typeVal === 'A2' || typeVal === 'A3') {
        typeVal = 'A5';
    }
    document.getElementById('meterType').value = typeVal;
    document.getElementById('meterVoltage').value = recordData.meterVoltage;

    // Set date
    document.getElementById('installDate').value = recordData.installDate;
    const dateObj = parseDate(recordData.installDate);
    if (dateObj && !isNaN(dateObj)) {
        document.getElementById('installDatePicker').value = dateToPicker(recordData.installDate);
        updateDateDisplay(dateObj);
    }

    // Set trans type and feed source
    document.getElementById('transType').value = recordData.transType;
    document.getElementById('feedSource').value = recordData.feedSource;
    handleFeedSourceChange();

    // Set transformer
    document.getElementById('transName').value = recordData.transName;
    document.getElementById('transCode').value = recordData.transCode;

    // Set station values FIRST - this is critical
    document.getElementById('stationName').value = recordData.stationName;
    document.getElementById('stationCode').value = recordData.stationCode;

    // Update station code datalist
    const codeDatalist = document.getElementById('stationCodeList');
    codeDatalist.innerHTML = '';
    if (recordData.stationName && stationCodesByName[recordData.stationName]) {
        stationCodesByName[recordData.stationName].forEach(code => {
            const opt = document.createElement('option');
            opt.value = code;
            codeDatalist.appendChild(opt);
        });
    }

    // --- FIX: Manually populate panel datalist with filtered data ---
    const panelNameDatalist = document.getElementById('panelsList');
    const panelCodeDatalist = document.getElementById('panelCodeList');
    panelNameDatalist.innerHTML = '';
    panelCodeDatalist.innerHTML = '';

    // Filter panels by station code
    const filteredPanels = rawPanels.filter(p => {
        // Match by station code OR station name
        const matchCode = recordData.stationCode && p.mahataCode === recordData.stationCode;
        const matchName = recordData.stationName && p.mahataName === recordData.stationName;
        return matchCode || matchName;
    });

    // If no panels found with station filter, show all panels
    const panelsToShow = filteredPanels.length > 0 ? filteredPanels : rawPanels;

    // Add panel options to datalists
    const seenPanelNames = new Set();
    const seenPanelCodes = new Set();
    panelsToShow.forEach(p => {
        if (p.name && !seenPanelNames.has(p.name)) {
            seenPanelNames.add(p.name);
            const opt1 = document.createElement('option');
            opt1.value = p.name;
            panelNameDatalist.appendChild(opt1);
        }
        if (p.code && !seenPanelCodes.has(p.code)) {
            seenPanelCodes.add(p.code);
            const opt2 = document.createElement('option');
            opt2.value = p.code;
            panelCodeDatalist.appendChild(opt2);
        }
    });

    // Set panel values AFTER populating datalist
    document.getElementById('panelName').value = recordData.panelName;
    document.getElementById('panelCode').value = recordData.panelCode;

    // --- FIX: Manually populate feeder datalist with filtered data ---
    const feederNameDatalist = document.getElementById('feedersList');
    const feederCodeDatalist = document.getElementById('feederCodeList');
    feederNameDatalist.innerHTML = '';
    feederCodeDatalist.innerHTML = '';

    // Filter feeders by panel code and station code
    const filteredFeeders = rawFeeders.filter(f => {
        let matchPanel = true;
        let matchStation = true;
        
        if (recordData.panelCode) {
            // Check if feeder code starts with panel code
            matchPanel = f.code && f.code.startsWith(recordData.panelCode);
        }
        if (recordData.stationCode) {
            matchStation = f.mahataCode === recordData.stationCode;
        }
        return matchPanel && matchStation;
    });

    // If no feeders found with filter, show all feeders
    const feedersToShow = filteredFeeders.length > 0 ? filteredFeeders : rawFeeders;

    // Add feeder options to datalists
    const seenFeederNames = new Set();
    const seenFeederCodes = new Set();
    feedersToShow.forEach(f => {
        if (f.name && !seenFeederNames.has(f.name)) {
            seenFeederNames.add(f.name);
            const opt1 = document.createElement('option');
            opt1.value = f.name;
            feederNameDatalist.appendChild(opt1);
        }
        if (f.code && !seenFeederCodes.has(f.code)) {
            seenFeederCodes.add(f.code);
            const opt2 = document.createElement('option');
            opt2.value = f.code;
            feederCodeDatalist.appendChild(opt2);
        }
    });

    // Set feeder values AFTER populating datalist
    document.getElementById('feederName').value = recordData.feederName;
    document.getElementById('feederCode').value = recordData.feederCode;

    // Set outgoing
    document.getElementById('feederOutgoing').value = recordData.feederOutgoing;

    // Set extra fields
    document.getElementById('transCap').value = recordData.transCap;
    document.getElementById('lat').value = recordData.lat;
    document.getElementById('lng').value = recordData.lng;
    document.getElementById('transAddress').value = recordData.transAddress;

    // Update UI buttons
    document.getElementById('addSingleBtn').innerHTML = '<i class="fas fa-save"></i> تحديث السجل';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    document.getElementById('addSingleBtn').style.backgroundColor = '#f59e0b';

    // Scroll to form
    document.getElementById('dataForm').scrollIntoView({ behavior: 'smooth' });
    
    // Validate and render
    checkValidation();
    renderTable(allRecords);
    
    // Debug info
    console.log('Panels loaded:', rawPanels.length);
    console.log('Feeders loaded:', rawFeeders.length);
    console.log('Filtered panels:', filteredPanels.length);
    console.log('Filtered feeders:', filteredFeeders.length);
};

        function checkValidation() {
            const meterNum = norm(document.getElementById('meterNum').value);
            const simNum = norm(document.getElementById('simNum').value);
            const feedSourceVal = document.getElementById('feedSource').value;
            const editingKeyVal = document.getElementById('editingKey').value;

            const stationCode = norm(document.getElementById('stationCode').value);
            const panelCode = norm(document.getElementById('panelCode').value);
            const feederCode = norm(document.getElementById('feederCode').value);

            let hasError = false;

            const meterField = document.getElementById('meterNum');
            const meterWarning = document.getElementById('meterNumWarning');

            if (!meterNum) {
                meterField.classList.remove('duplicate', 'valid');
                meterWarning.classList.remove('show');
                hasError = true;
            } else if (meterNum.length !== 8 || !/^\d+$/.test(meterNum)) {
                meterField.classList.add('duplicate');
                meterField.classList.remove('valid');
                meterWarning.textContent = '⚠️ رقم العداد يجب أن يتكون من 8 أرقام !';
                meterWarning.classList.add('show');
                hasError = true;
            } else if (existingMeters.has(meterNum) && !(editingKeyVal && allRecords[editingKeyVal] && norm(allRecords[editingKeyVal]["رقم العداد"]) === meterNum)) {
                meterField.classList.add('duplicate');
                meterField.classList.remove('valid');
                meterWarning.textContent = '⚠️ رقم العداد مسجل مسبقاً!';
                meterWarning.classList.add('show');
                hasError = true;
            } else {
                meterField.classList.remove('duplicate');
                meterField.classList.add('valid');
                meterWarning.classList.remove('show');
            }

            const simField = document.getElementById('simNum');
            const simWarning = document.getElementById('simNumWarning');

            if (simNum) {
                if (simNum.length !== 19 || !/^\d+$/.test(simNum)) {
                    simField.classList.add('duplicate');
                    simField.classList.remove('valid');
                    simWarning.textContent = '⚠️ رقم الشريحة يجب أن يتكون من 19 رقم بالضبط!';
                    simWarning.classList.add('show');
                    hasError = true;
                } else if (existingSims.has(simNum) && !(editingKeyVal && allRecords[editingKeyVal] && norm(allRecords[editingKeyVal]["رقم الشريحة"]) === simNum)) {
                    simField.classList.add('duplicate');
                    simField.classList.remove('valid');
                    simWarning.textContent = '⚠️ رقم الشريحة مسجل مسبقاً!';
                    simWarning.classList.add('show');
                    hasError = true;
                } else {
                    simField.classList.remove('duplicate');
                    simField.classList.add('valid');
                    simWarning.classList.remove('show');
                }
            } else {
                simField.classList.remove('duplicate', 'valid');
                simWarning.classList.remove('show');
            }

            const stationCodeField = document.getElementById('stationCode');
            const stationCodeWarning = document.getElementById('stationCodeWarning');
            if (stationCode && !validateStationCode(stationCode)) {
                stationCodeField.classList.add('duplicate');
                stationCodeField.classList.remove('valid');
                stationCodeWarning.textContent = '⚠️ كود المحطة غير صحيح!';
                stationCodeWarning.classList.add('show');
                hasError = true;
            } else {
                stationCodeField.classList.remove('duplicate');
                stationCodeField.classList.add('valid');
                stationCodeWarning.classList.remove('show');
            }

            const panelCodeField = document.getElementById('panelCode');
            const panelCodeWarning = document.getElementById('panelCodeWarning');
            if (panelCode && !validatePanelCode(panelCode)) {
                panelCodeField.classList.add('duplicate');
                panelCodeField.classList.remove('valid');
                panelCodeWarning.textContent = '⚠️ كود لوحة التوزيع غير صحيح!';

                hasError = true;
            } else {
                panelCodeField.classList.remove('duplicate');
                panelCodeField.classList.add('valid');
                panelCodeWarning.classList.remove('show');
            }

            const feederCodeField = document.getElementById('feederCode');
            const feederCodeWarning = document.getElementById('feederCodeWarning');

                feederCodeField.classList.add('valid');
                feederCodeWarning.classList.remove('show');
            }

            document.getElementById('addSingleBtn').disabled = hasError || !feedSourceVal;

            const simNum = norm(document.getElementById('simNum').value);
            const feedSourceSelect = document.getElementById('feedSource');
            const feedSourceVal = feedSourceSelect.value;
            const feedSourceText = feedSourceSelect.options[feedSourceSelect.selectedIndex].text;

            const transName = norm(document.getElementById('transName').value);
            const transCode = norm(document.getElementById('transCode').value);
            const feederName = norm(document.getElementById('feederName').value);
            const feederCode = norm(document.getElementById('feederCode').value);
            const panelName = norm(document.getElementById('panelName').value);
            const panelCode = norm(document.getElementById('panelCode').value);
            const stationName = norm(document.getElementById('stationName').value);
            const stationCode = norm(document.getElementById('stationCode').value);
            const feederOutgoing = norm(document.getElementById('feederOutgoing').value);
            const editingKeyVal = document.getElementById('editingKey').value;

            if (!meterNum || meterNum.length !== 8) {
                showStatus("يرجى التأكد من إدخال رقم العداد الرئيسي المكون من 8 أرقام.", "error");
                return;
            }

            if (!feedSourceVal) {
                showStatus("يرجى اختيار مصدر تغذية المحول أولاً.", "error");
                return;
            }

            if (stationCode && !validateStationCode(stationCode)) {
                showStatus("كود المحطة غير صحيح!", "error");
                return;
            }
            if (panelCode && !validatePanelCode(panelCode)) {
                showStatus("كود لوحة التوزيع غير صحيح!", "error");
                return;
            }
            if (feederCode && !validateFeederCode(feederCode)) {
                showStatus("كود المغذي غير صحيح!", "error");
                return;
            }

            const installDate = document.getElementById('installDate').value;
            const dateParts = installDate.split('/');
            if (dateParts.length !== 3 || !/^\d{2}$/.test(dateParts[0]) || !/^\d{2}$/.test(dateParts[1]) || !/^\d{4}$/.test(dateParts[2])) {
                showStatus("تاريخ التركيب يجب أن يكون بصيغة dd/mm/yyyy", "error");
                return;
            }

            const recordData = {
                "رقم العداد": meterNum,
                "رقم الشريحة": simNum,
                "TYPE": document.getElementById('meterType').value,
                "جهد العداد": norm(document.getElementById('meterVoltage').value),
                "تاريخ التركيب": installDate,
                "trans_type": document.getElementById('transType').value,
                "feed_source": feedSourceVal,
                "مصدر تغذية المحول": feedSourceText,
                "اسم المحول": transName,
                "كود المحول": transCode,
                "اسم المغذي": feederName,
                "كود المغذي": feederCode,
                "اسم لوحة التوزيع": panelName,
                "كود لوحة التوزيع": panelCode,
                "sub_name": stationName,
                "sub_code": stationCode,
                "cell_out": feederOutgoing,
                "قدرة المحول": norm(document.getElementById('transCap').value),
                "Latitude(y)": norm(document.getElementById('lat').value),
                "Longitude(x)": norm(document.getElementById('lng').value),
                "القطاع": sectorName,
                "الهندسة": districtName,
                "عنوان المحول بالتفصيل": norm(document.getElementById('transAddress').value),
                "_timestamp": Date.now()
            };

            const targetKey = editingKeyVal || meterNum;
            const targetRef = ref(db, `sectors/${kId}/districts/${hCode}/manual_entries/${targetKey}`);

            const action = editingKeyVal ? 'تحديث' : 'حفظ';
            showStatus(`جاري ${action} السجل...`, "info");
            updateSyncStatus(true);

            set(targetRef, recordData)
                .then(() => {
                    showStatus(`تم ${action} السجل بنجاح!`, "success");
                    updateSyncStatus(false);
                    resetSessionTimer();
                    if (!editingKeyVal) {
                        clearForm();
                        renderStationsList();
                        renderPanelsList();
                        renderFeedersList();
                        renderOutgoingList();
                    } else {
                        cancelEdit();
                    }
                    checkValidation();
                })
                .catch(err => {
                    showStatus(`خطأ أثناء ${action}: ` + err.message, "error");
                    updateSyncStatus(false);
                });
        });

        document.getElementById('cancelEditBtn').addEventListener('click', cancelEdit);
        checkValidation();
    </script>
</body>

</html>
