<!DOCTYPE html>
<html lang="ar" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Admin - Excel Uploader</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-card {
            background: var(--surface);
            width: 100%;
            max-width: 700px;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .icon-wrapper {
            background: #eff6ff;
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }

        .header i {
            color: var(--primary);
            font-size: 1.8rem;
        }

        .header h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 700;
            color: #0f172a;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .info-box {
            background: #eff6ff;
            border: 1px solid #dbeafe;
            border-right: 5px solid var(--primary);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: #1e40af;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
        }

        textarea,
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 0.85rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        textarea:focus,
        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.5);
        }

        .btn-primary:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .console-wrapper {
            margin-top: 2rem;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .console-header {
            background: #1e293b;
            padding: 8px 15px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        #logConsole {
            padding: 15px;
            color: #38bdf8;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            max-height: 180px;
            overflow-y: auto;
            direction: ltr;
            line-height: 1.6;
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="admin-card">
        <div class="header">
            <div class="icon-wrapper">
                <i class="fas fa-file-excel"></i>
            </div>
            <h1>رفع ملف Excel إلى Firebase</h1>
            <p>لوحة التحكم لتحميل وتخزين ملفات Excel داخل Realtime Database</p>
        </div>

        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            <div>
                تأكد من اختيار ملف <code>.xlsx</code> أو <code>.xls</code> وتحديد المسار المطلوب للرفع.
            </div>
        </div>

        <div class="form-group">
            <label><i class="fas fa-code-branch"></i> إعدادات المشروع (JSON Config)</label>
            <textarea id="firebaseConfigInput" rows="6" placeholder='const firebaseConfig = {
  "apiKey": "your-api-key",
  "authDomain": "your-app.firebaseapp.com",
  "databaseURL": "https://your-app.firebaseio.com",
  "projectId": "your-project-id"
}'></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label><i class="fas fa-folder-open"></i> المسار المستهدف</label>
                <input type="text" id="targetPath" value="/" placeholder="/uploads/excel_data">
            </div>
            <div class="form-group">
                <label><i class="fas fa-file-upload"></i> اختر ملف Excel</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls">
            </div>
        </div>

        <button class="btn-primary" id="startAction" disabled>
            <span class="loader" id="loader"></span>
            <span id="btnText">رفع البيانات</span>
            <i class="fas fa-upload"></i>
        </button>

        <div class="console-wrapper">
            <div class="console-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
                <span style="color: #94a3b8; font-size: 0.7rem; margin-left: 10px; font-family: sans-serif;">Terminal</span>
            </div>
            <div id="logConsole">
                <div id="logContent">> النظام جاهز... حدد الملف والمسار ثم اضغط رفع</div>
            </div>
        </div>
    </div>

    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <!-- SheetJS for Excel Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        const btn = document.getElementById('startAction');
        const fileInput = document.getElementById('excelFile');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');
        const logContent = document.getElementById('logContent');

        fileInput.addEventListener('change', () => {
            btn.disabled = !fileInput.files.length;
        });

        function log(msg, type = 'info') {
            const colors = { info: '#38bdf8', error: '#f87171', warn: '#fbbf24' };
            const div = document.createElement('div');
            div.style.color = colors[type];
            div.innerHTML = `<span style="color: #64748b">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            logContent.appendChild(div);
            logContent.parentElement.scrollTop = logContent.parentElement.scrollHeight;
        }

        async function executeUpload() {
            const configText = document.getElementById('firebaseConfigInput').value;
            const path = document.getElementById('targetPath').value.trim() || "/";
            const file = fileInput.files[0];

            if (!file) {
                log("🛑 يرجى اختيار ملف Excel أولاً", "error");
                return;
            }

            btn.disabled = true;
            loader.style.display = 'inline-block';
            btnText.innerText = "جاري قراءة الملف...";

            try {
                const jsonMatch = configText.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error("لم يتم العثور على صيغة JSON صحيحة للتهيئة");

                const config = new Function(`return ${jsonMatch[0]}`)();

                if (firebase.apps.length) await firebase.app().delete();
                firebase.initializeApp(config);

                // Read Excel File
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                log(`قراءة Sheet: [${firstSheetName}] بنجاح. عدد السجلات: ${jsonData.length}`, 'warn');
                log(`بدء الاتصال بـ Firebase... المسار المحدد: [${path}]`, 'info');

                btnText.innerText = "جاري رفع البيانات...";

                // Upload to Realtime Database using set()
                await firebase.database().ref(path).set(jsonData);

                log("✅ تم رفع البيانات إلى Realtime Database بنجاح.", "info");
                btnText.innerText = "اكتملت العملية";

            } catch (err) {
                log("🛑 خطأ: " + err.message, "error");
                btnText.innerText = "فشل العملية";
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
            }
        }

        btn.onclick = executeUpload;
    </script>

</body>

</html>
