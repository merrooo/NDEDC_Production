<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الرئيسية - شركة شمال الدلتا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; margin: 0; }
        .main-card { background: #ffffff; padding: 35px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); width: 100%; max-width: 650px; }
        
        .header-title { text-align: center; margin-bottom: 25px; color: #1e293b; }
        .header-title i { color: #2563eb; font-size: 36px; margin-bottom: 10px; display: block; }
        .header-title h2 { margin: 0; font-size: 22px; color: #0f172a; }

        .info-box { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 15px; border-radius: 8px; font-size: 14px; margin-bottom: 25px; text-align: center; line-height: 1.6; }
        .info-box b { color: #1e293b; font-size: 15px; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media (max-width: 550px) { .options-grid { grid-template-columns: 1fr; } }

        .nav-card { background: #ffffff; border: 2px solid #e2e8f0; border-radius: 10px; padding: 25px 20px; text-align: center; text-decoration: none; color: #334155; transition: all 0.25s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .nav-card:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0, 0, 0, 0.08); }
        .nav-card i { font-size: 38px; margin-bottom: 12px; }
        .nav-card h3 { margin: 0 0 8px 0; font-size: 17px; color: #0f172a; }
        .nav-card p { margin: 0; font-size: 12px; color: #64748b; line-height: 1.4; }

        .card-upload { border-color: #cbd5e1; }
        .card-upload i { color: #2563eb; }
        .card-upload:hover { border-color: #2563eb; background-color: #f8fafc; }

        .card-fetch { border-color: #cbd5e1; }
        .card-fetch i { color: #059669; }
        .card-fetch:hover { border-color: #059669; background-color: #f8fafc; }

        .footer-actions { text-align: center; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .btn-logout { background: transparent; border: 1px solid #cbd5e1; color: #64748b; padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-logout:hover { background-color: #f1f5f9; color: #dc2626; border-color: #fca5a5; }
    </style>
</head>

<body>

    <div class="main-card">
        <div class="header-title">
            <i class="fas fa-bolt"></i>
            <h2>شركة شمال الدلتا لتوزيع الكهرباء</h2>
            <span style="font-size: 13px; color: #64748b;">لوحة التحكم والعمليات</span>
        </div>

        <div class="info-box" id="userInfoBox">
            <i class="fas fa-spinner fa-spin"></i> جاري التحقق من بيانات الدخول...
        </div>

        <div class="options-grid">
            <a id="btnGoUpload" href="#" class="nav-card card-upload">
                <i class="fas fa-cloud-upload-alt"></i>
                <h3>إدخال ورفع البيانات</h3>
                <p>رفع ملفات Excel أو إدخال بيانات العدادات والمحولات يدوياً</p>
            </a>

            <a id="btnGoFetch" href="#" class="nav-card card-fetch">
                <i class="fas fa-search-location"></i>
                <h3>استعلام وعرض البيانات</h3>
                <p>عرض الجداول، البحث عن العدادات، وتصدير التقارير إلى Excel</p>
            </a>
        </div>

        <div class="footer-actions">
            <a href="login.html" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> تغيير القطاع / الهندسة
            </a>
        </div>
    </div>

    <script>
        // قاموس أسماء القطاعات والهندسات للعرض الواضح
        const keta3Names = {
            "1": "قطاع دمياط",
            "2": "قطاع شمال الدقهلية",
            "3": "قطاع جنوب الدقهلية",
            "4": "قطاع كفر الشيخ"
        };

        const handsaNames = {
            101: "هندسة شمال دمياط", 102: "هندسة جنوب دمياط", 103: "هندسة عزبة البرج", 104: "هندسة كفر سعد", 105: "هندسة كفر البطيخ", 106: "هندسة راس البر", 107: "هندسة دمياط الجديدة", 108: "هندسة الزرقا", 109: "هندسة فارسكور", 110: "هندسة الروضة", 111: "هندسة الشعراء",
            201: "هندسة مدينة شربين", 202: "هندسة قري شربين", 203: "هندسة دكرنس", 204: "هندسة جمصة", 205: "هندسة قري بلقاس", 206: "هندسة مدينة بلقاس", 207: "هندسة الستاموني", 208: "هندسة بني عبيد", 209: "هندسة منية النصر", 210: "هندسة ميت سلسيل", 211: "هندسة الجمالية", 212: "هندسة قري المنزلة", 213: "هندسة مدينة المنزلة", 214: "هندسة المطرية",
            301: "هندسة شرق المنصورة", 302: "هندسة غرب المنصورة", 303: "هندسة طلخا", 304: "هندسة نبروه", 305: "هندسة قري المنصورة 1", 306: "هندسة قري المنصورة 2", 307: "هندسة اجا", 308: "هندسة مدينة السنبلاوين", 309: "هندسة قري السنبلاوين", 310: "هندسة تمي الامديد", 311: "هندسة مدينة ميت غمر", 312: "هندسة قري ميت غمر", 313: "هندسة كوم النور",
            401: "هندسة مدينة كفر الشيخ", 402: "هندسة غرب كفر الشيخ", 403: "هندسة شرق كفر الشيخ", 404: "هندسة قلين", 405: "هندسة قرى سيدي سالم", 406: "هندسة مدينة سيدي سالم", 407: "هندسة الرياض", 408: "هندسة مدينة دسوق", 409: "هندسة قرى شمال دسوق", 410: "هندسة قرى جنوب دسوق", 411: "هندسة فوه", 412: "هندسة مطوبس", 413: "هندسة مدينة الحامول", 414: "هندسة قرى الحامول", 415: "هندسة بيلا", 416: "هندسة بلطيم", 417: "هندسة برج البرلس"
        };

        // قراءة المتغيرات من رابط الصفحة URL
        const urlParams = new URLSearchParams(window.location.search);
        const keta3Id = urlParams.get('keta3') || urlParams.get('keta3_id');
        const handsaId = urlParams.get('handsa') || urlParams.get('handsa_id');

        // التحقق من صلاحية الجلسة أو بيانات الدخول
        if (!keta3Id || !handsaId) {
            alert("يرجى اختيار القطاع والهندسة أولاً من صفحة تسجيل الدخول.");
            window.location.href = "login.html";
        } else {
            const kName = keta3Names[keta3Id] || `القطاع رقم ${keta3Id}`;
            const hName = handsaNames[handsaId] || `الهندسة رقم ${handsaId}`;

            // عرض النطاق الحالي للعمل
            document.getElementById('userInfoBox').innerHTML = `
                <i class="fas fa-user-shield"></i> تم تسجيل الدخول بنجاح<br>
                <b>${kName}</b> — <b>${hName}</b>
            `;

            // ربط الأزرار بالروابط المناسبة مع تمرير المتغيرات
            document.getElementById('btnGoUpload').href = `upload.html?keta3=${encodeURIComponent(keta3Id)}&handsa=${encodeURIComponent(handsaId)}`;
            document.getElementById('btnGoFetch').href = `fetch.html?keta3=${encodeURIComponent(keta3Id)}&handsa=${encodeURIComponent(handsaId)}`;
        }
    </script>

</body>

</html>
