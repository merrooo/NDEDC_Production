        function getTariffRows(kwh, tariffType, periodKey) {
            const cfg = TARIFF_CONFIGS[periodKey]; 
            if (!cfg) return { rows: [], totalCost: 0 };
            const rates = cfg[tariffType]; 
            if (!rates) return { rows: [], totalCost: 0 };

            const rows = []; 
            let remaining = kwh; 
            let totalCost = 0;

            for (let i = 0; i < rates.length && remaining > 0; i++) {
                const slab = rates[i]; 
                const qty = Math.min(remaining, slab.limit);
                if (qty > 0) {
                    const rowTotal = (qty * slab.p + slab.s) + (slab.extraDiff || 0);
                    rows.push({ 
                        slab: slab.label, 
                        qty, 
                        price: slab.p, 
                        service: slab.s, 
                        diff: slab.extraDiff || 0, 
                        total: rowTotal 
                    });
                    totalCost += rowTotal;
                } 
                remaining -= qty;
            } 
            return { rows, totalCost };
        }

        function calculateAndDisplay() {
            const inputVal = document.getElementById('inptarrif').value;
            const kwh = parseFloat(inputVal);

            if (isNaN(kwh) || kwh < 0) {
                alert("يرجى إدخال قيمة استهلاك صحيحة أولاً.");
                return;
            }

            const tariffType = document.getElementById('tariffTypeSelector').value;
            const periodKey = document.getElementById('periodSelector').value;
            const tbody = document.getElementById('unifiedTariffBody');
            
            const { rows, totalCost } = getTariffRows(kwh, tariffType, periodKey);
            
            let html = '';
            rows.forEach((row, i) => {
                if (i === 0) {
                    html += `<tr>
                        <td rowspan="${rows.length}" style="vertical-align:middle; font-size:11px; background:#f8fafc; font-weight: 600; color: #004a99; border-left: 3px solid #004a99;">${periodKey}</td>
                        <td style="text-align:right;">${row.slab}</td>
                        <td>${row.qty.toFixed(2)}</td>
                        <td>${row.price}</td>
                        <td>${row.service}</td>
                        <td>${row.diff}</td>
                        <td style="font-weight:700;">${row.total.toFixed(2)}</td>
                    </tr>`;
                } else {
                    html += `<tr>
                        <td style="text-align:right;">${row.slab}</td>
                        <td>${row.qty.toFixed(2)}</td>
                        <td>${row.price}</td>
                        <td>${row.service}</td>
                        <td>${row.diff}</td>
                        <td style="font-weight:700;">${row.total.toFixed(2)}</td>
                    </tr>`;
                }
            });

            tbody.innerHTML = html;
            document.getElementById('unifiedTariffFoot').innerHTML = `<tr class="total-row">
                <td colspan="2" style="text-align:left;">الإجمالي العام:</td>
                <td>${kwh.toFixed(2)} ك و س</td>
                <td colspan="3"></td>
                <td>${totalCost.toFixed(2)} ج</td>
            </tr>`;

            document.getElementById('downloadTariffTableBtn').style.display = 'inline-flex';
        }

        function downloadTable(tableId, fileName) {
            const table = document.getElementById(tableId);
            const wb = XLSX.utils.table_to_book(table, { sheet: "تقرير الشرائح" });
            XLSX.writeFile(wb, `${fileName}.xlsx`);
        }

        // Event Listeners
        document.getElementById('processSingleBtn').addEventListener('click', calculateAndDisplay);
