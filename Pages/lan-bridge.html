<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAN Bridge</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a; color: #e2e8f0;
    margin: 0; padding: 20px; min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  h1 { font-size: 1.15rem; margin: 0; text-align: center; color: #f1f5f9; font-weight: 700; }
  h1 .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: #ef4444; margin-right: 8px;
    vertical-align: middle; transition: all .3s;
  }
  h1 .dot.ok { background: #10b981; box-shadow: 0 0 8px #10b981; }

  .buttonRow {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
  }
  .btn {
    border: none; border-radius: 10px; padding: 16px 8px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    transition: all .15s; color: #fff; letter-spacing: .3px;
  }
  .btn:disabled { opacity: .22; cursor: not-allowed; transform: none !important; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn-create { background: #2563eb; }
  .btn-create:hover:not(:disabled) { background: #1d4ed8; }
  .btn-join   { background: #7c3aed; }
  .btn-join:hover:not(:disabled) { background: #6d28d9; }
  .btn-disc   { background: #ef4444; }
  .btn-disc:hover:not(:disabled) { background: #dc2626; }

  .status {
    padding: 12px 16px; border-radius: 10px; font-size: 13px;
    font-weight: 600; text-align: center;
    background: #1e293b; color: #94a3b8; border: 1px solid #334155;
  }
  .status.ok   { background: #064e3b; color: #6ee7b7; border-color: #10b981; }
  .status.err  { background: #7f1d1d; color: #fca5a5; border-color: #ef4444; }
  .status.warn { background: #78350f; color: #fcd34d; border-color: #f59e0b; }
  .status .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid #475569; border-top-color: #7c3aed;
    border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #shared {
    width: 100%; min-height: 110px; padding: 12px;
    border: 1px solid #334155; border-radius: 8px;
    font-family: 'Segoe UI', sans-serif; font-size: 14px;
    background: #1e293b; color: #e2e8f0; resize: vertical;
  }
  #shared:focus { outline: none; border-color: #7c3aed;
    box-shadow: 0 0 0 3px rgba(124,58,237,.2); }
  #shared:disabled { opacity: .35; cursor: not-allowed; }

  #mousePad {
    width: 100%; height: 280px; border-radius: 12px;
    background: #1e293b; border: 2px dashed #334155;
    position: relative; overflow: hidden;
    user-select: none; -webkit-user-select: none;
    transition: all .2s;
    display: flex; align-items: center; justify-content: center;
  }
  #mousePad.active {
    border-color: #10b981; border-style: solid;
    background: #064e3b; cursor: pointer;
    box-shadow: 0 0 0 4px rgba(16,185,129,.15);
  }
  #mousePad.active:hover { background: #065f46; }
  #mousePad.locked {
    border-color: #10b981; border-style: solid;
    background: #022c22;
    box-shadow: 0 0 0 4px rgba(16,185,129,.4);
  }
  #mousePad.passive { border-color: #7c3aed; background: #2e1065; }

  #padHint {
    text-align: center; pointer-events: none;
    color: #64748b; font-size: 14px; font-weight: 600;
    padding: 0 24px; line-height: 1.6;
  }
  #mousePad.active #padHint { color: #6ee7b7; font-size: 18px; }
  #mousePad.locked #padHint { display: none; }
  #mousePad.passive #padHint { color: #c4b5fd; font-size: 15px; }

  #padLive {
    position: absolute; top: 12px; left: 12px;
    background: #10b981; color: #022c22;
    padding: 4px 12px; border-radius: 12px;
    font-size: 10px; font-weight: 800; letter-spacing: 1px;
    display: none;
  }
  #mousePad.locked #padLive { display: block; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

  #padCoords {
    position: absolute; bottom: 10px; right: 12px;
    font-family: monospace; font-size: 11px;
    color: #475569; pointer-events: none;
    background: rgba(15,23,42,.8); padding: 3px 8px; border-radius: 4px;
  }
  #mousePad.locked #padCoords { color: #6ee7b7; }

  #lockedHelp {
    position: absolute; bottom: 10px; left: 12px;
    font-size: 10px; color: #475569; pointer-events: none;
    display: none;
  }
  #mousePad.locked #lockedHelp { display: block; color: #6ee7b7; }

  #fbBar {
    text-align: center; padding: 8px; font-size: 11px;
    font-weight: 700; border-radius: 6px;
    background: #78350f; color: #fcd34d;
  }
  #fbBar.ok  { background: #064e3b; color: #6ee7b7; }
  #fbBar.err { background: #7f1d1d; color: #fca5a5; }
  #fbBar.hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <h1><span class="dot" id="connDot"></span>LAN Bridge</h1>

  <div id="fbBar">🔥 Checking Firebase…</div>

  <div class="buttonRow">
    <button class="btn btn-create" id="btnCreate">📤 Create</button>
    <button class="btn btn-join"   id="btnJoin" disabled>📥 Join</button>
    <button class="btn btn-disc"   id="btnDisconnect" disabled>✖ Disconnect</button>
  </div>

  <div id="status" class="status">Not connected</div>

  <textarea id="shared" placeholder="Shared text — syncs live between both laptops." disabled></textarea>

  <div id="mousePad">
    <div id="padLive">● LIVE</div>
    <div id="padHint">Click Create or Join to begin</div>
    <div id="padCoords">—</div>
    <div id="lockedHelp">ESC to exit · Left/Right click works</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnKRhT5xJTBvsQKpW7e9w-hGSbAQJWTSo",
  authDomain: "production1-ae85.firebaseapp.com",
  databaseURL: "https://production1-ae85-default-rtdb.firebaseio.com",
  projectId: "production1-ae85",
  storageBucket: "production1-ae85.firebasestorage.app",
  messagingSenderId: "490438031865",
  appId: "1:490438031865:web:a4a69335989f30cd13a528"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const $ = id => document.getElementById(id);

/* ── STATE ─────────────────────────────── */
let pc = null, dc = null;
let mouseWS = null;
let myRole = null;
let activeCode = null;
let appState = 'idle';
let slaveHasCode = false;
let firebaseOk = false;
let locked = false;
let remoteX = 0, remoteY = 0;
let slaveScreen = { x: 0, y: 0, w: 1920, h: 1080 };
let answerUnsub = null;
let slaveInfoUnsub = null;
let sessionWatcherUnsub = null;
let slaveWatchUnsub = null;
let sendTimer = null, applyingRemote = false;

const SENSITIVITY = 1.5;

/* ── UI ─────────────────────────────────── */
function setStatus(msg, cls = '') {
  const el = $('status');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}
function setConnDot(on) { $('connDot').className = 'dot' + (on ? ' ok' : ''); }

function updatePad() {
  const pad = $('mousePad');
  const hint = $('padHint');
  pad.classList.remove('active', 'passive', 'locked');

  if (locked) { pad.classList.add('locked'); return; }
  if (appState === 'connected' && myRole === 'slave') {
    pad.classList.add('passive');
    hint.textContent = '👥 Being controlled by the master';
    return;
  }
  if (appState === 'connected' && myRole === 'master' &&
      mouseWS && mouseWS.readyState === WebSocket.OPEN) {
    pad.classList.add('active');
    hint.textContent = '🎮 Click here to control the slave mouse';
    return;
  }
  if (appState === 'waiting') { hint.textContent = 'Connecting…'; return; }
  hint.textContent = 'Click Create or Join to begin';
}

function updateButtons() {
  const idle = appState === 'idle';
  const connected = appState === 'connected';

  $('btnCreate').disabled = !idle || slaveHasCode;
  $('btnJoin').disabled   = !slaveHasCode || !idle;
  $('btnDisconnect').disabled = idle && !slaveHasCode && !activeCode;

  $('shared').disabled = !connected;
}

/* ── Firebase health check ─────────────── */
async function testFirebase() {
  const bar = $('fbBar');
  try {
    await set(ref(db, '_healthcheck'), { ts: Date.now() });
    await remove(ref(db, '_healthcheck'));
    firebaseOk = true;
    bar.textContent = '🔥 Firebase connected';
    bar.className = 'ok';
    setTimeout(() => bar.classList.add('hidden'), 2500);
    return true;
  } catch (e) {
    firebaseOk = false;
    bar.textContent = '❌ Firebase: ' + (e.message || e.code || e);
    bar.className = 'err';
    return false;
  }
}

/* ── WebRTC ────────────────────────────── */
function waitForIce(peer) {
  if (peer.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise(r => {
    const t = setTimeout(r, 4000);
    peer.addEventListener('icegatheringstatechange', () => {
      if (peer.iceGatheringState === 'complete') { clearTimeout(t); r(); }
    });
  });
}
function makePeer() {
  const peer = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  });
  peer.addEventListener('connectionstatechange', () => {
    const st = peer.connectionState;
    if (st === 'failed' || st === 'disconnected') {
      setStatus('Connection lost — click Disconnect', 'err');
    }
  });
  return peer;
}
function wireChannel(ch) {
  dc = ch;
  ch.onopen = () => {
    appState = 'connected';
    updateButtons();
    updatePad();
    setStatus('Connected ✅', 'ok');
    setConnDot(true);
  };
  ch.onclose = () => {
    if (appState !== 'idle') {
      setStatus('Disconnected', 'err');
      setConnDot(false);
      appState = 'idle';
      updateButtons();
      updatePad();
    }
  };
  ch.onmessage = ev => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'text') {
        applyingRemote = true;
        $('shared').value = msg.value;
        applyingRemote = false;
      }
    } catch (_) {}
  };
}
function genCode() {
  const c = 'abcdefghjkmnpqrstuvwxyz23456789';
  let o = '';
  for (let i = 0; i < 4; i++) o += c[Math.floor(Math.random() * c.length)];
  return o;
}

/* ── FULL CLEANUP ──────────────────────── */
async function cleanup() {
  const wasMaster = (myRole === 'master');
  const wasCode   = activeCode;

  // Set idle FIRST so our own session removal doesn't trigger the watcher
  appState = 'idle';
  myRole = null;
  activeCode = null;
  locked = false;
  setConnDot(false);

  if (answerUnsub)        { try { answerUnsub(); }        catch(_){} answerUnsub = null; }
  if (slaveInfoUnsub)     { try { slaveInfoUnsub(); }     catch(_){} slaveInfoUnsub = null; }
  if (sessionWatcherUnsub){ try { sessionWatcherUnsub(); }catch(_){} sessionWatcherUnsub = null; }

  if (document.pointerLockElement) document.exitPointerLock();
  if (mouseWS) { try { mouseWS.close(); } catch(_){} mouseWS = null; }
  if (dc)      { try { dc.close(); }      catch(_){} dc = null; }
  if (pc)      { try { pc.close(); }      catch(_){} pc = null; }

  // Remove ALL Firebase keys — regardless of role
  if (wasCode) {
    try { await remove(ref(db, `sessions/${wasCode}`)); } catch(_){}
    try { await remove(ref(db, 'currentSession')); }     catch(_){}
  }

  updateButtons();
  updatePad();
  setStatus('Not connected');
  $('padCoords').textContent = '—';
}

/* ══════════ CREATE (master) ══════════ */
$('btnCreate').onclick = async () => {
  if (!firebaseOk) return;
  myRole = 'master';
  appState = 'waiting';
  updateButtons();
  updatePad();
  setStatus('Creating session…');

  const code = genCode();
  activeCode = code;

  try {
    pc = makePeer();
    wireChannel(pc.createDataChannel('sync'));
    await pc.setLocalDescription(await pc.createOffer());
    await waitForIce(pc);

    await set(ref(db, `sessions/${code}/offer`), {
      sdp: pc.localDescription.sdp,
      type: pc.localDescription.type,
      ts: Date.now()
    });
    await set(ref(db, 'currentSession'), { code, ts: Date.now() });

    setStatus('Waiting for slave to join…');

    // Watch for the slave's WebRTC answer
    answerUnsub = onValue(ref(db, `sessions/${code}/answer`), async snap => {
      const v = snap.val();
      if (!v || !pc || pc.signalingState !== 'have-local-offer') return;
      try {
        await pc.setRemoteDescription({ type: v.type, sdp: v.sdp });
        setStatus('Connecting…');
        if (answerUnsub) { answerUnsub(); answerUnsub = null; }
      } catch (e) { setStatus('Error: ' + e.message, 'err'); }
    });

    // Watch for the slave's IP + screen → auto-connect the mouse bridge
    slaveInfoUnsub = onValue(ref(db, `sessions/${code}/slave_info`), snap => {
      const info = snap.val();
      if (!info || !info.ip) return;

      // ⭐ Screen info comes from the Python bridge — guaranteed to match pynput
      if (info.screen) {
        slaveScreen = {
          x: info.screen.virt_x || 0,
          y: info.screen.virt_y || 0,
          w: info.screen.virt_w || info.screen.primary_w || 1920,
          h: info.screen.virt_h || info.screen.primary_h || 1080
        };
      } else {
        slaveScreen = { x: 0, y: 0, w: info.width || 1920, h: info.height || 1080 };
      }

      console.log('[master] slave screen:', slaveScreen);
      connectBridge(info.ip);
      if (slaveInfoUnsub) { slaveInfoUnsub(); slaveInfoUnsub = null; }
    });

    // Watch the session node — if someone else deletes it, auto-cleanup
    sessionWatcherUnsub = onValue(ref(db, `sessions/${code}`), snap => {
      if (snap.val() === null && appState !== 'idle') {
        cleanup();
        setStatus('Session ended', 'warn');
      }
    });

  } catch (e) {
    setStatus('Create failed: ' + e.message, 'err');
    await cleanup();
  }
};

function connectBridge(ip) {
  if (mouseWS) { try { mouseWS.close(); } catch(_){} }
  try {
    mouseWS = new WebSocket(`ws://${ip}:8765`);
  } catch (e) {
    setStatus('Mouse bridge unreachable — text sync only', 'warn');
    return;
  }
  mouseWS.onopen = () => {
    setStatus('Connected ✅ (mouse ready)', 'ok');
    updatePad();
  };
  mouseWS.onclose = () => {
    updatePad();
    if (appState === 'connected') {
      setStatus('Mouse bridge lost — text sync only', 'warn');
    }
  };
  mouseWS.onerror = () => {
    setStatus('Mouse bridge unreachable — is mouse_bridge.py running on ' + ip + '?', 'warn');
  };
}

/* ══════════ JOIN (slave) ══════════ */
$('btnJoin').onclick = async () => {
  if (!firebaseOk || !activeCode) return;
  myRole = 'slave';
  appState = 'waiting';
  updateButtons();
  updatePad();
  setStatus('Joining…');

  const code = activeCode;

  try {
    // 1) Detect own IP + real screen size via local Python endpoint
    let myIp = null;
    let screenInfo = null;
    try {
      const ipRes = await fetch('http://127.0.0.1:8766/ip', { cache: 'no-store' });
      if (ipRes.ok) {
        const t = (await ipRes.text()).trim();
        if (/^\d+\.\d+\.\d+\.\d+$/.test(t)) myIp = t;
      }
      const scrRes = await fetch('http://127.0.0.1:8766/screen', { cache: 'no-store' });
      if (scrRes.ok) screenInfo = await scrRes.json();
    } catch (_) {}

    if (!myIp) {
      setStatus('Bridge not detected — start mouse_bridge.py first', 'warn');
    } else if (!screenInfo) {
      setStatus('Screen detection failed — using fallback', 'warn');
    }

    // 2) Get the master's offer
    if (pc) { try { pc.close(); } catch(_){} pc = null; }
    const snap = await get(ref(db, `sessions/${code}/offer`));
    const offer = snap.val();
    if (!offer) {
      setStatus('Session not found', 'err');
      appState = 'idle';
      updateButtons();
      updatePad();
      return;
    }

    // 3) Submit IP + screen info BEFORE establishing WebRTC
    if (myIp) {
      await set(ref(db, `sessions/${code}/slave_info`), {
        ip: myIp,
        screen: screenInfo || null,
        ts: Date.now()
      });
      console.log('[slave] submitted', myIp, screenInfo);
    }

    // 4) Establish WebRTC
    pc = makePeer();
    pc.ondatachannel = ev => wireChannel(ev.channel);
    await pc.setRemoteDescription({ type: offer.type, sdp: offer.sdp });
    await pc.setLocalDescription(await pc.createAnswer());
    await waitForIce(pc);
    await set(ref(db, `sessions/${code}/answer`), {
      sdp: pc.localDescription.sdp,
      type: pc.localDescription.type,
      ts: Date.now()
    });

    setStatus('Connecting…');

  } catch (e) {
    setStatus('Join failed: ' + e.message, 'err');
    await cleanup();
  }
};

/* ══════════ DISCONNECT ══════════ */
$('btnDisconnect').onclick = async () => {
  await cleanup();
};

/* ══════════ SLAVE watcher (auto-fills session) ══════════ */
function startSlaveWatcher() {
  if (slaveWatchUnsub) return;
  slaveWatchUnsub = onValue(ref(db, 'currentSession'), snap => {
    const val = snap.val();
    if (myRole === 'master') return;

    if (!val || !val.code) {
      if (slaveHasCode) {
        slaveHasCode = false;
        activeCode = null;
        updateButtons();
        if (appState === 'idle') setStatus('Not connected');
      }
      return;
    }
    if (appState !== 'idle') return;

    slaveHasCode = true;
    activeCode = val.code;
    updateButtons();
    setStatus('Master session ready — click Join');
  });
}

/* ══════════ TEXT SYNC ══════════ */
$('shared').addEventListener('input', () => {
  if (applyingRemote) return;
  clearTimeout(sendTimer);
  sendTimer = setTimeout(() => {
    if (dc && dc.readyState === 'open') {
      dc.send(JSON.stringify({ type: 'text', value: $('shared').value }));
    }
  }, 120);
});

/* ══════════ MOUSE — pointer lock (single mode) ══════════ */
const pad = $('mousePad');
const padCoords = $('padCoords');

pad.addEventListener('click', () => {
  if (locked) return;
  if (!mouseWS || mouseWS.readyState !== WebSocket.OPEN) return;
  pad.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  locked = (document.pointerLockElement === pad);
  if (locked) {
    remoteX = Math.floor(slaveScreen.w / 2);
    remoteY = Math.floor(slaveScreen.h / 2);
    sendMouse({
      x: slaveScreen.x + remoteX,
      y: slaveScreen.y + remoteY
    });
    padCoords.textContent = `${remoteX}, ${remoteY}`;
  }
  updatePad();
});

document.addEventListener('mousemove', (e) => {
  if (!locked) return;
  remoteX = Math.max(0, Math.min(slaveScreen.w - 1, remoteX + e.movementX * SENSITIVITY));
  remoteY = Math.max(0, Math.min(slaveScreen.h - 1, remoteY + e.movementY * SENSITIVITY));
  sendMouse({
    x: slaveScreen.x + Math.round(remoteX),
    y: slaveScreen.y + Math.round(remoteY)
  });
  padCoords.textContent = `${Math.round(remoteX)}, ${Math.round(remoteY)}`;
});

document.addEventListener('mousedown', (e) => {
  if (!locked) return;
  if (e.button === 0) sendMouse({ click: 'left' });
  else if (e.button === 2) sendMouse({ click: 'right' });
});

document.addEventListener('contextmenu', (e) => {
  if (locked) e.preventDefault();
});

function sendMouse(p) {
  if (mouseWS && mouseWS.readyState === WebSocket.OPEN) {
    mouseWS.send(JSON.stringify(p));
  }
}

/* ══════════ INIT ══════════ */
(async () => {
  setStatus('Testing Firebase…');
  const ok = await testFirebase();
  if (!ok) {
    setStatus('Firebase failed — check red bar', 'err');
    return;
  }
  startSlaveWatcher();
  updateButtons();
  updatePad();
  setStatus('Ready');
})();
</script>
</body>
</html>
