<!-- templates/chat.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Codebase Chat</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 0 auto; }
        #chat { height: 500px; overflow-y: scroll; border: 1px solid #ccc; padding: 20px; }
        .user { color: blue; }
        .bot { color: green; }
        input { width: 80%; padding: 10px; }
    </style>
</head>
<body>
    <h1>🤖 Codebase Assistant</h1>
    <div id="chat"></div>
    <input id="question" placeholder="Ask about your code...">
    <button onclick="send()">Ask</button>
    
    <script>
        async function send() {
            const input = document.getElementById('question');
            const question = input.value;
            input.value = '';
            
            // Add to chat
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="user">You: ${question}</div>`;
            
            // Get response
            const response = await fetch('/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question})
            });
            const data = await response.json();
            chat.innerHTML += `<div class="bot">Bot: ${data.answer}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
