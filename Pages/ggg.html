<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>إضافة كود القطاع والهندسة</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <h2>رفع ملفات Excel</h2>
  <input type="file" id="upload" multiple />

  <button onclick="processFiles()">تجهيز الملفات</button>

  <script>
    const keta3Map = {
      "دمياط":1, "شمال الدقهلية":2, "جنوب الدقهلية":3, "كفر الشيخ":4
    };

    const handsaMap = {
      "شمال دمياط":101, "جنوب دمياط":102, "شرق المنصورة":301, "غرب المنصورة":302,
      "طلخا":303, "نبروه":304, "مدينة كفر الشيخ":401
      // زود باقي الهندسات هنا حسب الجدول المرجعي
    };

    function processFiles() {
      const files = document.getElementById('upload').files;
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, {type: 'array'});
          const sheetName = workbook.SheetNames[0];
          const sheet = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);

          // إضافة الأعمدة الجديدة
          sheet.forEach(row => {
            row["كود القطاع"] = keta3Map[row["قطاع"]] || "";
            row["كود الهندسة"] = handsaMap[row["هندسة"]] || "";
          });

          // تحويل مرة أخرى إلى شيت
          const newSheet = XLSX.utils.json_to_sheet(sheet);
          const newWb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(newWb, newSheet, sheetName);

          // حفظ الملف الجديد
          XLSX.writeFile(newWb, file.name.replace(".xlsx","_new.xlsx"));
        };
        reader.readAsArrayBuffer(file);
      });
    }
  </script>
</body>
</html>
